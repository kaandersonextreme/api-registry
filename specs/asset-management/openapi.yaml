      properties:
        product_types:
          type: object
          description: Map of OS type to list of product type information
          additionalProperties:
            type: array
            items:
              type: object
              description: The product type information
              required:
                - product_type
                - model
                - firmware_type
              properties:
                product_type:
                  type: string
                  description: The product type identifier or name (e.g., X460-G2, AP4000). This
                    is the canonical product type used by the platform to
                    identify device families.
                  example: SwitchEngine_7520_48XT_6C
                model:
                  type: string
                  description: The device model identifier or designation associated with this
                    product type (e.g., X460-G2, AP4000). This represents the
                    specific hardware model within the product family.
                  example: "7520"
                firmware_type:
                  type: string
                  description: The firmware type or category for this product (e.g., IQE, EXOS,
                    VOSS). Used to identify which firmware image family or
                    update mechanism applies to devices of this model.
                  example: onie
