                                type: string
                                description: Name of the PSIRT.
                                example: PSIRT-001
                              psirts_url:
                                type: string
                                format: uri
                                description: URL providing details about the PSIRT.
                                example: https://example.com/psirt-details
                        total:
                          type: integer
                          format: int32
                          description: Total number of PSIRTs.
                          example: 1073741824
        page:
          type: integer
          format: int32
          description: Current page number.
          example: 1
        count:
          type: integer
          format: int32
          description: Number of items per page.
          example: 10
        total_pages:
          type: integer
          format: int64
          description: Total number of pages.
          example: 1
        total_count:
          type: integer
          format: int64
          description: Total number of items.
          example: 5
        classification:
          type: string
          description: Classification of the firmware (device category).
          enum:
            - WIRELESS
            - SWITCH
            - SDWAN
            - ROUTER
            - XIQ_SE
            - APPLIANCE
            - UNKNOWN
          example: WIRELESS
        is_locally_managed:
          type: boolean
          description: Indicates whether the devices are locally managed.
          example: true
