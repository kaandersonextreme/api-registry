          example:
            - Active
            - Cancelled
            - Expired
            - Inactive
          items:
            type: string
            enum:
              - Active
              - Cancelled
              - Expired
              - Inactive
        site:
          type: array
          items:
            type: string
          description: Site identifiers to filter contracts. Example values include
            human-readable site names.
          example:
            - Headquarters Campus
            - site-12345
        partner:
          type: array
          items:
            type: string
          description: Partner identifiers to filter contracts. Example values include the
            partner's display name.
          example:
            - Extreme Networks Partner Inc.
            - partner-9876
        start_date_range:
          type: object
          description: Filter contracts by a date range based on the contract start date.
            Use after_date and/or before_date to define the range boundaries.
          properties:
            after_date:
              type: string
              pattern: ^(?!0000)\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
              description: In this format YYYY-MM-DD
              example: 2023-01-01
            before_date:
              type: string
              pattern: ^(?!0000)\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
              description: In this format YYYY-MM-DD
              example: 2023-12-31
            use_and_operator:
              type: boolean
              description: When true, both after_date and before_date must be satisfied. When
                false, either condition can be satisfied.
        ea_type:
          type: array
          description: Enterprise Agreement (EA) types to filter contracts. Represents the
            agreement classification associated with the contract.
          example:
            - ENTERPRISE_AGREEMENT
            - MSC
            - STANDARD
          items:
            $ref: "#/components/schemas/EaType"
