openapi: 3.0.3
info:
  title: Extreme Platform ONE REST API - Asset Management
  description: >-
    The Extreme Platform ONE™ Asset Management API provides comprehensive

    automation and intelligent orchestration for enterprise network asset
    lifecycle 

    management, enabling seamless device inventory tracking, contract
    management, 

    and automated compliance monitoring across complex network infrastructures.
  termsOfService: https://www.extremenetworks.com/company/legal/terms-of-use/
  contact:
    name: Extreme Networks Support
    url: https://www.extremenetworks.com/support
    email: support@extremenetworks.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 25.11.0
servers:
  - url: https://cloudapi.extremecloudiq.com/assets/v1
    description: Extreme Platform ONE REST API - Assets
tags:
  - name: Device
    description: >-
      **Advanced Device Asset Management & Intelligent Inventory Control**


      Comprehensive device asset management capabilities providing
      intelligent  device discovery, automated inventory tracking, lifecycle
      management,  and advanced analytics for enterprise network infrastructure
      with  AI-powered optimization and predictive maintenance.


      **Core Device Management:** - Real-time device discovery with automated
      classification and tagging - Comprehensive device inventory with detailed
      metadata and specifications   - Advanced device lifecycle tracking from
      procurement to decommissioning - Intelligent device relationship mapping
      and dependency analysis - Automated warranty tracking and maintenance
      scheduling - Device performance monitoring with predictive analytics -
      Enterprise-scale bulk operations with Excel import/export capabilities


      **AI Intelligence:** ML-driven device categorization, predictive
      failure  detection, automated optimization recommendations, intelligent
      capacity planning
  - name: Contract
    description: >-
      **Intelligent Contract Lifecycle Management & Automation**


      Advanced contract management capabilities providing automated
      contract  tracking, intelligent renewal management, compliance monitoring,
      and  comprehensive vendor relationship optimization with AI-powered
      analytics  and predictive contract intelligence.


      **Contract Management Features:** - Automated contract lifecycle tracking
      from inception to renewal - Intelligent renewal alerts and automated
      notification systems - Comprehensive compliance monitoring and regulatory
      adherence - Advanced contract analytics with cost optimization insights -
      Vendor relationship management with performance tracking - Contract risk
      assessment and mitigation recommendations - Enterprise-scale contract
      portfolio management and reporting


      **AI Enhancement:** Predictive contract analytics, automated
      compliance  verification, intelligent cost optimization, smart renewal
      recommendations
  - name: Summary
    description: >-
      **Advanced Asset Summary & Firmware Management Operations**


      Comprehensive asset summary and firmware management capabilities
      providing  intelligent device lifecycle tracking, automated firmware
      upgrade orchestration,  and centralized hardware lifecycle management with
      AI-powered insights and  predictive maintenance scheduling.


      **Core Summary Features:** - Real-time asset summary dashboards with
      comprehensive metrics - Hardware lifecycle tracking with automated
      warranty and EOL management - Firmware upgrade orchestration with
      scheduling and rollback capabilities - Device history tracking with
      detailed audit trails and compliance reporting - Bulk operations
      management with batch processing and status monitoring - Integration with
      ITSM and monitoring platforms for unified operations


      **Firmware Management Intelligence:** - AI-driven firmware compatibility
      analysis and recommendation engine - Predictive upgrade scheduling with
      optimal maintenance window identification - Automated rollback
      capabilities with intelligent failure detection - Multi-device
      orchestration with dependency mapping and staged deployments - Real-time
      upgrade monitoring with proactive issue detection and alerting
paths:
  /devices:
    post:
      tags:
        - Device
      summary: List Devices
      description: >
        List devices with pagination, sorting, search and optional filters.


        The request body accepts **one of two mutually exclusive forms**:


        **1. Filter by device IDs** — provide only `device_ids` (1–100 items).
        No other fields may be present. The response contains exactly the
        devices matching the supplied IDs.


        **2. Filter by device attributes** — provide any combination of fields
        from `ListDevicesRequestFilter`

        (e.g. `classification`, `states`, `connection_states`, `site_ids`, etc.)
        exactly as before.

        All existing filter behaviour is unchanged.
      operationId: listDevices
      x-ai-intent: device-inventory-management
      x-ai-purpose: Retrieve and filter device inventory for operational oversight and
        network management
      x-ai-usage: Use when AI systems need to query, analyze, or manage device
        collections across network infrastructure
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/device_limit"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/search"
      requestBody:
        required: true
        description: >
          One of two mutually exclusive request forms:

          - **`device_ids`** (array of Long, 1–100 items): when present, filters
          by those device IDs only. No other fields may be provided.

          - **ListDevicesRequestFilter fields** (`classification`, `states`,
          `connection_states`, etc.): standard attribute-based filter used
          exactly as before.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListDevicesRequestBody"
            examples:
              byDeviceIds:
                summary: Filter by specific device IDs (only device_ids may be provided)
                value:
                  device_ids:
                    - 1001
                    - 1002
                    - 1003
              byFilter:
                summary: Filter by device attributes
                value:
                  classification: SWITCH
                  states:
                    - MANAGED
                    - UNMANAGED
                  connection_states:
                    - CONNECTED
                  site_ids:
                    - 1001
                    - 1002
                  os_versions:
                    - 16.2.0.5
                    - 16.1.3.2
                  models:
                    - X460-G2
                    - X670-G2
                  country_name:
                    - United States
                    - Canada
                  managing_app:
                    - XIQ
                    - Cloud
                  device_type:
                    - Switch
                  license_type:
                    - PILOT
                    - NAVIGATOR
                  ip_address:
                    - 192.168.1.10
                    - 10.0.0.50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedDevice"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /devices/export:
    post:
      tags:
        - Device
      summary: Export Devices List
      description: Export the filtered devices list data in CSV format.
      operationId: exportAssetsDeviceList
      x-ai-intent: device-data-export
      x-ai-purpose: Export device data for analytics, reporting, and downstream processing
      x-ai-usage: Use when AI needs to extract device data for analysis, machine
        learning, or integration with external systems
      parameters:
        - name: search
          in: query
          description: Search string to be used as a parameter for searching
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Sort string in the format of "field:direction", e.g. "host_name-"
            or "ip_address+"
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListDevicesRequestFilter"
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: byte
                description: CSV file content in base64-encoded byte format containing the
                  exported device list data
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /devices/licenses:
    get:
      tags:
        - Device
      summary: Get License Information
      description: Get information about licenses.
      operationId: getLicenseInfo
      x-ai-intent: license-compliance-monitoring
      x-ai-purpose: Monitor and track license usage and compliance across device inventory
      x-ai-usage: Use when AI systems need to analyze license utilization, compliance
        status, and optimization opportunities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Licenses"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /devices/column/filters:
    post:
      tags:
        - Device
      summary: List filters for columns
      description: List all filter values for each column.
      operationId: listColumnFilters
      x-ai-intent: device-query-metadata
      x-ai-purpose: Provide available filter options and data constraints for dynamic
        query construction
      x-ai-usage: Use when AI systems need to build intelligent queries and understand
        available data dimensions for filtering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnFiltersRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnFilters"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /devices/subscriptions/unmanaged:
    get:
      tags:
        - Device
      summary: Get count of UNMANAGED devices
      description: Get count of UNMANAGED devices for each Device Type.
      operationId: getUnmanagedDevicesCount
      x-ai-intent: device-compliance-auditing
      x-ai-purpose: Monitor unmanaged device inventory for compliance, security, and
        lifecycle management
      x-ai-usage: Use when AI systems need to identify unmanaged devices for automated
        onboarding or security compliance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: List of unmanaged device counts grouped by product type, device
                  type, and license management type
                items:
                  $ref: "#/components/schemas/UnmanagedDevices"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /devices/productTypes:
    post:
      x-internal: false
      tags:
        - Device
      summary: Get Product Types
      description: Retrieve product types information filtered by OS types.
      operationId: getProductTypes
      x-ai-intent: device-classification-analysis
      x-ai-purpose: Retrieve product type information for device categorization and
        inventory management
      x-ai-usage: Use when AI systems need to analyze product types, device models,
        and firmware compatibility by OS type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductTypesRequest"
            example:
              os_types:
                - Switch Engine
                - Fabric Engine
                - Wireless
                - TPME
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductTypesResponse"
              example:
                product_types:
                  Switch Engine:
                    - product_type: SwitchEngine_4220_4MW_8P_4X
                      model: "4220"
                      firmware_type: summit_arm
                  Fabric Engine:
                    - product_type: FabricEngine_5420M_24W_24S_4YE
                      model: 5420M
                      firmware_type: "5420"
                  Wireless:
                    - product_type: AP_120
                      model: AP120
                      firmware_type: AP120
                  TPME:
                    - product_type: TPME-S
                      model: TPME-S
                      firmware_type: TPME
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /devices/firmwareMetadatas:
    post:
      x-internal: false
      tags:
        - Device
      summary: Get Device Firmware Metadatas
      description: Retrieve compatible firmware metadata for specified product types
        and firmware types.
      operationId: getDeviceFirmwareMetadatas
      x-ai-intent: firmware-compatibility-analysis
      x-ai-purpose: Retrieve firmware metadata for device compatibility validation and
        upgrade planning
      x-ai-usage: Use when AI systems need to analyze firmware compatibility, plan
        upgrades, or validate firmware deployment options
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmwareMetadatasRequest"
            example:
              os_types:
                - Switch Engine
                - Wireless
              product_types:
                - AP_120
                - SwitchEngine_4220_4MW_8P_4X
              firmware_types:
                - summit_arm
                - "5420"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareMetadatasResponse"
              example:
                firmware_metadatas:
                  Fabric Engine:
                    - firmware_id: 17
                      firmware_name: 5420.8.10.0.0.voss
                      firmware_type: "5420"
                      scope: GLOBAL
                      version: 8.10.0.0
                      md5: 8f1dc79cb91b872d42034863c1eebed7
                  AP_120:
                    - firmware_id: 1182
                      firmware_name: AP120-6.5r10.golden.img.S
                      firmware_type: AP120
                      scope: GLOBAL
                      version: 6.5.10.0
                      md5: null
                  summit_arm:
                    - firmware_id: 1396
                      firmware_name: summit_arm-31.7.3.30.xos
                      firmware_type: summit_arm
                      scope: GLOBAL
                      version: 31.7.3.30
                      md5: cf644072451336874ba0d08a42b0ac54
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /devices/status/count:
    get:
      tags:
        - Device
      summary: Get Device Status Count
      description: Retrieve count of devices grouped by their connection status.
      operationId: getDeviceStatusCount
      x-ai-intent: device-inventory-management
      x-ai-purpose: Retrieve and filter device inventory for operational oversight and
        network management
      x-ai-usage: Use when AI systems need to query, analyze, or manage device
        collections across network infrastructure
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCount"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /devices/licenseCount:
    post:
      tags:
        - Device
      summary: Get License Count Per Location
      description: Retrieve license count per location information for devices in the
        inventory.
      operationId: licenseCount
      x-ai-intent: device-query-optimization
      x-ai-purpose: Save intelligent filtering strategies for recurring device
        analysis and monitoring
      x-ai-usage: Use when AI systems need to persist optimized query patterns for
        device inventory management
      parameters:
        - name: licenseTypes
          in: query
          description: Filter on specific license types to include in the count results.
            Provide one or more license types (e.g., PILOT, LEGACY) to limit the
            counts to those types.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ParamDeviceLicenseType"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseInfoFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseCount"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /contracts:
    post:
      tags:
        - Contract
      summary: List Filtered Contracts
      description: List contracts with pagination, sorting and filtering options.
      operationId: listContracts
      x-ai-intent: contract-inventory-management
      x-ai-purpose: Manage and track device contracts and licensing agreements for
        compliance monitoring
      x-ai-usage: Use when AI needs to analyze contract compliance, expiration
        tracking, and lifecycle management
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/contractEndInDays"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedContract"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /contracts/export:
    get:
      tags:
        - Contract
      summary: Export Contracts (Deprecated)
      description: Deprecated. Use POST /assets/v1/contracts/export instead, which
        supports full filter options. This endpoint will be removed in a future
        release.
      operationId: exportContracts
      deprecated: true
      parameters:
        - name: contract_id
          in: query
          description: Comma-separated list of contract IDs. If not provided, all
            contracts will be exported.
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^[A-Za-z0-9]{18}$
              minLength: 18
              maxLength: 18
          style: form
          explode: false
      responses:
        "200":
          description: Excel file.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Contract
      summary: Export Contracts with filters
      description: Export contracts to Excel format with optional filters.
      operationId: exportContractsPost
      parameters:
        - name: contract_id
          in: query
          description: Comma-separated list of contract IDs. If not provided, all
            contracts will be exported.
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^[A-Za-z0-9]{18}$
              minLength: 18
              maxLength: 18
            example:
              - 8102T000000Q37zQAC
              - 810cX000007rK38QAF
          style: form
          explode: false
        - name: contract_end_in_days
          in: query
          description: Filter contracts ending within the specified number of days from
            today
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractFilter"
      responses:
        "200":
          description: Excel file.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /contracts/{contract_id}/lines:
    get:
      tags:
        - Contract
      summary: List Contract Lines
      description: List contract lines by pagination.
      operationId: listContractLines
      x-ai-intent: contract-compliance-monitoring
      x-ai-purpose: Enable detailed contract line-item analysis for license
        compliance, cost optimization, and automated contract management
        workflows
      x-ai-usage: Use when AI systems need to analyze contract details, track license
        utilization per line item, or automate compliance reporting
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/contract_id-string"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedContractLine"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /contracts/{contract_id}/export:
    get:
      tags:
        - Contract
      summary: Export Contract with Lines
      description: Export a specific contract along with its lines to Excel format.
      operationId: exportContractWithLines
      x-ai-intent: contract-data-portability
      x-ai-purpose: Enable offline analysis and sharing of contract data by exporting
        contract details and line items to standard spreadsheet formats
      x-ai-usage: Use when users need to perform custom analysis in Excel, share
        contract details with external stakeholders, or archive contract
        snapshots
      parameters:
        - $ref: "#/components/parameters/contract_id-string"
      responses:
        "200":
          description: Returns an Excel file containing contract and line items data.
          headers:
            Content-Disposition:
              description: 'Suggests a filename for download. Example: attachment;
                filename="contract-<contract_id>.xlsx"'
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
                description: Binary Excel (XLSX) file content. The spreadsheet contains the
                  contract metadata and its line items in tabular form. The
                  response Content-Type is
                  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                  - $ref: "#/components/schemas/ApiClientError"
                  - $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /contracts/filter:
    get:
      tags:
        - Contract
      summary: Get Contract Filters
      description: Retrieve available contract filters for querying contracts.
      operationId: getContractFilters
      x-ai-intent: contract-inventory-management
      x-ai-purpose: Provide users with available contract filters to enable efficient
        contract querying and inventory management
      x-ai-usage: Use when AI systems need to understand available contract filters
        for building dynamic queries or providing filter options in user
        interfaces
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractFilterVo"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                  - $ref: "#/components/schemas/ApiClientError"
                  - $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /summary/firmwareStatus:
    post:
      x-internal: false
      tags:
        - Summary
      summary: Get Firmware Status Count
      description: Retrieves firmware status count information for devices.
      operationId: getFirmwareStatusCount
      x-ai-intent: firmware-status-count-retrieval
      x-ai-purpose: Retrieve firmware status count for devices
      x-ai-usage: Use when AI needs to fetch firmware status count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceClassificationAndSiteFilter"
      responses:
        "200":
          description: Firmware status count retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareStatusVo"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /summary/firmwareSummary:
    post:
      x-internal: false
      tags:
        - Summary
      summary: Get Firmware Summary
      description: Retrieves firmware summary information with pagination support.
        This endpoint provides details about firmware summary for devices in the
        inventory.
      operationId: getFirmwareSummary
      x-ai-intent: firmware-summary-retrieval
      x-ai-purpose: Retrieve firmware summary details for devices with pagination.
