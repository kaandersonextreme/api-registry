    DeviceFwUpgradeRequestFilter:
      type: object
      title: Device Firmware Upgrade Request Filter
      description: >
        Request schema for initiating a firmware upgrade process based on
        classification,

        schedule time, timezone, request type, and device data.
      required:
        - classification
        - request_type
        - data
      properties:
        classification:
          $ref: "#/components/schemas/DeviceFirmwareClassificationFilter"
        schedule_time:
          type: string
