          description: |
            Scheduled time for the firmware upgrade.
          example: 2026-02-12T17:17:06.424Z
        timezone:
          type: string
          description: |
            Timezone for the scheduled upgrade. Accepts IANA time zone names
            (for example "America/New_York"), the literal "UTC", or UTC offset
            strings such as "+05:30". The service validates this value against
            Java's ZoneId (e.g. ZoneId.of(timezone)).
          format: timezone
          example: America/New_York
        request_type:
          $ref: "#/components/schemas/HistoryRequestTypeFilter"
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceFirmwareSummaryInfo"
          description: >
            List of devices with their serial numbers and firmware versions for
