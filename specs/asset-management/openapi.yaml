      properties:
        serial_numbers:
          type: array
          description: List of serial numbers for the devices to be upgraded. Each serial
            number is expected to be an alphanumeric string and may include
            hyphens. Typical formats include vendor prefixes like "SN12345" or
            customer formats like "sn-67890". The service treats serial numbers
