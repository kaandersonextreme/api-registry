      security:
        - BearerAuth: []
components:
  schemas:
    DeviceIdsRequest:
      type: object
      additionalProperties: false
      required:
        - device_ids
      properties:
        device_ids:
          type: array
          description: List of device IDs to filter (maximum 100)
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64
    DeviceClassificationFilter:
      type: string
      enum:
        - WIRELESS
        - SWITCH
        - SDWAN
        - ROUTER
        - XIQ_SE
        - APPLIANCE
        - ALL
        - UNKNOWN
      title: Device Classification Filter
      description: Enum representing the possible values of device classifications on
        which we can filter
      default: ALL
    DeviceStateFilter:
      type: string
      enum:
        - NEW
        - MANAGED
        - UNMANAGED
      title: Device State Filter
      description: Enum representing the possible values of device states on which we
        can filter
    DeviceConnectionStateFilter:
      type: string
      enum:
        - CONNECTED
        - DISCONNECTED
      title: Device Connection State Filter
      description: Enum representing the possible values of device connection states
        on which we can filter
    RequestDeviceType:
      type: string
      enum:
        - Switch
        - SDWAN
        - Controller
        - Router
        - VGVA
        - XIQ SE
        - XMC
        - Appliance
        - Tunnel Concentrator
        - Wireless
        - Appliance Cluster
        - Switch Stack
        - Master
        - Member
        - Backup
        - Wireless Controller
        - SNMP Discovered
        - Third-Party Management Engine
        - Unknown
      title: Device Type
      description: Enum representing the possible types of devices
      default: Unknown
      example: Switch
    DeviceLicenseType:
      type: string
      x-extensible-enum:
        - Legacy
        - Navigator
        - Pilot
        - Copilot
        - Appliance
        - Trial
        - Not Applicable
        - Unknown
        - Not Licensed
        - Standard Tier A
        - Standard Tier B
        - Standard Tier C
        - Standard Tier D
        - Standard Tier 3RD
        - Advanced Tier A
        - Advanced Tier B
        - Advanced Tier C
        - Advanced Tier D
        - None
        - XSW-MSP-DC-S-C
        - XSW-MSP-BR-S-C
        - EP1-SDW-ADV-L-S-C
        - EP1-SDW-ADV-M-S-C
        - EP1-SDW-ADV-S-S-C
        - EP1-SDW-STD-L-S-C
        - EP1-SDW-STD-M-S-C
        - EP1-SDW-STD-S-S-C
        - XSW-BR-XS-S
        - XSW-BR-S-S
        - XSW-BR-M-S
        - XSW-DC-S-S
        - XSW-DC-M-S
        - XSW-DC-SR-L-S
        - XSW-DC-LR-L-S
        - XSW-BR-XS-HA-S
        - XSW-BR-S-HA-S
        - XSW-BR-M-HA-S
        - XSW-DC-S-HA-S
        - XSW-DC-M-HA-S
        - XSW-DC-SR-HA-L-S
        - XSW-DC-LR-HA-L-S
      title: Device License Type
      description: Enum representing the possible license types of a device
      default: Trial
    DeviceEndDate:
      type: string
      enum:
        - END_OF_SALE
        - END_OF_SOFTWARE_MAINTENANCE
        - END_OF_SERVICE_LIFE
      title: Device End Date Filter
      description: Enum representing the possible values of device end dates on which
        we can filter
    ListDevicesRequestFilter:
      type: object
      additionalProperties: false
      properties:
        classification:
          $ref: "#/components/schemas/DeviceClassificationFilter"
        states:
          type: array
          description: Filter on device states
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceStateFilter"
          example:
            - MANAGED
            - UNMANAGED
        connection_states:
          type: array
          description: Filter on device connection states
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceConnectionStateFilter"
          example:
            - CONNECTED
        site_ids:
          type: array
          description: Filter on the site ids where the devices are located
          uniqueItems: true
          items:
            type: integer
            format: int64
          example:
            - 1001
            - 1002
            - 1003
        os_versions:
          type: array
          description: Filter on OS versions (expected in semantic version format-
            MAJOR.MINOR.PATCH.BUILD).
          uniqueItems: true
          items:
            type: string
            maxLength: 32
            pattern: ^\d+\.\d+\.\d+\.\d+$
          example:
            - 16.2.0.5
            - 16.1.3.2
            - 15.7.1.8
        models:
          type: array
          description: Filter on device models
          uniqueItems: true
          items:
            type: string
            maxLength: 32
          example:
            - X460-G2
            - X670-G2
            - X440-G2
        country_name:
          type: array
          description: Filter on country names where the devices are located
          uniqueItems: true
          items:
            type: string
            maxLength: 64
          example:
            - United States
            - Canada
            - United Kingdom
        managing_app:
          type: array
          description: Managing app filter
          uniqueItems: true
          items:
            type: string
            enum:
              - Cloud
              - XIQ SE
              - Controller
              - XIQ
              - Locally
              - TPME
              - Unknown
          example:
            - Cloud
            - XIQ
            - Controller
        device_type:
          type: array
          description: Filter on device type
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RequestDeviceType"
        license_type:
          type: array
          description: Filter on device license type
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceLicenseType"
        end_date:
          $ref: "#/components/schemas/DeviceEndDate"
        ip_address:
          type: array
          description: Filter on ip address. IP address should be in valid IPv4 format.
          uniqueItems: true
          items:
            type: string
            format: ipv4
            maxLength: 32
          example:
            - 192.168.1.10
            - 10.0.0.50
            - 172.16.1.100
        feature_license:
          type: array
          description: Filter on feature license
          uniqueItems: true
          items:
            type: string
            maxLength: 32
          example:
            - ADVANCED_ROUTING
            - SECURITY_SUITE
            - QOS_PLUS
        building_ids:
          type: array
          description: Filter on the building ids where the devices are located
          uniqueItems: true
          items:
            type: integer
            format: int64
          example:
            - 1001
            - 1002
            - 1003
        floor_ids:
          type: array
          description: Filter on the floor ids where the devices are located
          uniqueItems: true
          items:
            type: integer
            format: int64
          example:
            - 1001
            - 1002
            - 1003
        basic_info:
          type: boolean
          description: Return minimal device response
          example: false
          default: false
        column_list:
          type: array
          description: >
            Filter on the columns to be returned in the export csv. Allowed
            values: Serial Number, MAC, Hostname, Device Type, Device Function,
            State, Status, Site, Managed By, Model, Firmware, Country,
            Subscription, Service Contract, End Of Sale Date, End Of Service
            Date, GA Date, EOSM Date, Date Shipped, Date Available, MGT IP
            Address, Feature License, Slot Unit Number
          uniqueItems: true
          items:
            type: string
          example:
            - Hostname
            - State
            - Country
            - Status
            - MGT IP Address
            - MAC
        firmware_status:
          type: string
          description: Filter on device firmware upgrade status
          enum:
            - TOTAL_UPDATES
            - EOVM
            - SECURITY_VULNERABILITY
          example: TOTAL_UPDATES
        is_locally_managed:
          type: boolean
          description: Filter on whether the device is locally managed
          example: true
        switch_type:
          type: string
          description: Filter on switch type (applicable for switches)
          enum:
            - STANDALONE
            - STACK
        appliance_type:
          type: string
          description: Filter on appliance type (applicable for appliances)
          enum:
            - Standalone Appliance
            - Appliance Cluster
        serial_numbers:
          type: array
          description: Filter on device serial numbers. Serial numbers typically contain
            alphanumeric characters and may include hyphens; max length 64.
          uniqueItems: true
          items:
            type: string
            maxLength: 64
            pattern: ^[A-Za-z0-9-]+$
          example:
            - CN12345678
            - FT98765432
            - SN-ABC-12345
        exclude_device_function:
          type: array
          description: Exclude device function
          items:
            type: string
            enum:
              - Tunnel Concentrator
        unassigned_location:
          type: boolean
          description: Filter devices with unassigned location (no site, building, or floor)
          example: true
    ListDevicesRequestBody:
      oneOf:
        - $ref: "#/components/schemas/DeviceIdsRequest"
        - $ref: "#/components/schemas/ListDevicesRequestFilter"
    ResponseDeviceType:
      type: string
      enum:
        - Switch
        - SDWAN
        - Controller
        - Router
        - VGVA
        - XIQ SE
        - XMC
        - Appliance
        - Tunnel Concentrator
        - Wireless
        - Appliance Cluster
        - Switch Stack
        - Master
        - Member
        - Backup
        - Wireless Controller
        - SNMP Discovered
        - Third-Party Management Engine
        - Unknown
      title: Device Type
      description: Enum representing the possible types of devices
      default: Unknown
      example: Switch
    DeviceFunction:
      type: string
      enum:
        - AP
        - Switch Engine
        - Fabric Engine
        - EXOS
        - VOSS
        - XIQ SE
        - Appliance
        - Tunnel Concentrator
        - Router
        - Unknown
      title: Device Function
      description: Enum representing the function or role of a device
      default: Unknown
    DeviceState:
      type: string
      enum:
        - New
        - Managed
        - Unmanaged
        - Unknown
        - Onboarded
        - Provisioned
      title: Device State
      description: Enum representing the possible device states
      x-enumDescriptions:
        New: A NEW device was added
        Managed: The device is MANAGED by a client app (XIQ, SDWAN etc)
        Unmanaged: The device has been UNMANAGED by a client app (XIQ, SDWAN etc)
        Unknown: The device status is UNKNOWN
      default: New
    DeviceManagingApp:
      type: string
      enum:
        - Cloud
        - XIQ SE
        - Controller
        - XIQ
        - Locally
        - TPME
        - Unknown
      title: Device Managing Application
      description: Enum representing the names of possible applications that can
        manage a device
      default: Cloud
    DeviceContract:
      type: object
      properties:
        contract_id:
          type: string
          description: Contract Id
          maxLength: 64
        contract_end_dt:
          type: string
          description: "End of contract date. Format: ISO 8601 date (YYYY-MM-DD). Example:
            2017-01-24"
          format: date
          example: 2017-01-24
        contract_number:
          type: string
          description: Contract number
          maxLength: 64
          example: CN12345678
    DeviceLifeCycle:
      type: object
      description: Device life cycle
      properties:
        end_of_sale_date:
          type: string
          description: "End of sale date. Format: ISO 8601 date (YYYY-MM-DD). Example:
            2017-01-24"
          format: date
          example: 2017-01-24
        end_of_service_date:
          type: string
          description: "End of service date. Format: ISO 8601 date (YYYY-MM-DD). Example:
            2017-01-24"
          format: date
          example: 2017-01-24
        ga_date:
          type: string
          description: "GA (General Availability) date. Format: ISO 8601 date
            (YYYY-MM-DD). Example: 2017-01-24"
          format: date
          example: 2017-01-24
        eosm_date:
          type: string
          description: "End of service maintenance (EOSM) date. Format: ISO 8601 date
            (YYYY-MM-DD). Example: 2017-01-24"
          format: date
          example: 2017-01-24
        ship_date:
          type: string
          description: "Ship date. Format: ISO 8601 date (YYYY-MM-DD). Example: 2017-01-24"
          format: date
          example: 2017-01-24
        ship_to_customer_date:
          type: string
          description: "Ship to customer date. Format: ISO 8601 date (YYYY-MM-DD).
            Example: 2017-01-24"
          format: date
          example: 2017-01-24
    FeatureLicense:
      type: string
      enum:
        - Premier
        - MACsec
        - UPLINK_4X10G
        - UPLINK_8X10G
        - UNKNOWN
      title: Device Feature License
      description: Enum representing the feature license of a device
      default: UNKNOWN
    DeviceStackType:
      type: string
      enum:
        - Master
        - Member
        - Stack
        - Backup
        - Unknown
      title: Device Stack Type
      description: Enum representing the possible types of stack type of a device
      default: Unknown
      example: Master
    MemberDevice:
      type: object
      description: Member device in a stack or ucp device
      properties:
        device_id:
          type: integer
          description: The id of the device
          format: int64
          example: 12345
        created_at:
          type: integer
          format: int64
          description: The creation time of the record, represented as milliseconds since
            the Unix epoch (1970-01-01T00:00:00Z).
          example: 1692624000000
        updated_at:
          type: integer
          format: int64
          description: The last update time of the record, represented as milliseconds
            since the Unix epoch (1970-01-01T00:00:00Z).
          example: 1692710400000
        serial_number:
          type: string
          description: The serial number of the device
          maxLength: 64
          example: XN12345678
        mac_address:
          type: string
          description: MAC address in hexadecimal format without separators (12 hex
            digits, e.g. "aabbccddeeff").
          minLength: 12
          maxLength: 12
          pattern: ^[0-9A-Fa-f]{12}$
          example: aabbccddeeff
        host_name:
          type: string
          description: The host name of the device
          maxLength: 255
          example: switch-floor2-east
        owner_id:
          type: integer
          description: The id of the owner account that owns the device
          format: int64
          example: 101
        msp_id:
          type: integer
          description: The id of the msp account that manages the device
          default: 0
          format: int64
          example: 201
        product_type:
          type: string
          description: The product type of the device, e.g., AP_230, BR_100, NX9600, etc.
          maxLength: 32
          example: X460-G2
        type:
          $ref: "#/components/schemas/ResponseDeviceType"
        function:
          $ref: "#/components/schemas/DeviceFunction"
        admin_status:
          $ref: "#/components/schemas/DeviceState"
        os_version:
          type: string
          description: The firmware version of the device
          maxLength: 32
          example: 16.2.0.5
        is_connected:
          type: boolean
          description: Is the device connected?
          example: true
        site_id:
          type: integer
          description: The id of the site where the device is located
          format: int64
          example: 1001
        site_name:
          type: string
          description: The name of the site where the device is located
          maxLength: 256
