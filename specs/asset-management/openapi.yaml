  /summary/history:
    post:
      x-internal: false
      tags:
        - Summary
      summary: Get Device History
      description: Retrieves device history with pagination, sorting, and search
        capabilities. This endpoint provides historical data for device firmware
        upgrades.
      operationId: listDeviceHistory
      x-ai-intent: device-history-retrieval
      x-ai-purpose: Retrieve historical data for device firmware upgrades.
      x-ai-usage: Use when AI systems need to analyze device history data.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
          description: Page number for pagination (1-based indexing).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 10
          description: Number of records per page.
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated list of fields to sort by. Each field can be
            optionally suffixed with `+` (ascending) or `-` (descending). If no
            suffix is provided, ascending order is used by default.
          example: site_name-,updated_at+
        - name: search
          in: query
          required: false
          schema:
            type: string
            pattern: "[a-zA-Z0-9 ._:%()-]+"
            minLength: 3
          description: Search keyword to filter device history (minimum 3 characters,
            supports alphanumeric and special characters)
      requestBody:
        required: true
        description: Filter criteria for device history including device type,
          classification, status, etc.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListDeviceHistoryFilter"
      responses:
        "200":
          description: The device history response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedDeviceHistoryVo"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /summary/history/column/filters:
    post:
      x-internal: false
      tags:
        - Summary
      summary: Get History Column Filters
      description: Retrieves available filter options for device history columns. This
        endpoint provides unique values for each column in the device history
        table.
      operationId: listHistoryColumnFilters
      x-ai-intent: history-column-filters-retrieval
      x-ai-purpose: Retrieve filter options for device history columns.
      x-ai-usage: Use when AI systems need to analyze or filter device history data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceHistoryRequestFilter"
      responses:
