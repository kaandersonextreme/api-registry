    FirmwareHistoryStatus:
      type: string
      title: Firmware History Status
      description: Represents the status of firmware history during the upgrade process.
      enum:
        - Scheduled
        - Upgrading
        - Complete
        - Failed
      example: Scheduled
    HistoryDeviceTypeFilter:
      type: string
      title: History Device Type Filter
      description: Represents a device type used for filtering device history data.
      enum:
        - Wireless
        - Switch
        - Switch Stack
      example: Wireless
    ListDeviceHistoryFilter:
      type: object
      title: List Device History Filter
      description: >
        Request schema for filtering device history data based on status,
        models,

        device types, OS types, and site names.
      properties:
        status:
          type: array
          items:
            $ref: "#/components/schemas/FirmwareHistoryStatus"
          description: List of firmware history statuses for filtering.
          example:
            - Scheduled
            - Complete
        models:
          type: array
          items:
            type: string
          description: List of device models for filtering.
          example:
            - XR500
            - XR600
        device_type:
          type: array
          items:
            $ref: "#/components/schemas/HistoryDeviceTypeFilter"
          description: List of device types for filtering.
          example:
            - Wireless
            - Switch
        os_type:
          type: array
          items:
            type: string
          description: List of operating system types for filtering.
          example:
            - IQE
            - EXOS
        site_names:
          type: array
          items:
            type: string
          description: List of site names for filtering.
          example:
            - Site A
            - Site B
    DeviceHistoryVo:
      type: object
      title: Device History
      description: Represents a view object for presenting device software upgrade
        history information.
      properties:
        serial_number:
          type: string
          maxLength: 64
          description: Serial number of the device.
          example: SN1234567890
        host_name:
          type: string
          maxLength: 255
          description: Hostname of the device.
          example: Device-123
        status:
          $ref: "#/components/schemas/FirmwareHistoryStatus"
        details:
          type: string
          maxLength: 255
          description: Additional details or error messages related to the device history
            event.
          example: Upgrade completed successfully.
          nullable: true
        start_time:
          type: string
          description: The start time of the firmware upgrade process. Date and time in
            yyyy-MM-dd HH:mm:ss format
          example: 2026-01-26 15:44:46
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])
            (0\d|1\d|2[0-3]):[0-5]\d:[0-5]\d$
          nullable: true
        end_time:
          type: string
          description: The end time of the firmware upgrade process. Date and time in
            yyyy-MM-dd HH:mm:ss format
          example: 2026-01-26 15:53:43
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])
            (0\d|1\d|2[0-3]):[0-5]\d:[0-5]\d$
          nullable: true
        model:
          type: string
          maxLength: 64
          description: Model of the device.
          example: XR500
          nullable: true
        device_type:
          $ref: "#/components/schemas/DeviceMake"
        operating_system:
          type: string
          maxLength: 32
          description: Operating system of the device.
          example: EXOS
        update_to_version:
          type: string
          maxLength: 64
          description: Firmware version to which the device was updated.
          pattern: ^\d+\.\d+\.\d+.*$
          example: 2.0.0
        site_name:
          type: string
          maxLength: 256
          description: Name of the site where the device is located.
          example: Site A
          nullable: true
        external_release_type:
          type: string
          maxLength: 64
          description: External release type of the firmware.
          example: Maintenance
          nullable: true
        classification:
          $ref: "#/components/schemas/DeviceFirmwareClassificationFilter"
        timezone:
          type: string
          description: The timezone in IANA format (e.g., "America/New_York") or UTC,
            indicating the timezone in which the device details are recorded.
          example: UTC
          nullable: true
      required:
        - serial_number
        - host_name
        - status
        - device_type
        - operating_system
        - update_to_version
        - classification
    PagedDeviceHistoryVo:
      type: object
      title: Paginated Device History Response
      description: |
        Response schema containing paginated device history data.
        Provides historical data for device firmware upgrades.
      x-ai-usage: >
        AI systems should use this response to analyze device history data and
        generate insights.
      example:
        data:
          - serial_number: SN12345
            host_name: Device1
            status: Complete
            details: Upgrade successful
            start_time: 2026-01-26 15:44:46
            end_time: 2026-01-26 15:53:43
            model: XR500
            device_type: WIRELESS
            operating_system: IQE
            update_to_version: 12.0.0
            site_name: Site A
            external_release_type: Maintenance
            classification: WIRELESS
            timezone: UTC
        page: 1
        count: 10
        total_pages: 1
        total_count: 5
      required:
        - data
        - page
        - count
        - total_pages
        - total_count
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceHistoryVo"
        page:
          type: integer
          format: int32
          description: Current page number.
          example: 1
        count:
          type: integer
          format: int32
          description: Number of items per page.
          example: 10
        total_pages:
          type: integer
          format: int64
          description: Total number of pages.
          example: 1
        total_count:
          type: integer
          format: int64
          description: Total number of items.
          example: 5
    DeviceHistoryRequestFilter:
      type: object
      title: Device History Request Filter
      description: |
        Request schema for filtering history column data based on status.
      properties:
        status:
          type: array
          items:
            $ref: "#/components/schemas/FirmwareHistoryStatus"
          description: List of firmware history statuses for filtering.
          example:
            - Scheduled
            - Complete
    DeviceUpgradeHistoryFiltersVo:
      type: object
      title: Device Upgrade History Filters Response
      description: >
        Response schema containing unique values for each column in the device
        history table.

        Provides filter options for device history data.
      x-ai-usage: >
        AI systems should use this response to analyze or filter device history
        data.
      required:
        - status
        - models
        - device_type
        - os_type
        - site_name
      properties:
        status:
          type: array
          items:
            type: string
            enum:
              - Scheduled
              - Upgrading
              - Complete
              - Failed
          description: Unique values for the status column.
          example:
            - Scheduled
            - Complete
        models:
          type: array
          items:
            type: string
          description: >-
            Unique values for the models column. Model identifiers represent
            device product models as stored in the product mapping metadata
            (examples include platform family names and product codes). The
            available set of models depends on your inventory and product
            mappings.

            If you want a single canonical list enforced by the API, consider
            moving the model values to a shared enum components/schemas entry so
            callers can rely on a fixed set.
          example:
            - XR500
            - XR600
            - XR600P
            - VOSS7400
            - SwitchEngine_5420F_24P_4XE
            - XR100
        device_type:
          type: array
          items:
            type: string
            enum:
              - AP
              - SWITCH
              - SDWAN
              - CONTROLLER
              - ROUTER
              - VGVA
              - XIQ_SE
              - XMC
              - APPLIANCE
              - TUNNEL_CONCENTRATOR
              - WIRELESS
              - APPLIANCE_CLUSTER
              - SWITCH_STACK
              - MASTER
              - MEMBER
              - BACKUP
              - WIRELESS_CONTROLLER
              - SNMP_DISCOVERED
              - THIRD_PARTY_MANAGEMENT_ENGINE
              - UNKNOWN
          description: Unique values for the device type column. These are the supported
            device type categories used across the platform.
          example:
            - WIRELESS
            - SWITCH
        os_type:
          type: array
          items:
            type: string
          description: Unique values for the OS type column.
          example:
            - ExtremeOS
            - Linux
        site_name:
          type: array
          items:
            type: string
          description: Unique values for the site name column.
          example:
            - Site A
            - Site B
    PsirtsFilter:
      type: object
      title: PSIRTs Filter
      description: |
        Request schema for filtering PSIRTs data based on OS version.
      properties:
        os_version:
          type: array
          items:
            type: string
            pattern: ^[0-9]+\.[0-9]+\.[0-9]+.*$
          description: List of OS versions for filtering PSIRTs.
          example:
            - 33.5.2.118
            - 33.4.1.15-patch1-1
    PsirtListVo:
      type: object
      title: PSIRTs Information
      description: >
        Schema for PSIRTs information, including OS version, product type,
        PSIRTs name,

        URL, and product OS.
      required:
        - os_version
        - product_type
        - psirts_name
        - psirts_url
        - product_os
      properties:
        os_version:
          type: string
          maxLength: 64
          description: OS version or OS identifier. Accepts either a semantic version-like
            string (e.g., "33.5.2.118", "2.0.0") or an OS name/identifier (e.g.,
            "EXOS", "ExtremeOS").
          pattern: ^(?:\d+\.\d+\.\d+.*|[A-Za-z0-9 _.-]{1,64})$
          example: EXOS
        product_type:
          type: string
          description: Product type of the device.
          example: Switch
        psirts_name:
          type: string
          description: Name of the PSIRT.
          example: PSIRT-1234
        psirts_url:
          type: string
          format: uri
          description: URL of the PSIRT.
          example: https://example.com/psirt-1234
        product_os:
          type: string
          description: Product OS of the device.
          example: ExtremeOS
    PagedDataPsirtListVo:
      type: object
      title: Paginated PSIRTs Response
      description: |
        Response schema containing paginated PSIRTs data.
        Provides details about PSIRTs for devices in the inventory.
      x-ai-usage: >
        AI systems should use this response to analyze PSIRTs data and generate
        insights.
      example:
        data:
          - os_version: ExtremeOS
            product_type: Switch
            psirts_name: PSIRT-1234
            psirts_url: https://example.com/psirt-1234
            product_os: ExtremeOS
        page: 1
        count: 10
        total_pages: 1
        total_count: 5
      required:
        - data
        - page
        - count
        - total_pages
        - total_count
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PsirtListVo"
        page:
          type: integer
          format: int32
          description: Current page number.
          example: 1
        count:
          type: integer
          format: int32
          description: Number of items per page.
          example: 10
        total_pages:
          type: integer
          format: int64
          description: Total number of pages.
          example: 1
        total_count:
          type: integer
          format: int64
          description: Total number of items.
          example: 5
  responses:
    400ErrorResponse:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiClientError"
    401ErrorResponse:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    403ErrorResponse:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    500ErrorResponse:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    409ErrorResponse:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  parameters:
    page:
      name: page
      in: query
      description: Page number for pagination, starting from 1
      required: false
      schema:
        minimum: 1
        maximum: 2147483647
        type: integer
        format: int32
        default: 1
    device_limit:
      name: limit
      in: query
      description: Page Size, min = 1, max = 500
      required: false
      schema:
        maximum: 500
        minimum: 1
        type: integer
        format: int32
        default: 10
    sort:
      name: sort
      in: query
      description: "A comma-separated list of sort fields. Sort directions can
        optionally be appended to each sort field. The sort direction can be
        <ul> <li>either <code>+</code> or <code>:asc</code> for ascending
        <li>either <code>-</code> or <code>:desc</code> for descending </ul>
        <p>If no sort direction is specified, ascending is assumed. <p>The sort
        fields are applied in the order they appear in the list.  <p>For
        example, the following sort string sorts by <code>name</code> in
        ascending order, then by <code>age</code> in descending order: <ul>
        <li>sort=name,age- <li>sort=name:asc,age:desc <li>sort=name,age:desc
        </ul> Please refer to the response schema's field descriptions to
        identify the fields that support sorting."
      required: false
      schema:
        type: string
      example: contract_start_dt:asc,contract_end_dt:desc
    search:
      name: search
      in: query
      description: Search string to be used as a parameter for searching
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Page Size, min = 1, max = 100
      required: false
      schema:
        maximum: 100
        minimum: 1
        type: integer
        format: int32
        default: 10
    contractEndInDays:
      name: contract_end_in_days
      in: query
      description: Filter contracts ending within the specified number of days from today
      required: false
      schema:
        minimum: 0
        type: integer
        format: int32
    contract_id-string:
      name: contract_id
      description: The unique contract identifier. Must be exactly 18 alphanumeric
        characters (letters and digits).
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{18}$
        minLength: 18
        maxLength: 18
        example: ABC123DEF456GHI789
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Enter your API Key as a Bearer Token
security:
  - BearerAuth: []
