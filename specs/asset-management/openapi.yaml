    DeviceFirmwareClassificationFilter:
      type: string
      title: Device Firmware Classification Filter
      description: |
        Enum representing various device classifications for firmware filtering.
      enum:
        - WIRELESS
        - SWITCH
        - SDWAN
        - ROUTER
        - XIQ_SE
        - APPLIANCE
        - UNKNOWN
      example: WIRELESS
      default: WIRELESS
    DeviceFirmwareSummaryInfo2:
      type: object
      title: Device Firmware Summary Information
      description: |
        Schema for firmware summary information, including serial numbers and
        the version to update to.
      required:
        - serial_numbers
        - update_to_version
      properties:
        serial_numbers:
          type: array
          description: List of serial numbers for the devices to be upgraded. Each serial
            number is expected to be an alphanumeric string and may include
            hyphens. Typical formats include vendor prefixes like "SN12345" or
            customer formats like "sn-67890".
          uniqueItems: true
          items:
            type: string
            maxLength: 64
            pattern: ^[A-Za-z0-9-]+$
          example:
            - SN12345
            - sn-67890
        update_to_version:
          type: string
          description: Firmware version to update to. Expected core format is
            MAJOR.MINOR.PATCH (for example "2.0.0"). The service also accepts
            extended version strings that contain additional build or patch
            labels (for example "33.5.2.118" or "33.4.1.15-patch1-1"). The
            schema pattern enforces a numeric MAJOR.MINOR.PATCH prefix and
            allows optional trailing labels.
          pattern: ^\d+\.\d+\.\d+.*$
          example: 2.0.0
    DeviceFwSummaryRequestFilter:
      type: object
