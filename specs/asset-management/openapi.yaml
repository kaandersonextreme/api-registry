          description: The history column filters response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceUpgradeHistoryFiltersVo"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /summary/psirts/list:
