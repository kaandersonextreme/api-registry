      security:
        - BearerAuth: []
components:
  schemas:
    SortOrder:
      type: string
      description: "Sort order for results. ASC: ascending order (oldest to newest, or
        lowest to highest based on the sort field). DESC: descending order
        (newest to oldest, or highest to lowest based on the sort field)."
      enum:
        - ASC
        - DESC
    Paged:
      type: object
      required:
        - count
        - page
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          description: The current page number
          format: int32
          example: 1
        count:
          type: integer
          description: The element count of the current page
          format: int32
          example: 10
        total_pages:
          type: integer
          description: The total page number based on request page size
          format: int32
          example: 5
        total_count:
          type: integer
          description: The total element count
          format: int64
          example: 43
    BaseEntity:
      required:
        - id
        - create_time
        - update_time
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier
          format: int64
          example: 12345
        create_time:
          type: string
          description: The create time
          format: date-time
          example: 2026-04-01T02:13:45.780Z
        update_time:
          type: string
          description: The last update time
          format: date-time
          example: 2026-04-02T04:47:41.341Z
    ViqEntity:
      allOf:
        - $ref: "#/components/schemas/BaseEntity"
        - type: object
          properties:
            org_id:
              type: integer
              description: The organization identifier, valid when enabling HIQ feature
              format: int64
          required:
            - org_id
    ClsAddress:
      type: object
      description: The physical address information of the location.
      properties:
        address:
          type: string
          description: The street address line 1
          example: 123 Main St
        address2:
          type: string
          description: The street address line 2
          example: Suite 100
        city:
          type: string
          description: The city or town of the address
          example: Springfield
        postal_code:
          type: string
          description: >
            The postal or ZIP code of the address. Format varies by country
            (e.g., '62701' for US ZIP codes, 'M5H 2N2' for Canadian postal
            codes, 'SW1A 1AA' for UK postcodes).
          example: SW1A 1AA
        state:
          type: string
          description: >
            The province, state, or region of the address. For US addresses, use
            the two-letter US state abbreviation (e.g., 'IL', 'CA', 'NY'). For
            other countries, use the appropriate province/region name or code.
          example: IL
    ClsXrefApplicationType:
      type: string
      description: The types of application that cross-reference the location
      enum:
        - XIQ
        - XSW
        - XUZ
    ClsMeasurementUnit:
      type: string
      description: The measurement unit in feet/meters
      enum:
        - FEET
        - METERS
      default: FEET
    ClsSite:
      allOf:
        - $ref: "#/components/schemas/ViqEntity"
        - type: object
          description: The site information
          required:
            - name
            - country_code
          properties:
            parent_id:
              type: integer
              description: The parent site group ID
              format: int64
              example: 2001
            name:
              type: string
              description: The site name
            unique_name:
              type: string
              description: The unique site name
            type:
              type: string
              enum:
                - SITE
              description: The location type
              example: SITE
            description:
              type: string
              description: The site description
            country_code:
              type: integer
              format: int32
              externalDocs:
                description: Get list of supported country codes
                url: https://extremecloudiq.com/api-docs/api-reference.html#_get_list_of_countries_and_country_codes
              description: The numeric country code for the site.
              example: 840
            address:
              $ref: "#/components/schemas/ClsAddress"
            created_by:
              type: integer
              description: The user ID used to create the site
              format: int64
            latitude:
              type: number
              description: >
                The latitude coordinate for the site location, in decimal
                degrees. Valid range: -90.0 (South Pole) to 90.0 (North Pole).
              format: double
              minimum: -90
              maximum: 90
              example: 37.7749
            longitude:
              type: number
              description: >
                The longitude coordinate for the site location, in decimal
                degrees. Valid range: -180.0 (West) to 180.0 (East).
              format: double
              minimum: -180
              maximum: 180
              example: -122.4194
            applications:
              type: array
              description: The applications that are cross-referencing the site
              items:
                $ref: "#/components/schemas/ClsXrefApplicationType"
            site_type:
              type: string
              description: The site type indoor or outdoor.
              enum:
                - INDOOR
                - OUTDOOR
              default: INDOOR
            device_elevation:
              type: number
              description: Device elevation in the unit specified by 'length_unit' field (FEET
                or METERS) (applicable for outdoor site only).
              format: double
            floor_loss:
              type: number
              description: Floor loss in decibels(dB) (applicable for outdoor site only).
              format: double
            metric_width:
              type: number
              description: Metric width value in the unit specified by length_unit field (FEET
                or METERS) (applicable for outdoor site only).
              format: double
            metric_height:
              type: number
              description: Metric height in the unit specified by 'length_unit' field (FEET or
                METERS) (applicable for outdoor site only).
              format: double
            length_unit:
              $ref: "#/components/schemas/ClsMeasurementUnit"
            environment_type:
              type: string
              description: Environment type (applicable for outdoor site only).
              enum:
                - INDOOR_LINE_OF_SIGHT
                - OUTDOOR_FREE_SPACE
                - OUTDOOR_SUBURBAN
                - OUTDOOR_DENSE_URBAN
                - INDOOR
                - OFFICE
                - WAREHOUSE
                - OBSTRUCTED_IN_BUILDING
                - AUTO
                - CALIBRATED
              default: AUTO
            background:
              type: string
              description: Background image filename with extension like map.png (applicable
                for outdoor site only).
              example: map.png
            set_afc_schedule:
              type: boolean
              description: Set this property to enable afc schedule (applicable for outdoor
                site only).
              default: false
            site_schedule:
              type: integer
              description: Site schedule (applicable for outdoor site only).
              format: int64
              default: 0
            site_timezone:
              type: string
              format: timezone
              description: Site timezone in IANA timezone format (e.g., 'America/New_York')
                (applicable for outdoor site only).
              default: UTC
    PagedClsSite:
      allOf:
        - $ref: "#/components/schemas/Paged"
        - type: object
          properties:
            data:
              type: array
              description: The data in the current page
              items:
                $ref: "#/components/schemas/ClsSite"
    ConstraintViolationError:
      type: object
      properties:
        field:
          type: string
          description: The field name
        message:
          type: string
          description: The detailed description
    ApiClientError:
      required:
        - status
        - title
      type: object
      properties:
        title:
          type: string
          description: The short description of error
        status:
          type: integer
          description: The status code of error
          format: int32
        detail:
          type: string
          description: The detailed description of error
        violations:
          type: array
          description: List of constraint violations
          items:
            $ref: "#/components/schemas/ConstraintViolationError"
    ApiError:
      required:
        - status
        - title
      type: object
      properties:
        title:
          type: string
          description: The short description of error
        status:
          type: integer
          description: The status code of error
          format: int32
        detail:
          type: string
          description: The detailed description of error
    ClsCreateSiteRequest:
      type: object
      required:
        - name
        - country_code
      properties:
        parent_id:
          type: integer
          description: The parent site group ID that this site belongs to
          format: int64
          example: 2001
        name:
          type: string
          description: The name of the site
          example: San Francisco Office
        country_code:
          type: integer
          format: int32
          externalDocs:
            description: Get list of supported country codes
            url: https://extremecloudiq.com/api-docs/api-reference.html#_get_list_of_countries_and_country_codes
          description: The numeric country code for the site.
          example: 840
        address:
          $ref: "#/components/schemas/ClsAddress"
        latitude:
          type: number
          description: >
            The latitude coordinate for the site location, in decimal degrees
            (e.g., 37.7749 for San Francisco). Range: -90.0 to 90.0.
          format: double
          minimum: -90
          maximum: 90
          example: 37.7749
        longitude:
          type: number
          description: >
            The longitude coordinate for the site location, in decimal degrees
            (e.g., -122.4194 for San Francisco). Range: -180.0 to 180.0.
          format: double
          minimum: -180
          maximum: 180
          example: -122.4194
        description:
          type: string
          description: Description of the site
          example: Primary west coast data center
        site_type:
          type: string
          description: The site type indoor or outdoor.
          enum:
            - INDOOR
            - OUTDOOR
          default: INDOOR
        device_elevation:
          type: number
          description: Device elevation in the unit specified by 'length_unit' field
            (applicable for outdoor site only).
          format: double
        floor_loss:
          type: number
          description: Floor loss in dB (applicable for outdoor site only).
          format: double
        metric_width:
          type: number
          description: Width measurement in the unit specified by 'length_unit' field
            (applicable for outdoor site only).
          format: double
        metric_height:
          type: number
          description: Height measurement in the unit specified by 'length_unit' field
            (applicable for outdoor site only).
          format: double
        length_unit:
          $ref: "#/components/schemas/ClsMeasurementUnit"
        environment_type:
          type: string
          description: Environment type (applicable for outdoor site only).
          enum:
            - INDOOR_LINE_OF_SIGHT
            - OUTDOOR_FREE_SPACE
            - OUTDOOR_SUBURBAN
            - OUTDOOR_DENSE_URBAN
            - INDOOR
            - OFFICE
            - WAREHOUSE
            - OBSTRUCTED_IN_BUILDING
            - AUTO
            - CALIBRATED
          default: AUTO
        background:
          type: string
          description: Background image name (applicable for outdoor site only).
        set_afc_schedule:
          type: boolean
          description: Set this property to enable afc schedule (applicable for outdoor
            site only).
          default: false
        site_schedule:
          type: integer
          description: Site schedule (applicable for outdoor site only).
          format: int64
          default: 0
        site_timezone:
          type: string
          format: timezone
          description: Site timezone in IANA timezone format (e.g., 'America/New_York')
            (applicable for outdoor site only).
          default: UTC
    ClsUpdateSiteRequest:
      type: object
      required:
        - name
      properties:
        parent_id:
          type: integer
          description: The parent site group ID
          format: int64
        name:
          type: string
          description: The site name
        address:
          $ref: "#/components/schemas/ClsAddress"
        latitude:
          type: number
          description: The latitude coordinate for the site
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: The longitude coordinate for the site
          format: double
          minimum: -180
          maximum: 180
        description:
          type: string
          description: The site description
        device_elevation:
          type: number
          description: Device elevation in the unit specified by 'length_unit' field (FEET
            or METERS) (applicable for outdoor site only).
          format: double
        floor_loss:
          type: number
          description: Floor loss in decibels(dB) (applicable for outdoor site only).
          format: double
        metric_width:
          type: number
          description: Metric width in the unit specified by 'length_unit' field (FEET or
            METERS) (applicable for outdoor site only).
          format: double
