openapi: 3.0.3
info:
  title: Extreme Platform ONE REST API - Site
  description: Extreme Platform ONE&trade; Site API allows users to access and
    manage Site/Location information, such as Sites, Site Groups, Buildings,
    Floors, etc.
  termsOfService: https://www.extremenetworks.com/company/legal/terms-of-use/
  contact:
    name: Extreme Networks Support
    url: https://www.extremenetworks.com/support
    email: support@extremenetworks.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 25.11.0
servers:
  - url: https://cloudapi.extremecloudiq.com/site/v1
    description: Extreme Platform ONE REST API - Site
tags:
  - name: Site
    description: The Site Service API for managing the ExtremeCloud site related
      configurations in a geographical area
  - name: Site Group
    description: The Site Group API for managing the grouping of sites and/or site groups
  - name: Building
    description: The Site Service API for managing building(s) under a site
  - name: Floor
    description: The Site Service API for managing floor(s) in a building
  - name: Tree
    description: The Site Service API for querying site related configurations on
      the hierarchy tree
  - name: Location Management
    description: The Site Service API for different actions on SiteGroups, Sites,
      Buildings and Floors
  - name: Miscellaneous
    description: The API executes miscellaneous functions.
paths:
  /sites:
    get:
      tags:
        - Site
      summary: List sites
      description: List pages of sites by filter.
      operationId: getSites
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit-500"
        - name: order
          in: query
          description: The sort order by name (ascending by default)
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: name
          in: query
          description: List sites by name (case insensitive)
          required: false
          schema:
            type: string
        - name: ids
          in: query
          description: List sites by IDs
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedClsSite"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Site
      summary: Create site
      description: Create a new site under a site group or the root location.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_create_site
      operationId: createSite
      requestBody:
        description: Create site request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClsCreateSiteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsSite"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /sites/{id}:
    get:
      tags:
        - Site
      summary: Get site by ID
      description: Get the site for the specified ID.
      operationId: getSite
      parameters:
        - $ref: "#/components/parameters/id-int64"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsSite"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    put:
      tags:
        - Site
      summary: Update site by ID
      description: Update the site information with the site ID.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_update_site
      operationId: updateSite
      parameters:
        - $ref: "#/components/parameters/id-int64"
      requestBody:
        description: Update site request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClsUpdateSiteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsSite"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    delete:
      tags:
        - Site
      summary: Delete site by ID
      description: Delete the site for the specified ID.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_delete_site
      operationId: deleteSite
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the site to be deleted.
          schema:
            type: integer
            format: int64
        - name: force_delete
          in: query
          description: When true, forcefully deletes the site and all its descendant sites
            recursively. When false, deletion will fail if the site has
            dependencies.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /site-groups:
    get:
      tags:
        - Site Group
      summary: List site groups
      description: List pages of site groups by filter.
      operationId: getSiteGroups
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit-500"
        - name: order
          in: query
          description: The sort order for site group name (ASC for ascending, DESC for
            descending; ascending by default)
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: name
          in: query
          description: List site groups by name (case insensitive)
          required: false
          schema:
            type: string
        - name: ids
          in: query
          description: List site groups by IDs
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedClsSiteGroup"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Site Group
      summary: Create site group
      description: Create a new site group.
      operationId: createSiteGroup
      requestBody:
        description: Create site group request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClsCreateSiteGroupRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsSiteGroup"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /site-groups/{id}:
    get:
      tags:
        - Site Group
      summary: Get site group by ID
      description: Get the site group for the specified ID.
      operationId: getSiteGroup
      parameters:
        - $ref: "#/components/parameters/id-int64"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsSiteGroup"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    put:
      tags:
        - Site Group
      summary: Update site group by ID
      description: Update the site group information with the site group ID.
      operationId: updateSiteGroup
      parameters:
        - $ref: "#/components/parameters/id-int64"
      requestBody:
        description: Update site group request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClsUpdateSiteGroupRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsSiteGroup"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    delete:
      tags:
        - Site Group
      summary: Delete site group by ID
      description: Delete the site group for the specified ID.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_delete_site_group
      operationId: deleteSiteGroup
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the site group to be deleted.
          schema:
            type: integer
            format: int64
        - name: force_delete
          in: query
          description: When true, forcefully deletes the site group along with all its
            child site groups and associated resources (sites, buildings,
            floors) recursively. When false, deletion will fail if the site
            group has any dependencies.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /buildings:
    get:
      tags:
        - Building
      summary: List buildings
      description: List pages of buildings by filter.
      operationId: getBuildings
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit-500"
        - name: order
          in: query
          description: The sort order by name (ascending by default)
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: name
          in: query
          description: List buildings by name (case insensitive)
          required: false
          schema:
            type: string
        - name: ids
          in: query
          description: List buildings by IDs
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedClsBuilding"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Building
      summary: Create building
      description: Create a new building under the parent location.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_create_building
      operationId: createBuilding
      requestBody:
        description: Create building request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClsCreateBuildingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsBuilding"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    delete:
      tags:
        - Building
      summary: Delete multiple buildings
      description: Delete buildings under the parent location.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_delete_buildings
      operationId: deleteBuildings
      parameters:
        - name: ids
          in: query
          description: List of building IDs to delete.
          required: true
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              type: integer
              format: int64
              minimum: 1
            example:
              - 5784375
              - 7548935
              - 5475434
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsBatchResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /buildings/{id}:
    get:
      tags:
        - Building
      summary: Get a building by ID
      description: Get the building for the specified ID.
      operationId: getBuilding
      parameters:
        - $ref: "#/components/parameters/id-int64"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsBuilding"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    put:
      tags:
        - Building
      summary: Update building
      description: Update the building information with the building ID.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_update_building
      operationId: updateBuilding
      parameters:
        - $ref: "#/components/parameters/id-int64"
      requestBody:
        description: Update building request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClsUpdateBuildingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsBuilding"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    delete:
      tags:
        - Building
      summary: Delete building by ID
      description: Delete the building for the specified ID.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_delete_building
      operationId: deleteBuilding
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the building to be deleted.
          schema:
            type: integer
            format: int64
        - name: force_delete
          in: query
          description: Force deletion of this building and all associated floors, rooms,
            and devices recursively
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /floors:
    get:
      tags:
        - Floor
      summary: List floors
      description: List pages of floors by filter.
      operationId: getFloors
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit-500"
        - name: order
          in: query
          description: The sort order by name (ascending by default)
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: name
          in: query
          description: |
            Filter floors by name (case insensitive).
          required: false
          schema:
            type: string
            example: Floor 1
        - name: ids
          in: query
          description: List floors by IDs
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedClsFloor"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Floor
      summary: Create floor
      description: Create a new floor under the parent building.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_create_floor
      operationId: createFloor
      requestBody:
        description: Create floor request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClsCreateFloorRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsFloor"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    delete:
      tags:
        - Floor
      summary: Delete multiple floors
      description: Delete multiple floors under the parent building.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_delete_floors
      operationId: deleteFloors
      parameters:
        - name: ids
          in: query
          description: List of floor IDs to delete
          required: true
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              type: integer
              format: int64
              minimum: 1
            example:
              - 4324242
              - 4343242
              - 43423423
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsBatchResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /floors/{id}:
    get:
      tags:
        - Floor
      summary: Get a floor by ID
      description: Get the floor for the specified ID.
      operationId: getFloor
      parameters:
        - $ref: "#/components/parameters/id-int64"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsFloor"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    put:
      tags:
        - Floor
      summary: Update floor
      description: Update floor information with the floor ID.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_update_floor
      operationId: updateFloor
      parameters:
        - $ref: "#/components/parameters/id-int64"
      requestBody:
        description: Update floor request body
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClsUpdateFloorRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsFloor"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    delete:
      tags:
        - Floor
      summary: Delete floor by ID
      description: Delete the floor for the specified ID.
      externalDocs:
        description: API Reference
        url: https://extremecloudiq.com/api-docs/api-reference.html#_delete_floor
      operationId: deleteFloor
      parameters:
        - $ref: "#/components/parameters/id-int64"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /floors/floorplan:
    post:
      tags:
        - Floor
      summary: Upload floorplan
      description: Upload the floorplan map for the VIQ.
      operationId: uploadFloorplan
      parameters:
        - name: overrideBg
          in: query
          schema:
            type: boolean
            default: false
          description: |-
            A flag indicating whether to override the existing floor plan image.
            Set to `true` to override, `false` to retain the existing image.
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  description: |-
                    The floor plan image file to upload.
                    Accepted formats: image/png, image/jpeg, image/jpg.
                    Maximum file size: 10 MB.
                  format: binary
                  x-accepted-formats: image/png, image/jpeg, image/jpg
            encoding:
              file:
                contentType: image/png, image/jpeg, image/jpg
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClsUploadImageMetadataResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    get:
      tags:
        - Floor
      summary: List floorplan images
      description: List pages of available floorplan images.
      operationId: getFloorplans
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit-100"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedClsFloorplan"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    delete:
      tags:
        - Floor
      summary: Delete floorplan images by ID
