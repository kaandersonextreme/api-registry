  /tree/:import:
    post:
      tags:
        - Tree
      summary: Import site tree
      description: Import sites groups and sites tree.
      operationId: importTree
      parameters:
        - name: override
          in: query
          schema:
            type: boolean
          description: >-
            A flag indicating whether to override the existing floor plan image
            during import operation.

            Set to true to override the existing image, false to retain the
            existing image.
        - name: id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: >-
            id field corresponds to the folderId under which the XML file will
            be imported. The folderId can be obtained from the GET /tree API.
            Depending on the type of XML being imported, the folderId should be
            as follows:

            If folderId is not provided, the XML is imported under root folder.

            - **Site Group / Site XML:** folderId should be the ID of the site
            group under which the XML has to be imported or the root node .

            - **Building XML:** folderId should be the ID of the site under
            which the XML has to be imported.

            - **Floor XML:** folderId should be the ID of the building under
            which the XML has to be imported.
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  description: >-
                    The file to import. Two formats are accepted:

                    - **.xml** (`text/xml` or `application/xml`): A plain XML
                    export file containing site group, site, building, or floor
                    hierarchy data (e.g., 'site-tree.xml',
                    'building-export.xml').

                    - **.tar.gz** (`application/gzip`): A compressed archive
                    exported from ExtremeCloud that includes the XML hierarchy
                    plus associated floor plan images (e.g.,
                    'location-export.tar.gz', 'floor-plan-bundle.tar.gz').
                  format: binary
                  example: site-tree-import.xml
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - taskId
                properties:
                  taskId:
                    type: string
                    description: The unique identifier for the import task that can be used to track
                      the import operation status.
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /tree/:export:
    post:
      tags:
        - Tree
      summary: Export site tree
      description: export sites groups and sites tree.
      operationId: exportTree
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClsExportTreeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: >
                  Returns the exported sites tree as a binary file in the format
                  specified by the file_type request parameter. When file_type
                  is 'XML_OR_TAR_GZ', the response is either a plain .xml file
                  (for trees without floor plan images) or a .tar.gz archive
                  (for trees that include floor plan images exported from
                  ExtremeCloud).
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
