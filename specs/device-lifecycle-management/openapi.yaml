        location_id:
          type: integer
          format: int64
          description: |
            Unique identifier for the location associated with the device.
          example: 12345
        token:
          type: string
          description: |
            Registration token issued for the device.
          example: 123-123-123
    ResponseEnvelopeRegisterToken:
      title: Device Token Generation Response Envelope
      description: >
        Response envelope for device token operations, providing token issuance
