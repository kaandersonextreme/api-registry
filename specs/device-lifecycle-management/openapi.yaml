    FirmwareUpgradeContext:
      type: string
      title: Firmware Upgrade Context
      description: |
        The context(s) in which the firmware upgrade action applies.
      enum:
        - DEVICES
      example: DEVICES
      default: DEVICES
    HistoryRequestTypeFilter:
      type: string
      title: History Request Type Filter
      description: >
        Enum representing various request types for firmware upgrade processes.

        - SCHEDULE_LATER: Schedule the firmware upgrade for a future time(within
        30 days of the current time).

        - RESCHEDULE: Change the scheduled time of an existing SCHEDULED
        firmware upgrade.

        - CANCEL: Cancel a previously SCHEDULED firmware upgrade.

        - RETRY: Retry a firmware upgrade that previously failed.

        - SCHEDULE_NOW: Schedule the firmware upgrade for immediate execution.
      enum:
        - SCHEDULE_LATER
        - RESCHEDULE
        - CANCEL
        - RETRY
        - SCHEDULE_NOW
      example: SCHEDULE_NOW
    FirmwareUpgradeInfo:
      type: object
      title: Firmware Upgrade Info
      description: >
        Each entry contains upgrade instructions for one classification/type of
        device:

        classification/device_type, optional schedule_time, timezone,
        request_type and

        a list of firmware info items (serial numbers and target version).
      required:
        - classification
        - data
      properties:
        classification:
          $ref: "#/components/schemas/DeviceFirmwareClassificationFilter"
        data:
          type: array
          description: >
            List of firmware items for this device group. Each item includes a
            list

            of serial numbers and the version to update to.
          items:
            $ref: "#/components/schemas/DeviceFirmwareSummaryInfo"
    DeviceFwUpgradeRequestFilter:
      type: object
      title: Device Firmware Upgrade Request Filter
      description: |
        Request schema for initiating a firmware upgrade process.
        The request specifies the target devices, upgrade type,
        optional scheduling details, and firmware versions.
      required:
        - scope
        - request_type
        - firmware_info
      properties:
        scope:
          $ref: "#/components/schemas/FirmwareUpgradeContext"
        schedule_time:
          type: string
          format: date-time
          description: |
            Scheduled execution time for firmware upgrade in UTC.
            Required only for request_type = SCHEDULE_LATER or RESCHEDULE.
            Example: "2026-05-04T16:50:06.000Z"
          example: 2026-05-04T16:50:06.000Z
        timezone:
          type: string
          description: |
            IANA timezone used for validating and displaying schedule_time.
            Required when schedule_time is provided.
          example: Asia/Kolkata
        request_type:
          allOf:
            - $ref: "#/components/schemas/HistoryRequestTypeFilter"
          description: When the upgrade is to be scheduled
        firmware_info:
          type: array
          description: |
            List of firmware upgrade entries grouped by classification,
            each containing target serial numbers and upgrade version.
          items:
            $ref: "#/components/schemas/FirmwareUpgradeInfo"
    DeviceFirmwareUpgradeVo:
      type: object
      title: Firmware Summary Response
      description: >
        Response schema containing firmware summary data with pagination
        details.

        Provides firmware summary details for devices in the inventory.
      x-ai-usage: >
        AI systems should use this response to analyze firmware summary data and
        generate insights.
      x-tags:
        - device-upgrade
      properties:
        response:
          type: string
          description: >
            A human-readable result message for the firmware upgrade operation.
            Examples: "Upgrade scheduled", "Upgrade successful", "Upgrade
            failed: reason".
          example: Upgrade scheduled successfully
      required:
        - response
    DeviceFirmwareRequestFilter:
      type: object
      title: Device Firmware Request Filter
      description: >
        Request schema for filtering firmware versions data based on
        classification,

        serial numbers, and locally managed flag.
      required:
        - classification
        - is_locally_managed
      properties:
        classification:
          $ref: "#/components/schemas/DeviceFirmwareClassificationFilter"
        serial_numbers:
          type: array
          items:
            type: string
          description: |
            List of serial numbers to filter the firmware versions data.
          example:
            - SN12345
            - SN67890
        is_locally_managed:
          type: boolean
          description: |
            Indicates whether the devices are locally managed.
          example: true
    DeviceFirmwareVersionsVo:
      type: object
      title: Firmware Detail Information
      description: >
        Schema for firmware detail information, including model, OS, asset
        count,

        serial numbers, and firmware version details.
      required:
        - data
        - page
        - count
        - total_pages
        - total_count
        - classification
        - is_locally_managed
      properties:
        data:
          type: array
          description: List of firmware details.
          items:
            type: object
            required:
              - model
              - operating_system
              - num_of_assets
              - serial_numbers
              - firmware_version_info
            properties:
              model:
                type: string
                description: Device model.
                example: SwitchEngine_5420F_24P_4XE
              operating_system:
                type: string
                description: Operating system of the device.
                example: ExtremeOS
              num_of_assets:
                type: integer
                format: int32
                description: Number of assets for the firmware.
                example: 5
              serial_numbers:
                type: array
                items:
                  type: string
                description: List of serial numbers for the devices.
                example:
                  - SN12345
                  - SN67890
              firmware_version_info:
                type: array
                items:
                  type: object
                  required:
                    - version
                    - download_link
                    - release_notes_link
                    - external_release_type
                    - psirts_json
                  properties:
                    version:
                      type: string
                      description: Firmware version.
                      example: 1.0.0
                    download_link:
                      type: string
                      format: uri
                      description: Link to download the firmware.
                      example: https://example.com/firmware/download
                    release_notes_link:
                      type: string
                      format: uri
                      description: Link to the release notes.
                      example: https://example.com/firmware/release-notes
                    external_release_type:
                      type: string
                      description: Release type of the firmware.
                      example: Maintenance
                    psirts_json:
                      type: object
                      required:
                        - psirts_details
                      properties:
                        psirts_details:
                          type: array
                          items:
                            type: object
                            required:
                              - psirts_name
                              - psirts_url
                            properties:
                              psirts_name:
                                type: string
                                description: Name of the PSIRT.
                                example: PSIRT-001
                              psirts_url:
                                type: string
                                format: uri
                                description: URL providing details about the PSIRT.
                                example: https://example.com/psirt-details
                        total:
                          type: integer
                          description: Total number of PSIRTs.
                          example: 1073741824
        page:
          type: integer
          format: int32
          description: Current page number.
          example: 1
        count:
          type: integer
          format: int32
          description: Number of items per page.
          example: 10
        total_pages:
          type: integer
          format: int64
          description: Total number of pages.
          example: 1
        total_count:
          type: integer
          format: int64
          description: Total number of items.
          example: 5
        classification:
          type: string
          description: Classification of the firmware.
          example: string
        is_locally_managed:
          type: boolean
          description: Indicates whether the devices are locally managed.
          example: true
    FirmwareAction:
      type: string
      title: Firmware Action
      description: |
        Action to be performed for firmware-related requests. Supports firmware
        upgrades as well as backup and restore actions.
      enum:
        - UPGRADE_FIRMWARE
      example: UPGRADE_FIRMWARE
      default: UPGRADE_FIRMWARE
    FirmwareHistoryStatus:
      type: string
      title: Firmware History Status
      description: Represents the status of firmware history during the upgrade process.
      enum:
        - Scheduled
        - Upgrading
        - Complete
        - Failed
      example: Scheduled
    HistoryDeviceTypeFilter:
      type: string
      title: History Device Type Filter
      description: Represents a device type used for filtering device history data.
      enum:
        - WIRELESS
        - SWITCH
      example: WIRELESS
    ListDeviceHistoryFilter:
      type: object
      title: List Device History Filter
      description: >
        Request schema for filtering device history data based on status,
        models,

        device types, OS types, and site names.
      properties:
        classification:
          allOf:
            - $ref: "#/components/schemas/DeviceFirmwareClassificationFilter"
          description: Device firmware classification filter (e.g., WIRELESS, SWITCH)
        action:
          allOf:
            - $ref: "#/components/schemas/FirmwareAction"
          description: Action type for device history (FIRMWARE_UPGRADE)
        status:
          type: array
          items:
            $ref: "#/components/schemas/FirmwareHistoryStatus"
          description: List of firmware history statuses for filtering.
          example:
            - Scheduled
            - Complete
        models:
          type: array
          items:
            type: string
          description: List of device models for filtering.
          example:
            - XR500
            - XR600
        device_type:
          type: array
          items:
            $ref: "#/components/schemas/HistoryDeviceTypeFilter"
          description: List of device types for filtering.
          example:
            - WIRELESS
            - SWITCH
        os_type:
          type: array
          items:
            type: string
          description: List of operating system types for filtering.
          example:
            - IQE
            - EXOS
        site_names:
          type: array
          items:
            type: string
          description: List of site names for filtering.
          example:
            - Site A
            - Site B
    FirmwareDeviceMake:
      type: string
      title: Device Make
      description: Represents different device makes.
      enum:
        - AP
        - SWITCH
        - WIRELESS
      example: AP
    DeviceHistoryVo:
      type: object
      title: Device History
      description: Represents a view object for presenting device software upgrade
        history information.
      properties:
        serial_number:
          type: string
          maxLength: 64
          description: Serial number of the device.
          example: SN1234567890
        host_name:
          type: string
          maxLength: 255
          description: Hostname of the device.
          example: Device-123
        status:
          $ref: "#/components/schemas/FirmwareHistoryStatus"
          description: Status of the firmware upgrade process.
        details:
          type: string
          maxLength: 255
          description: Additional details or error messages related to the device history
            event.
          example: Upgrade completed successfully.
          nullable: true
        start_time:
          type: string
          description: The start time of the firmware upgrade process in Unix timestamp
            format (milliseconds since epoch).
          example: 2023-10-01T12:40:00Z
          nullable: true
        end_time:
          type: string
          description: The end time of the firmware upgrade process in Unix timestamp
            format (milliseconds since epoch).
          example: 2023-10-02T12:40:00Z
          nullable: true
        model:
          type: string
          maxLength: 64
          description: Model of the device.
          example: XR500
          nullable: true
        device_type:
          $ref: "#/components/schemas/FirmwareDeviceMake"
        operating_system:
          type: string
          maxLength: 32
          description: Operating system of the device.
          example: EXOS
        update_to_version:
          type: string
          maxLength: 64
          description: Firmware version to which the device was updated.
          example: 2.0.0
        site_name:
          type: string
          maxLength: 256
          description: Name of the site where the device is located.
          example: Site A
          nullable: true
        external_release_type:
          type: string
          maxLength: 64
          description: External release type of the firmware.
          example: Stable
          nullable: true
        classification:
          $ref: "#/components/schemas/DeviceFirmwareClassificationFilter"
          description: Classification of the firmware.
        timezone:
          type: string
          description: The timezone in IANA format (e.g., "America/New_York") or UTC,
            indicating the timezone in which the device details are recorded.
          example: UTC
          nullable: true
      required:
        - serial_number
        - host_name
        - status
        - device_type
        - operating_system
        - update_to_version
        - classification
    PagedDeviceHistoryVo:
      type: object
      title: Paginated Device History Response
      description: |
        Response schema containing paginated device history data.
        Provides historical data for device firmware upgrades.
      x-ai-usage: >
        AI systems should use this response to analyze device history data and
        generate insights.
      x-tags:
        - device-history
        - firmware-history
      example:
        data:
          - serial_number: JA23480025
            host_name: Device1
            status: Complete
            details: Upgrade successful
            start_time: 2023-10-01T12:40:00Z
            end_time: 2023-10-02T12:40:00Z
            model: XR500
            device_type: WIRELESS
            operating_system: IQE
            update_to_version: 12.0.0
            site_name: Site A
            external_release_type: GA
            classification: WIRELESS
            timezone: UTC
        page: 1
        count: 10
        total_pages: 1
        total_count: 5
      required:
        - data
        - page
        - count
        - total_pages
        - total_count
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceHistoryVo"
        page:
          type: integer
          format: int32
          description: Current page number.
          example: 1
        count:
          type: integer
          format: int32
          description: Number of items per page.
          example: 10
        total_pages:
          type: integer
          format: int64
          description: Total number of pages.
          example: 1
        total_count:
          type: integer
          format: int64
          description: Total number of items.
          example: 5
    DeviceHistoryRequestFilter:
      type: object
      title: DeviceHistoryRequestFilter
      description: >
        Request filter containing a set of firmware history statuses to filter
        device history.

        The Java type uses LinkedHashSet<FirmwareHistoryStatus> so the array
        enforces unique items.
      properties:
        status:
          type: array
          description: Set of firmware history statuses for filtering. Unique items
            enforced (LinkedHashSet).
          uniqueItems: true
          items:
            $ref: "#/components/schemas/FirmwareHistoryStatus"
          example:
            - Scheduled
            - Complete
      additionalProperties: false
    DeviceUpgradeHistoryFiltersVo:
      type: object
      title: List Device History Filter
      description: >
        Request schema for filtering device history data based on
        classification,

        action, status, models, device types, OS types, and site names.
      properties:
        status:
          type: array
          items:
            type: string
          description: List of firmware history statuses for filtering.
          example:
            - Scheduled
            - Complete
        models:
          type: array
          items:
            type: string
          description: List of device models for filtering.
          example:
            - XR500
            - XR600
        device_type:
          type: array
          items:
            type: string
          description: List of device types for filtering.
          example:
            - WIRELESS
            - SWITCH
        os_type:
          type: array
          items:
            type: string
          description: List of operating system types for filtering.
          example:
            - IQE
            - EXOS
        site_name:
          type: array
          items:
            type: string
          description: List of site names for filtering.
          example:
            - Site A
            - Site B
      additionalProperties: false
    ResponseEnvelopeDeviceHistoryColumnFilterVo:
      title: Device History Column Filter Response Envelope
      description: |
        Response envelope for device history retrieval operations.
        Contains an array or collection of device history records (e.g. firmware
        upgrades, backups, restores) and related metadata, retrieved from device
        inventories and operation logs.
      x-ai-usage: |
        AI systems should analyze the data payload for action distributions,
        failure rates, temporal patterns, and upgrade/restore correlations. The
        response provides historical metadata useful for troubleshooting,
        capacity planning, and automated remediation strategies.
      x-tags:
        - device-history
        - firmware-history
        - response-envelope
      type: object
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DeviceUpgradeHistoryFiltersVo"
          required:
            - data
    Scope:
      type: string
      title: Scope of Action
      description: |
        The scope for which the action applies.
      enum:
        - DEVICES
      example: DEVICES
      default: DEVICES
    BackupRequestTypeFilter:
      type: string
      title: History Request Type Filter
      description: |
        Enum representing various request types for firmware upgrade processes.
      enum:
        - SCHEDULE_NOW
      example: SCHEDULE_NOW
    DeviceFwBackupRequestFilter:
      type: object
      title: Device Firmware Backup Request Filter
      description: |
        Request schema for initiating a firmware backup process.
        The request contains an action, a context, and a data list with entries
        describing which devices (by classification) to backup and how.
      required:
        - scope
        - request_type
        - devices_info
      properties:
        scope:
          $ref: "#/components/schemas/Scope"
        request_type:
          $ref: "#/components/schemas/BackupRequestTypeFilter"
        devices_info:
          type: array
          description: >-
            List of devices to be backed up. It can be serial numbers, site
            details in future.
             Each entry is expected to be an alphanumeric string and may include
             hyphens. The service treats serial numbers as case-insensitive for matching purposes.
             Typical formats include vendor prefixes like "SN12345" or customer formats like "sn-67890".
          uniqueItems: true
          items:
            type: string
            maxLength: 64
            pattern: ^[A-Za-z0-9-]+$
          example:
            - JA102435G-00046
            - TB052436K-H0138
    DeviceFirmwareBackupVo:
      type: object
      title: Firmware Backup Response
      description: |
        Response schema containing firmware backup data with pagination details.
        Provides firmware backup details for devices in the inventory.
      x-ai-usage: >
        AI systems should use this response to analyze firmware backup data and
        generate insights.
      properties:
        status:
          type: integer
          format: int32
          description: |
            Status code indicating the result of the firmware backup operation.
            0 = Success, 1 = Failure.
          example: 0
        response:
          type: string
          description: >
            A human-readable result message for the firmware backup operation.
            Examples: "Backup scheduled", "Backup successful", "Backup failed:
            reason".
          example: Backup scheduled successfully
      required:
        - status
        - response
    ResponseEnvelopeDeviceFirmwareBackup:
      title: Firmware Information Response Envelope
      description: |
        Response envelope for device information lookup operations.
        Contains an array of device information objects retrieved from
        product databases and device discovery services.
      x-ai-usage: >
        AI systems should process the data array for device compatibility

        validation, configuration planning, and automated provisioning
        workflows.

        Each array element provides comprehensive device specifications.
      x-tags:
        - device-backup
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/DeviceFirmwareBackupVo"
