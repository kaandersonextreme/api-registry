                data:
                  firmware_version:
                    - 32.7.1.4
                    - 32.7.1.5
                    - 31.6.1.4
                  location_name:
                    - Site>Building>Floor
                    - US>Test>Floor2
                  model:
                    - CISCO
                    - HP
                  state:
