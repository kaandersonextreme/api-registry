openapi: 3.0.3
info:
  title: Extreme Platform ONE REST API - Device Lifecycle Management
  description: >-
    The Extreme Platform ONE™ Device Lifecycle Management API provides
    comprehensive

    automation and orchestration for the complete network device lifecycle,
    from 

    initial discovery and zero-touch onboarding through operational management 

    and secure decommissioning.


    **🔄 Complete Lifecycle Management:**


    • **Zero-Touch Device Onboarding** - Fully automated provisioning for
    wireless 

    devices (IQEngine/XIQ) and wired devices (EXOS/VOSS) with intelligent 

    configuration validation and compliance checking


    • **Intelligent Bulk Operations** - Enterprise-scale batch processing with 

    Excel-based import/export, template-driven workflows, and automated 

    validation for efficient mass device management


    • **Advanced Device Discovery** - Device detection and classification 

    with automatic product compatibility checking and network topology analysis


    • **Subscription & License Management** - Automated tracking and lifecycle 

    management of device subscriptions, software licenses, and service
    entitlements


    • **Secure Lifecycle Transitions** - Complete device state management from 

    onboarding through operational phases to secure decommissioning with audit
    trails



    **🏢 Enterprise Integration & Scale:**


    Built for enterprise environments with seamless integration capabilities,

    comprehensive audit trails, high-performance batch processing, and 

    enterprise-grade security controls for large-scale network deployments.
  termsOfService: https://www.extremenetworks.com/company/legal/terms-of-use/
  contact:
    name: Extreme Networks Support
    url: https://www.extremenetworks.com/support
    email: support@extremenetworks.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 25.11.0
servers:
  - url: https://cloudapi.extremecloudiq.com/device-lifecycle
    description: Extreme Platform ONE REST API - Device Lifecycle
tags:
  - name: Device
    description: >
      **Advanced Device Lifecycle & Operational Management**



      Complete device lifecycle management covering discovery, configuration, 

      monitoring and decommissioning. Provides real-time device status 

      tracking, automated maintenance workflows, and comprehensive audit trails 

      for enterprise network infrastructure.



      **Core Functions:**

      - Real-time device discovery with automated classification

      - Comprehensive device inventory management with detailed metadata

      - Automated configuration updates and version management

      - Bulk operations for enterprise-scale device management

      - Secure device decommissioning with complete data sanitization

      - Integration with asset management and CMDB systems



      **AI Enhancements:** ML-driven device health analytics, predictive
      failure 

      detection, automated optimization recommendations, intelligent capacity
      planning
paths:
  /v1/devices:
    post:
      x-internal: false
      tags:
        - Device
      summary: Get list of all devices
      description: Retrieves a paginated list of devices with comprehensive filtering,
        searching,  and sorting capabilities. Returns device status,
        configuration, network information,  and links to detailed device views.
        Supports page-based pagination for flexible  data retrieval in
        dashboards, reports, and monitoring systems.
      operationId: listDevices
      x-ai-intent: device-inventory-retrieval
      x-ai-purpose: Retrieve comprehensive device inventory with filtering and
        pagination for monitoring and management
      x-ai-usage: Use when AI systems need to query device inventory, monitor device
        status, generate reports, or perform bulk operations
      parameters:
        - name: page
          in: query
          description: Page number for pagination (1-based indexing)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of items per page (maximum 100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
            example: 50
        - name: search
          in: query
          description: Full-text search query to filter devices. Searches across hostname,
            MAC address,  serial number, management IP, location, model, and
            operating system fields.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: switch-floor-1
        - name: sort
          in: query
          description: Field name to sort results by. By default, results are sorted in
            ascending order if not explicitly specified.  Users can specify the
            sort order by using the '+' character for ascending or the '-'
            character for descending.
          required: false
          schema:
            type: string
            default: hostname
            example: connected_for+
      requestBody:
        description: Filter criteria for device list
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFilter"
            examples:
              default:
                summary: Complete filter example
                value:
                  status:
                    - CONNECTED
                  managed: true
                  managed_by_device_id:
                    - 4563273784384
                    - 43568423842
                  managed_by_type:
                    - TPME
                    - XMC
                    - XIQ_SE
                    - XIQC
                    - Locally
                    - WiNG
                    - Cloud
                    - ALL
                  location_id:
                    - 4563273123456
                  operating_system:
                    - EXOS
                    - VOSS
                  firmware:
                    - 32.7.1.4
                  model:
                    - X460-G2
                    - X690
                  classification: APPLIANCE
              complex_filters:
                summary: Multiple filter criteria
                value:
                  status:
                    - CONNECTED
                  managed: true
                  location_id:
                    - 4563273123456
                  model:
                    - X460-G2
                    - X690
                  operating_system:
                    - EXOS
                  classification: APPLIANCE
              all_filters:
                summary: All available filters
                value:
                  status:
                    - CONNECTED
                    - DISCONNECTED
                  managed: true
                  managed_by_device_id:
                    - 434636438246
                    - 434863748428
                  managed_by_type:
                    - TPME
                    - XMC
                    - XIQ_SE
                    - XIQC
                    - Locally
                    - WiNG
                    - Cloud
                    - ALL
                  location_id:
                    - 4563273123456
                    - 4563273123457
                    - 456327312348
                  operating_system:
                    - EXOS
                    - VOSS
                  firmware:
                    - 32.7.1.4
                    - 32.7.1.5
                  model:
                    - X460-G2
                    - X690
                    - AP410C
                  classification: APPLIANCE
      responses:
        "200":
          description: Successful response with paginated device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
              examples:
                default:
                  summary: Default response with pagination
                  value:
                    data:
                      - id: 1001
                        hostname: switch-floor-1
                        status: CONNECTED
                        managed: true
                        managed_by:
                          id: 2001
                          hostname: switch-01
                          serial_number: TPME-64E0737DEE264837B0036EA140704D25
                          device_type: TPME
                          management_ip: 192.168.1.50
                        location:
                          site: Bengaluru
                          site_id: 4402341578445
                          building: extreme office
                          building_id: 4363686872842
                          floor: first-floor
                          floor_id: 4402341578453
                        connected_for: 7200
                        mac_address: "001122334455"
                        serial_number: TPME-14EC4D564399E91176CFCE2AB2516378
                        management_ip: 192.168.1.100
                        operating_system: EXOS
                        firmware: 32.7.1.4
                        model: X460-G2
                        ipv6_address: 2001:0db8:85a3:0000:0000:8a2e:0370:7334
                      - id: 1002
                        hostname: ap-conference-room
                        status: DISCONNECTED
                        managed: false
                        location:
                          site: USA
                          site_id: 4402341578445
                          building: extreme office
                          building_id: 4363686872842
                          floor: third-floor
                          floor_id: 4402341578453
                        connected_for: null
                        mac_address: AABBCCDDEEFF
                        serial_number: "98197527351258"
                        management_ip: 192.168.2.50
                        operating_system: IQ Engine
                        firmware: 10.6r2
                        model: AP410C
                    pagination:
                      page: 1
                      limit: 50
                      total_pages: 10
                      total_items: 487
                    statistics:
                      total_count: 487
                      managed_count: 450
                      unmanaged_count: 37
                      connected_count: 425
                      disconnected_count: 62
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /v1/devices/:export:
    post:
      tags:
        - Device
      x-internal: false
      summary: Export Devices List
      description: Export device data displayed on the UI in CSV format based on
        filter criteria and search parameters.
      operationId: exportDevicesList
      x-ai-intent: device-data-export
      x-ai-purpose: Export device data for analytics, reporting, and downstream processing
      x-ai-usage: Use when AI needs to extract device data for analysis, machine
        learning, or integration with external systems
      parameters:
        - name: search
          in: query
          description: Full-text search query to filter devices. Searches across hostname,
            MAC address, serial number, management IP, location, model, and
            operating system fields.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: switch-floor-1
        - name: sort
          in: query
          description: Field name to sort results by. By default, results are sorted in
            ascending order if not explicitly specified. Users can specify the
            sort order by using the '+' character for ascending or the '-'
            character for descending.
          required: false
          schema:
            type: string
            default: hostname
            example: connected_for+
      requestBody:
        description: Device filter criteria for exporting filtered devices
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFilter"
        required: false
      responses:
        "200":
          description: Successfully exported devices as CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
                example: |
                  Device Name,MAC Address,Serial Number,IP Address,Model,Status,Firmware
                  Device-1,00:11:22:33:44:55,SN001,192.168.1.10,Model-X,CONNECTED,v1.0
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /v1/devices/:delete:
    post:
      x-internal: false
      tags:
        - Device
      summary: Delete devices from management
      description: Removes devices from centralized management and
        inventory.  Supports bulk deletion operations with comprehensive status
        tracking.  Use with caution as this operation removes devices from
        monitoring and management oversight.
      operationId: deleteDevices
      x-ai-intent: device-lifecycle-decommissioning
      x-ai-purpose: Safely remove devices from the management platform and clean up
        associated resources
      x-ai-usage: Use when AI systems need to automate device retirement, cleanup
        workflows, and resource deallocation
      requestBody:
        description: >
          Delete device request payload.


          Request payload for removing devices from centralized management.
          Supports bulk deletion operations with optional factory reset
          capability. Critical for device lifecycle management and
          infrastructure decommissioning when devices are removed from service.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteDeviceRequestVo"
        required: true
      responses:
        "200":
          description: Device deletion operation initiated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelopeDeleteDevice"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /v1/devices/:status:
    get:
      x-internal: false
      tags:
        - Device
      summary: Get status of delete device operation
      description: Status of Device operations.
      operationId: getDeviceStatus
      x-ai-intent: device-operation-monitoring
      x-ai-purpose: Track progress and completion status of device management
        operations for workflow automation
      x-ai-usage: Use when AI systems need to monitor long-running device operations
        and trigger subsequent workflow steps
      parameters:
        - name: task_key
          in: query
          required: true
          description: The task key of the device operation for which status is to be
            fetched.
          schema:
            type: string
      responses:
        "200":
          description: The device operation status response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelopeDeviceStatus"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /v1/devices/discovery/{device_sn}/:add:
    post:
      x-internal: false
      tags:
        - Device
      summary: Add Discovered Device to Management System
      description: Add a discovered device to the management system using its serial
        number and optional device type. This endpoint facilitates the
        onboarding of devices that have been identified on the network but are
        not yet managed.
      operationId: addDiscoveredDevice
      x-ai-intent: device-discovery-add
      x-ai-purpose: Streamline the onboarding of discovered devices into the
        management system for efficient network administration
      x-ai-usage: Use when AI systems need to facilitate the addition of discovered
        devices for improved network management and automation
      parameters:
        - name: device_sn
          in: path
          required: true
          description: |
            The serial number of the device to be discovered.
            This is a unique identifier for the device.
          schema:
            type: string
            example: TPME-64E0737DEE264837B0036EA140704D25
        - name: device_type
          in: query
          required: false
          description: >
            The type of the device to be discovered.

            This can be used to filter the discovery results based on device
            type.
          schema:
            $ref: "#/components/schemas/DeviceTypeEnum"
            example: TPME
      requestBody:
        description: Device Discovery Add request payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceDiscoveryAddRequestVo"
        required: true
      responses:
        "200":
          description: The device discovery add response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelopeDeviceDiscoveryAdd"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /v1/devices/discovery/{device_sn}/:result:
    get:
      x-internal: false
      tags:
        - Device
      summary: Get Discovered Devices for a Device
      description: Retrieves the list of devices discovered by a specified
        device.  This endpoint provides detailed information about the devices
        that have been identified  during the discovery process, enabling
        administrators to manage and monitor network assets effectively.<br><br>
        **Deprecation Notice:** This endpoint is deprecated and will be removed
        in the future.  Please use the POST
        /v1/devices/discovery/{device_sn}/:result endpoint instead,  which
        offers enhanced filtering and search capabilities.
      operationId: getDeviceDiscoveryResultList
      deprecated: true
      x-ai-intent: device-discovery-results-list
      x-ai-purpose: Enhance network visibility and management through automated
        discovery result retrieval
      x-ai-usage: Use when AI systems need to analyze and act upon device discovery
        data for optimization and troubleshooting
      parameters:
        - name: device_sn
          in: path
          required: true
          description: |
            The serial number of the device to be discovered.
            This is a unique identifier for the device.
          schema:
            type: string
            example: TPME-64E0737DEE264837B0036EA140704D25
        - name: device_type
          in: query
          required: false
          description: >
            The type of the device to be discovered.

            This can be used to filter the discovery results based on device
            type.
          schema:
            $ref: "#/components/schemas/DeviceTypeEnum"
            example: TPME
      responses:
        "200":
          description: The device discovery result response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelopeDeviceDiscoveryResultList"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    post:
      x-internal: false
      tags:
        - Device
      summary: Get Discovered Devices for a Device
      description: Retrieves the list of devices discovered by a specified
        device.  This endpoint provides detailed information about the devices
        that have been identified  during the discovery process, enabling
        administrators to manage and monitor network assets effectively.
      operationId: getDeviceDiscoveryResult
      x-ai-intent: device-discovery-results
      x-ai-purpose: Enhance network visibility and management through automated
        discovery result retrieval
      x-ai-usage: Use when AI systems need to analyze and act upon device discovery
        data for optimization and troubleshooting
      parameters:
        - name: device_sn
          in: path
          required: true
          description: |
            The serial number of the device to be discovered.
            This is a unique identifier for the device.
          schema:
            type: string
            example: TPME-64E0737DEE264837B0036EA140704D25
        - name: device_type
          in: query
          required: false
          description: >
            The type of the device to be discovered.

            This can be used to filter the discovery results based on device
            type.
          schema:
            $ref: "#/components/schemas/DeviceTypeEnum"
        - name: page
          in: query
          description: Page number for pagination (1-based indexing)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of items per page (maximum 500)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 50
            example: 50
        - name: search
          in: query
          description: Full-text search query to filter devices. Searches across
            hostname,  serial number, management IP, location, model, and
            firmware version fields.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
            example: CISCO
        - name: sort
          in: query
          description: >-
            Field name to sort results by (must match the server-side sort
            fields, such as 'ip_address').
                    By default, results are sorted in ascending order if not explicitly specified. Users can specify the
                    sort order by using the '+' character for ascending or the '-' character for descending (for example,
                    'ip_address+' or 'ip_address-').
          required: false
          schema:
            type: string
            default: ip_address
            example: ip_address+
      requestBody:
        required: false
        content:
          application/json:
            schema:
              title: Device discovery filter request
              description: Filter criteria used to narrow the discovered devices returned for
                the specified device.
              allOf:
                - $ref: "#/components/schemas/DeviceDiscoveryResultFilter"
            example:
              firmware_version:
                - 1.2.3.4
              location_name:
                - Site>Building>Floor
              model:
                - CISCO
              state:
                - NEW
      responses:
        "200":
          description: The device discovery result response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelopeDeviceDiscoveryResult"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /v1/devices/discovery/{device_sn}/filters:
