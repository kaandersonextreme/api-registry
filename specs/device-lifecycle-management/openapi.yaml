      summary: Device Discovery Settings
      description: Retrieves the discovery settings for a device based on its serial
        number.  This endpoint allows administrators to view and manage the
        discovery configurations  associated with a specific device,
        facilitating better network management and monitoring.
      operationId: getDeviceDiscoverySettings
      x-ai-intent: device-discovery-settings
      x-ai-purpose: Retrieve and manage device discovery configurations for automated
        network management
      x-ai-usage: Use when AI systems need to access or modify device discovery
        settings for optimization and compliance
      parameters:
        - name: device_sn
          in: path
          required: true
          description: |
            The serial number of the device to be discovered.
            This is a unique identifier for the device.
          schema:
            type: string
            example: TPME-64E0737DEE264837B0036EA140704D25
        - name: device_type
          in: query
          required: false
          description: >
            The type of the device to be discovered.

            This can be used to filter the discovery results based on device
            type.
          schema:
            $ref: "#/components/schemas/DeviceTypeEnum"
            example: TPME
      responses:
        "200":
          description: The device discovery settings response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelopeDeviceDiscoverySettings"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /v1/devices/discovery/{device_sn}/:start:
    post:
      x-internal: false
      tags:
        - Device
      summary: Start Discovery for a Device
      description: Initiates the discovery process for a specified device using its
        serial number.  This endpoint allows administrators to start device
        discovery operations  to identify and catalog devices within the
        network. It is essential for network management  and ensuring that all
        devices are accounted for and properly configured.
      operationId: startDeviceDiscovery
      x-ai-intent: device-discovery-initiation
      x-ai-purpose: Automate the initiation of device discovery processes for
        efficient network management
      x-ai-usage: Use when AI systems need to trigger and manage device discovery workflows
      parameters:
        - name: device_sn
          in: path
          required: true
          description: |
            The serial number of the device to be discovered.
            This is a unique identifier for the device.
          schema:
            type: string
            example: TPME-64E0737DEE264837B0036EA140704D25
        - name: device_type
          in: query
          required: false
          description: >
            The type of the device to be discovered.

            This can be used to filter the discovery results based on device
            type.
          schema:
            $ref: "#/components/schemas/DeviceTypeEnum"
            example: TPME
      requestBody:
        description: Device Discovery Start request payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceDiscoveryStartRequestVo"
        required: true
      responses:
        "200":
          description: The device discovery start response
          content:
            application/json:
              schema:
