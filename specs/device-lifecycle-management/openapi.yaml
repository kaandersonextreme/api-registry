    ActivateTokenRequest:
      type: object
      title: Activate Token Request Object
      description: >
        Request object for activating a device token.

        Contains parameters to specify the device type, deployment type, token
        value and location.
      required:
        - device_type
        - deploy_type
        - location_id
        - token
      properties:
        device_type:
          $ref: "#/components/schemas/DeviceTypeEnum"
          description: Type of the device being activated. Supported values currently is
            "TPME".
          example: TPME
        deploy_type:
          $ref: "#/components/schemas/DeployTypeEnum"
          description: Deploy Type of the device being activated. Supported values
            currently are "VMWARE", "HYPER_V", "NUTANIX".
          example: VMWARE
        location_id:
          type: integer
          format: int64
          description: Unique identifier of the location (floor) where the device
            discovery will be performed. Used for organizational hierarchy,
            policy application, and geographical context. Critical for
            location-based configuration and compliance requirements.
          example: 123456
          minimum: 1
        token:
          type: string
          description: The registration token to be activated for the device.
          example: 123-123-123
    ActivateTokenResponseVo:
      type: object
      title: Activate Token Response
      description: >
        Response object indicating the status and message after attempting to
        activate a device registration token.
      properties:
        status:
          type: integer
          description: >
            HTTP-style status code indicating the current state of the
            activation operation.

            0 = Success, 1 = Failure.

            Used for immediate operation feedback and automated workflow
            decisions.
          format: int32
          example: 0
        message:
          type: string
          description: Human-readable message describing the activation result.
          example: Token activated successfully.
      required:
        - status
        - message
      example:
        status: 0
        message: Token activated successfully.
    ResponseEnvelopeActivateToken:
      title: Device Token Activation Response Envelope
      description: >
        Response envelope for device token operations, providing token issuance
        for device application type like TPME
      x-ai-usage: |
        AI systems should use to activate the generated token
      x-tags:
        - device-token
        - authentication
        - token-operations
        - response-envelope
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/ActivateTokenResponseVo"
              description: Response data for device token activation
    RegisterTokenRequest:
      type: object
      title: Register Token Request Object
      description: >
        Request object for registering a device token.

        Contains parameters to specify the device type, deployment type, and
        location.
      required:
        - device_type
        - deploy_type
        - location_id
      properties:
        device_type:
          $ref: "#/components/schemas/DeviceTypeEnum"
          description: Type of the device being registered. Supported values currently is
            "TPME".
          example: TPME
        deploy_type:
          $ref: "#/components/schemas/DeployTypeEnum"
          description: Deploy Type of the device being registered. Supported values
            currently are "VMWARE", "HYPER_V", "NUTANIX".
          example: VMWARE
        location_id:
          type: integer
          format: int64
          description: Unique identifier of the location (floor) where the device
            discovery will be performed. Used for organizational hierarchy,
            policy application, and geographical context. Critical for
            location-based configuration and compliance requirements.
          example: 123456
          minimum: 1
    TokenResponseVo:
