        - DEVICE_HOSTNAME
        - DEVICE_SERIAL_NUMBER
        - DEVICE_IP_SUBNET
        - DEVICE_LLDP_NEIGHBOR
      title: Rules Engine Device Fields
      description: Enumeration of supported device fields that can be used as
