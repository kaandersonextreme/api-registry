          pattern: ^\d+\.\d+\.\d+.*$
          example: 33.5.2.118
        upgrade_firmware_version:
          type: string
          description: "Firmware version to upgrade to. Expected format: MAJOR.MINOR.PATCH
            with optional additional labels (e.g., 33.4.1.15-patch1-1)."
          pattern: ^\d+\.\d+\.\d+.*$
          example: 33.4.1.15-patch1-1
