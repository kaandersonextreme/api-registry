          maxItems: 100
          uniqueItems: true
          x-ai-context: Hardware identification for RF compliance and asset tracking
    CtrlManagedDeviceOnboardingRequestVo:
      type: object
      title: Controller Managed Device Onboarding Request
      description: >
        Request payload for onboarding controller-managed devices into the
        network management system.

        Contains serial numbers and controller assignments for redundancy and
        failover.
      x-ai-usage: >
        AI systems should interpret the serial numbers as unique device
        identifiers,

        while the primary and backup controllers define the control plane
        endpoints for device management.
      x-tags:
        - controller-devices
        - onboarding
        - device-management
        - redundancy
        - failover
      example:
        serial_numbers:
          - WF062538W-50028
          - WF062538W-50030
        primary_controller: 10.16.231.125
        backup_controller: 10.16.231.126
      required:
        - serial_numbers
      properties:
        serial_numbers:
          type: array
          description: >
            List of serial numbers of the controller managed devices to be
            onboarded.

            Each serial number must be unique and represent a specific hardware
            device.
          example:
            - WF062538W-50028
            - WF062538W-50030
          items:
            type: string
            minLength: 8
            maxLength: 32
            description: Manufacturer serial number for the device
          minItems: 1
          uniqueItems: true
          x-ai-context: Hardware identification for device management
        primary_controller:
          type: string
          description: >
            IP address of the primary controller responsible for managing these
            devices.

            Defines the main control plane endpoint for device management.
          example: 10.16.231.125
          minLength: 8
          maxLength: 32
          x-ai-context: Primary controller device IP address.
        backup_controller:
          type: string
          description: >
            IP address of the backup controller used for redundancy and
            failover.

            Ensures device management continuity in case of primary controller
            failure.
          example: 10.16.231.126
          minLength: 8
          maxLength: 32
          x-ai-context: Backup controller device IP address.
    RulesEngineCapabilityDetailVo:
