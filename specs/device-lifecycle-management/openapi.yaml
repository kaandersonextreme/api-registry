components:
  schemas:
    DeviceStatus:
      type: string
      title: Device Status
      description: Current operational status of the device
      x-ai-usage: Use for health monitoring, alerting, and automated remediation workflows.
      enum:
        - CONNECTED
        - DISCONNECTED
      example: CONNECTED
    ManagingDeviceType:
      type: string
      title: Managing Device Type
      description: Type of device or platform managing the network device. Indicates
        which management system has control over the device. If no managing
        device type is specified, by default ALL types are included in response.
      x-ai-usage: Use to identify the management platform for devices.
      enum:
        - TPME
        - XMC
        - XIQ_SE
        - XIQC
        - Locally
        - WiNG
        - Cloud
        - CONTROLLER
        - ALL
      example: TPME
    DeviceClassificationEnum:
      type: string
      title: Device Classification
      enum:
        - APPLIANCE
        - THIRDPARTY
      description: The device classification type. APPLIANCE represents appliance-type
        devices. THIRDPARTY represents third-party managed devices.
      example: APPLIANCE
    DeviceFilter:
      type: object
      title: Device Filter Criteria
      description: Filter criteria based on device response properties
      properties:
        status:
          type: array
          items:
            $ref: "#/components/schemas/DeviceStatus"
          nullable: true
          description: Filter by device status (supports multiple values for OR logic). If
            no status is specified, by default ALL statuses are included in
            response.
          example:
            - CONNECTED
            - DISCONNECTED
        managed:
          type: boolean
          nullable: true
          description: Filter by managed status (true for managed, false for unmanaged).
            If not specified, by default ALL devices (managed and unmanaged) are
            included in response.
          example: true
        managed_by_device_id:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          description: Filter by managing device ID (supports multiple values for OR
            logic). If no managed_by_device_id is specified, by default ALL
            devices are included in response.
          example:
            - 4563273784384
            - 43568423842
        managed_by_type:
          type: array
          items:
            $ref: "#/components/schemas/ManagingDeviceType"
          nullable: true
          description: Filter by managing device type (supports multiple values for OR
            logic). If no managing_device_type is specified, by default ALL
            types are included in response.
