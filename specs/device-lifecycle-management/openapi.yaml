            - REST API
          typical_deployment: On-premises controller for APs and switches
      enum:
        - CONTROLLER
      example: CONTROLLER
    ControllerOnboardingRequestVo:
      type: object
      title: Controller Onboarding Request
      description: >
        Request payload for onboarding one or more controllers into the network
        management system.

        Each device entry contains a serial number (Lock ID), MAC address,
        device make,

        and an optional location assignment.


        Note: Network Policy is not applicable for controller onboarding.

        If no location is specified for a device, a default location is
        automatically assigned.
      x-ai-usage: >
        AI systems should understand that controller onboarding differs from

        wired/wireless onboarding:

        - The request contains an array of devices, each with its own
        identifiers.

        - Serial numbers represent Lock IDs from the controller hardware.

        - Network policy assignment is not part of the controller onboarding
        flow.

        - Location is optional per device and defaults to an auto-assigned
        location if omitted.
      x-tags:
        - controller-devices
        - infrastructure
        - onboarding
        - device-lifecycle
      example:
        devices:
          - serial_number: LOCK-ID-001
            mac_address: 00:11:22:33:44:55
            device_make: CONTROLLER
            location_id: 3473872642348
          - serial_number: LOCK-ID-002
            mac_address: 00:11:22:33:44:66
            device_make: CONTROLLER
      required:
        - devices
      properties:
        devices:
          type: array
          description: |
            Array of controllers to be onboarded. Each entry identifies a
            single controller by its Lock ID (serial number), MAC address, and
            device make, with an optional location assignment.
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
              - serial_number
              - mac_address
              - device_make
            properties:
              serial_number:
                type: string
                description: |
                  Lock ID from the controller. Serves as the unique
                  serial number identifier for the controller during onboarding.
                example: LOCK-ID-001
                minLength: 4
                maxLength: 64
                x-ai-context: Controller Lock ID for device identification and onboarding
              mac_address:
                type: string
                description: >
                  MAC address of the controller. Used as a unique

                  hardware identifier for the controller during the onboarding
                  process.
                example: 00:11:22:33:44:55
                pattern: ^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$
                x-ai-context: Unique hardware identifier for the controller
              device_make:
                $ref: "#/components/schemas/ControllerMakeEnum"
                description: Make of the controller to be onboarded
              location_id:
                type: integer
                description: >
                  Unique identifier of the physical location
                  (site/building/floor)

                  where this controller will be deployed. Optional; if not
                  provided,

                  a default location is automatically assigned to the
                  controller.
                example: 3473872642348
                format: int64
                minimum: 1
                x-ai-context: Optional infrastructure placement; defaults to auto-assigned
                  location if omitted
