        - STRING_NOT_EQUALS
        - STRING_EXISTS
        - STRING_CONTAINS
        - STRING_NOT_CONTAINS
        - STRING_STARTS_WITH
        - STRING_ENDS_WITH
        - STRING_REGEX_MATCH
        - STRING_LIST_EQUALS
        - NUMBER_EQUALS
        - NUMBER_NOT_EQUALS
        - NUMBER_LESS_THAN
        - NUMBER_GREATER_THAN
        - NUMBER_IN_RANGE
        - NUMBER_NOT_IN_RANGE
        - IPV4_SUBNET_IN
        - IPV4_SUBNET_NOT_IN
        - IPV6_SUBNET_IN
        - IPV6_SUBNET_NOT_IN
      title: Rules Engine Operation Types
      description: Enumeration of supported operation types that can be used to
        evaluate rule conditions.  Includes string operations (equal, contains,
        starts with, ends with, regex matching),  numeric comparisons (equal,
        not equal, less than, greater than, range checks),  and network
        operations (IPv4 and IPv6 subnet matching).
    RulesEngineRuleConditionVo:
