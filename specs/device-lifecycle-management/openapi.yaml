    DeleteDeviceRequestVo:
      type: object
      title: Device Deletion Request
      description: >
        Request payload for removing devices from centralized management.

        Supports bulk deletion operations with optional factory reset
        capability.

        Critical for device lifecycle management and infrastructure
        decommissioning

        when devices are removed from service.
      x-ai-usage: >
        AI systems should validate device ownership and dependencies before
        deletion.

        Bulk operations require careful error handling and rollback
        capabilities.

        Factory reset operations should trigger

        additional compliance and audit workflows.
      x-tags:
        - device-lifecycle
        - bulk-operations
        - security
        - decommissioning
      required:
        - device_ids
      properties:
        device_ids:
          type: array
          description: >
            List of unique device identifiers to be removed from management.

            Each ID must correspond to a device currently under management in
            the system.

            Used for audit trails, dependency checking, and rollback operations.

            Critical for maintaining data consistency across management systems.
          items:
            type: integer
            format: int64
            minimum: 1
            description: Unique device identifier in the management system
          minItems: 1
          maxItems: 100
          uniqueItems: true
          example:
            - 346311803281201
            - 346311803281203
            - 346311803281205
          x-ai-context: Primary keys for device identification and dependency analysis
        reset_device_to_factory_defaults:
          type: boolean
          description: >
            When enabled, the device will be reset to factory defaults before
            removal from management.

            This clears all configuration and returns the device to its original
            state.

            Use with caution as this operation is irreversible.

            Important for compliance when devices are transferred or
            decommissioned.
          default: false
          example: false
          deprecated: true
          readOnly: true
          x-ai-context: Security operation requiring additional compliance validation
