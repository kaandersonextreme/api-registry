    CnsAlertConfiguration:
      type: object
      description: Configuration for alert-based notifications. Defines which
        applications, alert policies, and severity levels should trigger
        notifications. At least one of the subscribe_all flags or specific ID
        arrays should be populated.
      properties:
        subscribe_all_apps:
          type: boolean
          description: When true, subscribes to alerts from all available applications.
            When false, use the apps array to specify individual applications.
        apps:
          type: array
          items:
            type: string
            description: The application identifier.
          description: List of application identifiers to subscribe to. Common values
            include XIQ (ExtremeCloud IQ), XCA (ExtremeCloud Appliance), and
            other Extreme platform applications. Ignored when subscribe_all_apps
            is true.
        subscribe_all_policies:
          type: boolean
          description: When true, subscribes to all alert policies. When false, use
            alert_policy_ids to specify individual policies.
        alert_policy_ids:
          type: array
          items:
            type: integer
            format: int64
          description: List of alert policy IDs to subscribe to. Ignored when
            subscribe_all_policies is true.
        subscribe_all_severities:
          type: boolean
          description: When true, subscribes to alerts of all severity levels. When false,
            use severity_ids to specify individual severity levels.
        severity_ids:
          type: array
          description: List of alert severity IDs to subscribe to (e.g., Critical, Major,
            Minor, Warning, Informational). Ignored when
            subscribe_all_severities is true.
          items:
            type: integer
            format: int64
            description: The alert severity ID.
