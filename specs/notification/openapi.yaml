    CnsSubscriptionNotificationRule:
      allOf:
        - $ref: "#/components/schemas/XiqBaseEntity"
        - type: object
          description: A subscription-based notification rule that triggers notifications
            based on subscription lifecycle events (e.g., expiration warnings,
            renewals). Subscription rules can include timeline-based triggers
            and event-based triggers.
          properties:
            rule_name:
              type: string
              description: Human-readable name for the subscription notification rule.
            is_predefined:
              type: boolean
              description: Indicates whether this is a system-defined rule (true) or a custom
                user-created rule (false). Predefined rules cannot be deleted
                but can be enabled/disabled.
            apps:
              type: array
              items:
                $ref: "#/components/schemas/CnsApplication"
              description: List of applications this rule applies to. Notifications will only
                trigger for events from these applications.
            timeline_rules:
              type: array
              items:
                $ref: "#/components/schemas/CnsNotificationRules"
              description: Timeline-based rules that trigger notifications at specific time
                intervals (e.g., 30 days before subscription expiration, 7 days
                before renewal).
            event_rules:
              type: array
              items:
                $ref: "#/components/schemas/CnsNotificationRules"
              description: Event-based rules that trigger notifications when specific
                subscription events occur (e.g., subscription activated,
                subscription cancelled).
    XiqSubscriptionNotificationRules:
      allOf:
        - type: object
          description: The Subscription notification rules data model
          properties:
            predefined_rule:
              $ref: "#/components/schemas/CnsSubscriptionNotificationRule"
            user_defined_rules:
              type: array
              description: The data in the current page
              items:
                $ref: "#/components/schemas/CnsSubscriptionNotificationRule"
    PagedXiqSubscriptionNotificationRules:
      allOf:
        - $ref: "#/components/schemas/Paged"
        - type: object
          properties:
            data:
              type: array
              description: The data in the current page
              items:
                $ref: "#/components/schemas/XiqSubscriptionNotificationRules"
    XiqCreateSubscriptionNotificationRuleRequest:
      type: object
      description: Request payload to create a new subscription notification rule. At
        least one of timeline_rule_ids or event_rule_ids must be provided.
      anyOf:
        - required:
            - timeline_rule_ids
        - required:
            - event_rule_ids
      required:
        - rule_name
      properties:
        rule_name:
          type: string
          description: Human-readable name for the subscription notification rule. Must be
            unique within the organization.
        force_update:
          type: boolean
          description: When true, allows updating an existing rule with the same name
            instead of returning a conflict error. Default is false.
        apps:
          type: array
          items:
            type: string
            description: Application identifier.
          description: List of application identifiers this rule applies to (e.g., XIQ for
            ExtremeCloud IQ, XCA for ExtremeCloud Appliance). If empty, the rule
            applies to all applications.
        timeline_rule_ids:
          type: array
          description: IDs of timeline rules to include. Timeline rules trigger
            notifications at specific time intervals relative to subscription
            events (e.g., 30 days before expiration).
          items:
            type: integer
            format: int64
            description: Timeline rule ID obtained from the metadata endpoint.
        event_rule_ids:
          type: array
          description: IDs of event rules to include. Event rules trigger notifications
            when specific subscription lifecycle events occur.
          items:
            type: integer
            format: int64
            description: Event rule ID obtained from the metadata endpoint.
    XiqUpdateSubscriptionNotificationRuleRequest:
      type: object
      description: The payload to update Contract notification rule
      anyOf:
        - required:
            - timeline_rule_ids
        - required:
            - event_rule_ids
      required:
        - rule_name
      properties:
        rule_name:
          type: string
          description: The Contract notification rule name.
        force_update:
          type: boolean
          description: The Contract notification rule force update flag.
        apps:
          type: array
          items:
            type: string
            description: The application name.
          description: The application name list, e.g. XIQ, XSW, XUZ etc.
        timeline_rule_ids:
          type: array
          description: The timeline rule ID list.
          items:
            type: integer
            format: int64
            description: The notification timeline rule ID.
        event_rule_ids:
          type: array
          description: The event rule ID list.
          items:
            type: integer
            format: int64
