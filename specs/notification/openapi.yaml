      description: Request payload for registering a new mobile push notification
        token. The token is obtained from APNs (iOS) or FCM (Android) and
        associates the device with the authenticated user.
      required:
        - token
        - device_id
      properties:
        token:
          type: string
          description: The push notification token obtained from the platform's push
            notification service (APNs for iOS, FCM for Android).
        device_id:
          type: string
          description: Unique identifier for the mobile device, typically the device's
            UUID or a generated identifier from the mobile app.
    CnsPushNotificationToken:
      allOf:
        - $ref: "#/components/schemas/XiqBaseEntity"
        - type: object
          description: Represents a mobile push notification token registered for a user's
            device. Tokens are issued by push notification services (APNs for
            iOS, FCM for Android) and used to deliver notifications to mobile
            applications.
          properties:
            token:
              type: string
              description: The device push notification token issued by APNs (iOS) or FCM
                (Android). This token uniquely identifies the app installation
                on a specific device.
            device_id:
              type: string
              description: Unique identifier for the mobile device, typically the device's
                UUID or a generated identifier from the mobile app.
            user_id:
