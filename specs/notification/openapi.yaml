components:
  schemas:
    CnsAlertEmailSortFieldOld:
      type: string
      description: All available email notification sort fields.
      enum:
        - EMAIL_ADDRESS
    SortOrder:
      type: string
      description: "Sort order for results. ASC: ascending order (oldest to newest, or
        lowest to highest based on the sort field). DESC: descending order
        (newest to oldest, or highest to lowest based on the sort field)."
      enum:
        - ASC
        - DESC
    Paged:
      type: object
      required:
        - count
        - page
        - total_count
        - total_pages
      properties:
        page:
          type: integer
          description: The current page number
          format: int32
          example: 1
        count:
          type: integer
          description: The element count of the current page
          format: int32
          example: 10
        total_pages:
          type: integer
          description: The total page number based on request page size
          format: int32
          example: 5
        total_count:
          type: integer
          description: The total element count
          format: int64
          example: 43
    XiqBaseEntityOld:
      required:
        - id
        - create_time
        - update_time
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier
          format: int64
        create_time:
          type: string
          description: The create time
          format: date-time
        update_time:
          type: string
          description: The last update time
          format: date-time
    CnsAlertPolicyOld:
      type: object
      properties:
        policy_id:
          type: integer
          description: The policy identifier, used to identify policy id
          format: int64
        policy_name:
          type: string
          description: The name of the policy
    CnsAlertSeverityOld:
      type: object
      properties:
        severity_id:
          type: integer
          format: int64
          description: The alert severity ID.
        severity_name:
          type: string
          description: The alert severity name.
    CnsAlertSiteOld:
      type: object
      properties:
        site_id:
          type: integer
          description: The location unique identifier
          format: int64
        site_name:
          type: string
          description: The site name
    CnsApplicationOld:
      type: object
      properties:
        app:
          type: string
          description: The application name such as XSW, XIQ etc.
        app_name:
          type: string
          description: The application display name which can be displayed to users such
            as SD-WAN, XCloudIQ etc.
    XiqAlertEmailSubscriptionOld:
      allOf:
        - $ref: "#/components/schemas/XiqBaseEntityOld"
        - type: object
          description: The email subscription data model
          required:
            - email
            - is_email_verified
            - subscribe_all_policies
            - subscribe_all_severities
            - subscribe_all_sites
            - subscribe_all_apps
          properties:
            email:
              type: string
              format: email
              description: The email address.
            is_enabled:
              type: boolean
              description: Enable/disable alert notifications for an email.
            is_email_verified:
              type: boolean
              description: The email address verified flag.
            resend_email_after:
              type: string
              format: date-time
              description: This field represents the time after for the user can resend a new
                verification email.
            subscribe_all_policies:
              type: boolean
              description: The all alert policies selected flag.
            alert_policies:
              type: array
              items:
                $ref: "#/components/schemas/CnsAlertPolicyOld"
              description: This field represents the name of the policy to which this email
                notification belongs to. This field is optional because it is
                only needed when is_subscribe_all is false.
            subscribe_all_severities:
              type: boolean
              description: The all severities selected flag.
            severities:
              type: array
              items:
                $ref: "#/components/schemas/CnsAlertSeverityOld"
              description: This field represents the list of severities the email notification
                belongs to.
            subscribe_all_sites:
              type: boolean
              description: The all sites selected flag.
            sites:
              type: array
              items:
                $ref: "#/components/schemas/CnsAlertSiteOld"
              description: This field represents the list of sites to which this email
                notification belongs to.
            subscribe_all_apps:
              type: boolean
              description: The all apps selected flag.
            apps:
              type: array
              items:
                $ref: "#/components/schemas/CnsApplicationOld"
              description: The field represents the list of applications this email
                notification belongs to.
    PagedXiqAlertEmailSubscriptionOld:
      allOf:
        - $ref: "#/components/schemas/Paged"
        - type: object
          properties:
            data:
              type: array
              description: The data in the current page
              items:
                $ref: "#/components/schemas/XiqAlertEmailSubscriptionOld"
    ConstraintViolationError:
      type: object
      properties:
        field:
          type: string
          description: The field name
        message:
          type: string
          description: The detailed description
    ApiClientError:
      required:
        - status
        - title
      type: object
      properties:
        title:
          type: string
          description: The short description of error
        status:
          type: integer
          description: The status code of error
          format: int32
        detail:
          type: string
          description: The detailed description of error
        violations:
          type: array
          description: List of constraint violations
          items:
            $ref: "#/components/schemas/ConstraintViolationError"
    ApiError:
      required:
        - status
        - title
      type: object
      properties:
        title:
          type: string
          description: The short description of error
        status:
          type: integer
          description: The status code of error
          format: int32
        detail:
          type: string
          description: The detailed description of error
    XiqCreateAlertEmailSubscriptionRequest1:
      type: object
      description: The payload to create email subscription
      required:
        - email
        - is_enabled
        - subscribe_all_policies
        - subscribe_all_apps
        - subscribe_all_severities
      properties:
        email:
          type: string
          description: The email address.
        is_enabled:
          type: boolean
          description: Enable/disable alert notifications for an email.
        subscribe_all_apps:
          type: boolean
          description: The all apps selected flag.
        apps:
          type: array
          items:
            type: string
            description: The application name.
          description: The application name list, e.g. XIQ, XSW, XUZ etc.
        subscribe_all_policies:
          type: boolean
          description: The all alert policies selected flag.
        alert_policy_ids:
          type: array
          items:
            type: integer
            format: int64
          description: The selected alert policy list. This field will be an empty
            collection when is_subscribe_all is true.
        subscribe_all_severities:
          type: boolean
          description: The all severities selected flag.
        severity_ids:
          type: array
          description: The severity ID list.
          items:
            type: integer
            format: int64
            description: The alert severity ID.
    subscriptionIdsOld:
      type: object
      description: The filter to get alert subscriptions
      properties:
        ids:
          type: array
          description: The subscription ID list
          items:
            type: integer
            description: The subscription ID list
            format: int64
    XiqBulkOperationResultOld:
      type: string
      enum:
        - PARTIAL_SUCCESS
        - SUCCESS
    XiqBulkDeleteEmailSubscriptionResultOld:
      type: object
      description: The result of bulk detele email susbscriptions.
      properties:
        ID:
          type: integer
          format: int64
          description: The ID of email subscription.
    XiqDeleteBulkAlertSubscriptionEmailResponseOld:
      type: object
      description: The result of a bulk delete for alert email subscriptions.
      required:
        - result
      properties:
        result:
          type: string
          description: The result of this bulk deletion (SUCCESS/PARTIAL_SUCCESS).
          $ref: "#/components/schemas/XiqBulkOperationResultOld"
          example: PARTIAL_SUCCESS
        reason:
          type: string
          description: Indicate the reason of unresolved_deletion.
          example: At least one ID not found.
        unresolved_deletions:
          type: array
          description: This result will be shown when a bulk delete partially succeeds,
            providing details of unsuccessful delete IDs and associated names.
          items:
            $ref: "#/components/schemas/XiqBulkDeleteEmailSubscriptionResultOld"
    XiqUpdateAlertEmailSubscriptionRequestOld:
      type: object
      description: The payload to create email subscription
      required:
        - email
        - is_enabled
        - subscribe_all_policies
        - subscribe_all_apps
        - subscribe_all_severities
      properties:
