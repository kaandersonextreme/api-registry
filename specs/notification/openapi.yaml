    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 25.11.0
servers:
  - url: https://cloudapi.extremecloudiq.com/notification/v1
    description: Extreme Platform ONE REST API - Notification
tags:
  - name: Email Subscription
    description: Email Subscription Management
  - name: Webhook Subscription
    description: Webhook Subscription Management
  - name: ServiceNow Subscription
    description: ServiceNow Subscription Management
  - name: Email Notification
    description: >-
      **Email Notification Management**


      The Email Notification Management capabilities support the complete
      lifecycle of email configurations within the system.


      **Core Functions:**

      - Retrieve all configured email records across rule types such as alert,
      subscription, and contract

      - View detailed information for an individual email configuration

      - Create new email configurations for each rule type

      - Fully update or partially modify existing configurations without
      replacing the entire record

      - Enable or remove specific email configurations through administrative
      controls

      - Validate email settings or identities via record-level or global
      verification


      **Outcome:**

      Provides comprehensive control over the creation, validation, management,
      and maintenance of email-based notifications.
  - name: Webhook Notification
    description: >-
      **Webhook Notification Management**


      Webhook Notification Management enables end-to-end control of webhook
      configurations in the system.


      **Key Functions:**

      - Retrieve webhook configurations across alert, subscription, and contract
      rule types

      - Access detailed information for a specific webhook

      - Create new webhook configurations per rule type

      - Fully update or partially modify existing webhook settings

      - Enable or remove webhooks as required


      **Outcome:**

      Ensures flexible configuration, controlled activation, and efficient
      lifecycle management of webhook integrations.
  - name: ServiceNow Notification
    description: >-
      **ServiceNow Notification Management**


      ServiceNow Notification Management provides complete administration of
      ServiceNow integration settings.


      **Key Functions:**

      - Retrieve integrations across alert, subscription, and contract rule
      types

      - View detailed configuration of a specific integration

      - Create new integrations for each rule type

      - Fully update or partially modify existing integrations

      - Enable or remove integrations when necessary


      **Outcome:**

      Delivers flexible setup, controlled activation, and streamlined
      maintenance of ServiceNow integrations.
  - name: Notification Rules
    description: >-
      **Notification Rules Management**


      Notification rule management supports contract-based and
      subscription-based rule configurations.


      **Key Functions:**

      - Retrieve lists of existing rules

      - Access detailed information for individual rules

      - Create new rule definitions aligned with operational needs

      - Fully update or partially modify rule logic

      - Remove obsolete rules

      - View summarized, aggregated insights for monitoring and analysis


      **Outcome:**

      Enables flexible rule creation, modification, governance, and visibility
      across subscription and contract contexts.
  - name: Metadata
    description: >-
      **Notification Rules Metadata**


      Metadata access provides structured reference definitions for rule
      behavior and event processing.


      **Key Functions:**

      - Retrieve predefined rule definitions for timeline processing and event
      handling

      - View rule conditions, triggers, and associated actions

      - Support configuration consistency, troubleshooting, and auditing


      **Outcome:**

      Improves transparency, governance, and reliable interpretation of rule
      execution.
  - name: Mobile Push Notification
    description: Mobile Push Notification Token Management
paths:
  /email:
    get:
      tags:
        - Email Notification
      summary: List Email Subscriptions
      description: Retrieves a paginated list of email notification subscriptions.
        Each subscription represents an email address configured to receive
        alert notifications based on specified rules and filters.
      operationId: listEmailSubscriptions
      parameters:
        - name: keyword
          in: query
          description: The keyword to filter email addresses. If blank then skip this
            filter criteria.
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit-500"
        - name: sortField
          in: query
          description: The sort field is the email address.
          required: false
          schema:
            $ref: "#/components/schemas/CnsAlertEmailSortField"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/verified"
        - $ref: "#/components/parameters/enable"
        - $ref: "#/components/parameters/ruleType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedXiqAlertEmailSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Email Notification
      summary: Create Email Subscription
      description: Creates one or more email notification subscriptions. Each
        subscription associates an email address with alert configurations,
        subscription rules, or contract rules. New email addresses require
        verification before notifications are sent.
      operationId: createEmailSubscription
      requestBody:
        description: Email subscription configuration including recipient addresses and
          notification rules.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XiqCreateAlertEmailSubscriptionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertEmailSubscriptionList"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /email/:delete:
    post:
      tags:
        - Email Notification
      summary: Bulk Delete Email Subscriptions
      description: Deletes multiple email subscriptions in a single request. Returns a
        summary of successful and failed deletions. Deleted subscriptions will
        immediately stop receiving notifications.
      operationId: deleteBulkAlertSubscriptionEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/notificationIds"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqDeleteBulkAlertSubscriptionEmailResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /email/:enable:
    post:
      tags:
        - Email Notification
      summary: Bulk Enable/Disable Email Subscriptions
      description: Enables or disables multiple email subscriptions in a single
        request. Disabled subscriptions remain configured but will not receive
        notifications until re-enabled.
      operationId: enableBulkEmailNotification
      parameters:
        - $ref: "#/components/parameters/CnsNotificationEnabledField"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/notificationIds"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqEnableBulkEmailNotificationResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
  /email/{id}:
    get:
      tags:
        - Email Notification
      summary: Get Email Subscription
      description: Retrieves detailed information for a specific email subscription,
        including its verification status, enabled state, and configured
        notification rules.
      operationId: getEmailSubscription
      parameters:
        - $ref: "#/components/parameters/id-int64"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertEmailSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    put:
      tags:
        - Email Notification
      summary: Update Email Subscription
      description: Fully replaces an existing email subscription configuration. All
        fields in the request body will overwrite the current values. Use PATCH
        for partial updates.
      operationId: updateEmailSubscription
      parameters:
        - $ref: "#/components/parameters/id-int64"
      requestBody:
        description: Complete email subscription configuration to replace the existing
          subscription.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XiqUpdateAlertEmailSubscriptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertEmailSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    patch:
      tags:
        - Email Notification
      summary: Patch Email Subscription
      description: Partially updates an email subscription. Only the fields provided
        in the request body will be modified; other fields retain their current
        values.
      operationId: patchEmailSubscription
      parameters:
        - $ref: "#/components/parameters/id-int64"
      requestBody:
        description: Fields to update on the email subscription. Only provided fields
          will be modified.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XiqPatchAlertEmailSubscriptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertEmailSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /email/{id}/:verify:
    post:
      tags:
        - Email Notification
      summary: Send Verification Email
      description: Sends a verification email to the subscription's email address. The
        recipient must click the verification link in the email to confirm
        ownership. Unverified email addresses will not receive alert
        notifications. This endpoint can be called again to resend the
        verification email if the original expired or was not received.
      operationId: verifySubscriptionEmail
      parameters:
        - $ref: "#/components/parameters/id-int64"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /email/:verify:
    post:
      tags:
        - Email Notification
      summary: Bulk Send Verification Emails
      description: Sends verification emails to multiple email subscriptions in a
        single request. Each recipient must click their verification link to
        confirm ownership. This is useful for re-sending verification emails to
        multiple unverified addresses.
      operationId: verifySubscriptionEmailsBulk
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/notificationIds"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /webhook:
    get:
      tags:
        - Webhook Notification
      summary: List Webhook Subscriptions
      description: Retrieves a paginated list of webhook notification subscriptions.
        Each subscription represents an HTTP endpoint configured to receive
        alert notification payloads via POST requests.
      operationId: listWebhookSubscriptions
      parameters:
        - name: keyword
          in: query
          description: The keyword to filter webhook URL. If blank then skip this filter
            criteria.
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit-500"
        - name: sortField
          in: query
          description: The sort field is the webhook URL.
          required: false
          schema:
            $ref: "#/components/schemas/CnsAlertWebhookSortField"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/enable"
        - $ref: "#/components/parameters/ruleType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedXiqAlertWebhookSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - Webhook Notification
      summary: Create Webhook Subscription
      description: Creates one or more webhook notification subscriptions. Each
        subscription configures an HTTPS endpoint to receive JSON payloads when
        alerts match the specified rules. Optionally include a shared secret for
        HMAC signature verification.
      operationId: createWebhookSubscription
      requestBody:
        description: Webhook subscription configuration including endpoint URLs,
          optional secrets, and notification rules.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XiqCreateAlertWebhookSubscriptionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertWebhookSubscriptionList"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /webhook/:delete:
    post:
      tags:
        - Webhook Notification
      summary: Bulk Delete Webhook Subscriptions
      description: Deletes multiple webhook subscriptions in a single request. Returns
        a summary of successful and failed deletions. Deleted subscriptions will
        immediately stop receiving notification payloads.
      operationId: deleteBulkAlertSubscriptionWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/notificationIds"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqDeleteBulkAlertSubscriptionWebhookResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /webhook/:enable:
    post:
      tags:
        - Webhook Notification
      summary: Bulk Enable/Disable Webhook Subscriptions
      description: Enables or disables multiple webhook subscriptions in a single
        request. Disabled subscriptions remain configured but will not receive
        notification payloads until re-enabled.
      operationId: enableBulkWebhookNotification
      parameters:
        - $ref: "#/components/parameters/CnsNotificationEnabledField"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/notificationIds"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqEnableBulkWebhookNotificationResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
  /webhook/{id}:
    get:
      tags:
        - Webhook Notification
      summary: Get Webhook Subscription
      description: Retrieves detailed information for a specific webhook subscription,
        including its endpoint URL, enabled state, and configured notification
        rules.
      operationId: getWebhookSubscription
      parameters:
        - $ref: "#/components/parameters/id-int64"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertWebhookSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    put:
      tags:
        - Webhook Notification
      summary: Update Webhook Subscription
      description: Fully replaces an existing webhook subscription configuration. All
        fields in the request body will overwrite the current values. Use PATCH
        for partial updates.
      operationId: updateWebhookSubscription
      parameters:
        - $ref: "#/components/parameters/id-int64"
      requestBody:
        description: Complete webhook subscription configuration to replace the existing
          subscription.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XiqUpdateAlertWebhookSubscriptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertWebhookSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    patch:
      tags:
        - Webhook Notification
      summary: Patch Webhook Subscription
      description: Partially updates a webhook subscription. Only the fields provided
        in the request body will be modified; other fields retain their current
        values.
      operationId: patchWebhookSubscription
      parameters:
        - $ref: "#/components/parameters/id-int64"
      requestBody:
        description: Fields to update on the webhook subscription. Only provided fields
          will be modified.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XiqPatchAlertWebhookSubscriptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertWebhookSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /servicenow:
    get:
      tags:
        - ServiceNow Notification
      summary: List ServiceNow Subscriptions
      description: Retrieves a paginated list of ServiceNow notification
        subscriptions. Each subscription represents a ServiceNow instance
        configured to receive alert notifications as incidents or events.
      operationId: listServiceNowSubscriptions
      parameters:
        - name: keyword
          in: query
          description: The keyword to filter ServiceNow accounts. If blank then skip this
            filter criteria.
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit-500"
        - name: sortField
          in: query
          description: The sort field is the ServiceNow account email.
          required: false
          schema:
            $ref: "#/components/schemas/CnsAlertServiceNowSortField"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/enable"
        - $ref: "#/components/parameters/ruleType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedXiqAlertServiceNowSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
    post:
      tags:
        - ServiceNow Notification
      summary: Create ServiceNow Subscription
      description: Creates a new ServiceNow notification subscription. The
        subscription connects to a ServiceNow instance using provided
        credentials and creates incidents or events when alerts match the
        specified rules.
      operationId: createServiceNowSubscription
      requestBody:
        description: ServiceNow subscription configuration including instance URL,
          credentials, and notification rules.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XiqCreateAlertServiceNowSubscriptionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertServiceNowSubscriptionList"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /servicenow/:delete:
    post:
      tags:
        - ServiceNow Notification
      summary: Bulk Delete ServiceNow Subscriptions
      description: Deletes multiple ServiceNow subscriptions in a single request.
        Returns a summary of successful and failed deletions. Deleted
        subscriptions will immediately stop creating incidents in ServiceNow.
      operationId: deleteBulkAlertSubscriptionServiceNow
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/notificationIds1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqDeleteBulkAlertSubscriptionServiceNowResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /servicenow/:enable:
    post:
      tags:
        - ServiceNow Notification
      summary: Bulk Enable/Disable ServiceNow Subscriptions
      description: Enables or disables multiple ServiceNow subscriptions in a single
        request. Disabled subscriptions remain configured but will not create
        incidents in ServiceNow until re-enabled.
      operationId: enableBulkServiceNowNotification
      parameters:
        - $ref: "#/components/parameters/CnsNotificationEnabledField"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/notificationIds1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqEnableBulkServiceNowNotificationResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
  /servicenow/{id}:
    get:
      tags:
        - ServiceNow Notification
      summary: Get ServiceNow Subscription
      description: Retrieves detailed information for a specific ServiceNow
        subscription, including its instance URL, enabled state, and configured
        notification rules.
      operationId: getServiceNowSubscription
      parameters:
        - $ref: "#/components/parameters/id-int64"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XiqAlertServiceNowSubscription"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
