        - count
    CasAlertStatsByDevice:
      type: object
      properties:
        serial_number:
          type: string
          description: The device serial number.
          example: 1452G-00686
        location_info:
          $ref: "#/components/schemas/CasLocationInfo"
        stats:
          type: array
          description: The alert count of the specified severities of the device.
          items:
            $ref: "#/components/schemas/CasAlertStatsBySeverity"
    AlertLocationType:
      type: string
      description: The location type.
      enum:
        - FLOOR
        - BUILDING
        - SITE
    CasAlertStatsByLocation:
      type: object
      properties:
        location_id:
          type: integer
          description: The location identifier.
          format: int64
        stats:
          type: array
          description: The alert count of the specified severities of the location.
          items:
            $ref: "#/components/schemas/CasAlertStatsBySeverity"
        sub_locations:
          type: array
          description: The alert count of sub locations.
          items:
            $ref: "#/components/schemas/CasAlertStatsByLocation"
    CasTimeSeriesAlertCount:
      type: object
      properties:
        timestamp:
          type: string
          description: The start of time range for the count
          format: date-time
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/CasAlertStatsBySeverity"
      description: The object includes alert count by severity along a time range. If
        the request contains a time range within a day, then range will be 10
        minutes. If the request contains a time range between 1 day and 7 days,
        then range will be 8 hours. If the request contains a time range between
        7 days and 30 days, then range will be 24 hours/1 day. If the request
        contains a time range between 30 days and 60 days, then range will be 3
        days. If the request contains a time range between 60 days and 90 days,
        then range will be 7 days.
      required:
        - alert_counts
        - timestamp
    CasAlertCountStatsResponse:
