            4=Major, 5=Minor). Use the listAlertSeverities API to retrieve all
            valid severity IDs.
          example: 1
        severity_name:
          type: string
          description: The alert severity name (e.g., 'Critical', 'Major', 'Minor',
            'Warning', 'Info'). Use the listAlertSeverities API to retrieve all
            valid severity names.
          example: Critical
        count:
          type: integer
          description: The alert count of the severity.
          format: int64
