        site_name: Branch-Office-NY
    CasSitesFilter:
      description: "Filter sites by alert policy assignment status. AVAILABLE: sites
        that do not have a site-specific policy assigned (they use the global
        policy). UNAVAILABLE: sites that already have a site-specific policy
