    CasAlertRuleType:
      type: string
      description: Rule type to query
      enum:
        - EVENT
        - METRIC
        - ALL
    CasAlertRuleStatus:
      type: string
      description: Rule status to query
      enum:
        - ENABLED
        - DISABLED
        - BOTH
    XiqAlertRuleThresholdOperator:
      type: string
      description: 'Has value when message_metadata_type is "METRIC", otherwise empty.
        The operator for comparing the metric value against the threshold. GT:
        greater than, GE: greater than or equal to, EQ: equal to, LT: less than,
        LE: less than or equal to, NE: not equal to.'
      enum:
        - GT
        - GE
        - EQ
        - LT
        - LE
        - NE
        - ""
      example: GT
    XiqAlertRule:
      type: object
      description: Represents an alert rule that defines conditions for triggering
        alerts. Rules can be event-based (triggered by specific network events)
        or metric-based (triggered when metrics exceed thresholds). Rules
        support three trigger types - IMMEDIATE (alert instantly), DEFERRED
        (alert after condition persists for a duration), and REPEATED (alert
        when condition occurs multiple times within a time window).
      properties:
        id:
          type: integer
          description: The unique identifier of this rule.
          format: int64
        message_metadata_id:
          type: integer
          format: int64
          description: The identifier for the unique message type that corresponds to this
            rule.  If message_metadata_type is "EVENT", then this identifier
            corresponds to the ID from the alerts metadata events API. If
            message_metadata_type is "METRIC", then this identifier corresponds
            to the ID from the alerts metadata metrics API.
        message_metadata_name:
          type: string
          description: The display name for the message. Can also be used as a display
            name for this rule.
        message_metadata_type:
          type: string
          description: The type of the alert message. EVENT rules are triggered by
            specific network events; METRIC rules are triggered when a metric
            crosses a threshold.
          enum:
            - EVENT
            - METRIC
          example: EVENT
        description:
          type: string
          description: This is a description for the alert rule.
        severity_id:
          type: integer
          format: int64
          description: The severity identifier. The list of severities is available from
            the alerts metadata severity API.
        severity_name:
          type: string
          description: The display name for the alert severity.
        trigger_type:
          type: string
          description: The configured trigger type of the rule. IMMEDIATE triggers
            instantly, DEFERRED triggers after the condition persists for a
            duration, REPEATED triggers when the condition occurs multiple times
            within a time window.
          enum:
            - IMMEDIATE
            - DEFERRED
            - REPEATED
          example: IMMEDIATE
        is_enabled:
          type: boolean
          description: True if this rule is active and enabled.
        duration:
          type: integer
          format: int32
          description: Has value when trigger_type is "DEFERRED". The deferred duration,
            in seconds.
          example: 1
        time_window:
          type: integer
          format: int32
          description: Has value when trigger_type is "REPEATED". The time window to count
            the number of repeated messages, in seconds.
        count:
          type: integer
          format: int32
          description: Has value when trigger_type is "REPEATED". The lower bound of the
            number of messages required to trigger this rule.
          example: 3
        threshold:
          type: number
          format: double
          description: Has value when message_metadata_type is "METRIC". The threshold
            value for the metric in the unit specified by the unit field.
        unit:
          type: string
          description: The unit of this threshold (e.g., '%', 'dBm', 'Mbps', 'ms').
          example: "%"
        operator:
          $ref: "#/components/schemas/XiqAlertRuleThresholdOperator"
      required:
        - id
        - message_metadata_id
        - message_metadata_name
        - message_metadata_type
        - description
        - severity_id
        - severity_name
        - trigger_type
        - is_enabled
    XiqUpdateAlertRuleRequest:
      type: object
      properties:
        description:
          type: string
          description: This is a description for the alert rule.
        severity_id:
          type: integer
          format: int64
          description: The severity identifier. The list of severities is available from
            the alerts metadata severity API.
        trigger_type:
          type: string
          description: The configured trigger type of the rule. IMMEDIATE triggers
            instantly, DEFERRED triggers after the condition persists for a
            duration, REPEATED triggers when the condition occurs multiple times
            within a time window.
          enum:
            - IMMEDIATE
            - DEFERRED
            - REPEATED
          example: IMMEDIATE
        duration:
          type: integer
          format: int32
          description: Has value when trigger_type is "DEFERRED". The deferred duration,
            in seconds.
          example: 1
        time_window:
          type: integer
          format: int32
          description: Has value when trigger_type is "REPEATED". The time window to count
            the number of repeated messages, in seconds.
        count:
          type: integer
          format: int32
          description: Has value when trigger_type is "REPEATED". The lower bound of the
            number of messages required to trigger this rule.
          example: 3
        threshold:
          type: number
          format: double
          description: Has value when message_metadata_type is "METRIC". The threshold
            value for the metric. Common units include '%' (percentage), 'dBm'
            (signal strength), 'Mbps' (throughput), 'ms' (latency). The
            applicable unit is defined by the metric type and can be retrieved
            from the alerts metadata metrics API.
        operator:
          $ref: "#/components/schemas/XiqAlertRuleThresholdOperator"
    AlertApp:
      type: object
      description: Represents an Extreme platform application that supports alerting.
        Each application has a code identifier used in API filters and a display
        name for UI presentation.
      properties:
        app:
          type: string
          description: The application code identifier (e.g., XIQ, XCA, XSW). Use this
            value when filtering alerts by application.
          example: XIQ
        app_name:
          type: string
          description: The human-readable application name for display purposes (e.g.,
            ExtremeCloud IQ, ExtremeCloud Appliance, SD-WAN).
      required:
        - app
        - app_name
    AlertCategory:
      type: object
      description: Represents an alert category that groups related alert types.
        Categories help organize alerts by functional area (e.g., Network,
        Security, Hardware, Configuration).
      properties:
        id:
          type: integer
          format: int64
          description: The alert category ID.
        name:
          type: string
          description: The alert category name (e.g., 'Network Access', 'Application
            Access', 'Service', 'Device'). Use the listAlertCategories API to
            retrieve all valid category names.
          example: Network Access
      required:
        - id
        - name
    AlertMessageType:
      type: object
      description: The Alert Message Type Model
      properties:
        id:
          type: integer
          format: int64
          description: The alert message type ID.
        name:
          type: string
          description: The alert message type name (e.g., 'Avg CPU Usage', 'Device
            Offline', 'Maximum Consumed Power', 'Network Interface Down').
          example: Device Offline
      required:
        - id
        - name
    AlertSeverity:
      type: object
      description: Represents an alert severity level used to classify the urgency and
        impact of alerts. Common severities include Critical, Major, Minor,
        Warning, and Informational.
      properties:
        id:
          type: integer
          format: int64
          description: The alert severity ID.
        name:
          type: string
          description: The alert severity name (e.g., 'Critical', 'Major', 'Minor',
            'Warning', 'Info').
          example: Critical
      required:
        - id
        - name
    AlertSourceType:
      type: object
      description: The Alert Source Type Model
      properties:
        id:
          type: integer
          format: int64
          description: The alert source type ID.
        name:
          type: string
          description: The alert source type (e.g., 'Device', 'Client', 'Network
            Service'). Use the listAlertSourceTypes API to retrieve all valid
            source types.
          example: Device
      required:
        - id
        - name
  responses:
    400ErrorResponse:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiClientError"
    401ErrorResponse:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    403ErrorResponse:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    500ErrorResponse:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  parameters:
    page:
      name: page
      in: query
      description: Page number for pagination, starting from 1
      required: false
      schema:
        minimum: 1
        maximum: 2147483647
        type: integer
        format: int32
        default: 1
    limit-500:
      name: limit
      in: query
      description: Page Size, min = 1, max = 500
      required: false
      schema:
        maximum: 500
        minimum: 1
        type: integer
        format: int32
        default: 500
    startTime:
      name: startTime
      in: query
      description: The start time to query. <p>The format is defined by RFC 3339,
        section 5.6, for example, <code>2024-02-22T10:00:00.000Z</code>.
      required: false
      schema:
        type: string
        format: date-time
    endTime:
      name: endTime
      in: query
      description: The end time to query. <p>The format is defined by RFC 3339,
        section 5.6, for example, <code>2024-02-22T11:00:00.000Z</code>.
      required: false
      schema:
        type: string
        format: date-time
    order:
      name: order
      in: query
      description: The sort order (ascending by default)
      required: false
      schema:
        $ref: "#/components/schemas/SortOrder"
    apps:
      name: apps
      in: query
      description: The application name list. Use the listAlertApps API to retrieve
        all valid application codes.
      required: false
      schema:
        type: array
        example:
          - XIQ
        items:
          type: string
          description: The application code identifier (e.g., 'XIQ', 'XSW', 'XUZ', 'XCA').
    acknowledged:
      in: query
      name: acknowledged
      description: When omitted, all alerts are returned. Set to false to return only
        unacknowledged alerts. Set to true to return only acknowledged alerts.
      required: false
      schema:
        type: boolean
    categoryIds:
      in: query
      description: The alert category Ids to filter, use alert/metadata API to get
        category information.
      name: categoryIds
      required: false
      schema:
        type: array
        description: The alert category ID list.
        items:
          type: integer
          format: int64
          description: The alert category ID.
    severityIds:
      in: query
      description: The alert severity Ids to filter, use alert/metadata API to get
        severity information.
      name: severityIds
      required: false
      schema:
        type: array
        description: The alert severity ID list.
        items:
          type: integer
          format: int64
          description: The alert severity ID.
    messageMetadataIds:
      in: query
      description: The message metadata ID list to filter. Use
        /alert/metadata/events-by-category or
        /alert/metadata/metrics-by-metricset APIs to get the message metadata
        information.
      name: messageMetadataIds
      required: false
      schema:
        type: array
        description: The message metadata ID list.
        items:
          type: integer
          format: int64
          description: The message metadata ID.
    siteIds:
      in: query
      description: The site ID list to filter.
      name: siteIds
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
          description: The site ID
    floorIds:
      in: query
      description: The floor ID list to filter.
      name: floorIds
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
          description: The floor ID
    buildingIds:
      in: query
      description: The building ID list to filter.
      name: buildingIds
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
          description: The building ID
    sortField:
      name: sortField
      in: query
      description: The sort field
      required: false
      schema:
        $ref: "#/components/schemas/XiqAlertSortField"
    keyword:
      name: keyword
      in: query
      description: The keyword to filter alerts by summary, severity, source, etc.
      example: Device Disconnected
      required: false
      schema:
        type: string
    sourceTypeIds:
      in: query
      description: The alert sourceType Ids to filter, use alert/metadata API to get
        sourceType information.
      name: sourceTypeIds
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
          description: The alert sourceType ID.
    deviceIds:
      in: query
      description: The device Ids to filter.
      name: deviceIds
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
          description: The alert device ID.
    alertIds_list:
      in: query
      description: The alert Ids to filter. If alertIds is provided, all other filters
        will be ignored except startTime and endTime.
      name: alertIds
      required: false
      schema:
        type: array
        items:
          type: string
          description: The alert ID.
    alertStatus:
      in: query
      name: status
      description: Filter alerts by their status. When omitted, all alerts are
        returned. Value can be either "active" or "inactive".
      required: false
      schema:
        type: string
        enum:
          - active
          - inactive
    group:
      name: group
      in: path
      description: The group to count from. If "APPLICATION" is selected, "apps" query
        parameter will be ignored.
      required: true
      schema:
        $ref: "#/components/schemas/XiqAlertGroupQuery"
    siteId:
      in: query
      description: The site ID to filter.
      name: siteId
      required: false
      schema:
        type: integer
        format: int64
        description: The site ID
    siteIdsForCountByGroup:
      in: query
      description: The site ID list to filter. If both [siteId] and [siteIds] list is
        populated, then siteId takes precedence.
      name: siteIds
      required: false
      schema:
        type: array
        items:
          type: integer
          format: int64
          description: The site ID
    locationType:
      in: query
      name: locationType
      description: The location type to count from. When locationType=BUILDING/FLOOR,
        The siteId parameter must be provided. When locationType=SITE, siteId is
        not a required parameter.
      required: false
      schema:
        $ref: "#/components/schemas/AlertLocationType"
    exportHeaders:
      in: query
      description: The column headers required in the export report. (e.g.,
        'message_metadata_name', 'summary', 'severity_name', 'acknowledged',
        'app', 'site_name', 'category_name', 'source', 'time', 'status').
      name: columnHeaders
      required: false
      schema:
        type: array
        example:
          - severity_name
        items:
          type: string
          description: The column header for the export CSV file.
          enum:
            - message_metadata_name
            - summary
            - severity_name
            - acknowledged
            - app
            - site_name
            - category_name
            - source
            - time
            - status
    policyId:
      in: path
      name: policyId
      description: The alert policy identifier. Must be a valid site policy ID; the
        global policy cannot be deleted or modified via this parameter.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 10012345678
      required: true
    ruleId:
      name: ruleId
      in: path
      description: The alert rule identifier.
      required: true
      schema:
        type: integer
        format: int64
    apps1:
      name: apps
      in: query
      description: The application code list to filter by. Use the listAlertApps API
        to retrieve all valid application codes.
      required: false
      schema:
        type: array
        items:
          type: string
          description: The application code identifier (e.g., XIQ, XCA, XSW, XUZ).
          example: XIQ
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Enter your API Key as a Bearer Token
security:
  - BearerAuth: []
