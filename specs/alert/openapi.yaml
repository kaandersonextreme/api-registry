            $ref: "#/components/schemas/CasAlertEventRulesByCategory"
        metric_rules_overview:
          type: array
          description: A list of overviews of the metric-based alert rules, grouped by
            metricset.
          items:
            $ref: "#/components/schemas/CasAlertMetricRulesByMetricset"
    CasAlertPolicyAndRules:
      type: object
      description: Represents an alert policy with its complete rule configuration.
        Includes policy metadata, assigned sites (for site policies), and all
