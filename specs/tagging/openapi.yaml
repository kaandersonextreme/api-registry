servers:
  - url: https://cloudapi.extremecloudiq.com/tagging/v1
    description: Extreme Platform ONE REST API - Tagging
tags:
  - name: Tags
    description: >
      **Tag Management Operations**


      Tags are lightweight labels used to categorize and organize entities
      within the system. Each tag has:

      - A unique name within the owner's scope

      - A type (manual, auto, or system-generated)

      - A service owner identifier

      - Optional attributes for additional metadata


      Use these endpoints to create, read, update, and delete tags, as well as
      manage their relationships with entities.
  - name: Entities
    description: >
      **Entity Management Operations**


      Entities represent the actual resources (devices, services, applications,
      etc.) that can be tagged. Each entity has:

      - A unique identifier (CSID) from the creating service

      - A human-readable name

      - A type classification

      - Optional metadata as a JSON blob

      - A service owner identifier


      Use these endpoints to manage entities and their tag associations.
  - name: Policies
    description: >
      **Policy Management Operations**


      Policies define automated rules for tag management based on criteria
      matching. They enable:

      - Automatic tag assignment based on entity properties

      - Tag lifecycle automation

      - Compliance enforcement

      - Dynamic tag updates based on changing conditions


      Policies use a flexible criteria system supporting complex logical
      conditions.
  - name: Associate
    description: >
      **Tag-Entity Association Operations**


      Association operations manage the many-to-many relationships between tags
      and entities. Features include:

      - Bulk association and disassociation operations

      - Bidirectional relationship management

      - Validation of association constraints

      - Audit trail for association changes


      Associations can be created from either the tag side or the entity side.
  - name: Attributes
    description: >
      **Tag Attribute Management**


      Attributes provide a key-value metadata system for tags, enabling:

      - Extended tag information storage

      - Custom properties for specific use cases

      - Searchable metadata for advanced filtering

      - Structured data attachment to tags


      Attributes support create, read, update, and delete operations with
      validation.
  - name: Owner
    description: >
      **Owner-based Operations**


      Owner-based operations provide multi-tenant capabilities by scoping
      operations to specific service owners. Features:

      - Bulk operations scoped to owner

      - Data isolation between owners

      - Administrative operations

      - Cleanup and maintenance tasks
  - name: Telemetry
    description: |
      **Telemetry and Monitoring**

      Telemetry endpoints provide insights into system usage and performance:
      - Usage statistics and metrics
      - Performance monitoring data
      - System health indicators
      - Usage patterns and trends
paths:
  /tags:
    post:
      tags:
        - Tags
      summary: Create one or more tags with MCP-ready bulk operations
      description: >
        **Create Tags for MCP Server Integration**


        Creates one or more tags in the system with comprehensive support for
        MCP (Model Context Protocol) servers and automation systems.

        This endpoint is optimized for bulk operations, automated workflows, and
        integration scenarios.


        **MCP Server Features:**

        - **Idempotent Operations**: Safe for automated retry scenarios and
        batch processing

        - **Atomic Transactions**: All tags succeed or fail together, ensuring
        data consistency

        - **Rich Error Context**: Detailed error messages for automated error
        handling and recovery

        - **Bulk Optimization**: Efficient processing of large tag sets
        (recommended: 100-500 per request)

        - **Integration Patterns**: Designed for CMDB sync, infrastructure
        discovery, and compliance automation


        **Core Features:**

        - Bulk creation of multiple tags in a single request

        - Automatic validation of tag names and properties

        - Support for hierarchical tag relationships via parent field

        - Automatic owner isolation and multi-tenancy

        - Comprehensive response metadata for tracking and auditing


        **Tag Properties:**

        - `name`: Unique tag identifier within the owner scope (required, max 64
        chars)

        - `type`: Tag classification ["auto", "manual", "policy", "provisional"]
        (required)

        - `serviceOwner`: Service ownership ["edge", "network", "iam", "system",
        "asset"] (required)

        - `description`: Human-readable description of the tag's purpose
        (optional)

        - `access`: Access level control ["read", "write", "admin"] (optional,
        default: "read")

        - `parent`: Optional parent tag ID for hierarchical organization (UUID
        format)


        **MCP Use Cases:**

        - **Infrastructure Auto-Discovery**: Automatically tag discovered
        network devices, servers, and services

        - **Compliance Automation**: Bulk creation of regulatory, security, and
        policy compliance tags

        - **Resource Classification**: Systematic categorization during cloud
        migration or datacenter consolidation

        - **CI/CD Integration**: Automated tagging during deployment pipelines
        and environment provisioning

        - **CMDB Synchronization**: Import tags from external configuration
        management databases

        - **Lifecycle Management**: Automated tag creation during resource
        provisioning and decommissioning


        **Validation Rules:**

        - Tag names must be unique within the owner scope

        - Names can contain alphanumeric characters, hyphens, and underscores

        - Maximum name length is 64 characters

        - ServiceOwner must be a valid registered service


        **Use Cases:**

        - Initial setup of tag taxonomy

        - Bulk import of tags from external systems

        - Dynamic tag creation based on discovered resources

        - Hierarchical tag structure establishment
      operationId: CreateTags
      x-mcp-operation-type: bulk-create
      x-mcp-automation-friendly: true
      x-mcp-recommended-batch-size: 500
      x-mcp-idempotent: true
      x-mcp-use-cases:
        - infrastructure-discovery
        - compliance-automation
        - asset-lifecycle-management
      requestBody:
        required: true
        description: Array of tag objects to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/tagInfoList"
      responses:
        "200":
          description: >
            **Tags Created Successfully**


            One or more tags were created successfully. The response includes
            the details of each created tag including:

            - Generated unique tag ID

            - Original tag name as provided

            - Owner ID for multi-tenant isolation

            - Status indicating success

            - Confirmation message


            **Response Structure:**

            - Array of tag creation results

            - Each result contains ID, name, ownerId, status, and message

            - Status will be "Success" for successfully created tags


            **Note:** In partial success scenarios, some tags may succeed while
            others fail.
          headers:
            X-Span-Id:
              $ref: "#/components/headers/X-Span-Id"
            X-Trace-Id:
              $ref: "#/components/headers/X-Trace-Id"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/createTagResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          description: >
            **All Tag Creation Failed**


            None of the requested tags could be created due to validation errors
            or conflicts.
          headers:
            X-Span-Id:
              $ref: "#/components/headers/X-Span-Id"
            X-Trace-Id:
              $ref: "#/components/headers/X-Trace-Id"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/createTagResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tags/delete:
    post:
      tags:
        - Tags
      summary: Delete multiple tags in a single request
      operationId: DeleteTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tagIds:
                  type: array
                  items:
                    type: string
                tagNames:
                  type: array
                  items:
                    type: string
              oneOf:
                - required:
                    - tagIds
                - required:
                    - tagNames
      responses:
        "200":
          description: Tags deleted successfully
          headers:
            X-Span-Id:
              $ref: "#/components/headers/X-Span-Id"
            X-Trace-Id:
              $ref: "#/components/headers/X-Trace-Id"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tags/fetch:
    post:
      tags:
        - Tags
      operationId: FetchTags
      summary: Advanced tag search and retrieval with MCP server optimization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: object
                pagination:
                  $ref: "#/components/schemas/paginationRequest"
                deepFetch:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Successfully retrieved tags based on the query criteria
          headers:
            X-Span-Id:
              $ref: "#/components/headers/X-Span-Id"
            X-Trace-Id:
              $ref: "#/components/headers/X-Trace-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tagPaginationResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tags/tagId/{tagId}:
    put:
      tags:
        - Tags
      summary: Update tags by tagId
      operationId: UpdateTagById
