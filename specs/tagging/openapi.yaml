components:
  headers:
    X-Span-Id:
      description: A unique identifier for the span of the request.
      schema:
        type: string
    X-Trace-Id:
      description: A unique identifier for tracing the request across systems.
      schema:
        type: string
  schemas:
    tagInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - auto
            - manual
            - policy
            - provisional
        serviceOwner:
          type: string
          enum:
            - edge
            - network
            - iam
            - system
            - asset
        description:
          type: string
        parent:
          type: string
          format: uuid
      required:
        - name
    tagInfoList:
      type: array
      items:
        $ref: "#/components/schemas/tagInfo"
    createTagResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        ownerId:
          type: integer
        serviceOwner:
          type: string
        status:
          type: string
        message:
          type: string
    updateTagRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        serviceOwner:
          type: string
        description:
          type: string
        parent:
          type: string
    updateTagResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        ownerId:
          type: integer
        serviceOwner:
          type: string
        description:
          type: string
    entityRequestList:
      type: array
      items:
        $ref: "#/components/schemas/entityRequest"
    entityRequest:
      type: object
      properties:
        csid:
          type: string
        name:
          type: string
        serviceOwner:
          type: string
        type:
          type: string
        metadata:
          type: string
      required:
        - name
        - csid
        - serviceOwner
        - type
    createEntityResponse:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: integer
        csid:
          type: string
        name:
          type: string
        serviceOwner:
          type: string
        type:
          type: string
        status:
          type: string
        message:
          type: string
    entityResponse:
      type: object
      properties:
        id:
          type: string
        csid:
          type: string
        name:
          type: string
        ownerId:
          type: integer
        serviceOwner:
          type: string
        type:
          type: string
        metadata:
          type: string
    entityPaginationResponse:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/entityResponse"
        pagination:
          $ref: "#/components/schemas/paginationResponse"
    policyRequestList:
      type: array
      items:
        $ref: "#/components/schemas/policyRequest"
    policyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
