        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /entities:
    post:
      tags:
        - Entities
      summary: Create one or more entities with MCP-optimized bulk operations
      operationId: CreateEntities
