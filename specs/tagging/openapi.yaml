openapi: 3.0.3
info:
  title: Tag Management API
  description: >
    # Tag Management System API


    This specification defines the comprehensive REST API for managing tags,
    entities, associations, and policies in the Extreme Networks platform.


    ## Overview

    The Tag Management API provides a powerful and flexible system for
    organizing and categorizing resources through:

    - **Tags**: Lightweight labels that can be applied to entities for
    organization and filtering

    - **Entities**: The actual resources (devices, services, etc.) that can be
    tagged

    - **Associations**: Bidirectional relationships between tags and entities

    - **Policies**: Rule-based automation for tag management

    - **Attributes**: Key-value metadata attached to tags for enhanced
    functionality


    ## Key Features

    - Bulk operations for creating, updating, and deleting tags and entities

    - Flexible search and filtering capabilities with pagination support

    - Policy-driven automation for tag lifecycle management

    - Rich attribute system for tag metadata

    - Owner-based multi-tenancy support

    - Comprehensive telemetry and monitoring


    ## Authentication

    All endpoints require proper authentication headers. Ensure you include
    valid credentials in your requests.


    ## Rate Limiting

    API requests are subject to rate limiting. Monitor the response headers for
    rate limit information.
