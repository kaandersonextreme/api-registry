        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "404":
          $ref: "#/components/responses/404ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /wired/health-filter-metadata:
    post:
      tags:
        - Dashboard
      summary: Wired client health filter metadata
      description: Returns the client health filter metadata of Wired devices.
      operationId: getWiredClientHealthFilterMetadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WiredClientHealthFilterMetadataRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiredClientHealthFilterMetadataResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /rtts-support:
    post:
      tags:
        - Client Details
      summary: Check RTTS support for multiple clients
      description: Checks if Route Table Tracking Support (RTTS) is supported for a
        list of clients. Takes client details including clientId, deviceId, and
        connectionStatus, and returns whether RTTS is supported for each client.
        Maximum 500 clients can be validated in a single request.
      operationId: checkRttsSupport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RttsSupportRequest"
            examples:
              mixedClients:
                summary: Mixed client request
                value:
                  clients:
                    - client_uuid: 886fe194-2e54-4a45-b994-514081d802f4
                      device_id: 167941815665597
                      connection_status: CONNECTED
                    - client_uuid: 886fe194-2e54-4a45-b994-514081d802f3
                      device_id: 167941815665599
                      connection_status: DISCONNECTED
      responses:
        "200":
          description: Successfully checked RTTS support for all clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RttsSupportResponse"
              examples:
                mixedResponse:
                  summary: Mixed RTTS support response
                  value:
                    clients:
                      - client_uuid: 886fe194-2e54-4a45-b994-514081d802f4
                        rtts_supported: true
