    ClientMacLookupRequest:
      type: object
      description: Request to lookup clients by their MAC addresses
      required:
        - mac_addresses
      properties:
        mac_addresses:
          type: array
          description: List of client MAC addresses to lookup (hexadecimal format without
            separators, 12 characters)
          items:
            type: string
            pattern: ^[0-9A-Fa-f]{12}$|^[0-9A-Fa-f]{16}$
            description: Client MAC address in hexadecimal format without separators (12/16
              characters)
            example: E4FD8C988800
          minItems: 1
          maxItems: 100
          example:
            - E4FD8C988800
            - 1123CB00014E
            - AB0000000001
    ClientMacLookupData:
      type: object
      description: Unified client data from MAC lookup containing common fields across
        wired and wireless clients
      required:
        - mac
        - client_type
      properties:
        client_id:
          type: integer
          format: int64
          description: The client ID
          example: 7778185873882
        client_uuid:
          type: string
          description: The unique identifier for the client
          format: uuid
          example: 886fe194-2e54-4a45-b994-514081d802f4
        mac:
          type: string
          description: The MAC address of the client device in hexadecimal format without
            separators (12 hex characters)
          pattern: ^[0-9A-Fa-f]{12}$
          example: E4FD8C985C00
        client_type:
          type: string
          description: Type of client connection
          enum:
            - WIRED
            - WIRELESS
          example: WIRED
        connection_status:
          type: string
          description: The current connection status of the client
          enum:
            - CONNECTED
            - DISCONNECTED
          example: CONNECTED
        client_hostname:
          type: string
          description: The hostname of the client
          maxLength: 255
          example: DESKTOP-ABC123
        operating_system:
          type: string
          description: The operating system of the client device
          maxLength: 64
          example: Windows 10
        username:
          type: string
          description: The username of the client
          maxLength: 128
          example: john.doe
        client_ip:
          type: string
          description: The IP address of the client (IPv4 or IPv6, can be empty if no IP
            assigned)
          example: 192.168.1.100
        ipv4:
          type: string
          description: The IPv4 address assigned to the client in dotted-decimal notation
            (can be empty if no IP assigned)
          example: 192.168.1.100
        ipv6:
          type: string
          description: The IPv6 address assigned to the client in standard notation (can
            be empty if no IPv6 assigned)
          example: 2001:0db8:85a3::8a2e:0370:7334
        vlan:
          type: integer
          format: int32
          description: The VLAN ID (valid range 1-4094)
          minimum: 1
          maximum: 4094
          example: 153
        site:
          type: string
          description: The site where the client is located
          maxLength: 256
          example: Corporate HQ
        building:
          type: string
          description: The building where the client is located
          maxLength: 256
          example: Building A
        floor:
          type: string
          description: The floor where the client is located
          maxLength: 256
          example: Floor 2
        device_id:
          type: integer
          format: int64
          description: The device (AP or Switch) to which client is connected
          example: 7778185883343
        connected_device_mac:
          type: string
          description: The MAC address of the connected device (AP or Switch) in
            hexadecimal format without separators
          pattern: ^[0-9A-Fa-f]{12}$
          example: AB0000000001
    ClientMacLookupResponse:
      type: object
