    RttsSupportRequest:
      type: object
      required:
        - clients
      properties:
        clients:
          type: array
          description: List of clients to check for RTTS support (max 500 items)
          minItems: 1
          maxItems: 500
          items:
            type: object
            required:
              - client_uuid
              - device_id
              - connection_status
            properties:
              client_uuid:
                type: string
                description: The unique client identifier (UUID) obtained from the client health
                  grid response (client_uuid field)
                format: uuid
                example: 886fe194-2e54-4a45-b994-514081d802f4
              device_id:
                type: integer
                description: Unique identifier of the device
                format: int64
                example: 167941815665597
              connection_status:
                type: string
                description: Current connection status of the client
                enum:
                  - CONNECTED
                  - DISCONNECTED
                example: CONNECTED
    RttsSupportResponse:
      type: object
      required:
        - clients
      properties:
        clients:
          type: array
          description: List of clients with their RTTS support status
          items:
            type: object
            required:
              - client_uuid
              - rtts_supported
            properties:
              client_uuid:
                type: string
                description: The unique identifier for the client
                format: uuid
                example: 886fe194-2e54-4a45-b994-514081d802f4
              rtts_supported:
                type: boolean
                description: Indicates whether Route Table Tracking Support (RTTS) is supported
                  for this client
                example: true
  responses:
    400ErrorResponse:
      description: Bad Request
