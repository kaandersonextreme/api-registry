components:
  schemas:
    WirelessClientType:
      type: string
      description: Type of wireless client device technology
      enum:
        - WIRELESS
        - WI-FI
        - THREAD
        - WING
        - UNKNOWN
      example: WI-FI
    WirelessClientDetails:
      type: object
      description: Detailed information about a wireless client device including
        connection status, signal quality, network configuration, and location
      required:
        - device_connected
        - device_id
        - mac_address
        - connection_time
        - client_type
      properties:
        device_connected:
          type: boolean
          description: Indicates whether the client device is currently connected to the
            network (true = connected, false = disconnected)
          example: true
        device_id:
          type: integer
          format: int64
          description: Unique identifier of the access point device the client is
            connected to
          example: 12345
        os_type:
          type: string
          description: Operating system type of the client device (e.g., Windows, macOS,
            iOS, Android, Linux)
          maxLength: 64
          example: iOS 16
        ip_address:
          type: string
          description: IPv4 address assigned to the client in dotted-decimal notation (can
            be empty if no IP assigned)
          example: 192.168.1.100
        mac_address:
          type: string
          description: MAC address of the client device in hexadecimal format without
            separators (12 hex characters)
          pattern: ^[0-9A-Fa-f]{12}$
          example: 1123CB00014E
        device_location_names:
          type: string
          description: Hierarchical location path of the access point in format
            'Site/Building/Floor'
          maxLength: 512
          example: Corporate HQ/Building A/Floor 2
        device_location_id:
          type: integer
          format: int64
          description: Unique identifier of the location where the access point is deployed
          example: 1001
        alias:
          type: string
          description: User-defined friendly name or alias for the client device
          maxLength: 128
          example: John's iPhone
        user:
          type: string
          description: Username of the authenticated user associated with this client
            connection
          maxLength: 128
          example: john.doe@company.com
        connection_to:
          type: string
          description: Name or identifier of the access point the client is connected to
          maxLength: 255
          example: AP-Floor2-East
        connection_time:
          type: integer
          format: int64
          description: Time when the client established connection, represented as
            milliseconds since the Unix epoch (1970-01-01T00:00:00Z)
          minimum: 0
          example: 1692624000000
        vlan:
          type: integer
          format: int32
          description: VLAN identifier the client is assigned to (valid range 1-4094)
          minimum: 1
          maximum: 4094
          example: 100
        cwp_used:
          type: integer
          format: int32
          description: The Captive Web Portal used
          example: 1
        user_profile:
          type: string
          description: Name of the user profile or policy applied to this client connection
          maxLength: 128
          example: Employee-WiFi
        ssid:
          type: string
          description: Service Set Identifier (SSID) / WiFi network name the client is
            connected to
          maxLength: 32
          example: Corp-WiFi-5G
        radio:
          type: string
          description: Radio interface type and band (e.g., wifi0 for 2.4GHz, wifi1 for
            5GHz, wifi2 for 6GHz)
          maxLength: 32
          example: wifi1
        wifi_protocol:
          type: string
          description: WiFi protocol version used by the client (e.g., 802.11ax, 802.11ac,
            802.11n, WiFi 6E)
          maxLength: 32
          example: 802.11ax
        channel:
          type: integer
          format: int32
          description: Wireless channel number the client is operating on (2.4GHz - 1-14,
            5GHz - 36-165, 6GHz - 1-233)
          minimum: 1
          maximum: 233
          example: 36
        client_hostname:
          type: string
          description: Hostname of the client device as reported by DHCP or DNS
          maxLength: 255
          example: iPhone-John
        client_type:
          $ref: "#/components/schemas/WirelessClientType"
        encryption_method:
          type: string
          description: Encryption method used for the wireless connection (e.g., WPA2,
            WPA3, Open)
          maxLength: 32
          example: WPA3
        auth:
          type: string
          description: Authentication method used for the wireless connection (e.g., PSK,
            EAP, Open)
          maxLength: 32
          example: EAP
        nac_details:
          type: string
          description: Network Access Control details or posture information for the
            client device
          maxLength: 512
          example: Sample NAC details
        nac_profile:
          type: string
          description: Network Access Control profile applied to the client device
          maxLength: 512
          example: Sample NAC profile
        vlan_ip_sort_pair:
          type: string
          description: String representation of the VLAN to IP address mapping for the
            client (e.g., '100 10.10.10.10')
          maxLength: 512
          example: 100 10.10.10.10
    ConstraintViolationError:
      type: object
      properties:
        field:
          type: string
          description: The field name
        message:
          type: string
          description: The detailed description
    ApiClientError:
      required:
        - status
        - title
      type: object
      properties:
        title:
          type: string
          description: The short description of error
        status:
          type: integer
          description: The status code of error
          format: int32
        detail:
          type: string
          description: The detailed description of error
        violations:
          type: array
          description: List of constraint violations
          items:
            $ref: "#/components/schemas/ConstraintViolationError"
    ApiError:
      required:
        - status
        - title
      type: object
      properties:
        title:
          type: string
          description: The short description of error
        status:
          type: integer
          description: The status code of error
          format: int32
        detail:
          type: string
          description: The detailed description of error
    WiredClientDetails:
      type: object
      description: Detailed information about a wired client device connected to a
        network switch, including connection status, port information, VLAN
        assignment, authentication details, and switch location
      required:
        - connection_type
        - connection_status
        - client_mac
        - client_type
      properties:
        connection_type:
          type: integer
          format: int32
          description: Type of connection 2 for wired clients -1 for Unknown
          enum:
            - 2
            - -1
          example: 2
        connection_status:
          type: boolean
          description: Current connection status of the client (true = connected, false =
            disconnected)
          example: true
        start_time:
          type: integer
          format: int64
          description: Time when the client connection started, represented as
            milliseconds since the Unix epoch (1970-01-01T00:00:00Z)
          minimum: 0
          example: 1692624000000
        end_time:
          type: integer
          format: int64
          description: Time when the client connection ended, represented as milliseconds
            since the Unix epoch (1970-01-01T00:00:00Z). Value is 0 for active
            connections
          minimum: 0
          example: 0
        device_id:
          type: integer
          format: int64
          description: Unique identifier of the network switch device the client is
            connected to
          example: 12345
        device_mac:
          type: string
          description: MAC address of the network switch in hexadecimal format without
            separators (12 hex characters)
          pattern: ^[0-9A-Fa-f]{12}$
          example: AB0000000001
        device_host_name:
          type: string
          description: Hostname of the network switch device
          maxLength: 255
          example: switch-floor2-east
        device_location_name:
          type: string
          description: Hierarchical location path of the switch in format
            'Site/Building/Floor'
          maxLength: 512
          example: Corporate HQ/Building A/Floor 2
        device_location_id:
          type: integer
          format: int64
          description: Unique identifier of the location where the switch is deployed
          example: 1001
        device_os_version:
          type: string
          description: Firmware/OS version running on the network switch
          maxLength: 32
          example: 33.5.1.6
        associate_if_index:
          type: integer
          format: int32
          description: Interface index of the device interface (AP or Switch port) that a
            client is connected/associated to.
          example: 1001
        if_name:
          type: string
          description: Name of the network interface on the switch
          maxLength: 64
          example: GigabitEthernet1/0/1
        associate_if_name:
          type: string
          description: Associated interface name where the client is physically connected
          maxLength: 64
          example: 1:1
        associate_lag_master_if_name:
          type: string
          description: Name of the LAG (Link Aggregation Group) master interface if the
            port is part of a LAG
          maxLength: 64
          example: lag.0.1
        client_hostname:
          type: string
          description: Hostname of the client device as reported by DHCP or DNS
          maxLength: 255
          example: DESKTOP-ABC123
        client_os_name:
          type: string
          description: Operating system name of the client device
          maxLength: 64
          example: Windows 10
        client_mac:
          type: string
          description: MAC address of the client device in hexadecimal format without
            separators (12 hex characters)
          pattern: ^[0-9A-Fa-f]{12}$
          example: 1122334455AA
        client_ip:
          type: string
          description: IPv4 address assigned to the client in dotted-decimal notation (can
            be empty if no IP assigned)
          example: 192.168.1.100
        client_ipv6:
          type: string
          description: IPv6 address assigned to the client in standard notation (can be
            empty if no IPv6 assigned)
          example: 2001:0db8:85a3:0000:0000:8a2e:0370:7334
        vlan:
          type: integer
          format: int32
          description: VLAN identifier the client is assigned to (valid range 1-4094)
          minimum: 1
          maximum: 4094
          example: 100
        vlan_ip_pairs:
          type: object
          description: Map of VLAN IDs to their associated IP addresses (both IPv4 and IPv6)
          additionalProperties:
            type: array
            description: List of IP addresses associated with the VLAN
            items:
              type: string
              description: IP address (IPv4 or IPv6)
              example: 192.168.1.100
          example:
            "100":
              - 192.168.1.100
              - 2001:db8::1
            "200":
              - 10.0.0.50
        instant_port_device_type:
          type: string
          description: Type of device detected by instant port classification (e.g.,
            Phone, Camera, Printer, IP Phone)
          maxLength: 64
          example: IP Phone
        user_profile_name:
          type: string
          description: Name of the user profile or policy applied to this client connection
          maxLength: 128
          example: Employee-Wired
        port_name:
          type: string
          description: Physical port name on the switch where the client is connected
          maxLength: 64
          example: Port 1:1
        auth_method:
          type: string
          description: Authentication method used for the client connection
          enum:
            - N/A
            - CWP
            - OPEN
            - WEP-OPEN
            - WEP-SHARED
            - WPA-PSK
            - WPA2-PSK
            - WPA-802.1X
            - WPA2-802.1X
            - WPA-AUTO-PSK
            - WPA-AUTO-802.1X
            - DYNAMIC-WEP
            - 802.1X
            - WPA3_SAE
            - WPA3-802.1X
            - OWE
            - THREAD_PSKD
            - MAC
            - WPA3-SAE-EXT
          maxLength: 64
          example: 802.1X
        nac_profile:
          type: string
          description: Network Access Control (NAC) profile applied to the client
          maxLength: 128
          example: Corporate-NAC
        auth_client_nac_details:
          type: string
          description: Detailed NAC authentication information and client security posture
          maxLength: 512
          example: Compliant - AV Updated
        auth_type:
          type: string
          description: Type of authentication protocol (e.g., EAP-TLS, EAP-PEAP, RADIUS)
          maxLength: 64
          example: EAP-TLS
        auth_username:
          type: string
          description: Username used for authentication
          maxLength: 128
          example: john.doe@company.com
        client_type:
          type: string
          description: Category or type of client device (typically "wired" for wired
            clients, or "unknown" if type cannot be determined)
          maxLength: 64
          example: wired
        dhcp_lease_time:
          type: integer
          format: int32
          description: DHCP lease duration in seconds
          minimum: 0
          example: 86400
        dhcp_server_port_number:
          type: string
          description: Port number or identifier of the DHCP server on the switch
          maxLength: 64
          example: 1:2
    SortOrder:
      type: string
      description: "Sort order for results. ASC: ascending order (oldest to newest, or
        lowest to highest based on the sort field). DESC: descending order
        (newest to oldest, or highest to lowest based on the sort field)."
      enum:
        - ASC
        - DESC
    WiredClientHealthGridRequest:
