            $ref: "#/components/schemas/ApiClientError"
    401ErrorResponse:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    403ErrorResponse:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    500ErrorResponse:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    404ErrorResponse:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  parameters:
    clientId:
      name: client_uuid
      in: path
      description: The unique client identifier (UUID) obtained from the client health
        grid response (client_uuid field)
      required: true
      schema:
        type: string
        example: 886fe194-2e54-4a45-b994-514081d802f4
    page:
      name: page
      in: query
      description: Page number for pagination, starting from 1
      required: false
      schema:
        minimum: 1
        maximum: 2147483647
        type: integer
        format: int32
        default: 1
    limit:
      name: limit
      in: query
      description: Number of items to return per page (max 500)
      required: false
      schema:
        maximum: 500
        minimum: 1
        type: integer
        format: int32
        default: 10
    KeywordWired:
      name: keyword
      in: query
      description: >
        Keyword for case-insensitive exact match across multiple wired client
        fields:

        - client_mac: Client MAC address (e.g., "8899AA000101")


        Returns results where any of these fields exactly matches the keyword
        (case-insensitive).
      required: false
      schema:
        type: string
        maxLength: 256
        example: 8899AA000101
    order:
      name: order
      in: query
      description: The sort order (ascending by default)
      required: false
      schema:
        $ref: "#/components/schemas/SortOrder"
    KeywordWireless:
      name: keyword
      in: query
      description: >
        Keyword for case-insensitive exact match across multiple fields:

        - client_mac: Client MAC address (e.g., "8899AA000101")


        Returns results where any of these fields exactly matches the keyword
        (case-insensitive).
      required: false
      schema:
        type: string
        maxLength: 256
        example: 8899AA000101
    deviceId:
      name: device_id
      in: path
      description: Unique identifier of the device
      required: true
      schema:
        type: integer
        format: int64
        example: 167941815665597
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Enter your API Key as a Bearer Token
security:
  - BearerAuth: []
