  /mac-lookup:
    post:
      tags:
        - Client Details
      summary: Lookup clients by MAC addresses
      description: Lookup and retrieve basic client information based on a list of MAC
        addresses (max 100). It support both wired and wireless clients.
      operationId: lookupClientsByMacAddress
      requestBody:
        description: Request body containing the list of MAC addresses to lookup
          (hexadecimal format without separators)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientMacLookupRequest"
            example:
              mac_addresses:
                - E4FD8C988800
                - 1123CB00014E
                - FFFFFFFFFFFF
        required: true
      responses:
        "200":
          description: Successfully retrieved client information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMacLookupResponse"
              example:
                total_count: 3
                found_count: 2
                clients:
                  - client_id: 7778185873882
                    client_uuid: 886fe194-2e54-4a45-b994-514081d802f4
                    mac: E4FD8C985C00
                    client_type: WIRED
