  /devices/{device_id}/monitor/ipv4-routing:
    get:
      tags:
        - Routing Details
      summary: Get device IPv4 routing information
      description: Retrieves IPv4 routing information for a specific device with
        pagination support. Returns routing details including destination, VLAN
        information, route origin, status, metrics, next hop details, and ping
        protection settings.
      operationId: getDeviceIpv4Routing
      parameters:
        - $ref: "#/components/parameters/deviceId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: sort_field
          in: query
          description: Sort Field
          required: false
          schema:
            type: string
            enum:
              - DESTINATION
              - VLAN_ID
              - VLAN_NAME
              - ROUTE_ORIGIN
              - STATUS
              - METRIC
              - AGE
              - ROUTE_TYPE_PRIORITY
              - ROUTING_INSTANCE
              - ISID_ID
              - ISID_NAME
              - NEXTHOP_IPV4_ADDRESS
              - NEXTHOP_DEVICE_ID
              - NEXTHOP_HOST_NAME
              - PING_PROTECTION_ENABLED
              - PING_PROTECTION_STATE
              - PING_PROTECTION_LAST_UPTIME
              - PING_PROTECTION_LAST_DOWNTIME
        - $ref: "#/components/parameters/order"
      responses:
        "200":
          description: Successfully retrieved device IPv4 routing information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceIpv4RoutingResponse"
              example:
                page: 1
                count: 1
                total_pages: 1
                total_count: 2
                data:
                  - earliest_refresh_time: 2026-02-10 10:30:29.131
                    latest_refresh_time: 2026-02-10 10:30:29.131
                    latest_refresh_timestamp: 1770719429131
                    ipv4_routing_details:
                      - destination: 0.0.0.0/0
                        vlan_id: 1
                        vlan_name: Default
                        route_origin: BOOTP
                        status: UP
                        metric: 1
                        age: 5929
                        route_type_priority: "5000"
                        routing_instance: VR-Default
                        isid_id: 0
                        isid_name: ""
                        nexthop_ipv4_address: 10.234.63.254
                        nexthop_device_id: 0
                        nexthop_host_name: ""
                        ping_protection_enabled: false
                        ping_protection_state: UNKNOWN
                        ping_protection_last_uptime: 0
                        ping_protection_last_downtime: 0
                      - destination: 10.234.63.0/24
                        vlan_id: 1
                        vlan_name: Default
                        route_origin: DIRECT
                        status: UP
                        metric: 1
                        age: 5930
                        route_type_priority: "10"
                        routing_instance: VR-Default
                        isid_id: 0
                        isid_name: ""
                        nexthop_ipv4_address: 10.234.63.203
                        nexthop_device_id: 167941815665597
                        nexthop_host_name: 4220-12P-4X-SwitchEngine
                        ping_protection_enabled: false
                        ping_protection_state: UNKNOWN
                        ping_protection_last_uptime: 0
                        ping_protection_last_downtime: 0
        "400":
