    WirelessClientHealthGridRequest:
      type: object
      description: Request parameters for filtering and querying wireless client
        health grid data with advanced filtering capabilities
      properties:
        site_ids:
          type: array
          description: List of site identifiers to filter wireless clients by specific
            locations
          items:
            type: integer
            format: int64
            description: Unique identifier of a site
            example: 1001
          example:
            - 1001
            - 1002
            - 1003
        device_ids:
          type: array
          description: List of access point device identifiers to filter clients connected
            to specific APs
          items:
            type: integer
            format: int64
            description: Unique identifier of an access point device
            example: 12345
          example:
            - 12345
            - 12346
        number_filter:
          type: array
          description: List of numeric filters
          items:
            type: object
            properties:
              column_name:
                type: string
                description: |
                  The column name to apply the filter on. Supported columns:
                  - RSSI
                  - SNR
                enum:
                  - RSSI
                  - SNR
                example: RSSI
              filter_type:
                type: string
                description: |
                  The type of numeric filter to apply:
                  - GT: Greater Than
                  - GTE: Greater Than or Equal
                  - LT: Less Than
                  - LTE: Less Than or Equal
                  - EQ: Equal
                  - NEQ: Not Equal
                  - BTW: Between (uses min and max values)
                  - BLANK: Field is blank/null
                  - NOT_BLANK: Field is not blank/null
                enum:
                  - GT
                  - GTE
                  - LT
                  - LTE
                  - EQ
                  - NEQ
                  - BTW
                  - BLANK
                  - NOT_BLANK
                default: GT
                example: GT
              value:
                type: number
                description: >
                  The value to compare against for the filter (used for GT, GTE,
                  LT, LTE, EQ, NEQ).

                  Units:
                    - For RSSI: dBm
                    - For SNR: dB
                    The unit should match the column_name value.
                format: double
              min:
                type: number
                description: |
                  The minimum value for the BTW (Between) filter type.
                  Units:
                    - For RSSI: dBm
                    - For SNR: dB
                  The unit should match the column_name value.
                format: double
              max:
                type: number
                description: |
                  The maximum value for the BTW (Between) filter type.
                  Units:
                    - For RSSI: dBm
                    - For SNR: dB
                  The unit should match the column_name value.
                format: double
        alias:
