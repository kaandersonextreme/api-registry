openapi: 3.0.3
info:
  title: Extreme Platform ONE REST API - Client
  description: Platform Client Service (PCS) API provides client cache details and
    wireless/wired client health grid information.
  termsOfService: https://www.extremenetworks.com/company/legal/terms-of-use/
  contact:
    name: Extreme Networks Support
    url: https://www.extremenetworks.com/support
    email: support@extremenetworks.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 25.11.0
servers:
  - url: https://cloudapi.extremecloudiq.com/client/v1
    description: Extreme Platform ONE REST API - Client
tags:
  - name: Client Details
    description: Client details and health information
  - name: Dashboard
    description: Client health dashboard
  - name: Routing Details
    description: Device routing details
paths:
  /wireless/details/{client_uuid}:
    get:
      tags:
        - Client Details
      summary: Get Wireless Client Details Info
      description: Retrieves detailed information about a wireless client using the
        client UUID from the grid response.
      operationId: getWirelessClientDetailsInfo
      parameters:
        - $ref: "#/components/parameters/clientId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WirelessClientDetails"
              example:
                device_connected: false
                device_id: 7778185882009
                os_type: unknown
                ip_address: 192.168.120.50
                mac_address: 8899AA000204
                device_location_names: "||"
                device_location_id: -1
                alias: ""
                user: 8899AA000204
                connection_to: host name
                connection_time: 1774356520000
                vlan: 1
                cwp_used: 2
                user_profile: user-profile
                ssid: ssid5
                radio: 2.4G
                wifi_protocol: 802.11b
                channel: 8
                client_hostname: host name
                client_type: WING
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /wired/details/{client_uuid}:
    get:
      tags:
        - Client Details
      summary: Get Wired Client Details Info
      description: Retrieves detailed information about a wired client using the
        client UUID from the grid response.
      operationId: getWiredClientDetailsInfo
      parameters:
        - $ref: "#/components/parameters/clientId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiredClientDetails"
              example:
                connection_type: 2
                connection_status: true
                start_time: 1774359148008
                end_time: 0
                device_id: 7778185883928
                device_mac: AC4DD9FF1C00
                device_host_name: Stack
                device_location_name: site | building | floor
                device_location_id: -1
                device_os_version: 33.5.1.6)
                associate_if_index: -1
                if_name: 1:1
                associate_if_name: 1:1
                associate_lag_master_if_name: ""
                client_hostname: DESKTOP-775EPGT
                client_os_name: Windows 10
                client_mac: E4FD8C988800
                client_ip: 10.234.153.136
                client_ipv6: ""
                vlan: 153
                vlan_ip_pairs:
                  "153": []
                instant_port_device_type: ""
                user_profile_name: ""
                port_name: 1:1
                auth_method: N/A
                nac_profile: ""
                auth_client_nac_details: ""
                auth_type: N/A
                auth_username: ""
                client_type: WIRED
                dhcp_lease_time: 86400
                dhcp_server_port_number: 1:1
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /wired:
    post:
      tags:
        - Dashboard
      summary: Wired client data
      description: Returns the client data of Wired devices based on the provided filters.
      operationId: getWiredClientData
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/KeywordWired"
        - name: connection_status
          in: query
          description: Connection Status
          required: false
          schema:
            type: string
            enum:
              - CONNECTED
              - DISCONNECTED
        - name: sort_field
          in: query
          description: Sort Field
          required: false
          schema:
            type: string
            default: MAC
            enum:
              - CONNECTION_STATUS
              - CLIENT_HOSTNAME
              - SITE
              - BUILDING
              - FLOOR
              - IPV4
              - IPV6
              - PORT_NUMBER
              - SWITCH_NAME
              - OPERATING_SYSTEM
              - MAC
              - USERNAME
              - INSTANT_PORT_PROFILE
        - $ref: "#/components/parameters/order"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WiredClientHealthGridRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedWired"
              example:
                page: 1
                count: 1
                total_pages: 1
                total_count: 1
                data:
                  - device_id: 7778185883343
                    site: Corporate HQ
                    building: Building A
                    floor: Floor 2
                    connection_status: CONNECTED
                    client_hostname: DESKTOP-ABC123
                    client_ip: 192.168.1.100
                    ipv4: 192.168.1.100
                    ipv6: 2001:0db8:85a3::8a2e:0370:7334
                    port_number: 1:1
                    switch_name: 5420F-8W-16P-4XE-SwitchEngine
                    mac: E4FD8C985C00
                    vlan: 153
                    operating_system: Windows 10
                    username: john.doe
                    instant_port_profile: Employee-Wired-Profile
                    client_id: 7778185873882
                    client_uuid: 886fe194-2e54-4a45-b994-514081d802f4
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
      security:
        - BearerAuth: []
  /wired/grid:
    post:
      deprecated: true
      tags:
        - Dashboard
      summary: Wired client health grid
      description: Returns the client health grid of Wired devices based on the
