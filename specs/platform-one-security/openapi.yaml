openapi: 3.0.3
info:
  title: Platform ONE Security OpenAPI Specs
  version: 25.11.0-20260522
  x-logo:
    url: assets/extreme.png
    backgroundColor: "#FFFFFF"
    altText: Extreme Networks
  description: >-
    The OpenAPI specification provides a detailed description of the Platform
    ONE Security

    services API. This API enables seamless integration and interaction with

    the platform for managing user groups, device groups, devices,

    and access control capabilities.


    🔑 Key Features:


    **User Group Operations**

      Create, update, retrieve, and manage user groups with detailed access
      control and user association capabilities.

    **Device Group Operations**

      Manage device groups with features like creating, updating, deleting,
      and retrieving device group details, including device associations
      and metadata.

    **Device Operations**

      Search, filter, and manage devices with advanced query
      capabilities, including action logs and pagination.

    **Access Control**

      Manage device access permissions with operations to allow or revoke
      access for specific devices.

    **End System Data Management**

      Manage and retrieve End system data.

    **Disconnect Client Sessions**

      Disconnect one or more client sessions.

    🏢 Enterprise-Ready:


    Designed for enterprise-grade environments, this API ensures secure and

    scalable operations with support for pagination, filtering, and detailed

    response schemas. It also includes vendor extensions for enhanced

    documentation and integration capabilities.
  contact:
    name: Extreme Networks Support
    url: https://www.extremenetworks.com/support
    email: support@extremenetworks.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://cloudapi.extremecloudiq.com/uztna
    description: Extreme Platform ONE REST API - Security
tags:
  - name: Users
    description: >
      Users provides a unified layer for managing who can access the platform.


      It focuses on user identities and exposes search, filtering, and
      pagination capabilities that support administrative workflows and bulk
      operations.


      **Core Functions:**


      - List and paginate users with key attributes such as ID, email, and sync
      state.

      - Build filtered and stateful user selections for assignment flows.

      - Integrate with external identity providers to keep user records aligned
      with upstream sources of truth.
  - name: User Groups
    description: >
      User groups provide a unified way to manage access by organizing users
      into logical collections.


      It focuses on group lifecycle, policy assignment, and synchronization with
      identity providers. Administrative workflows and bulk operations are
      supported.


      **Core Functions:**


      - Create and maintain user groups synchronized from an identity provider.

      - Assign policies to groups at scale.

      - Add or remove users and manage group lifecycle.
  - name: Devices
    description: >
      Devices represent the endpoints that users access the platform with.


      This module allows administrators to register, manage, and track devices.
      Bulk operations and filtering support large-scale deployments.


      **Core Functions:**


      - Register and manage devices (MAC, hostname, alias).

      - Bulk import and update device inventories.

      - Control device access states (allow/revoke).
  - name: Device Groups
    description: >
      Device groups organize related devices into logical collections for policy
      enforcement.


      Administrators can create groups based on explicit membership, MAC OUIs,
      or custom prefixes. Group associations can be viewed, filtered, and used
      as targets for policies.


      **Core Functions:**


      - Create groups using explicit membership, MAC OUIs, or custom prefixes.

      - View and paginate group associations.

      - Use groups as policy targets for policies.
  - name: Clients
    description: >
      API for fetching client data with key attributes such as authentication
      status, compliance state,

      and agent status.Also supports advanced filtering and search capabilities
      to locate specific client devices.
  - name: Trigger Client Session Deauthorization
    description: >
      Triggers de-authorization for the specified client MAC addresses and
      optionally, 

      their associated RADIUS session identifiers. Use this endpoint when
      clients must be forcibly disconnected, for example 

      during logout events, policy updates, or security remediation actions. For
      cloud‑onboarded devices, 

      this API forcibly disconnects clients directly. For third‑party devices
      connected through a proxy, 

      it initiates a standard RADIUS Change of Authorization (CoA) request
      instead.
