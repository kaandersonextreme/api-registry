components:
  schemas:
    AccessGroup:
      type: object
      description: Serializers for PinEmail object.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The unique identifier for the access group.
        name:
          type: string
          description: The name of the access group.
          maxLength: 512
        description:
          type: string
        code:
          type: string
          readOnly: true
          description: The code of the access group.
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          allOf:
            - $ref: "#/components/schemas/StatusEnum"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the access group was created.
        last_modified_at:
          type: string
          format: date-time
          readOnly: true
          description: The timestamp when the access group was last modified.
        associated_users_count:
          type: integer
          description: The count of associated users with this user group.
          readOnly: true
          nullable: true
        is_synced:
          type: boolean
          description: Indicates whether the access group is synced.
        is_local_synced:
          type: boolean
          description: Indicates whether the access group is locally synced.
        is_deleted:
          type: boolean
          description: Indicates whether the access group is deleted.
        idp_company_type:
          type: string
          readOnly: true
          nullable: true
          description: The type of IDP (Identity Provider) company associated with this
            user group.
        is_blocked:
          type: boolean
          readOnly: true
          description: Indicates whether the user group is blocked.
      required:
        - associated_users_count
        - code
        - created_at
        - description
        - id
        - idp_company_type
        - is_blocked
        - last_modified_at
        - name
        - status
    AccessGroupAssociatedUsers:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The email address of the user.
        id:
          type: integer
          description: The ID of the user.
        scim_username:
          type: string
          description: The SCIM username of the user.
        status:
          allOf:
            - $ref: "#/components/schemas/StatusEnum"
          description: |-
            The status of the access group.

            * `ACTIVE` - active
            * `IN_PROGRESS` - in_progress
            * `FAILED` - failed
            * `DELETED` - deleted
            * `SYSTEM_GENERATED_ENABLED` - system_generated_enabled
            * `SYSTEM_GENERATED_DISABLED` - system_generated_disabled
            * `MDM_ENROLLED_ENABLED` - mdm_enrolled_enabled
            * `MDM_ENROLLED_DISABLED` - mdm_enrolled_disabled
        user_access_revoked:
          type: boolean
          description: Indicates whether the user is blocked or not.
      required:
        - email
        - id
        - scim_username
        - status
        - user_access_revoked
    AccessGroupRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the user group.
          maxLength: 512
          minLength: 3
        description:
          type: string
          nullable: true
          description: The description of the user group.
          maxLength: 5000
        user_ids:
          type: array
          items:
            type: integer
          description: List of user IDs to be added in the user group.
          maxItems: 10000
          minItems: 0
      required:
        - name
    AddAccessGroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the user group.
        name:
          type: string
          description: The name of the user group.
        description:
          type: string
          description: The description of the user group.
        code:
          type: string
          description: The code associated with the user group.
        status:
          allOf:
            - $ref: "#/components/schemas/StatusEnum"
          description: |-
            The status of the user group.

            * `ACTIVE` - active
            * `IN_PROGRESS` - in_progress
            * `FAILED` - failed
            * `DELETED` - deleted
            * `SYSTEM_GENERATED_ENABLED` - system_generated_enabled
            * `SYSTEM_GENERATED_DISABLED` - system_generated_disabled

            * `ACTIVE` - active
            * `IN_PROGRESS` - in_progress
            * `FAILED` - failed
            * `DELETED` - deleted
            * `SYSTEM_GENERATED_ENABLED` - system_generated_enabled
            * `SYSTEM_GENERATED_DISABLED` - system_generated_disabled
            * `MDM_ENROLLED_ENABLED` - mdm_enrolled_enabled
            * `MDM_ENROLLED_DISABLED` - mdm_enrolled_disabled
        created_at:
          type: string
          format: date-time
          description: The timestamp when the user group was created.
        last_modified_at:
          type: string
          format: date-time
          description: The timestamp when the user group was last modified.
        associated_users_count:
          type: integer
          nullable: true
          description: The number of users associated with the user group.
        is_synced:
          type: boolean
          description: The sync status of the user group.
        is_local_synced:
          type: boolean
          description: The local sync status of the user group.
        is_deleted:
          type: boolean
          description: The delete status of the user group.
        idp_company_type:
          type: string
          nullable: true
          description: The IDP company type.
        user_ids:
          type: array
          items:
            type: integer
            nullable: true
          description: The list of user IDs associated with the user group.
      required:
        - associated_users_count
        - code
        - created_at
        - description
        - id
        - idp_company_type
        - is_deleted
        - is_local_synced
        - is_synced
        - last_modified_at
        - name
        - status
        - user_ids
    DeviceAccessManagement:
      type: object
      description: Serializer to serialize manage devices access
      properties:
        operation:
          type: string
        users:
          type: array
          items:
            type: string
            format: email
          description: List of user emails to block or unblock
        mac_addresses:
          type: array
          items:
            type: string
            maxLength: 17
      required:
        - mac_addresses
        - operation
    DeviceGroupList:
      type: object
      description: Serialize id, instance type and project for tree chart visualization
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Device group ID
        name:
          type: string
          description: Name of the device group
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Description of the device group
        type:
          type: string
          nullable: true
          default: DEVICE
        workspace_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Workspace ID
        count:
          type: string
          readOnly: true
          description: Count of devices in the device group
        mdm_id:
          type: string
          nullable: true
          maxLength: 40
        mdm_type:
          type: string
          maxLength: 255
        is_blocked:
          type: boolean
          readOnly: true
          description: Indicates whether the device group is blocked.
      required:
        - count
        - id
        - is_blocked
        - name
        - workspace_id
    DeviceGroupMetaDataItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partial_mac_address:
          type: string
        mac_oui:
          type: string
        vendor:
          type: string
        alias:
          type: string
    DeviceGroupPagination:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Device ID
        mac_address:
          type: string
          nullable: true
          description: MAC address of the device
          maxLength: 17
        mac_oui:
          type: string
          nullable: true
          description: MAC OUI of the device
          maxLength: 255
        alias:
          type: string
          description: Alias of the device
        name:
          type: string
          description: Hostname of the device
        device_type:
          type: string
          nullable: true
          description: Device type
          maxLength: 20
        description:
          type: string
          description: Description of the device
        mdm_id:
          type: string
          nullable: true
          maxLength: 40
        mdm_type:
          type: string
          maxLength: 255
        ethernet_mac_address:
          type: string
          nullable: true
          maxLength: 17
        user_principal_name:
          type: string
          nullable: true
          maxLength: 255
        device_owner_type:
          type: string
          nullable: true
          maxLength: 255
      required:
        - id
    DeviceGroupPostRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the device group
          maxLength: 512
          minLength: 3
        description:
          type: string
          nullable: true
          description: Description of the device group
          maxLength: 5000
        device_ids:
          type: array
          items:
            type: string
            format: uuid
          description: "List of device UUIDs to associate with the device group. "
          maxItems: 10000
        workspace_all_devices:
          type: boolean
          description: If true, all devices are automatically included. If false, all the
            provided device_ids will be added to the group.
        type:
          allOf:
            - $ref: "#/components/schemas/TypeEnum"
          default: DEVICE
          description: |-
            Type of the device group.

            DEVICE - manually selected devices
            MAC_OUI - devices matching MAC OUI patterns
            CUSTOM_MAC - devices matching custom MAC patterns

            * `DEVICE` - device
            * `MAC_OUI` - mac_oui
            * `CUSTOM_MAC` - custom_mac
        meta_data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceGroupMetaDataItem"
          default: []
          description: >-
            Required when type is MAC_OUI or CUSTOM_MAC. Ignored when type is
            DEVICE.


            Each object may contain:

            - id (UUID)

            - partial_mac_address

            - mac_oui

            - vendor

            - alias
      required:
        - description
        - name
        - workspace_all_devices
    DeviceGroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Device group ID
        name:
          type: string
          description: Name of the device group
        description:
          type: string
          description: Description of the device group
        type:
          allOf:
            - $ref: "#/components/schemas/TypeEnum"
          description: |-
            Type of the device group.

            DEVICE - manually selected devices
            MAC_OUI - devices matching MAC OUI patterns
            CUSTOM_MAC - devices matching custom MAC patterns

            * `DEVICE` - device
            * `MAC_OUI` - mac_oui
            * `CUSTOM_MAC` - custom_mac
        workspace_id:
          type: integer
          description: Workspace ID
        device_count:
          type: integer
          description: Number of devices in the group
        attached_devices:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceDevice"
          description: List of devices associated with the group
        meta_data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceGroupMetaDataItem"
          description: Data of the custom MAC or MAC OUI objects
        mac_oui:
          type: array
          items: {}
          description: List of MAC OUIs
        is_blocked:
          type: boolean
          description: The blocked status of the device group.
      required:
        - attached_devices
        - description
        - device_count
        - id
        - is_blocked
        - mac_oui
        - meta_data
        - name
        - type
        - workspace_id
    DeviceGroupDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        payload:
          type: object
          additionalProperties: {}
        errors:
          type: object
          additionalProperties: {}
        description:
          type: string
      required:
        - description
        - errors
        - payload
    DeviceIdsPatchField:
      type: object
      properties:
        added_devices:
          type: array
          items:
            type: string
            format: uuid
          description: List of device UUIDs to associate with the device group.
          maxItems: 10000
        removed_devices:
          type: array
          items:
            type: string
            format: uuid
          description: List of device UUIDs to be removed from the device group.
          maxItems: 10000
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
          description: Success status of the response.
        payload:
          default: {}
          description: Payload, typically empty in case of an error.
        errors:
          type: object
          additionalProperties: {}
          nullable: true
          default: {}
          description: Additional error details.
        description:
          type: string
          description: Description of the response.
      required:
        - description
    MethodNotAllowedErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        code:
          type: string
          default: ""
        payload:
          default: {}
        errors:
          type: object
          additionalProperties: {}
          nullable: true
          default: {}
        description:
          type: string
      required:
        - description
    OperationEnum:
      enum:
        - ALLOWED
        - REVOKED
      type: string
      description: |-
        * `ALLOWED` - Allowed
        * `REVOKED` - Revoked
    PaginatedAccessGroupAssociatedUsersList:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: Indicates if the API call was successful.
        payload:
          type: object
          properties:
            users:
              type: array
              items:
                $ref: "#/components/schemas/AccessGroupAssociatedUsers"
              description: List of users.
            total:
              type: integer
              example: 1
              description: Total number of items available.
            from:
              type: integer
              example: 0
              description: The starting offset of the items.
            to:
              type: integer
              example: 1
              description: The ending offset of the items.
        errors:
          type: object
          nullable: true
          example: {}
          description: Errors encountered during the request.
        description:
          type: string
          example: Associated Users.
          description: Description of the API response.
    PaginatedAccessGroupList:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: Indicates if the API call was successful.
        payload:
          type: object
          properties:
            access_groups:
              type: array
              items:
                $ref: "#/components/schemas/AccessGroup"
              description: List of access_groups.
            total:
              type: integer
              example: 1
              description: Total number of items available.
            from:
              type: integer
              example: 0
              description: The starting offset of the items.
            to:
              type: integer
              example: 1
              description: The ending offset of the items.
        errors:
          type: object
          nullable: true
          example: {}
          description: Errors encountered during the request.
        description:
          type: string
          example: List of Access Group.
          description: Description of the API response.
    PaginatedDeviceGroupListList:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: Indicates if the API call was successful.
        payload:
          type: object
          properties:
            device_groups:
              type: array
              items:
                $ref: "#/components/schemas/DeviceGroupList"
              description: List of device_groups.
            total:
              type: integer
              example: 1
              description: Total number of items available.
            from:
              type: integer
              example: 0
              description: The starting offset of the items.
            to:
              type: integer
              example: 1
              description: The ending offset of the items.
        errors:
          type: object
          nullable: true
          example: {}
          description: Errors encountered during the request.
        description:
          type: string
          example: List of device groups.
          description: Description of the API response.
    PaginatedDeviceGroupPaginationList:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: Indicates if the API call was successful.
        payload:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/DeviceGroupPagination"
              description: List of data.
            total:
              type: integer
              example: 1
              description: Total number of items available.
            from:
              type: integer
              example: 0
              description: The starting offset of the items.
            to:
              type: integer
              example: 1
              description: The ending offset of the items.
        errors:
          type: object
          nullable: true
          example: {}
          description: Errors encountered during the request.
        description:
          type: string
          example: Device group details fetched successfully
          description: Description of the API response.
    PaginatedWorkspaceDeviceList:
      type: object
      properties:
        success:
          type: boolean
          example: true
          description: Indicates if the API call was successful.
        payload:
          type: object
          properties:
            devices:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceDevice"
              description: List of devices.
            total:
              type: integer
              example: 1
              description: Total number of items available.
            from:
              type: integer
              example: 0
              description: The starting offset of the items.
            to:
              type: integer
              example: 1
              description: The ending offset of the items.
        errors:
          type: object
          nullable: true
          example: {}
          description: Errors encountered during the request.
        description:
          type: string
          example: List of workspace devices.
          description: Description of the API response.
    PatchedAccessGroupRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the user group.
        description:
          type: string
          nullable: true
          description: The description of the user group.
        user_ids:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              format: uuid
          description: Object containing 'added_users' and 'removed_users' lists of ids.
            Optional field
    PatchedPatchedDeviceAccessManagementRequest:
      type: object
      properties:
        operation:
          allOf:
            - $ref: "#/components/schemas/OperationEnum"
          default: ALLOWED
          description: |-
            The action to perform on the device access

            * `ALLOWED` - Allowed
            * `REVOKED` - Revoked
        users:
          type: array
          items:
            type: string
            format: email
          description: List of user emails to block or unblock
        mac_addresses:
          type: array
          items:
            type: string
            maxLength: 17
          description: List of MAC addresses affected by the operation
    PatchedPatchedDeviceGroupPostRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the device group
          maxLength: 512
          minLength: 3
        description:
          type: string
          description: Description of the device group
          maxLength: 1000
        device_ids:
          allOf:
            - $ref: "#/components/schemas/DeviceIdsPatchField"
          description: Object containing added_devices and removed_devices lists. Optional
            field.
        workspace_all_devices:
          type: boolean
          description: If true, all devices are automatically included. If false, all the
            provided device_ids will be added to the group.
        type:
          allOf:
            - $ref: "#/components/schemas/TypeEnum"
          default: DEVICE
          description: |-
            Type of the device group.

            DEVICE - manually selected devices
            MAC_OUI - devices matching MAC OUI patterns
            CUSTOM_MAC - devices matching custom MAC patterns

            * `DEVICE` - device
            * `MAC_OUI` - mac_oui
            * `CUSTOM_MAC` - custom_mac
        meta_data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceGroupMetaDataItem"
          default: []
          description: >-
            Required when type is MAC_OUI or CUSTOM_MAC. Ignored when type is
            DEVICE.


            Each object may contain:

            - id (UUID)

            - partial_mac_address

            - mac_oui

            - vendor

            - alias
    StatusEnum:
      enum:
        - ACTIVE
        - IN_PROGRESS
        - FAILED
        - DELETED
        - SYSTEM_GENERATED_ENABLED
        - SYSTEM_GENERATED_DISABLED
        - MDM_ENROLLED_ENABLED
        - MDM_ENROLLED_DISABLED
      type: string
      description: |-
        * `ACTIVE` - active
        * `IN_PROGRESS` - in_progress
        * `FAILED` - failed
        * `DELETED` - deleted
        * `SYSTEM_GENERATED_ENABLED` - system_generated_enabled
        * `SYSTEM_GENERATED_DISABLED` - system_generated_disabled
        * `MDM_ENROLLED_ENABLED` - mdm_enrolled_enabled
        * `MDM_ENROLLED_DISABLED` - mdm_enrolled_disabled
    TypeEnum:
      enum:
        - DEVICE
        - MAC_OUI
        - CUSTOM_MAC
      type: string
      description: |-
        * `DEVICE` - device
        * `MAC_OUI` - mac_oui
        * `CUSTOM_MAC` - custom_mac
    UnauthorizedError:
      type: object
      properties:
        support_id:
          type: string
        details:
