          description: Errors encountered during the request.
        description:
          type: string
          example: List of associated users.
          description: Description of the API response.
    UpdateAccessGroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the user group.
        name:
          type: string
          description: The name of the user group.
        description:
          type: string
          description: The description of the user group.
        code:
          type: string
          description: The code associated with the user group.
        status:
          allOf:
            - $ref: "#/components/schemas/StatusEnum"
          description: |-
            The status of the user group.

            * `ACTIVE` - active
            * `IN_PROGRESS` - in_progress
            * `FAILED` - failed
            * `DELETED` - deleted
            * `SYSTEM_GENERATED_ENABLED` - system_generated_enabled
            * `SYSTEM_GENERATED_DISABLED` - system_generated_disabled
            * `MDM_ENROLLED_ENABLED` - mdm_enrolled_enabled
            * `MDM_ENROLLED_DISABLED` - mdm_enrolled_disabled
        created_at:
          type: string
          format: date-time
          description: The timestamp when the user group was created.
        last_modified_at:
          type: string
          format: date-time
          description: The timestamp when the user group was last modified.
        associated_users_count:
          type: integer
          nullable: true
          description: The number of users associated with the user group.
        is_synced:
          type: boolean
          description: The sync status of the user group.
        is_local_synced:
          type: boolean
          description: The local sync status of the user group.
        is_deleted:
          type: boolean
          description: The delete status of the user group.
        idp_company_type:
          type: string
          nullable: true
          description: The IDP company type.
      required:
        - associated_users_count
        - code
        - created_at
        - description
        - id
        - idp_company_type
        - is_deleted
        - is_local_synced
        - is_synced
        - last_modified_at
        - name
        - status
    WorkspaceDevice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Device ID
        mac_address:
          type: string
          description: MAC address of the device
        mac_oui:
          type: string
          description: MAC OUI of the device
        name:
          type: string
          description: Hostname of the device
        alias:
          type: string
          description: Alias of the device
        description:
          type: string
          description: Description of the device
        device_type:
          type: string
          description: Type of the device
      required:
        - alias
        - description
        - device_type
        - id
        - mac_address
        - mac_oui
        - name
    UserIdNameEmail:
      type: object
      description: get user id, email, is_synced, is_deleted and is_selected serializers
      properties:
        id:
          type: integer
          readOnly: true
          description: User ID
        email:
          type: string
          format: email
          title: Email Address
          description: User Email
          maxLength: 254
        is_synced:
          type: boolean
          description: Is Synced
        is_deleted:
          type: boolean
          description: Is Deleted
        is_selected:
          type: boolean
          default: false
        idp_company_type:
          type: string
          readOnly: true
        scim_username:
          type: string
          description: User SCIM Username
      required:
        - email
        - id
        - idp_company_type
    ExternalDeauth:
      type: object
      required:
        - devices
      properties:
        org_id:
          type: string
          description: Organization identifier used to scope the deauthorization request.
          example: "0"
        owner_id:
          type: string
          description: Tenant or account owner identifier associated with the request.
          example: "189357"
        workspace_id:
          type: number
          description: Workspace identifier in which the client sessions are managed.
          example: 1235
        reason:
          type: string
          description: Optional default reason applied to all targeted devices when a
            per-device reason is not provided.
          example: ""
        devices:
          type: array
          description: List of client sessions to deauthorize.
          items:
            type: object
            properties:
              mac_address:
                type: string
                description: Client device MAC address to disconnect.
                example: 9C:A2:F4:E2:1A:03
              nas_ip:
                type: string
                description: NAS (network access server) IP address where the client session is
                  active.
                example: 10.234.153.103
              nas_port_id:
                type: string
                description: Logical NAS port identifier for the client session.
                example: "1004"
              nas_port:
                type: string
                description: Physical or mapped NAS port value for the client session.
                example: "1111"
              accounting_session_id:
                type: string
                description: RADIUS accounting session identifier used to target a specific
                  active session.
                example: "123456789"
              proxy_id:
                type: number
                description: Optional proxy identifier when request routing is proxied.
                example: 1234567
              reason:
                type: string
                description: Optional reason for deauthorizing this specific client session.
                example: Logout
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Enter your API Key as a Bearer Token
security:
  - BearerAuth: []
