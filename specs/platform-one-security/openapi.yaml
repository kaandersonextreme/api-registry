  /cnac/endsystem-service/api/endsystems/v2/clients:
    get:
      tags:
        - Clients
      summary: Get Client list
      description: List of client device data with optional filtering based on query
        parameters. Filters include time range (start-time and end-time),
        authentication type, client state, ZTNA agent status, compliance status,
        user identity, and keyword-based searches across multiple fields.
        Pagination and sorting options are supported for efficient data
        retrieval. The response provides detailed information about the clients,
        such as their authentication status, compliance, VLAN configuration, and
        more. This endpoint enables administrators to manage and analyze
        client's authentication data effectively.
      operationId: clientslist
      parameters:
        - in: query
          name: start-time
          schema:
            type: integer
            format: int64
            example: 1652607240
          description: start-time is epoch time in seconds.<br>It represents the start of
            the time range (start-time - end-time) in which the auth request was
            last seen (inclusive). Both start-time and end-time parameters
            should be provided together.Unix Epoch (Jan 1,1970 UTC)
          required: false
        - in: query
          name: end-time
          schema:
            type: integer
            format: int64
            example: 1652607260
          description: end-time is epoch time in seconds.<br>It represents the end of the
            time range (start-time - end-time) in which the auth request was
            last seen (exclusive). Both start-time and end-time parameters
            should be provided together.Unix Epoch (Jan 1,1970 UTC)
          required: false
        - in: query
          name: mac-address
          schema:
            type: string
            example: 12:26:7F:00:02:0B
          description: client's mac address<br>its a search for given mac-address with
            delimeter.
          required: false
        - in: query
          name: auth-type
          schema:
            type: string
            enum:
              - EAP-TTLS
              - EAP-TLS
              - MAC-AUTH
            example: EAP-TTLS
          description: Authentication Type.
          required: false
        - in: query
          name: state
          schema:
            type: string
            example: Accepted
            enum:
              - Accepted
              - Rejected
              - Revoked
              - Disconnected
          description: Authentication state of client device
          required: false
        - in: query
          name: ztna-agent-status
          schema:
            type: string
            example: Connected
            enum:
              - Connected
              - Disconnected
              - Revoked
          description: Status of client agent
          required: false
        - in: query
          name: compliance-status
          schema:
            type: string
            example: COMPLIANT
            enum:
              - COMPLIANT
              - NON_COMPLIANT
              - Unknown
          description: Compliance status of client device
          required: false
        - in: query
          name: user-name
          schema:
            type: string
            example: uztna_cust1@0c5vx.onmicrosoft.com
          description: User identity with a maximum limit of 194 characters.
          required: false
        - in: query
          name: keyword
          schema:
            type: string
            example: windows
          description: keyword for case-insensitive search on all the string fields
            including mac-address, user-name, nas-ip, nas-port-id, auth-type,
            ssid, ip-address, ipv6-address, es-type, os-name, host-name, state,
            last-nac-profile, last-nac-rule, response-attributes,
            ztna-agent-status, compliance-status, model-name, device-family,
            device-location, reason, switch-name.
          required: false
        - in: query
          name: page
          schema:
            type: integer
            format: int32
            example: 5
          description: next page number for pagination.<br>Default value is 1 (used if set
            value is not an integer > 0).
          required: false
        - in: query
          name: size
          schema:
            type: integer
            format: int32
            example: 10
          description: current page size for pagination.<br>Default value is 20 (used if
            set value is not an integer > 0).
          required: false
        - in: query
          name: sort
          schema:
            type: string
            example: last-seen-time,DESC
          description: column on which the sort is required and the sort order (ASC,
            DESC).<br>Sorting can be applied only one column at a time.
          required: false
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: list of endsystems
                    type: array
                    items:
                      properties:
                        timestamp:
                          description: timestamp at which the record entry was made (internal)
                          type: integer
                          format: int64
                          example: 1689343258
                        mac_address:
                          description: mac address of the client
                          type: string
                          example: F8:DB:7F:01:08:76
                        user_name:
                          description: user name
                          type: string
                          example: mallfrieden@gmail.com
                        nas_ip:
                          description: nas ip address
                          type: string
                          example: 172.16.1.215
                        nas_port_id:
                          description: nas port id
                          type: string
                          example: "2454"
                        nas_port:
                          description: nas port number
                          type: integer
                          format: int32
                          example: 23
                        auth_type:
                          description: Authentication Type
                          type: string
                          example: EAP-TTLS
                        ssid:
                          description: SSID (service set identifier)
                          type: string
                          example: Extreme-Guest
                        ip_address:
                          description: client's ip address
                          type: string
                          example: 192.168.15.127
                        ipv6_address:
                          description: client's ipv6 address
                          type: string
                          example: 0:0:0:0:0:FFFF:C0A8:C8B
                        es_type:
                          description: end system os type
                          type: string
                          example: Windows
                        os_name:
                          description: end system operating system
                          type: string
                          example: Windows Server 2003
                        host_name:
                          description: host name
                          type: string
                          example: mfrieden-phone
                        state:
                          description: client's state
                          type: string
                          example: Accepted
                        last_nac_profile:
                          description: last nac profile
                          type: string
                          example: Guest Access
                        last_nac_rule:
                          description: last nac rule
                          type: string
                          example: Guest Access
                        response_attributes:
                          description: response attributes
                          type: string
                          example: "[{'name':'Filter Id','value':'GuestRegistered'},{'name':'Filter
                            Id','value':'SomeName'}]"
                        first_seen_time:
                          description: epoch time in seconds when the client auth request was received
                            first time
                          type: integer
                          format: int64
                          example: 1692021658
                        last_seen_time:
                          description: epoch time in seconds when the client auth request was received
                            last time
                          type: integer
                          format: int64
                          example: 1689343258
                        ztna_agent_status:
                          description: ztna agent status on the device
                          type: string
                          example: Allowed
                        compliance_status:
                          description: device compliance status
                          type: string
                          example: Compliant
                        model_name:
                          description: model name of the device
                          type: string
                          example: Apple MacBook
                        device_family:
                          description: device family
                          type: string
                          example: Mobiles/Phones
                        device_location:
                          description: geographic location of the device
                          type: string
                          example: US
                        reason:
                          description: reason for auth failure, if applicable
                          type: string
                          example: failed to match rule
                        is_craas:
                          description: if the client is authenticated via RaaS
                          type: boolean
                          example: false
                        is_zta:
                          description: if the client is authenticated via ZTNA
                          type: boolean
                          example: true
                        policy_vlan:
                          description: VLAN id configured in policy
                          type: integer
                          format: int32
                          example: 32
                        policy_nsi:
                          description: ISID configured in policy
                          type: integer
                          format: int32
                          example: 57
                        switch_name:
                          description: hostname of the switch
                          type: string
                          example: extreme-switch
                        user_blocked:
                          description: if the user is blocked or not
                          type: boolean
                          example: false
                        device_blocked:
                          description: if the device is blocked or not
                          type: boolean
                          example: false
                  pagination:
                    description: pagination details
                    type: object
                    properties:
                      total_count:
                        description: total count of the endsystems
                        type: integer
                        format: int32
                        example: 10
                      count_in_page:
                        description: count of endsystems in the current page
                        type: integer
                        format: int32
                        example: 10
                      offset:
                        description: offset
                        format: int32
                        type: integer
                        example: 1
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                  - required:
                      - status
                      - error
                      - message
                    type: object
                    properties:
                      status:
                        type: integer
                      error:
                        type: string
                      message:
                        type: string
                  - type: object
                    properties:
                      violations:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            message:
                              type: string
                example:
                  status: 400
                  error: Bad Request
                  message: Constraint Violation
                  violations:
                    - field: id
                      message: may not be null
                    - field: name
                      message: may not be empty
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                  - details
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: string
              example:
                code: UNAUTHORIZED
                message: Authentication failed
                details: Invalid access token or API key
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                required:
                  - status
                  - error
                  - message
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  message:
                    type: string
              example:
                status: 403
                error: Forbidden
                message: Resource not authorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                required:
                  - status
                  - error
                  - message
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  message:
                    type: string
              example:
                status: 404
                error: Not Found
                message: Resource not found
        "405":
          description: Method Not Allowed
          content:
            application/json:
              schema:
                required:
                  - status
                  - error
                  - message
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  message:
                    type: string
              example:
                status: 405
                error: Method Not Allowed
                message: Method POST is not Allowed
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                required:
                  - status
                  - error
                  - message
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  message:
                    type: string
              example:
                status: 500
                error: Internal Server Error
                message: Things are a little unstable
  /cnac/network-policy-engine/api/v1/npe/external/deauth:
    post:
      operationId: deauthClient
      description: Forcibly disconnects one or more client devices from the network by
        deauthorizing their active sessions. This endpoint accepts client MAC
        addresses and optional RADIUS session identifiers to immediately
        terminate connectivity. It is typically used for logout events, policy
        changes, or security remediation. Cloud‑onboarded devices are
        disconnected directly, while clients on third‑party devices are
        deauthorized via a RADIUS Change of Authorization (CoA) request.
      summary: Disconnect one or more client sessions
      tags:
        - Trigger Client Session Deauthorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalDeauth"
        required: true
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                required:
                  - status
                  - title
                type: object
                properties:
                  status:
                    type: integer
                  title:
                    type: string
                  detail:
                    type: string
                  message:
                    type: string
              example:
                status: 400
                title: Bad Request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                required:
                  - code
                  - message
                  - details
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: string
              example:
                code: UNAUTHORIZED
                message: Authentication failed
                details: Invalid access token or API key
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                required:
                  - status
                  - error
                  - message
                type: object
                properties:
                  status:
                    type: integer
                  error:
