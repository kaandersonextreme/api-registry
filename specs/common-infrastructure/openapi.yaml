        vlanRanges:
          type: string
          description: Range of VLAN ID to probe. Limited to 500 VLAN IDs at a time.
          example: 100-110
        retries:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of retries for the service probe operation
          example: 3
        timeoutInSeconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 30
          description: Timeout in seconds for the service probe operation
          example: 60
        deviceId:
          type: string
          description: The UUID of the device to probe
          example: 5b3da8f6-bfc8-4776-ae72-e388db060000
    ServiceProbeVLANStartResponse:
      type: object
      properties:
        succeeded:
          type: boolean
          description: The status of the service probe start operation
          example: true
        taskKey:
          type: string
          description: The ID of the task for tracking the service probe operation
          example: 5b3da8f6-bfc8-4776-ae72-e388db060000
        startTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the service probe operation started
          example: 2023-10-01T12:00:00Z
    ServiceProbeVLANStopRequest:
      type: object
      properties:
        taskKey:
          type: string
          description: The ID of the task to stop the service probe operation
          example: 5b3da8f6-bfc8-4776-ae72-e388db060000
        deviceId:
          type: string
          description: The UUID of the device to stop probing
          example: 5b3da8f6-bfc8-4776-ae72-e388db060000
    ServiceProbeVLANStopResponse:
      type: object
      properties:
        succeeded:
          type: boolean
          description: The status of the service probe stop operation
          example: true
        taskKey:
          type: string
          description: The ID of the task for tracking the service probe stop operation
          example: 5b3da8f6-bfc8-4776-ae72-e388db060000
        startTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the service probe operation started
          example: 2023-10-01T12:00:00Z
        stopTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the service probe operation was stopped
          example: 2023-10-01T12:00:05Z
    ServiceProbeDataResponse:
      type: object
      properties:
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of completion for the service probe operation
          example: 33
        status:
          type: string
          description: The status of the VLAN probe
          enum:
            - RUNNING
            - STOPPED
            - COMPLETED
            - FAILED
            - VALIDATION_FAILED
          example: RUNNING
        deviceStatus:
          $ref: "#/components/schemas/DeviceProbeStatus"
        startTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the service probe operation started
          example: 2023-10-01T12:00:00Z
        endTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the service probe operation completed
          example: 2023-10-01T12:00:00Z
        updateTimeStamp:
          type: string
          format: date-time
          description: The timestamp when the service probe operation last updated
          example: 2023-10-01T12:00:00Z
        taskKey:
          type: string
          description: The ID of the task for which the service probe data is retrieved
          example: 5b3da8f6-bfc8-4776-ae72-e388db060000
        completed:
          type: boolean
          description: Indicates whether the service probe operation is completed
          example: true
    DeviceProbeStatus:
      type: object
      properties:
        deviceId:
          type: string
          description: The UUID of the device for which the service probe data is retrieved
          example: 5b3da8f6-bfc8-4776-ae72-e388db060000
        vlanProbeNotifications:
          $ref: "#/components/schemas/vlanProbeNotification"
        status:
          type: string
          description: The status of the service probe operation for the device
          enum:
            - SUCCESS
            - FAIL
          example: SUCCESS
        deviceMAC:
          type: string
