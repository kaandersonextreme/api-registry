  /device/sync:
    post:
      tags:
        - Device Management
      summary: Sync the managed devices to clear the device inconsistencies
      description: >
        Performs comprehensive device inventory synchronization between the
        management system

        and cloud-based device registry to identify and resolve inconsistencies,
        ensuring accurate

        device records and eliminating orphaned or stale device entries.


        This operation provides robust device consistency management including:

        - **Inventory Reconciliation**: Compare local device records with
        authoritative cloud inventory

        - **Inconsistency Detection**: Identify orphaned devices, duplicate
        entries, and stale records

        - **Automated Cleanup**: Remove devices that no longer exist in the
        authoritative source

        - **Data Validation**: Verify device attributes, status information, and
        relationship integrity

        - **Audit Trail Generation**: Document all synchronization actions for
        compliance and troubleshooting


        **Synchronization Process:**

        - **Discovery Phase**: Enumerate all managed devices in local inventory

        - **Validation Phase**: Cross-reference with cloud device registry and
        authoritative sources

        - **Analysis Phase**: Identify inconsistencies, conflicts, and
        resolution requirements

        - **Reconciliation Phase**: Apply corrections, removals, and updates
        based on policy

        - **Verification Phase**: Confirm synchronization success and generate
        completion reports


        **Inconsistency Resolution:**

        - **Orphaned Devices**: Remove local devices that no longer exist in
        cloud inventory

        - **Stale Records**: Update device information that has changed in
        authoritative sources

        - **Duplicate Entries**: Consolidate multiple records for the same
        physical device

        - **Status Mismatches**: Reconcile operational status and management
        state differences

        - **Relationship Cleanup**: Repair broken device relationships and
        topology associations


        **Use Cases:**

        - Regular maintenance to ensure device inventory accuracy and
        consistency

        - Post-migration cleanup after device management system changes

        - Resolving device inventory issues identified through monitoring or
        auditing

        - Supporting device lifecycle management and decommissioning workflows

        - Integration with cloud-based device management and orchestration
        systems

        - Compliance maintenance for asset management and audit requirements

        - Troubleshooting device discovery and management connectivity issues


        **Operational Safeguards:**

        - **Dry Run Capability**: Preview synchronization actions before
        applying changes

        - **Rollback Support**: Ability to reverse synchronization actions if
        needed

        - **Selective Sync**: Target specific device groups or categories for
        focused cleanup

        - **Impact Assessment**: Analyze potential effects before performing
        bulk operations

        - **Backup Integration**: Coordinate with backup systems to preserve
        critical device data


        **Performance Considerations:**

        - Synchronization time scales with device inventory size and complexity

        - Cloud connectivity requirements for accessing authoritative device
        registry

        - Potential temporary service impact during large-scale device cleanup
        operations

        - Resource utilization optimization for minimal operational disruption
      operationId: clearDeviceInconsistencies
      x-mcp-operation:
        category: device-management
        ai-description: Synchronize managed devices with cloud inventory to resolve
          inconsistencies and maintain accurate device records.
        use-cases:
          - Clean up orphaned device records
          - Synchronize device inventory with cloud systems
          - Resolve device management inconsistencies
          - Support device lifecycle management workflows
        data-sensitivity: administrative
        automation-priority: medium
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deviceSyncAttribute"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request - Invalid request parameters or format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
          description: Internal Server Error - Failed to sync devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
