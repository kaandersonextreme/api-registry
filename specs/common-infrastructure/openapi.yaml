  /device/physical/link:
    get:
      tags:
        - Device Management
      summary: Get Physical Link Details
      description: >
        Retrieves comprehensive physical link information including port
        utilization statistics, 

        traffic counters, error statistics, and operational details for both
        ends of a network link.


        This endpoint provides detailed insights into:

        - **Utilization Metrics**: Current and maximum bandwidth utilization
        percentages

        - **Traffic Statistics**: Packet and byte counters for unicast,
        broadcast, and multicast traffic

        - **Error Statistics**: Various error counters including discards, CRC
        errors, collisions

        - **Port Details**: Administrative and operational states, speed,
        duplex, media type

        - **LAG Information**: For aggregated links, includes member port
        details and protocols


        **Use Cases:**

        - Network performance monitoring and troubleshooting

        - Capacity planning and bandwidth analysis

        - Link health assessment and error detection

        - Integration with network monitoring systems


        **Performance Impact:**

        - Statistics are collected in real-time from network devices

        - Response time depends on device responsiveness and network latency
      operationId: getDevicePhysicalLinkDetails
      x-mcp-operation:
        category: device-monitoring
        ai-description: Retrieve detailed physical link statistics and performance
          metrics for network monitoring and analysis.
        use-cases:
          - Monitor link utilization and performance
          - Detect network congestion and errors
          - Analyze traffic patterns for capacity planning
          - Troubleshoot connectivity issues
        data-sensitivity: operational
        real-time: true
        automation-priority: medium
      parameters:
        - name: linkID
          in: query
          description: >
            Unique identifier (UUID) of the physical link for which to retrieve
            detailed information.

            This corresponds to the edge ID in topology data.
          required: true
          schema:
            type: string
            example: 5b3da8f6-bfc8-4776-ae72-e388db060000
        - name: topologyType
          in: query
          description: >
            Type of topology context from which the link details are being
            queried. This affects

            which layer of information is emphasized in the response.


            - `physical`: Focus on physical layer details and statistics

            - `fabric`: Include fabric-aware information if applicable

            - `physicalAndFabric`: Combined view of both layers
          required: true
          schema:
            $ref: "#/components/schemas/TopologyType"
          example: physical
      responses:
        "200":
          description: >
            Successfully retrieved physical link details. The response includes
            comprehensive information

            about both ports connected by the link, traffic statistics, error
            counters, and configuration details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePhysicalLinkDetails"
              examples:
                ethernet_link_details:
                  summary: Typical Ethernet link with statistics
                  description: Example response for a standard Ethernet link between two switches
                  value:
                    link:
                      device1Name: core-sw-001
                      device2Name: access-sw-015
                      port1Name: 1/1/1
                      port2Name: 1/1/24
                      port1Description: Uplink to Core
                      port2Description: Link to Access Layer
                    linkInfo:
                      linkMediaType: Ethernet
                    port1State:
                      portUtilizationInfo:
                        utilizationRx: 15.5
                        utilizationTx: 23.2
                        utilizationMaxRx: 45.8
                        utilizationMaxTx: 67.1
                      portInOutStats:
                        inOctets: 1234567890
                        outOctets: 9876543210
                        inUcastPkts: 500000
                        outUcastPkts: 750000
                      portDetails:
                        portOperStatus: UP
                        portSpeed: 1G
                        transmissionMode: FULL
                lag_link_details:
                  summary: LAG link with member ports
                  description: Example response for a Link Aggregation Group (LAG) with multiple
                    member ports
                  value:
                    link:
                      device1Name: core-sw-001
                      device2Name: core-sw-002
                      port1Name: lag-1
                      port2Name: lag-1
                      port1LagLinkInfo:
                        lagMode: Trunk
                        lagProtocol: LACP
                        lagAlgorithm: L3L4
                    memberLinksState:
                      - link:
                          port1Name: 1/1/1
                          port2Name: 1/1/1
                        port1State:
                          portDetails:
                            portOperStatus: UP
        "400":
          description: |
            Bad Request - Invalid parameters provided:
            - Invalid UUID format for linkID
            - Invalid topologyType value
            - Missing required parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                invalid_link_id:
                  summary: Invalid link ID format
                  value:
                    code: 400
                    message: "Invalid linkID format. Expected UUID format:
                      xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
        "500":
          description: |
            Internal Server Error - Failed to retrieve link details:
            - Device communication failure
            - Database query error
            - Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
