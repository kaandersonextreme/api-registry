openapi: 3.0.3
info:
  title: Extreme Networks Common Infrastructure API
  description: >
    # Common Infrastructure REST API


    This comprehensive API provides access to the Common Infrastructure services
    for Extreme Networks' network management platform.

    The API enables programmatic access to topology management, device
    management, service management, and network visualization capabilities.


    ## Key Features

    - **Topology Management**: Retrieve and manage network topologies (physical,
    fabric, service layers)

    - **Device Management**: Access device information, interfaces, neighbors,
    and fabric details

    - **Service Management**: Manage L2/L3 VSN, VLAN, and VRF services

    - **User Preferences**: Store and retrieve user-specific preferences

    - **Real-time Updates**: WebSocket notifications for topology and device
    changes

    - **Service Probing**: VLAN service probe utilities for network validation


    ## API Design

    This API follows RESTful principles and supports JSON payloads. Most
    operations use POST methods with detailed criteria objects

    to provide flexible filtering and querying capabilities suitable for complex
    network topologies.


    ## Authentication

    This API is designed to be integrated with MCP (Model Context Protocol)
    servers and other automation tools.

    Authentication and authorization should be handled at the infrastructure
    level.


    ## MCP Server Integration

    This API is optimized for MCP (Model Context Protocol) server integration
    with the following features:


    **AI-Friendly Design:**

    - Comprehensive endpoint descriptions with use cases and examples

    - Structured error responses for better error handling

    - Detailed parameter descriptions for automated API consumption

    - Response schemas optimized for AI interpretation


    **Automation Support:**

    - API Key authentication recommended for MCP servers

    - Asynchronous operations with proper status tracking

    - Bulk operations where applicable

    - Consistent data formats across endpoints


    **Rate Limiting Considerations:**

    - Recommended rate limit: 60 requests per minute

    - Burst allowance: 10 requests

    - Consider caching for topology and device data


    ## Rate Limiting

    API calls should be rate-limited appropriately to prevent system overload,
    especially for large topology queries.
