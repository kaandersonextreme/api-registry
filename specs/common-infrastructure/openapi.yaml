    devicePortState:
      type: object
      nullable: true
      description: Details of the port
      properties:
        portUtilizationInfo:
          $ref: "#/components/schemas/PortUtilizationInfo"
        portInOutStats:
          $ref: "#/components/schemas/PortInOutStats"
        portErrorStats:
          $ref: "#/components/schemas/PortErrorStats"
        portDetails:
          $ref: "#/components/schemas/PortDetails"
    PortUtilizationInfo:
      type: object
      nullable: true
      properties:
        utilizationRx:
          type: number
          format: float
          description: The percentage of bandwidth used for ingress.
          example: 12.34
        utilizationTx:
          type: number
          format: float
          description: The percentage of bandwidth used for egress.
          example: 56.78
        utilizationMaxRx:
          type: number
          format: float
          description: The maximum percentage of bandwidth reached, used for ingress.
          example: 67.89
        utilizationMaxTx:
          type: number
          format: float
          description: The maximum percentage of bandwidth reached, used for egress.
          example: 89.01
    PortInOutStats:
      type: object
      nullable: true
      properties:
        inOctets:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of octets received on the interface,
            including framing characters.
          example: 12345
        outOctets:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of octets transmitted out of the
            interface, including framing characters.
          example: 234567
        inUcastPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The number of packets, delivered by this sub-layer to a
            higher (sub-)layer, which were not addressed to a multicast
            or broadcast address at this sub-layer.
          example: 345678
        outUcastPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of packets that higher-level protocols
            requested be transmitted, and which were not addressed to a
            multicast or broadcast address at this sub-layer, including
            those that were discarded or not sent.
          example: 456789
        inBroadcastPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The number of packets, delivered by this sub-layer to a
            higher (sub-)layer, which were addressed to a broadcast
            address at this sub-layer.
          example: 123456
        outBroadcastPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of packets that higher-level protocols
            requested be transmitted, and which were addressed to a
            broadcast address at this sub-layer, including those that
            were discarded or not sent.
          example: 123456789
        inMulticastPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The number of packets, delivered by this sub-layer to a
            higher (sub-)layer, which were addressed to a multicast
            address at this sub-layer. For a MAC layer protocol, this
            includes both Group and Functional addresses.
          example: 1234569012
        outMulticastPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of packets that higher-level protocols
            requested be transmitted, and which were addressed to a
            multicast address at this sub-layer, including those that
            were discarded or not sent.  For a MAC layer protocol, this
            includes both Group and Functional addresses.
          example: 123456
        inFlowCtrlPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of flow control packets received
            by this interface.
          example: 123456
        outFlowCtrlPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of flow control packets transmitted 
            by this interface.
          example: 123456
        inPfcPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of Priority Flow Control (PFC)
            packets received by this interface.
          example: 123456
        outPfcPkts:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of Priority Flow Control (PFC)
            packets transmitted by this interface.
          example: 123456
    PortErrorStats:
      type: object
      nullable: true
      properties:
        inDiscards:
          type: integer
          format: int64
          minimum: 0
          description: |
            The number of inbound packets which were chosen to be
            discarded even though no errors had been detected to prevent
            their being deliverable to a higher-layer protocol. One 
            possible reason for discarding such a packet could be to free 
            up buffer space.
          example: 123456
        outDiscards:
          type: integer
          format: int64
          minimum: 0
          description: |
            The number of outbound packets which were chosen to be
            discarded even though no errors had been detected to prevent
            their being transmitted. One possible reason for discarding
            such a packet could be to free up buffer space.
          example: 123456
        inErrors:
          type: integer
          format: int64
          minimum: 0
          description: |
            For packet-oriented interfaces, the number of inbound
            packets that contained errors preventing them from being
            deliverable to a higher-layer protocol.
          example: 123456
        outErrors:
          type: integer
          format: int64
          minimum: 0
          description: |
            For packet-oriented interfaces, the number of outbound
            packets that could not be transmitted because of errors.
            For character-oriented or fixed-length interfaces, the
            number of outbound transmission units that could not be
            transmitted because of errors.
          example: 123456
        linkFailures:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of link failures encountered on 
            this interface.
          example: 123456
        linkInactive:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of link inactive errors encountered 
            on this interface.
          example: 123456
        macRx:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of frames for which reception on a
            particular interface fails due to an internal
            MAC sublayer receive error. A frame is only
            counted by an instance of this object if it is
            not counted by the corresponding instance of
            either the dot3StatsFrameTooLongs object, the
            dot3StatsAlignmentErrors object, or the
            dot3StatsFCSErrors object
          example: 123456
        macTx:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of frames for which transmission on a
            particular interface fails due to an internal
            MAC sublayer transmit error. A frame is only
            counted by an instance of this object if it is
            not counted by the corresponding instance of
            either the dot3StatsLateCollisions object, the
            dot3StatsExcessiveCollisions object, or the
            dot3StatsCarrierSenseErrors object.
          example: 123456
        packet:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of packet errors encountered on 
            this interface.
          example: 123456
        sqeTest:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of times that the SQE TEST ERROR
            message is generated by the PLS sublayer for a
            particular interface.
          example: 123456
        unknownProtos:
          type: integer
          format: int64
          minimum: 0
          description: |
            For packet-oriented interfaces - the number of packets
            received via the interface which were discarded
            because of an unknown or unsupported protocol. For
            character-oriented or fixed-length interfaces which
            support protocol multiplexing - the number of
            transmission units received via the interface which
            were discarded because of an unknown or unsupported
            protocol. For any interface which does not support
            protocol multiplexing this counter will always be 0.
          example: 123456
        alignment:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of frames received on a particular
            interface that are not an integral number of
            octets in length and do not pass the FCS check.
          example: 123456
        carrier:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of carrier errors encountered on
            this interface. Carrier errors occur when there is a 
            problem with the modulation of the signal. This could 
            indicate either a duplex mismatch, or a problem with 
            the physical cable/connector.
          example: 123456
        carrierSense:
          type: integer
          format: int64
          minimum: 0
          description: |
            The number of times that the carrier sense
            condition was lost or never asserted when
            attempting to transmit a frame on a particular
            interface.
          example: 123456
        deferredTx:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of frames for which the first
            transmission attempt on a particular interface
            is delayed because the medium is busy.
          example: 123456
        fcs:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of frames received on a particular
            interface that are an integral number of octets
            in length but do not pass the FCS check.
          example: 123456
        frameTooLong:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of frames received on a particular
            interface that exceed the maximum permitted
            frame size.
          example: 123456
        frameTooShort:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total number of frames that are too short 
            that were encountered on this interface.
          example: 123456
        excessiveCollision:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of frames for which transmission on a
            particular interface fails due to excessive
            collisions. This counter does not increment when 
            the interface is operating in full-duplex mode.
          example: 123456
        lateCollision:
          type: integer
          format: int64
          minimum: 0
          description: |
            The number of times that a collision is detected
            on a particular interface later than 512 bit-times
            into the transmission of a packet.
          example: 123456
        multipleCollision:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of successfully transmitted frames on
            a particular interface for which transmission
            is inhibited by more than one collision.
          example: 123456
        singleCollision:
          type: integer
          format: int64
          minimum: 0
          description: |
            A count of successfully transmitted frames on
            a particular interface for which transmission
            is inhibited by exactly one collision.
          example: 123456
    PortDetails:
      type: object
      nullable: true
      properties:
        mediaType:
          description: Indicates the type of media used by the port for data transmission.
          type: string
          enum:
            - RJ45
            - TRANSCEIVER
        portMode:
          description: >
            A value of Trunk indicates that the port on the current VLAN
            performs

            tagging on the incoming and outgoing traffic. This is Fabric Engine

            specific.
          type: string
          enum:
            - Access
            - Trunk
          default: Access
        transmissionMode:
          description: Indicate this port's current duplex value.
          type: string
          enum:
            - HALF
            - FULL
        portSpeed:
          description: Indicate this port's current speed value.
          type: string
          enum:
            - 0M
            - 10M
            - 100M
            - 1G
            - 2.5G
            - 5G
            - 10G
            - 20G
            - 25G
            - 40G
            - 50G
            - 100G
        slppStatus:
          description: The SLPP safe guard status for the port. SLPP guard state is set to
            MONITORING if the port is operational UP and SLPP guard is enabled
            on that port. The state is set to BLOCKING when the port is disabled
            by SLPP guard. If SLPP is not enabled on the port, the state is set
            to NONE.
          type: string
          enum:
            - BLOCKING
            - MONITORING
            - NONE
        poePowerUsed:
          description: Measured usage power expressed in Watts
          type: number
          format: float
          example: 123.45
        poeStatus:
          description: |
            The operational status of the port detection for PoE.
          type: string
          enum:
            - DISABLED
            - SEARCHING
            - DISCOVERED
            - DELIVERING
            - FAULTED
            - DISCONNECTED
            - OTHER
            - DENIED
            - TEST
        lldpNeighbor:
          description: System name of LLDP neighbor.
          type: string
          example: 5720-48MW
        portOperStatus:
          description: |
            The current operational state of the interface.  The
            testing state indicates that no operational packets can
            be passed.  If admin state is down then oper state
            should be down. If admin state is changed to up
            then oper state should change to up and the interface is
            ready to transmit and receive network traffic. It should
            change to dormant if the interface is waiting for
            external actions (such as a serial line waiting for an
            incoming connection). It should remain in the down state
            if and only if there is a fault that prevents it from going
            to the up state; It should remain in the notPresent
            state if the interface has missing (typically, hardware)
            components.
          type: string
          enum:
            - UP
            - DOWN
            - TESTING
            - UNKNOWN
            - DORMANT
            - NOT-PRESENT
            - LOWER-LAYER-DOWN
        portAdminStatus:
          $ref: "#/components/schemas/AdminState"
        dhcpSnoopingStatus:
          description: DHCP Snooping action on violation.
          type: string
          enum:
            - DROP_PACKET
            - BLOCK_MAC
            - BLOCK_PORT
            - NONE
          default: NONE
        autoSenseState:
          $ref: "#/components/schemas/AdminState"
        autoSenseOperState:
          $ref: "#/components/schemas/AutoSenseOperState"
