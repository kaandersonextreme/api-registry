    TopologyCriteria:
      type: object
      description: >
        Comprehensive criteria object for topology retrieval operations. This
        schema defines all possible

        filters, preferences, and options for customizing topology queries to
        meet specific visualization

        and analysis requirements.


        **Key Features:**

        - **Multi-layer Support**: Query across physical, fabric, and service
        topology layers

        - **Flexible Filtering**: Advanced search and filtering capabilities

        - **Visualization Options**: Support for different view types and
        layouts

        - **Service Integration**: Service-specific topology features

        - **Performance Optimization**: Pagination and selective data loading
      properties:
        generalCriteria:
          $ref: "#/components/schemas/GeneralCriteria"
        serviceCriteria:
          $ref: "#/components/schemas/ServiceCriteria"
      example:
        generalCriteria:
          type: physical
          viewType: abstract
          verboseType: Verbose
          chartHash: physical-topology-v1
        serviceCriteria:
          globalServiceCriteria:
            serviceList:
              - serviceType: VLAN_Service
                serviceName: VLAN-100
                serviceNumber: "100"
    TopologyDeviceCriteria:
      type: object
      description: TopologyDeviceCriteria
      properties:
        deviceIDList:
          $ref: "#/components/schemas/UUIDList"
        topoType:
          $ref: "#/components/schemas/TopologyType"
    TopologyLinkCriteria:
      type: object
      description: TopologyLinkCriteria
      properties:
        linkIDList:
          $ref: "#/components/schemas/UUIDList"
        topoType:
          $ref: "#/components/schemas/TopologyType"
    GeneralCriteria:
      type: object
      description: >
        Primary criteria object for topology operations defining the core
        parameters for data retrieval

        and visualization preferences. This schema controls the fundamental
        aspects of how topology

        data is queried, filtered, and presented.


        **Topology Types:**

        - **physical**: Physical layer topology showing actual hardware
        connections

        - **fabric**: Fabric layer topology showing logical fabric connections
        (SPBM, EVPN)

        - **service**: Service layer topology showing L2/L3 services and their
        relationships

        - **accessLayer**: Simplified view focusing on access layer devices

        - **physicalAndFabric**: Combined view showing both physical and fabric
        layers


        **View Types:**

        - **map**: Geographic or floor plan based visualization

        - **abstract**: Logical diagram representation

        - **list**: Tabular or list-based presentation


        **Actions:**

        - **expand**: Expand a collapsed group or node to show children

        - **collapse**: Collapse an expanded group to hide children

        - **collapse-all**: Collapse all expanded groups in the topology

        - **snapshot**: Capture current topology state for comparison

        - **search**: Perform search-based filtering
      properties:
        action:
          $ref: "#/components/schemas/NodeState"
        type:
          $ref: "#/components/schemas/TopologyType"
        viewType:
          $ref: "#/components/schemas/TopologyViewType"
        chartHash:
          type: string
          description: >
            Unique identifier for the topology view configuration maintained by
            the client GUI.

            Used for caching, state persistence, and custom positioning
            correlation.


            **Format**: Usually a combination of topology type and view
            identifier

            **Examples**: "physical-abstract-v1", "fabric-map-building-001"
          example: physical-topology-abstract-view
        nodeID:
          type: string
          description: >
            UUID of the specific node (device or group) on which to focus the
            topology operation.


            **Use Cases:**

            - Expand/collapse operations on specific groups

            - Center topology view on a particular building or floor

            - Filter topology to show only descendants of a specific node

            - Access layer topology scoped to a specific building


            **Node Types:**

            - Building IDs for access layer topology

            - Group IDs for hierarchical operations

            - Device IDs for device-centric views
          example: 5b3da8f6-bfc8-4776-ae72-a388db060000
        connectedState:
          type: string
          description: >
            Comma-separated list of node UUIDs representing the current
            connected/selection state

            in the UI. Used to maintain visual context and selection states
            across topology updates.


            **Purpose:**

            - Preserve user selections during topology refresh

            - Maintain visual highlighting and focus

            - Support multi-node operations and comparisons
          example: 5b3da8f6-bfc8-4776-ae72-a388db060000,7c8e9f0a-1b2c-3d4e-5f6a-b7c8d9e0f1a2
        verboseType:
          $ref: "#/components/schemas/VerboseType"
        searchCriteria:
          $ref: "#/components/schemas/SearchCriteria"
      example:
        action: expand
        type: physical
        viewType: abstract
        chartHash: main-physical-view
        nodeID: 5b3da8f6-bfc8-4776-ae72-a388db060000
        verboseType: Verbose
        searchCriteria:
          type: device
          field: name
          key: core-switch
    SearchCriteria:
      type: object
      description: SearchCriteria (Applicable when action is 'find')
      properties:
        type:
          type: string
          description: search for this specific type, device type is supported.
        field:
          type: string
          description: field on which the type can be searched, supports name,
            serialNumber and ipAddress
        key:
          type: string
          description: search string
    GlobalServiceCriteria:
      type: object
      description: GlobalServiceCriteria
      properties:
        serviceList:
          type: array
          items:
            $ref: "#/components/schemas/ServiceKey"
    EndToEndServiceCriteria:
      type: object
      description: EndToEndServiceCriteria
      properties:
        sourceNodeType:
          $ref: "#/components/schemas/NodeType"
        sourceNodeUUID:
          $ref: "#/components/schemas/UUID"
        sourceNodeServiceList:
          type: array
          items:
            $ref: "#/components/schemas/ServiceKey"
        destinationNodeType:
          $ref: "#/components/schemas/NodeType"
        destinationNodeUUID:
          $ref: "#/components/schemas/UUID"
        destinationNodeServiceList:
          type: array
          items:
            $ref: "#/components/schemas/ServiceKey"
    ServiceCriteria:
      type: object
      description: ServiceCriteria
      properties:
        globalServiceCriteria:
          $ref: "#/components/schemas/GlobalServiceCriteria"
        endToEndServiceCriteria:
          $ref: "#/components/schemas/EndToEndServiceCriteria"
