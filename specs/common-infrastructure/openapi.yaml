          description: IPv6 address
          type: string
          format: ipv6
          example: 2001:0db8:2231:aaec:0000:0000:4a4a:2100
        ipv6Netmask:
          description: IPv6 address mask length
          type: integer
          minimum: 1
          maximum: 128
          example: 64
    ErrorModel:
      type: object
      description: >
        Standardized error response format used across all API endpoints.
        Provides detailed

        information about API errors to enable proper error handling and user
        feedback.


        **Error Categories:**

        - **Client Errors (400-499)**: Invalid requests, authentication,
        authorization issues

        - **Server Errors (500-599)**: Internal system errors, service
        unavailability

        - **Network Errors**: Connectivity issues, timeouts, device
        communication failures


        **Error Handling Best Practices:**

        - Always check the `code` field for programmatic error handling

        - Use `message` for user-friendly error display

        - Implement retry logic for appropriate error codes (500, 503)

        - Log `correlationId` for troubleshooting when provided
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: >
            Numerical error code corresponding to HTTP status codes with
            additional

            application-specific codes for finer error categorization.


            **Common Codes:**

            - 400: Bad Request - Invalid input parameters

            - 401: Unauthorized - Authentication required

            - 403: Forbidden - Insufficient permissions

            - 404: Not Found - Resource doesn't exist

            - 409: Conflict - Resource state conflict

            - 422: Unprocessable Entity - Valid request, invalid data

            - 429: Too Many Requests - Rate limit exceeded

            - 500: Internal Server Error - Unexpected system error

            - 503: Service Unavailable - Temporary service issue
          example: 404
        message:
          type: string
          description: >
            Human-readable error message describing what went wrong. This
            message is safe

            to display to end users and provides actionable information when
            possible.


            **Message Guidelines:**

            - Clear and descriptive without technical jargon

            - Actionable advice when appropriate

            - No sensitive information exposure

            - Consistent formatting and terminology
          example: Unable to retrieve device details. Device may be offline or
            unreachable.
        timestamp:
          type: string
          format: date-time
          description: >
            ISO 8601 timestamp indicating when the error occurred. Useful for
            debugging

            and correlating errors across logs and systems.
          example: 2023-10-01T12:00:00Z
        path:
          type: string
          description: |
            The API endpoint path where the error occurred. Helps with debugging
            and error tracking across multiple endpoints.
          example: /retrieve-topology
        correlationId:
          type: string
          description: >
            Unique identifier for the request that can be used to trace the
            error

            across system logs and support requests.
          example: req-12345-67890
        details:
          type: object
          description: >
            Additional structured error details for programmatic consumption.

            Contains specific information about validation errors, field-level
            issues,

            or context-specific error data.
          properties:
            field:
              type: string
              description: Specific field name that caused the error (for validation errors)
              example: deviceId
            provided:
              type: string
              description: The actual value that was provided and caused the error
              example: invalid-uuid-123
            issue:
              type: string
              description: Specific description of what was wrong with the provided value
              example: Expected object, received string
            suggestion:
              type: string
              description: Helpful suggestion on how to fix the error
              example: Use viewType 'abstract' or 'list' for service topology
            conflictingFields:
              type: array
              items:
                type: string
              description: List of fields that are in conflict with each other
              example:
                - viewType
                - type
            retryAfter:
              type: integer
              description: Number of seconds to wait before retrying (for rate limiting)
              example: 30
            currentUsage:
              type: integer
              description: Current usage count (for rate limiting)
              example: 65
            limit:
              type: integer
              description: Maximum allowed limit (for rate limiting)
              example: 60
            maintenanceWindow:
              type: string
              description: Maintenance window information for service unavailable errors
              example: 2023-10-01T12:00:00Z to 2023-10-01T13:00:00Z
            validationErrors:
              type: array
              description: List of validation errors for multiple fields
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Field name with validation error
                    example: nodeID
                  message:
                    type: string
                    description: Validation error message for this field
                    example: Invalid UUID format
                  code:
                    type: string
                    description: Error code for this validation error
                    example: INVALID_UUID_FORMAT
            resourceType:
              type: string
              description: Type of resource that was being accessed
              example: device
            resourceId:
              type: string
              description: ID of the specific resource that caused the error
              example: 5b3da8f6-bfc8-4776-ae72-e388db060000
      example:
        code: 404
        message: Device with ID '5b3da8f6-bfc8-4776-ae72-e388db060000' not found
        timestamp: 2023-10-01T12:00:00.000Z
        path: /device/physical
        details:
          resourceType: device
          resourceId: 5b3da8f6-bfc8-4776-ae72-e388db060000
        correlationId: req-20231001-120000-001
