  /user/preferences:
    get:
      tags:
        - User Preferences
      summary: getUserPreferences
      description: >
        Retrieves user-specific preferences and configuration settings that
        personalize the network

        management interface and customize the user experience across different
        application features.


        This endpoint provides access to comprehensive user preference data
        including:

        - **Interface Customization**: Dashboard layouts, widget configurations,
        and display preferences

        - **Behavioral Settings**: Default views, auto-refresh intervals, and
        interaction preferences

        - **Personalization Data**: Custom filters, saved searches, and bookmark
        configurations

        - **Accessibility Options**: Display scaling, color themes, and
        accessibility accommodations

        - **Feature Toggles**: User-specific feature enablement and experimental
        feature access


        **Preference Categories:**

        - **Visualization**: Topology view preferences, chart types, and display
        options

        - **Workflow**: Default actions, confirmation settings, and automation
        preferences

        - **Notifications**: Alert preferences, delivery methods, and escalation
        settings

        - **Security**: Session management, authentication preferences, and
        privacy settings


        **Use Cases:**

        - Loading personalized user interface configurations on login

        - Synchronizing user preferences across multiple sessions or devices

        - Supporting user experience customization and accessibility
        requirements

        - Enabling preference backup and restoration workflows

        - Integration with single sign-on and identity management systems


        **Data Management:**

        - Preferences are stored per user and isolated between different user
