          type: array
          items:
            $ref: "#/components/schemas/LinkInspectorPanelPhysicalUpdateData"
        resource:
          $ref: "#/components/schemas/WebSocketServicesEvents"
    LinkInspectorPanelPhysicalUpdateData:
      type: object
      title: Physical Device data updated for inspector panel
      properties:
        linkID:
          type: string
          description: Link ID for which there is an update
          example: 5b3da8f6-1213-4776-2342-a388db060000
    GlobalMessage:
      type: object
      description: Sent via Kafka to System with Global (Non-Device related) websocket
        events.
      properties:
        GroupID:
          type: string
          description: An identifier for this group of devices
          example: VIQ1002-GROUP10-GLOBAL
        LocationAdd:
          $ref: "#/components/schemas/LocationAdd"
        LocationDelete:
          $ref: "#/components/schemas/LocationDelete"
        LocationUpdate:
          $ref: "#/components/schemas/LocationUpdate"
        LocationMove:
          $ref: "#/components/schemas/LocationMove"
    LocationAdd:
      type: object
      description: Sent using websocket to UI when there is location added.
      properties:
        LocationDataList:
          description: List of locations with their data that was added
          type: array
          items:
            $ref: "#/components/schemas/LocationAddData"
        resource:
          $ref: "#/components/schemas/WebSocketServicesEvents"
    LocationAddData:
      type: object
      description: Location data for UI to determine the location that has been added.
      properties:
        locationID:
          type: string
          description: Location UUID that was added
          example: 5b3da8f6-1213-4776-2342-a388db060000
    LocationDelete:
      type: object
      description: Sent using websocket to UI when there is location deleted.
      properties:
        LocationDataList:
          description: List of locations with their data that was deleted
          type: array
          items:
            $ref: "#/components/schemas/LocationDeleteData"
        resource:
          $ref: "#/components/schemas/WebSocketServicesEvents"
    LocationDeleteData:
      type: object
      description: Location data for UI to determine the location that has been deleted.
      properties:
        locationID:
          type: string
          description: Location UUID that was deleted
          example: 5b3da8f6-1213-4776-2342-a388db060000
    LocationUpdate:
      type: object
      description: Sent using websocket to UI when there is location data updated.
      properties:
        LocationDataList:
          description: List of locations with their data that was updated
          type: array
          items:
            $ref: "#/components/schemas/LocationUpdateData"
        resource:
          $ref: "#/components/schemas/WebSocketServicesEvents"
    LocationUpdateData:
      type: object
      description: Location data for UI to determine the location that has been updated.
      properties:
        locationID:
          type: string
          description: Location UUID that was deleted
          example: 5b3da8f6-1213-4776-2342-a388db060000
    LocationMove:
      type: object
      description: Sent using websocket to UI when there is a location that moved.
      properties:
        LocationDataList:
          description: List of locations with their data that was moved
          type: array
          items:
            $ref: "#/components/schemas/LocationMoveData"
        resource:
          $ref: "#/components/schemas/WebSocketServicesEvents"
    LocationMoveData:
      type: object
      description: Location data for UI to determine the location that has been moved.
      properties:
        locationID:
          type: string
          description: Location UUID that was deleted
          example: 5b3da8f6-1213-4776-2342-a388db060000
    TopologyDeviceData:
      type: object
      title: Device topology data for a particular device UUID to be used by the UI
      properties:
        physicalNode:
          $ref: "#/components/schemas/node"
        fabricNode:
          $ref: "#/components/schemas/node"
        ParentIDList:
          $ref: "#/components/schemas/UUIDList"
    TopologyLinkData:
      type: object
      title: Device topology data for a particular device UUID to be used by the UI
      properties:
        edge:
          $ref: "#/components/schemas/edge"
    LoggingInfo:
      type: object
      properties:
        service:
          type: string
          description: Service name
          example: system
        logDetails:
          type: array
          items:
            $ref: "#/components/schemas/LogDetails"
      required:
        - service
        - logDetails
    LogDetails:
      type: object
      properties:
        type:
          type: string
          description: Log type
          example: ServiceFile
        size:
          type: integer
          description: The maximum size in megabytes of the log file before it gets rotated
          example: 100
        maxBackups:
          type: integer
          description: The maximum number of old log files to retain
          example: 10
        level:
          type: string
          description: Log level details
          enum:
            - debug
            - info
            - warning
            - error
            - panic
            - fatal
          example: debug
        status:
          type: string
          description: Execution status
          example: Success
      required:
        - type
        - level
    DiscoveryStatusError:
      type: object
      properties:
        type:
          type: string
          description: The type of device discovery error. User prefixed error types are
            meant for UI consumption.
          enum:
            - UserMinimumFirmwareVersionError
            - UserDeviceConnectivityError
            - InternalNetworkCollectorError
            - InternalNetworkCorrelationError
            - InternalEdgeCollectorError
            - InternalEdgeCorrelationError
          example: UserMinimumFirmwareVersionError
        detail:
          type: string
          description: A free-formed error string providing more detail about the error code
          example: unsupported version 9.0.4-10. Minimum supported version is 9.1.0-1
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Enter your API Key as a Bearer Token
