tags:
  - name: Topology Management
    description: >
      Operations for retrieving and managing network topologies across different
      layers (physical, fabric, service).

      Includes functionality for topology visualization, custom positioning, and
      group hierarchy management.
  - name: User Preferences
    description: >
      User-specific preference storage and retrieval for personalized experience
      across the network management interface.
  - name: Custom logging
    description: >
      Dynamic logging configuration management for debugging and monitoring
      purposes across different services.
  - name: Device Management
    description: >
      Comprehensive device information access including physical details, fabric
      information, interfaces, neighbors,

      and link details. Supports device synchronization and discovery status
      monitoring.
  - name: Service Management
    description: >
      Management of network services including L2/L3 VSN, VLAN, and VRF services
      with detailed endpoint information

      and service topology data.
  - name: Service Probe Vlan
    description: >
      VLAN service probing utilities for network validation and troubleshooting.
      Supports starting, stopping,

      and monitoring probe operations with detailed status reporting.
  - name: Schemas
    description: >
      Schema information and metadata for API features, particularly useful for
      dynamic form generation

      and validation in client applications.
  - name: General
    description: >
      General utility operations including search suggestions and
      auto-completion features.
  - name: Hide Node or Link Management
    description: >
      Operations to hide network nodes or links from topology views for cleaner
      visualization and focus.
  - name: Unhide Node or Link Management
    description: >
      Operations to restore visibility of previously hidden network nodes or
      links in topology views.
  - name: Tag Management
    description: |
      Deprecated tag management operations.
paths:
  /retrieve-topology:
    post:
      tags:
        - Topology Management
      summary: Retrieve Network Topology
      description: >
        Retrieves comprehensive network topology data including nodes, edges,
        and custom positioning information.


        This endpoint supports multiple topology types (physical, fabric,
        service) and view types (map, abstract, list).

        The response includes hierarchical node structures with detailed device
        and group information, interconnection

        data through edges, and user-customized positioning for visualization
        purposes.


        **Use Cases:**

        - Initial topology loading for network visualization

        - Refreshing topology data after network changes

        - Filtering topology by specific criteria (search, node states, etc.)

        - Supporting different visualization views (map-based, abstract
        diagrams)


        **Performance Considerations:**

        - Large topologies may require pagination or filtering

        - Consider using specific topology types to reduce response size

        - Custom positions are cached and updated incrementally
      operationId: RetrieveTopology
      x-mcp-operation:
        category: topology-management
        ai-description: Primary endpoint for retrieving network topology data. Essential
          for network discovery and visualization tasks.
        use-cases:
          - Generate network topology diagrams
          - Analyze network connectivity patterns
          - Identify network bottlenecks and optimization opportunities
          - Support network troubleshooting workflows
        response-size: large
        caching-recommended: true
        automation-priority: high
      requestBody:
        description: >
          Criteria for topology retrieval including topology type, view
          preferences, search filters, 

          and visualization options. All fields are optional, with defaults
          providing a complete topology view.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopologyCriteria"
            examples:
              basic_physical_topology:
                summary: Basic physical topology request
                description: Retrieve complete physical topology with default settings
                value:
                  generalCriteria:
                    type: physical
                    viewType: abstract
                    verboseType: Verbose
              filtered_fabric_topology:
                summary: Filtered fabric topology with search
                description: Retrieve fabric topology filtered by device search criteria
                value:
                  generalCriteria:
                    type: fabric
                    viewType: map
                    searchCriteria:
                      type: device
                      field: name
                      key: switch
              service_topology_by_group:
                summary: Service topology for specific group
                description: Retrieve service topology focused on a specific building or group
                value:
                  generalCriteria:
                    type: service
                    nodeID: 5b3da8f6-bfc8-4776-ae72-a388db060000
                    action: expand
      responses:
        "200":
          description: >
            Successfully retrieved topology data. The response contains nodes
            representing network devices and groups,

            edges representing connections between nodes, and custom positioning
            data for visualization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/topology"
              examples:
                sample_topology_response:
                  summary: Sample topology with devices and links
                  description: Example response showing typical topology structure
                  value:
                    nodes:
                      - id: device-001
                        attributes:
                          text:
                            content: Core Switch 1
                        data:
                          type: Device
                          deviceAttribute:
                            name: core-sw-001
                            ipAddress: 192.168.1.10
                            deviceType: switch
                    edges:
                      - id: link-001
                        source: device-001
                        target: device-002
                        data:
                          type: physicalLink
                    customPositions:
                      device-001:
                        x: 100
                        y: 200
        "400":
          description: |
            Bad Request - Invalid criteria provided. This can occur when:
            - Invalid topology type specified
            - Conflicting view type and topology type combination
            - Invalid UUID format for nodeID
            - Malformed search criteria
            - Invalid JSON in request body
            - Missing required fields in criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                invalid_topology_type:
                  summary: Invalid topology type error
                  value:
                    code: 400
                    message: "Invalid topology type 'invalid'. Supported types: physical, fabric,
                      service, accessLayer, physicalAndFabric"
                    timestamp: 2023-10-01T12:00:00Z
                    path: /retrieve-topology
                malformed_request:
                  summary: Malformed request body
                  value:
                    code: 400
                    message: Invalid JSON format in request body
                    timestamp: 2023-10-01T12:00:00Z
                    path: /retrieve-topology
                    details:
                      field: generalCriteria
                      issue: Expected object, received string
                invalid_uuid:
                  summary: Invalid UUID format
                  value:
                    code: 400
                    message: "Invalid UUID format for nodeID. Expected format:
                      xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                    timestamp: 2023-10-01T12:00:00Z
                    path: /retrieve-topology
                    details:
                      field: nodeID
                      provided: invalid-uuid-123
        "500":
          description: |
            Internal Server Error - Unexpected error during topology retrieval.
            This occurs when:
            - Database connectivity issues
            - Internal service failures
            - Topology calculation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                internal_error:
                  summary: Internal server error
                  value:
                    code: 500
                    message: Internal server error occurred while retrieving topology data
                    timestamp: 2023-10-01T12:00:00Z
                    path: /retrieve-topology
                    correlationId: req-12345-67890
  /retrieve-topology/device:
    post:
      tags:
        - Topology Management
      summary: Retrieve Device Topology Data
      description: >
        Retrieves comprehensive device information within the topology context,
        providing detailed 

        device attributes, operational status, and relationships to other
        network elements.


        This endpoint focuses on device-specific data within the topology
        framework, including:

        - **Device Attributes**: Hardware specifications, software versions, and
        capabilities

        - **Operational Status**: Current device state, health metrics, and
        performance indicators

        - **Network Relationships**: Device roles, connections, and dependencies
        within the topology

        - **Management Information**: Device discovery details, monitoring
        status, and configuration state


        **Use Cases:**

        - Device inventory and asset management

        - Device health monitoring and status reporting

        - Topology-aware device troubleshooting

        - Integration with device management workflows

        - Network documentation and compliance reporting


        **Performance Considerations:**

        - Response size varies based on the number of devices and detail level
        requested

        - Consider filtering criteria to optimize response time and size

        - Device data is refreshed based on discovery intervals and real-time
        polling
      operationId: RetrieveTopologyDevices
      x-mcp-operation:
        category: topology-management
        ai-description: Retrieve specific device information within topology context for
          detailed device analysis.
        use-cases:
          - Get detailed device information for topology nodes
          - Analyze device roles and relationships in network topology
          - Support device-specific network troubleshooting
        data-sensitivity: operational
        automation-priority: medium
      requestBody:
        description: Request body for topology device data.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopologyDeviceCriteria"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/topologyDevice"
  /retrieve-topology/link:
    post:
      tags:
        - Topology Management
      summary: Retrieve Link Topology Data
      description: >
        Retrieves comprehensive link information within the topology context,
        providing detailed

        connectivity data, relationship mappings, and interconnection analytics
        between network elements.


        This endpoint specializes in link-specific topology data, including:

        - **Physical Connections**: Direct physical links between devices and
        ports

        - **Logical Associations**: VLAN trunks, LAG configurations, and virtual
        connections

        - **Link Properties**: Bandwidth, utilization, duplex settings, and
        operational parameters

        - **Relationship Context**: How links fit within the broader network
        topology structure

        - **Status Information**: Link state, health metrics, and performance
        indicators


        **Use Cases:**

        - Network connectivity analysis and path discovery

        - Link capacity planning and bandwidth management

        - Topology-aware network troubleshooting and fault isolation

        - Network documentation and relationship mapping

        - Integration with network monitoring and alerting systems


        **Performance Considerations:**

        - Response includes detailed link metadata which may result in larger
        payloads

        - Filter criteria can significantly reduce response time for large
        topologies

        - Link status information reflects real-time or near real-time device
        polling data
      operationId: RetrieveTopologyLinks
      x-mcp-operation:
        category: topology-management
        ai-description: Retrieve specific link information within topology context for
          network connectivity analysis.
        use-cases:
          - Analyze network connectivity and link relationships
          - Identify critical network paths and redundancy
          - Support link-specific network troubleshooting
          - Generate network connectivity reports
        data-sensitivity: operational
        automation-priority: medium
      requestBody:
        description: Request body for topology link data.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopologyLinkCriteria"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/topologyLink"
  /hide:
    post:
      tags:
        - Hide Node or Link Management
      summary: Hide Node or Link
      description: >
        Selectively hides specific nodes or links from topology visualizations
        to improve diagram clarity,

        reduce visual complexity, and create focused network views for specific
        analysis or presentation purposes.


        This operation provides granular control over topology visibility,
        supporting:

        - **Selective Hiding**: Hide individual nodes, links, or groups of
        network elements

        - **View Customization**: Create simplified views for different
        audiences or use cases

        - **Focus Management**: Reduce visual noise to highlight critical
        network paths or components

        - **Presentation Support**: Generate clean topology diagrams for
        documentation or presentations

        - **Troubleshooting Aid**: Hide non-relevant elements to focus on
        problem areas


        **Hide Operation Details:**

        - Hidden elements are removed from visual representation but remain in
        the data model

        - Hide state is maintained per user session or can be made persistent

        - Multiple elements can be hidden in a single operation

        - Hidden elements can be restored using the unhide operation


        **Use Cases:**

        - Creating simplified network diagrams for executive presentations

        - Focusing troubleshooting efforts on specific network segments

        - Generating role-specific topology views (access layer, core, etc.)

        - Reducing complexity for training and documentation purposes

        - Supporting network change management workflows


        **Operational Considerations:**

        - Hide operations are reversible and non-destructive

        - Hidden elements maintain their relationships and can affect path
        calculations

        - Consider impact on topology analytics when hiding critical network
        elements
      operationId: Hide
      x-mcp-operation:
        category: topology-visualization
        ai-description: Hide specific nodes or links from topology views to improve
          visualization clarity and focus.
        use-cases:
          - Simplify topology views by hiding non-essential elements
          - Create focused network diagrams for presentations
          - Reduce visual complexity for troubleshooting
          - Support custom topology visualization workflows
        data-sensitivity: configuration
        automation-priority: low
      requestBody:
        description: Request body for hide a node or link
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HideUnhideParamInfo"
      responses:
        "200":
          description: Hide of node or links are successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HideUnhideResponse"
        "400":
          description: Bad Request - The request was invalid or cannot be otherwise served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HideUnhideResponse"
        "404":
          description: Not Found - The specified resource could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HideUnhideResponse"
        "500":
          description: Internal Server Error - An error occurred on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HideUnhideResponse"
  /unhide:
    post:
      tags:
        - Unhide Node or Link Management
      summary: Unhide Node or Link
      description: >
        Restores visibility of previously hidden nodes or links in topology
        visualizations,

        returning network elements to their normal display state and re-enabling
        their 

        participation in visual analysis and interactive operations.


        This operation provides comprehensive visibility restoration
        capabilities:

        - **Selective Restoration**: Unhide specific nodes, links, or element
        groups

        - **Bulk Operations**: Restore multiple hidden elements in a single
        request

        - **State Management**: Manage visibility state across different
        topology views

        - **Recovery Support**: Restore accidentally hidden critical network
        elements

        - **View Completion**: Return to full topology visibility for
        comprehensive analysis


        **Unhide Operation Details:**

        - Restored elements immediately become visible in topology
        visualizations

        - All relationships and connections are re-established in the visual
        representation

        - Previously hidden elements retain their original positioning and
        properties

        - Unhide operations can be applied to elements hidden in current or
        previous sessions


        **Use Cases:**

        - Recovering from accidental hide operations

        - Transitioning from focused to comprehensive network views

        - Restoring full topology visibility after targeted analysis

        - Supporting dynamic visualization workflows

        - Enabling collaborative topology analysis with shared visibility states


        **Operational Considerations:**

        - Unhide operations are immediate and affect real-time topology displays

        - Consider performance impact when unhiding large numbers of elements

        - Restored elements may affect layout algorithms and positioning
      operationId: Unhide
      x-mcp-operation:
        category: topology-visualization
        ai-description: Restore visibility of previously hidden nodes or links in
          topology views.
        use-cases:
          - Restore hidden network elements to topology views
          - Undo previous hide operations for complete network visibility
          - Support dynamic topology visualization management
          - Enable comprehensive network analysis workflows
        data-sensitivity: configuration
        automation-priority: low
      requestBody:
        description: Request body to hide a node or link
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HideUnhideParamInfo"
      responses:
        "200":
          description: Hide of node or links are successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HideUnhideResponse"
        "400":
          description: Bad Request - The request was invalid or cannot be otherwise served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HideUnhideResponse"
        "404":
          description: Not Found - The specified resource could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HideUnhideResponse"
        "500":
          description: Internal Server Error - An error occurred on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HideUnhideResponse"
  /group:
    get:
      tags:
        - Topology Management
      summary: Get Group Hierarchy
      description: >
        Retrieves the complete organizational group hierarchy structure that
        defines how network

        devices and elements are logically organized within the management
        framework.


        This endpoint provides comprehensive group structure information
        including:

        - **Hierarchical Organization**: Multi-level group structures with
        parent-child relationships

        - **Group Membership**: Device assignments and group population details

        - **Organizational Context**: Business logic groupings such as
        locations, departments, or functions

        - **Management Scope**: Access control and administrative boundary
        definitions

        - **Metadata Information**: Group descriptions, properties, and custom
        attributes


        **Group Hierarchy Features:**

        - **Nested Structures**: Support for complex multi-level organizational
        hierarchies

        - **Dynamic Membership**: Groups can contain devices, sub-groups, or
        mixed memberships

        - **Role-Based Organization**: Groups aligned with network roles,
        locations, or business units

        - **Inheritance Properties**: Configuration and policy inheritance
        through hierarchy levels


        **Use Cases:**

        - Generating organizational network diagrams and documentation

        - Supporting role-based access control and administrative workflows

        - Enabling hierarchical network management and policy deployment

        - Facilitating network segmentation and logical organization

        - Integration with identity management and organizational directory
        systems


        **Performance Considerations:**

        - Response size scales with organizational complexity and group depth

        - Hierarchy data is typically cached and updated based on organizational
        changes

        - Consider the depth of hierarchy when processing for visualization or
        analysis
      operationId: GetGroupHierarchy
      x-mcp-operation:
        category: topology-management
        ai-description: Retrieve hierarchical group structure for organizational
          topology views and network segmentation.
        use-cases:
          - Understand network organizational structure
          - Generate hierarchical network diagrams
          - Support network segmentation analysis
          - Enable group-based network management workflows
        data-sensitivity: structural
        automation-priority: medium
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/group"
