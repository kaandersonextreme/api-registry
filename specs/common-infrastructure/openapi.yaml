          description: List of unavailable VLANs for the device
          example: 2011-2015
    vlanProbeNotification:
      type: array
      items:
        type: object
        properties:
          vlanId:
            type: integer
            description: The VLAN ID for which the notification is generated
            example: 100
          ipOrigin:
            type: string
