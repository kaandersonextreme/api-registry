        corruption

        - **Resource Cleanup**: Release network resources and probe-related
        system allocations

        - **Result Preservation**: Maintain partial probe results for analysis
        and reporting

        - **State Management**: Update probe operation status and completion
        tracking

        - **Audit Trail**: Log termination actions for compliance and
        troubleshooting


        **Termination Scenarios:**

        - **Manual Termination**: User-initiated stop for probe operations that
        are no longer needed

        - **Timeout Prevention**: Stop long-running probes before system timeout
        limits

        - **Resource Management**: Terminate probes to free resources for other
        operations

        - **Error Recovery**: Stop malfunctioning or stuck probe operations

        - **Maintenance Preparation**: Clear active probes before system
        maintenance


        **Operation Characteristics:**

        - **Immediate Response**: Stop commands are processed immediately with
        confirmation

        - **Safe Termination**: Probe operations are stopped safely without
        affecting network stability

        - **Result Availability**: Partial results remain accessible after
        termination

        - **Resource Recovery**: Network interfaces and system resources are
        properly released

        - **Status Updates**: Probe status is updated to reflect termination
        state


        **Use Cases:**

        - Stopping probe operations that have completed their intended
        validation

        - Terminating long-running probes that exceed expected completion times

        - Freeing network resources when probe operations are no longer required

        - Recovering from probe operations that appear to be stuck or
        malfunctioning

        - Preparing for network maintenance by clearing active validation
        operations

        - Supporting probe lifecycle management and operational workflows

        - Implementing probe timeout and resource management policies

        - Enabling responsive probe operation control for network administrators


        **Post-Termination Actions:**

        - **Result Retrieval**: Use the probe-data endpoint to retrieve partial
        results

        - **Resource Verification**: Confirm that network resources have been
        properly released

        - **Status Monitoring**: Verify that probe status reflects the
        terminated state

        - **Cleanup Validation**: Ensure that no residual probe processes remain
        active


        **Operational Safeguards:**

        - **Confirmation Required**: Termination requires explicit confirmation
        to prevent accidental stops

        - **Impact Assessment**: System validates that termination will not
        affect other operations

        - **Recovery Support**: Terminated probes can be restarted if needed

        - **Audit Logging**: All termination actions are logged for operational
        tracking
