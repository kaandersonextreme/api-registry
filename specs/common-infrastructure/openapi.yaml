  /utilities/service-probe-vlan/start:
    post:
      tags:
        - Service Probe Vlan
      summary: Start VLAN Service Probe Operation
      description: >
        Initiates a comprehensive VLAN service probe operation to validate VLAN
        availability and configuration

        across the network infrastructure. This utility performs automated
        testing to determine which VLANs

        are properly configured, accessible, and functional on the specified
        device.


        **Probe Operation Details:**

        - **VLAN Discovery**: Automatically detects configured VLANs within the
        specified range

        - **Connectivity Testing**: Validates VLAN reachability and proper
        forwarding

        - **Configuration Validation**: Checks VLAN settings, tagging, and port
        assignments

        - **IP Address Assignment**: Tests dynamic IP assignment capabilities
        (DHCP)

        - **Gateway Verification**: Validates default gateway accessibility per
        VLAN


        **Use Cases:**

        - **Network Commissioning**: Validate VLAN configuration during initial
        setup

        - **Troubleshooting**: Identify VLAN connectivity issues and
        misconfigurations

        - **Compliance Verification**: Ensure VLAN setup meets network policies

        - **Change Management**: Verify VLAN functionality after configuration
        changes

        - **Documentation**: Generate current VLAN availability reports


        **Operational Considerations:**

        - Probe operations are non-disruptive to production traffic

        - Maximum of 500 VLANs can be probed in a single operation

        - Concurrent probe operations on the same device are not allowed

        - Results are cached and available for retrieval during and after
        completion


        **Progress Tracking:**

        Use the returned `taskKey` to monitor progress via the
        `/utilities/service-probe-vlan/probe-data` endpoint.
      operationId: StartServiceProbeVLAN
      x-mcp-operation:
        category: network-validation
        ai-description: Initiate automated VLAN service probing for network validation
          and troubleshooting.
        use-cases:
          - Validate VLAN configurations after network changes
          - Automated network commissioning and testing
          - Proactive network health monitoring
          - Generate network compliance reports
        operation-type: async
        monitoring-required: true
        automation-priority: high
      requestBody:
        description: >
          Configuration parameters for the VLAN probe operation. Specify the
          VLAN range to test,

          device target, and operational parameters like timeouts and retry
          behavior.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceProbeVLANStartRequest"
            examples:
              basic_vlan_probe:
                summary: Basic VLAN range probe
                description: Probe VLANs 100-110 on a specific device with default settings
                value:
                  vlanRanges: 100-110
                  deviceId: 5b3da8f6-bfc8-4776-ae72-e388db060000
                  retries: 3
                  timeoutInSeconds: 30
              comprehensive_probe:
                summary: Comprehensive VLAN probe with custom settings
                description: Extended probe operation with custom timeout and retry settings
                value:
                  vlanRanges: 10-50,100-200,300-350
                  deviceId: a1b2c3d4-5e6f-7g8h-9i0j-k1l2m3n4o5p6
                  retries: 5
                  timeoutInSeconds: 60
              single_vlan_test:
                summary: Single VLAN validation
                description: Test a specific VLAN for detailed analysis
                value:
                  vlanRanges: "100"
                  deviceId: 5b3da8f6-bfc8-4776-ae72-e388db060000
                  retries: 2
                  timeoutInSeconds: 45
      responses:
        "202":
          description: >
            Service probe operation has been successfully initiated and is
            running asynchronously.

            The operation will continue in the background, and progress can be
            monitored using the

            returned task key.


            **Next Steps:**

            1. Use the `taskKey` to monitor progress via GET
            `/utilities/service-probe-vlan/probe-data`

            2. Check the `startTimeStamp` to track operation duration

            3. The probe will automatically complete or can be stopped manually
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProbeVLANStartResponse"
              examples:
                successful_start:
                  summary: Successful probe initiation
                  description: Example response when probe starts successfully
                  value:
                    succeeded: true
                    taskKey: probe-task-001-20231001-120000
                    startTimeStamp: 2023-10-01T12:00:00Z
        "400":
          description: >
            Bad Request - Invalid probe configuration provided:


            **Common Issues:**

            - **Invalid VLAN Range**: Range format is incorrect or exceeds 500
            VLANs

            - **Invalid Device ID**: Device UUID format is malformed

            - **Parameter Validation**: Timeout or retry values are outside
            acceptable ranges

            - **Range Conflicts**: VLAN ranges contain invalid or conflicting
            values


            **VLAN Range Format Examples:**

            - Single VLAN: `"100"`

            - Range: `"100-110"`

            - Multiple ranges: `"10-20,100-110,200-210"`

            - Mixed: `"50,100-110,200"`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                invalid_vlan_range:
                  summary: Invalid VLAN range format
                  value:
                    code: 400
                    message: "Invalid VLAN range format. Expected format: '100-110' or '100,101,102'
                      or '100-110,200-210'. Range cannot exceed 500 VLANs."
                invalid_device_id:
                  summary: Invalid device ID
                  value:
                    code: 400
                    message: "Invalid device ID format. Expected UUID format:
                      xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                parameter_out_of_range:
                  summary: Parameter validation error
                  value:
                    code: 400
                    message: "Timeout value must be between 1 and 300 seconds. Provided value: 500"
        "500":
          description: |
            Internal Server Error - Unexpected error during probe initiation:
            - System resource limitations
            - Database connectivity issues
            - Internal service failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /utilities/service-probe-vlan/stop:
