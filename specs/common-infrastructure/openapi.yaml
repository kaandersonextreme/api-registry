          - Support probe lifecycle management workflows
        data-sensitivity: operational
        automation-priority: medium
      requestBody:
        description: Request body to stop service probe for VLAN
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceProbeVLANStopRequest"
      responses:
        "200":
          description: Service probe stopped successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProbeVLANStopResponse"
  /utilities/service-probe-vlan/probe-data:
    get:
      tags:
        - Service Probe Vlan
      summary: Get Service Probe VLAN Data
      description: >
        Retrieves comprehensive VLAN service probe results and operational data,
        providing

        detailed insights into probe progress, validation outcomes, and network
        connectivity

        analysis essential for network troubleshooting and validation workflows.


        This endpoint provides extensive probe data including:

        - **Probe Results**: Detailed validation outcomes for each tested VLAN

        - **Progress Information**: Real-time status updates and completion
        progress

        - **Connectivity Analysis**: VLAN reachability, configuration
        validation, and performance metrics

        - **Error Diagnostics**: Detailed error information for failed VLAN
        validations

        - **Performance Metrics**: Response times, success rates, and network
        quality indicators


        **Data Retrieval Options:**

        - **Task-Based Retrieval**: Get results for a specific probe operation
        using task key

        - **Device-Based Retrieval**: Get all probe results associated with a
        specific device

        - **Real-Time Updates**: Monitor ongoing probe operations with live
        status information

        - **Historical Data**: Access completed probe results for analysis and
        reporting

        - **Filtered Results**: Retrieve specific subsets of probe data based on
        criteria


        **Probe Result Categories:**

        - **Successful Validations**: VLANs that passed all connectivity and
        configuration tests

        - **Failed Validations**: VLANs with connectivity issues, configuration
        problems, or access failures

        - **Partial Results**: VLANs with mixed validation outcomes or
        incomplete testing

        - **Pending Tests**: VLANs currently being tested or queued for
        validation

        - **Skipped Tests**: VLANs excluded from testing due to configuration or
        policy constraints


        **Detailed Analysis Data:**

        - **VLAN Configuration**: Detected VLAN settings, tagging, and port
        assignments

        - **Connectivity Metrics**: Response times, packet loss, and
        reachability statistics

        - **DHCP Analysis**: IP address assignment testing and DHCP server
        responsiveness

        - **Gateway Validation**: Default gateway accessibility and routing
        verification

        - **Quality Metrics**: Network performance indicators and service
        quality assessments


        **Use Cases:**

        - Monitoring active probe operations and tracking validation progress

        - Analyzing probe results to identify VLAN connectivity and
        configuration issues

        - Generating network validation reports and compliance documentation

        - Supporting network troubleshooting workflows with detailed diagnostic
        data

        - Integration with network monitoring and alerting systems

        - Facilitating network commissioning and acceptance testing procedures

        - Providing evidence for network service level agreement compliance

        - Enabling automated network validation and quality assurance processes


        **Data Format and Structure:**

        - **Structured Results**: Organized data format optimized for analysis
        and reporting

        - **Timestamp Information**: Detailed timing data for probe operations
        and individual tests

        - **Error Classification**: Categorized error information with
        diagnostic details

        - **Performance Baselines**: Comparative data for performance trend
        analysis

        - **Export Capabilities**: Data formatted for integration with external
        systems and tools


        **Real-Time Monitoring:**

        - **Live Updates**: Real-time progress information for ongoing probe
        operations

        - **Status Indicators**: Current probe state, completion percentage, and
        estimated time remaining

        - **Incremental Results**: Progressive result availability as individual
        VLAN tests complete

        - **Error Notifications**: Immediate visibility into probe errors and
        validation failures


        **Historical Analysis:**

        - **Trend Analysis**: Compare current probe results with historical
        validation data

        - **Performance Tracking**: Monitor VLAN performance changes over time

        - **Issue Correlation**: Identify recurring validation problems and
        network patterns

        - **Baseline Establishment**: Create performance and connectivity
        baselines for future comparisons
      operationId: GetServiceProbeVLANData
      x-mcp-operation:
        category: network-validation
        ai-description: Retrieve VLAN service probe results and progress data for
          network validation analysis.
        use-cases:
          - Monitor probe operation progress and completion status
          - Retrieve detailed probe results for network validation
          - Analyze VLAN availability and configuration validation
          - Support network troubleshooting and validation workflows
        data-sensitivity: operational
        real-time: true
        automation-priority: high
      parameters:
        - name: taskKey
          in: query
          description: The ID of the task to retrieve the service probe data
          required: false
          schema:
            type: string
            example: 5b3da8f6-bfc8-4776-ae72-e388db060000
        - name: deviceId
          in: query
          description: The ID of the device to retrieve the service probe data
          required: false
          schema:
            type: string
            example: 5b3da8f6-bfc8-4776-ae72-e388db060001
      responses:
        "200":
          description: Successfully retrieved service probe VLAN data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProbeDataResponse"
        "400":
          description: |
            Bad Request - Invalid parameters provided:
            - Neither taskKey nor deviceId provided
            - Both taskKey and deviceId provided (only one allowed)
            - Invalid UUID format for parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
          description: |
            Internal Server Error - Failed to retrieve probe data:
            - Database query error
            - Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
