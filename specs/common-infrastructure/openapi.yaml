  x-mcp-server:
    enabled: true
    description: Extreme Networks Common Infrastructure API optimized for MCP server
      integration
    capabilities:
      - network-topology-management
      - device-information-retrieval
      - service-management
      - network-monitoring
      - vlan-service-probing
    usage-patterns:
      - pattern: topology-discovery
        description: Retrieve and analyze network topology for AI-driven network insights
        endpoints:
          - /retrieve-topology
          - /retrieve-topology/device
          - /retrieve-topology/link
      - pattern: device-monitoring
        description: Monitor device health, interfaces, and performance metrics
        endpoints:
          - /device/physical
          - /device/fabric
          - /device/ports
          - /device/lldp-cdp-neighbors
      - pattern: service-analysis
        description: Analyze network services and their configurations
        endpoints:
          - /retrieve-services
          - /services/retrieve-vlans
          - /services/retrieve-vrfs
      - pattern: network-validation
        description: Perform network validation and troubleshooting operations
        endpoints:
          - /utilities/service-probe-vlan/start
          - /utilities/service-probe-vlan/probe-data
    automation-friendly: true
    rate-limiting:
      recommended-requests-per-minute: 60
      burst-limit: 10
