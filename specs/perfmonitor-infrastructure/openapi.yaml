      x-mcp-operation-type: wireless-health-analytics
      x-mcp-automation-friendly: true
      x-mcp-predictive-analytics: true
      x-mcp-location-aware: true
      x-mcp-health-scoring: true
      x-mcp-use-cases:
        - wireless-monitoring
        - ap-health-dashboards
        - predictive-maintenance
        - capacity-planning
        - automated-alerting
      summary: Wireless Device Health Analytics for MCP Servers
      description: >
        **Wireless Device Health Analytics for MCP Servers**


        Provides comprehensive health analytics exclusively for wireless network
        devices (Access Points).

        This endpoint automatically filters for wireless devices only, returning
        health metrics

        including CPU, Memory and PoE data for all APs.


        **Key Differences from /analytics/device-health:**

        - **Wireless-Only**: Automatically filters for AP/wireless devices — no
        need to specify deviceType

        - **All Metrics Included**: Returns all available health metrics (cpu,
        memory, poe) by default

        - **Simplified Request**: Fewer required parameters for wireless-focused
        monitoring


        **MCP Server Features:**

        - **Intelligent Health Scoring**: AI-driven health assessment with
        composite health scores for APs

        - **Location-Aware Monitoring**: Hierarchical location filtering for
        geographic AP monitoring

        - **Automated Health Assessment**: Continuous health evaluation with
        threshold-based alerting

        - **Integration-Optimized**: Health data formatted for ITSM and
        automation platform integration


        **Wireless-Specific Health Metrics:**

        - **CPU Analytics**: AP processor utilization trends and performance
        degradation detection

        - **Memory Intelligence**: AP RAM usage patterns and capacity
        forecasting

        - **Power Analytics**: PoE consumption tracking
      parameters:
        - name: download
          in: query
          required: false
          description: |
            When set to `csv`, the response is returned as a CSV file download
            instead of JSON. The CSV contains flattened device health data with
            one row per device. When this parameter is set, `responseType` is
            automatically forced to `grid` and pagination is bypassed so all
            matching devices are included in the export.
          schema:
            type: string
            enum:
              - csv
      requestBody:
        required: true
        description: >
          Request parameters for wireless device health data retrieval.

          All location filters are optional — without filters, returns data for
          all accessible wireless devices.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WirelessDeviceHealthDataRequest"
