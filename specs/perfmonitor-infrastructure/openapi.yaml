              basic_wireless_health:
                summary: Basic wireless health request
                value:
                  pageNumber: 1
                  pageSize: 50
              location_filtered_wireless:
                summary: Request filtered by location
                value:
                  siteIDs: 1,3
                  pageNumber: 1
                  pageSize: 100
              unhealthy_wireless_devices:
                summary: Get only unhealthy wireless devices
                value:
                  health: unhealthy
                  responseType: grid
                  pageNumber: 1
                  pageSize: 50
      responses:
        "200":
          description: >
            Successfully retrieved wireless device health data.


            **Response Structure:**

            - `applicationName`: Always "network" for network device health

            - `metricGroup`: Always "wireless device health" for this endpoint

            - `ownerID`: Identifier for the data owner/tenant

            - `summaryInfo`: High-level health statistics for wireless devices

            - `healthInfo`: Detailed wireless device health information with
            pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WirelessDeviceHealthDataResponses"
              examples:
                wireless_health_response:
                  summary: Sample wireless device health response
                  value:
                    applicationName: network
                    metricGroup: wireless device health
                    ownerID: 102
                    healthInfo:
                      items:
                        - metricsInfo:
                            deviceID: "8293582110001"
                            deviceSerialNumber: AP-5010-001
                            hostName: AP-5010-Floor1
                            macAddress: 0004969B0001
                            ipAddress: 10.65.70.100
                            function: Access Point
                            managedBy: Cloud
                            stackType: false
                            siteName: USA-RDU
                            siteID: "8293581949564"
                            buildingName: Office
                            floorName: Floor1
                            deviceHealthData:
                              timeStamp: 2026-03-11T00:35:23Z
                              healthStatus: healthy
                              healthValue: "95"
                              cpuHealthInfo:
                                cpuUsagePercentage: 12
                                cpuHealthStatus: green
                              memoryHealthInfo:
                                memoryUsagePercentage: 45
                                memoryHealthStatus: green
                              poeHealthInfo: {}
                              channelChangeCount: 0
                              wifiRebootCount: 0
                              eth0Score:
                                unicastScore: 55
                                multicastScore: 60
                                broadcastScore: 65
                              eth1Score:
                                unicastScore: 50
                                multicastScore: 55
                                broadcastScore: 60
                      paginationInfo:
                        current_page: 1
                        items_count: 1
                        total_pages: 1
                        total_items_count: 1
            text/csv:
              schema:
                type: string
                format: binary
                description: CSV file with flattened wireless device health data (returned when
                  download=csv).
        "400":
          description: |
            Bad Request - Invalid request parameters.

            **Common Causes:**
            - Invalid site, building, or floor IDs
            - Invalid page number or page size
            - Page size exceeds maximum allowed limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "404":
          description: |
            No wireless device health data found for the specified criteria.

            **Common Causes:**
            - No wireless devices found in specified locations
            - Invalid location IDs provided
            - No health data available for accessible wireless devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "409":
          description: |
            Conflict in request parameters.

            **Common Causes:**
