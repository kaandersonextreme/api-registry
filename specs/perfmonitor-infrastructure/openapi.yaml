          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /analytics/client-health/stats:
    post:
      tags:
        - Client health data
      operationId: RetrieveClientHealthStatsData
      x-mcp-operation-type: health-stats-analytics
      x-mcp-automation-friendly: true
      x-mcp-time-series: true
      x-mcp-use-cases:
        - health-trending
        - capacity-planning
        - proactive-monitoring
        - historical-analytics
      summary: Client Health Stats Time-Series Data for MCP Servers
      description: >
        **Client Health Stats Time-Series Analytics for MCP Servers**


        Retrieves aggregated healthy and unhealthy client counts per device over
        time from the

        `client_health_stats` hypertable. This endpoint supports both real-time
        latest-value queries

        and historical time-range queries with automatic aggregation tier
        selection.


        **Query Modes:**

        - **Latest Value** (`latestValue: true`): Returns the most recent data
        point from the base
          hypertable for each requested device. Ideal for real-time dashboards and current status monitoring.
        - **Time Range** (`startTime` + `endTime`): Returns time-series data
        points within the specified
          range. The system automatically selects the optimal aggregation tier based on the time span:
          - **≤15 days**: Raw base table (1-minute granularity)
          - **≤30 days**: 5-minute aggregation (`client_health_stats_agg1`)
          - **≤90 days**: 10-minute aggregation (`client_health_stats_agg2`)
          - **≤13 months**: 1-hour aggregation (`client_health_stats_agg3`)
          - **≤24 months**: 1-day aggregation (`client_health_stats_agg4`)

        **Use Cases for MCP Servers:**

        - **Health Trending**: Track healthy vs unhealthy client ratios over
        time for capacity planning

        - **Anomaly Detection**: Identify sudden changes in client health for
        automated alerting

        - **Historical Analysis**: Review client health patterns for root cause
        analysis

        - **Dashboard Widgets**: Power real-time and historical health
        visualizations


        **Data Source:**

        Data is populated by the wired client event handler
        (`SaveClientHealthStats`) which evaluates

        port congestion, broadcast thresholds, total errors, and IP connectivity
        for each client event.
      requestBody:
        required: true
        description: >
          Request parameters for client health stats retrieval.

          Either `latestValue: true` or a time range (`startTime` + `endTime`)
          must be provided.

          At least one `deviceID` must be specified.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientHealthStatsRequest"
            examples:
              latest_value_request:
                summary: Get latest client health stats for a device
                value:
                  deviceID: "1234567654321000001"
                  latestValue: true
                  pageNumber: 1
                  pageSize: 100
              time_range_request:
                summary: Get client health stats for a time range
                value:
                  deviceID: "1234567654321000001"
                  startTime: 2026-03-03T23:21:50Z
                  endTime: 2026-03-05T23:21:50Z
                  latestValue: false
                  pageNumber: 1
                  pageSize: 100
      responses:
        "200":
          description: >
            Successfully retrieved client health stats data.


            **Response Structure:**

            - `metricGroup`: Always "client health stats" for this endpoint

            - `ownerID`: Identifier for the data owner/tenant

            - `items`: Array of time-series data points per device containing:
              - `ts`: Timestamp of the data point in ISO 8601 UTC format
              - `deviceID`: Device identifier
              - `healthyClients`: Count of healthy clients at this timestamp
              - `unhealthyClients`: Count of unhealthy clients at this timestamp
            - `paginationInfo`: Pagination metadata for navigating large result
            sets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientHealthStatsResponses"
              examples:
                successful_response:
                  summary: Sample client health stats response
                  value:
                    metricGroup: client health stats
                    ownerID: 102
                    items:
                      - ts: 2026-03-04T10:00:00Z
                        deviceID: "1234567654321000001"
                        healthyClients: 42
                        unhealthyClients: 3
                      - ts: 2026-03-04T10:05:00Z
                        deviceID: "1234567654321000001"
                        healthyClients: 40
                        unhealthyClients: 5
                    paginationInfo:
                      current_page: 1
                      items_count: 2
                      total_pages: 1
                      total_items_count: 2
        "400":
          description: >
            Bad Request - Invalid request parameters.


            **Common Causes:**

            - Missing required `deviceID`

            - Neither `latestValue` nor time range (`startTime` + `endTime`)
            specified

            - `startTime` is after `endTime`

            - Invalid `applicationName`

            - Page size exceeds maximum allowed limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                missing_device_id:
                  summary: Missing device ID
                  value:
                    code: 1701
                    message: deviceID is required
                missing_time_params:
                  summary: Missing time parameters
                  value:
                    code: 1701
                    message: Either latestValue must be true or both startTime and endTime must be
                      provided
        "404":
          description: |
            No client health stats data found for the specified criteria.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                no_data_found:
                  summary: No data found
                  value:
                    code: 1307
                    message: No client health stats data found for the specified devices and time
                      range
        "500":
          description: |
            Internal server error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
