        **Intelligent Client Health Analytics for MCP Servers**


        Provides comprehensive health analytics for wireless network devices
        with advanced health scoring,

        predictive analytics, and intelligent status assessment. This endpoint
        is specifically designed

        for MCP (Model Context Protocol) servers implementing proactive network
        management, predictive

        maintenance, and automated health monitoring systems.


        **Enhanced Health Metrics:**

        - **IP Address Issues**: Identifies clients with self-assigned,
        unassigned, or valid IP addresses to assess connectivity status.

        - **Roaming Issues**: Identifies clients experiencing frequent or failed
        roaming events between access points, which can impact connectivity and
        performance.

        - **Authentication Issues**: Detects clients with authentication
        failures or issues that may prevent them from connecting to the network.

        - **Association Issues**: Identifies clients with association problems,
        such as frequent disconnections or failures to associate with access
        points.

        - **Frequency Distribution**: Provides insights into client distribution
        across different frequency bands (2.4 GHz vs 5 GHz) to optimize network
        performance and capacity planning.


        **Intelligent Location Hierarchy:**

        Advanced location-based filtering with geographic intelligence:

        1. **Site-Level Analytics**: Comprehensive site health overview with
        comparative analysis

        2. **Building-Level Intelligence**: Building-specific health trends and
        environmental correlation

        3. **Floor-Level Precision**: Granular floor-level monitoring with
        spatial health mapping

        4. **Zone-Based Analysis**: Custom zone definitions for targeted health
        monitoring strategies
