            $ref: "#/components/schemas/HealthInfoItem"
        paginationInfo:
          $ref: "#/components/schemas/PaginationResponse"
    HealthInfoItem:
      type: object
      properties:
        metricsInfo:
          $ref: "#/components/schemas/MetricsInfo"
    SummaryInfo:
      type: object
      required:
        - Total Devices
        - Total Unhealthy Devices
        - Wired Unhealthy Devices
        - Wireless Unhealthy Devices
        - Warning Devices
        - Devices with CPU Issues
        - CPU Issues
        - Devices with Memory Issues
        - Memory Issues
        - Devices with Temperature Issues
        - Temperature Issues
        - Devices with Fan Issues
        - Fan Issues
        - Devices with PSU Issues
        - PSU Issues
        - Devices with PoE Issues
        - PoE Issues
        - Devices Not Reporting Stats
      properties:
        Total Devices:
          type: integer
          example: 45
        Total Unhealthy Devices:
          type: integer
          example: 42
        Wired Unhealthy Devices:
          type: integer
          example: 30
        Wireless Unhealthy Devices:
          type: integer
          example: 12
        Warning Devices:
          type: integer
          example: 3
        Devices with CPU Issues:
          type: integer
          example: 0
        CPU Issues:
          type: integer
          example: 0
        Devices with Memory Issues:
          type: integer
          example: 0
        Memory Issues:
          type: integer
          example: 0
        Devices with Temperature Issues:
          type: integer
          example: 0
        Temperature Issues:
          type: integer
          example: 0
        Devices with Fan Issues:
          type: integer
          example: 0
        Fan Issues:
          type: integer
          example: 0
        Devices with PSU Issues:
          type: integer
          example: 0
        PSU Issues:
          type: integer
          example: 0
        Devices with PoE Issues:
          type: integer
          example: 0
        PoE Issues:
          type: integer
          example: 0
        Devices Not Reporting Stats:
          type: integer
          example: 2
    MetricsInfo:
      type: object
      properties:
        deviceUUID:
          type: string
          description: Universally unique identifier for the device in UUID v4 format.
          format: uuid
          example: 5b3da8f6-bfc8-4776-ae72-a388db060000
        deviceID:
          type: string
          description: Internal system-generated numeric device identifier.
          example: "1497460426261685519"
        deviceSerialNumber:
          type: string
          description: Manufacturer-assigned serial number of the device.
          example: 89C5-0D6B-000002
        hostName:
          type: string
          description: Configured hostname of the device.
          example: TestMac-021243
        macAddress:
          type: string
          description: MAC address of the device (uppercase hex without delimiters).
          pattern: ^[A-F0-9]{12}$
          minLength: 12
          maxLength: 12
          example: FF4F00B70061
        ipAddress:
          type: string
          description: >
            IP address of the device. Supports both IPv4 and IPv6 formats.

            For IPv6, use standard RFC 5952 text representation (may include
            `::` compression).
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$|^(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}$|^(?:[0-9A-Fa-f]{1,4}:){1,7}:$|^(?:[0-9A-Fa-f]{1,4}:){1,6}:[0-9A-Fa-f]{1,4}$|^(?:[0-9A-Fa-f]{1,4}:){1,5}(?::[0-9A-Fa-f]{1,4}){1,2}$|^(?:[0-9A-Fa-f]{1,4}:){1,4}(?::[0-9A-Fa-f]{1,4}){1,3}$|^(?:[0-9A-Fa-f]{1,4}:){1,3}(?::[0-9A-Fa-f]{1,4}){1,4}$|^(?:[0-9A-Fa-f]{1,4}:){1,2}(?::[0-9A-Fa-f]{1,4}){1,5}$|^[0-9A-Fa-f]{1,4}:(?:(?::[0-9A-Fa-f]{1,4}){1,6})$|^:(?:(?::[0-9A-Fa-f]{1,4}){1,7}|:)$
          example: 10.64.236.25
        stackLocation:
          type: string
          description: >
            Physical location of the device within a stack configuration.

            Format: "Site name:Building name:Floor name" (e.g., "San Jose
            Campus-SJ-Building-1-Floor-3" ).

            Only populated for devices that are part of a stack.
          example: San Jose Campus-SJ-Building-1-Floor-3
        function:
          type: string
          description: |
            The functional role of the network device.
          enum:
            - Switch
            - Router
            - Access Point
            - Firewall
          example: Switch
        managedBy:
          type: string
          description: |
            Indicates how the device is managed.
          enum:
            - Cloud
            - TPME
          example: Cloud
        stackType:
          type: boolean
          description: |
            Indicates whether the device is part of a stack configuration.
            True if the device is stacked, false if it is standalone.
          example: true
        stackNumber:
          type: integer
          description: |
            The position number of the device within a stack (1-based).
            Only meaningful when stackType is true.
          minimum: 1
          maximum: 9
          example: 3
        stackMode:
          type: string
          description: >
            The operational role of the device within a stack configuration.


            **Available Stack Modes:**

            - **PRIMARY**: Primary/active controller in a stack — manages stack
            coordination and configuration distribution

            - **BACKUP_IN_SYNC**: Backup controller synchronized with PRIMARY —
            ready for immediate failover

            - **STANDBY**: Standby device in the stack — available for failover
            but may not be fully synchronized

            - **MEMBER**: Secondary device participating in a stack — forwards
            traffic under PRIMARY control

            - **MASTER**: Legacy term for the primary controller role (older
            firmware devices)

            - **STANDALONE**: Device operating independently, not part of any
            stack configuration

            - **switch_stack**: Device is operating as part of a switch stack
            group

            - **NONE**: No stack mode assigned or not applicable for this device
          enum:
            - PRIMARY
            - BACKUP_IN_SYNC
            - STANDBY
            - MEMBER
            - MASTER
            - STANDALONE
            - SWITCH_STACK
          example: PRIMARY
        stackSize:
          type: integer
          description: |
            Total number of devices in the stack.
            Only meaningful when stackType is true.
          minimum: 1
          maximum: 9
          example: 5
        siteName:
          type: string
          example: Site2
        siteID:
          type: string
          description: Identifier of the site where the device is located.
          minimum: 1
          example: "348802884148991"
        buildingName:
          type: string
          example: Building3
        floorName:
          type: string
          example: Floor4
        address:
          type: string
          example: 4 Mile Road, Conway, 40
        deviceHealthData:
          type: array
          items:
            $ref: "#/components/schemas/DeviceHealthData"
        stackMembershipInfo:
          type: array
          description: Array of stack member device data (only populated for stack master
            devices)
          items:
            $ref: "#/components/schemas/StackMemberData"
        parentStackMemberName:
          type: string
          description: >
            Display name of the stack master device to which this member belongs.
          example: 8520-Stack
        stackDisplayName:
          type: string
          description: |
            Display name for the stack, can be different from the stack name.
            Only populated for stack master devices.
          example: USA-RDU-Office-Floor1
        stackCpuMax:
          type: string
          description: |
            Maximum CPU usage percentage across all stack members.
            Computed as max of per-member average CPU usage. Capped at 100.
            Only populated for stack master devices.
          example: "21"
        stackCpuAvg:
          type: string
          description: |
            Average CPU usage percentage across all stack members.
            Computed as avg of per-member average CPU usage. Capped at 100.
            Only populated for stack master devices.
          example: "17"
        stackMemoryMax:
          type: string
          description: |
            Maximum memory usage percentage across all stack members.
            Computed as max of per-member memory usage. Capped at 100.
            Only populated for stack master devices.
          example: "61"
        stackMemoryAvg:
          type: string
          description: |
            Average memory usage percentage across all stack members.
            Computed as avg of per-member memory usage. Capped at 100.
            Only populated for stack master devices.
          example: "50"
        stackTemperatureMax:
          type: string
          description: |
            Maximum temperature value (°C) across all stack members.
            Computed as max of per-member max temperature.
            Only populated for stack master devices.
          example: "71"
        stackTemperatureAvg:
          type: string
          description: |
            Average temperature value (°C) across all stack members.
            Computed as avg of per-member max temperature.
            Only populated for stack master devices.
          example: "68"
        stackPsuMax:
          type: string
          description: |
            Maximum PSU output power (watts) across all stack members.
            Only populated for stack master devices.
          example: "1.4"
        stackPsuAvg:
          type: string
          description: |
            Average PSU output power (watts) across all stack members.
            Only populated for stack master devices.
          example: "1.2"
        stackPoeTotalBudget:
          type: string
          description: |
            Total PoE power budget (watts) across all stack members.
            Calculated as 740W × number of stack members.
            Only populated for stack master devices.
          example: "4440.0"
        stackPoeTotalConsumed:
          type: string
          description: >
            Total PoE power consumed (watts) across all stack members.

            Calculated as sum of (per-member consumed percent × per-member
            budget / 100).

            Only populated for stack master devices.
          example: "1860.0"
        stackCpuStatus:
          type: string
          description: >
            Overall CPU health status for the stack.

            Aggregated from all stack members. Only populated for stack parent
            devices.
          enum:
            - green
            - red
          example: green
        stackMemoryStatus:
          type: string
          description: >
            Overall memory health status for the stack.

            Aggregated from all stack members. Only populated for stack parent
            devices.
          enum:
            - green
            - red
          example: green
        stackTemperatureStatus:
          type: string
          description: >
            Overall temperature health status for the stack.

            Aggregated from all stack members. Only populated for stack parent
            devices.
          enum:
            - green
            - red
          example: red
        stackPoeStatus:
          type: string
          description: >
            Overall PoE health status for the stack.

            Aggregated from all stack members. Only populated for stack parent
            devices.
          enum:
            - green
            - red
          example: green
        stackFanStatus:
          type: string
          description: >
            Global aggregated fan health status across all stack members.

            Only populated for stack master devices.

            Values: "ok" (all fans operational), "critical" (at least one fan
            non-operational).
          enum:
            - ok
            - critical
          example: ok
        stackPSUStatus:
          type: string
          description: >
            Global aggregated PSU health status across all stack members

            Only populated for stack master devices.

            Values: "ok" (all PSUs operational), "critical" (at least one PSU
            non-operational).
          enum:
            - ok
            - critical
          example: ok
        StackPoeTotalConsumedPercent:
          type: string
          description: >
            Total PoE power consumed as a percentage of total budget across all
            stack members.

            Calculated as (stackPoeTotalConsumed / stackPoeTotalBudget) × 100.

            Only populated for stack master devices.
          example: "41.9"
