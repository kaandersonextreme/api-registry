    UsageCapacityDataRequest:
      type: object
      title: Usage Capacity Data Request
      description: >
        Request object for retrieving comprehensive usage capacity analytics for
        network devices.

        Supports hierarchical location filtering and configurable usage capacity
        metric selection.
      properties:
        siteIDs:
          type: string
          description: >
            Comma-separated list of site identifiers for location-based
            filtering.

            Sites represent the highest level in the location hierarchy (e.g.,
            campus, datacenter).

            Use this to filter devices by geographical or organizational sites.

            Supports up to approximately 200 site IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1,3
        buildingIDs:
          type: string
          description: >
            Comma-separated list of building identifiers within the specified
            sites.

            Buildings represent physical structures or logical groupings within
            sites.

            More specific than site-level filtering.

            Supports up to approximately 200 building IDs per request for
            optimal performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 11,22
        floorIDs:
          type: string
          description: >
            Comma-separated list of floor identifiers within the specified
            buildings.

            Floors represent the most granular level of location-based
            filtering,

            useful for maintenance and physical access planning.

            Supports up to approximately 200 floor IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 110,220
        deviceIDs:
          type: string
          description: >
            Comma-separated list of specific device identifiers to retrieve
            usage capacity data for.

            Use this to target individual devices regardless of their location.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1497460426261685519,1497460426261685520
        responseType:
          type: string
          description: >
            Type of response as specified below -

            **Available Types:**

            - **summary**: Response contains usage capacity summary for
            site/building/floor

            - **grid**: Response contains usage capacity information of each
            device


            If not specified, returns usage capacity summary by default.
          pattern: ^[a-zA-Z\s,]+$
          enum:
            - summary
            - grid
          maxLength: 100
          example: summary
        deviceType:
          type: string
          description: >
            Type of device as specified below -

            **Available Types:**

            - **wired**: Response contains usage capacity information for wired
            devices on site/building/floor

            - **wireless**: Response contains usage capacity information for
            wireless devices on site/building/floor


            If not specified, returns usage capacity information for both wired
            and wireless devices by default.
          pattern: ^[a-zA-Z\s,]+$
          maxLength: 100
          enum:
            - wired
            - wireless
        managedBy:
          type: string
          description: >
            Filter by management type of device as specified below -

            **Available Types:**

            - **cloud**: Response contains usage capacity information for cloud
            managed devices

            - **TPME**: Response contains usage capacity information for third
            party managed devices


            If not specified, returns usage capacity information for both cloud
            and on-premises managed devices by default.
          pattern: ^[a-zA-Z\s,]+$
          maxLength: 20
          enum:
            - cloud
            - TPME
          example: TPME
        haveQueueCongestionPackets:
          type: boolean
          description: >
            When `true`, only those devices with totalQueueCongestionPackets
            values > 0 are returned in the results.

            Otherwise, all devices are returned (if not removed by other
            filters).
          example: true
          default: false
        sortField:
          type: string
          description: |
            An optional field by which to sort usage capacity data. If
            specified, may be "hostName," "siteName," "rxPktsPerSec," *etc.*
          pattern: ^[a-zA-Z0-9_]+$
          maxLength: 100
          example: hostName
          default: ""
          enum:
            - hostName
            - siteName
            - totalBandWidthUtilizedBytes
            - totalPacketCount
            - unicastUtilizationPercentage
            - multicastUtilizationPercentage
            - broadcastUtilizationPercentage
            - totalQueueTxPackets
            - totalQueueCongestionPackets
            - totalCongestionPercentage
            - rxPktsPerSec
            - txPktsPerSec
            - totalClients
            - totalClientsWithIssues
            - ""
        sortOrder:
          type: string
          description: >
            Order to sort the device usage capacity data. Can be ascending or
            descending.
          enum:
            - asc
            - desc
          default: asc
          example: desc
        keyword:
          type: string
          description: >
            Keyword to filter the usage and capacity data. Matches against
            device hostName,

            ip address, site name, building name and floor name.
          pattern: ^[a-zA-Z0-9_\-.:]+$
          maxLength: 100
          example: TestMac-021243
        pageNumber:
          type: integer
          description: >
            Current page number for pagination using 1-based indexing.

            Use this in combination with pageSize to navigate through large
            device inventories.
          minimum: 1
          default: 1
          example: 2
        pageSize:
          type: integer
          description: >
            Number of devices to return per page. Recommended maximum is 100 for
            optimal

            performance, though the system supports up to 1000 devices per page.
          minimum: 1
          maximum: 1000
          default: 100
          example: 80
