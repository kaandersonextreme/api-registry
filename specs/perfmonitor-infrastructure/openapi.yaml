    ClientHealthStatsRequest:
      type: object
      title: Client Health Stats Request
      description: >
        Request object for retrieving client health stats time-series data.

        Supports latest-value queries and historical time-range queries with
        automatic

        aggregation tier selection for optimal performance.
      required:
        - deviceID
      properties:
        deviceID:
          type: string
          description: |
            Internal device ID to retrieve client health stats for.
            One device ID is required.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 100
          example: "12345676543210001"
        startTime:
          type: string
          format: date-time
          description: >
            Start time for data retrieval in ISO 8601 UTC format. Results
            include data points

            from this time (inclusive). Required when `latestValue` is false.

            The system automatically selects the optimal aggregation tier based
            on the time span.
          example: 2026-03-03T23:21:50Z
        endTime:
          type: string
          format: date-time
          description: >
            End time for data retrieval in ISO 8601 UTC format. Results include
            data points

            up to this time (exclusive). Required when `latestValue` is false.
          example: 2026-03-05T23:21:50Z
        latestValue:
          type: boolean
          default: false
          description: >
            When true, retrieves only the most recent data point from the base
            hypertable

            for each requested device. Overrides time range parameters when
            enabled.

            Useful for real-time dashboards and current status monitoring.
          example: false
        pageNumber:
          type: integer
          description: Current page number for pagination (1-based indexing).
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          description: >
            Number of data points to return per page. Maximum allowed value is
            1000.
          minimum: 1
          maximum: 1000
          default: 100
          example: 100
    ClientHealthStatsResponses:
      type: object
      description: >
        Response containing client health stats time-series data with pagination.
      properties:
        metricGroup:
          type: string
          description: Name of the metric group.
          example: client health stats
        ownerID:
          type: integer
          description: Identifier of the organization or tenant owning this data.
          example: 102
        items:
          type: array
          description: >
            Array of client health stats data points ordered by timestamp
            ascending.

            Each data point represents the healthy and unhealthy client counts
            for a device

            at a specific point in time.
          items:
            $ref: "#/components/schemas/ClientHealthStatsDataPoint"
        paginationInfo:
          $ref: "#/components/schemas/PaginationResponse"
    ClientHealthStatsDataPoint:
      type: object
      description: >
        A single time-series data point representing client health counts for a
        device.
      required:
        - ts
        - deviceID
        - healthyClients
        - unhealthyClients
      properties:
        ts:
          type: string
          format: date-time
          description: >
            Timestamp of the data point in ISO 8601 UTC format.

            Granularity depends on the aggregation tier selected based on the
            query time range.
          example: 2026-03-04T10:00:00Z
        deviceID:
          type: string
          description: Internal system-generated numeric device identifier.
          example: "1234567654321000001"
        healthyClients:
          type: integer
          format: int64
          description: >
            Number of healthy clients connected to this device at the given
            timestamp.

            A client is considered healthy when its port has no congestion
            drops, no errors,

            broadcast percentage is within threshold, and the client has valid
            IP connectivity.
          minimum: 0
          example: 42
        unhealthyClients:
          type: integer
          format: int64
          description: >
            Number of unhealthy clients connected to this device at the given
            timestamp.

            A client is considered unhealthy if any of the following conditions
            are met:

            - Port not found in port stats

            - Missing IP information (no IPv4 or IP address)

            - Port congestion drop packets > 0

            - Broadcast percentage exceeds threshold of 75

            - Total port errors > 0
          minimum: 0
          example: 3
    WirelessDeviceHealthDataRequest:
      type: object
      title: Wireless Device Health Data Request
      description: >
        Request object for retrieving health analytics exclusively for wireless
        (AP) network devices.
      properties:
        siteIDs:
          type: string
          description: >
            Comma-separated list of site identifiers for location-based
            filtering.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1,3
        buildingIDs:
          type: string
          description: >
            Comma-separated list of building identifiers within the specified
            sites.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 11,22
        floorIDs:
          type: string
          description: >
            Comma-separated list of floor identifiers within the specified
            buildings.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 110,220
        deviceIDs:
          type: string
          description: >
            Comma-separated list of specific wireless device identifiers to
            retrieve health data for.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1497460426261685519,1497460426261685520
        deviceStats:
          type: string
          enum:
            - cpu
            - memory
            - poe
          description: >
            Comma-separated list of health metric categories to include in the
            response.

            Controls which health parameters are collected and returned.


            **Available Metrics:**

            - **cpu**: Processor utilization percentage (0-100%)

            - **memory**: RAM usage percentage (0-100%)

            - **poe**: Power over Ethernet consumption in watts (W)


            If not specified, returns all available metrics by default.
          pattern: ^(cpu|memory|poe)(,(cpu|memory|poe))*$
          maxLength: 100
          example: cpu,memory
        health:
          type: string
          description: |
            Filter devices by health status.

            **Available Statuses:**
            - **unhealthy**: Wireless devices with one or more health issues

            If not specified, returns devices of all health statuses by default.
          enum:
            - unhealthy
          maxLength: 100
          example: unhealthy
        responseType:
          type: string
          description: >
            Controls the format of the response data:

            - `summary`: Returns aggregated health summary statistics only

            - `grid`: Returns detailed per-device health information in grid
            format
          enum:
            - summary
            - grid
          example: grid
        managedBy:
          type: string
          description: >
            Filter by management type of wireless device.

            - **cloud**: Cloud managed wireless devices

            - **TPME**: Third party managed wireless devices


            If not specified, returns health information for both cloud and
            on-premises managed devices.
          pattern: ^[a-zA-Z\s,]+$
          maxLength: 20
          enum:
            - cloud
            - TPME
          example: cloud
        sortField:
          type: string
          description: |
            An optional field by which to sort wireless device health data.
          pattern: ^[a-zA-Z0-9_]+$
          maxLength: 100
          example: cpu
          enum:
            - hostName
            - location
            - cpu
            - memory
            - total-eth0-score
            - total-eth1-score
        sortOrder:
          type: string
          description: |
            Order to sort the wireless device health data.
          enum:
            - asc
            - desc
          default: asc
          example: desc
        keyword:
          type: string
          description: >
            Keyword to filter wireless device health data. Matches against
            device hostName,

            IP address, site name, building name and floor name.
          pattern: ^[a-zA-Z0-9_\-.:]+$
          maxLength: 100
          example: AP-5010
        pageNumber:
          type: integer
          description: |
            Current page number for pagination using 1-based indexing.
          minimum: 1
          default: 1
          example: 2
        pageSize:
          type: integer
          description: |
            Number of wireless devices to return per page.
          minimum: 1
          maximum: 1000
          default: 100
          example: 80
        has_cpu_usage_issues:
          type: boolean
        has_memory_usage_issues:
          type: boolean
        has_poe_usage_issues:
          type: boolean
        numberFilter:
          type: array
          description: >
            Array of numeric filter conditions to apply on metric columns.

            Each filter specifies a column name, a comparison operator, and the
            value(s) to compare against.


            **Supported filter types:**

            - **eq**: Equal to — matches rows where column equals `value`

            - **neq**: Not equal to — matches rows where column does not equal
            `value`

            - **gt**: Greater than — matches rows where column is greater than
            `value`

            - **gte**: Greater than or equal to — matches rows where column >=
            `value`

            - **lt**: Less than — matches rows where column < `value`

            - **lte**: Less than or equal to — matches rows where column <=
            `value`

            - **btw**: Between — matches rows where column is between `min` and
            `max` (inclusive)
          items:
            $ref: "#/components/schemas/NumberFilterItem"
          example:
            - columnName: eth0_unicast_score
              filterType: eq
              value: 55
            - columnName: eth0_multicast_score
              filterType: gte
              value: 50
            - columnName: eth0_broadcast_score
              filterType: btw
              min: 30
              max: 70
    NumberFilterItem:
      type: object
      title: Number Filter Item
      description: |
        A single numeric filter condition applied to a metric column.
        Use `value` for single-value comparisons (eq, neq, gt, gte, lt, lte)
        and `min`/`max` for range comparisons (btw).
      required:
        - columnName
        - filterType
      properties:
        columnName:
          type: string
          description: |
            The name of the metric column to filter on.
          enum:
            - cpu
            - memory
            - poe
            - eth0_unicast_score
            - eth0_multicast_score
            - eth0_broadcast_score
            - eth1_unicast_score
            - eth1_multicast_score
            - eth1_broadcast_score
          example: eth0_unicast_score
        filterType:
          type: string
          description: |
            The comparison operator to apply.
          enum:
            - eq
            - neq
            - gt
            - gte
            - lt
            - lte
            - btw
          example: eq
        value:
          type: number
          description: >
            The value to compare against. Used for eq, neq, gt, gte, lt, lte
            filter types.
          example: 55
        min:
          type: number
          description: |
            The minimum value for range filtering. Used with filter_type "btw".
          example: 30
        max:
          type: number
          description: |
            The maximum value for range filtering. Used with filter_type "btw".
          example: 70
    WirelessClientFilterQuery:
      type: object
      title: Wireless Client Filter Query
      description: >
        A filter condition to apply on wireless client metrics. Use `type` to
        specify the metric

        to filter on and `value` to specify the filter criteria. Multiple
        filters can be added.
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: >
            Type of filter to apply. Each type supports specific value formats:

            - **association-issues**: Filter by client association status
            (show/hide)

            - **authentication-issues**: Filter by client authentication status
            (show/hide)

            - **network-issues**: Filter by client network issues (show/hide)

            - **roaming-issues**: Filter by client roaming status (show/hide)

            - **connection-status**: Filter by client connection status
            (connected/disconnected)

            - **authentication**: Filter by client authentication method (e.g.,
            PSK, 802.1X)
          enum:
            - association-issues
            - authentication-issues
            - network-issues
            - roaming-issues
            - connection-status
            - authentication
            - category-assignment
            - client-type
            - encryption
            - frequency
            - user-profile
            - ssid
            - operating-system
          example: connection-status
        value:
          type: string
          example: connected
          description: >
            The filter criteria value. Supported values are defined in metadata
            api response for each filter type.

            For example, for `connection-status` filter type, supported values
            are "connected" and "disconnected".
