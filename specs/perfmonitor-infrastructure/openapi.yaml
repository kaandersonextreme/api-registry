        Returns a chronological list of issue events for a specific wireless
        client,

        filtered by issue type. Each event includes the timestamp,
        human-readable

        reason, duration, and the device name where the issue was observed.


        **Supported Issue Types:**

        - **association**: Association failures (problem IDs 0–3, −3)

        - **authentication**: Authentication failures (problem IDs 65536–65553,
        −4)

        - **network**: Network connectivity issues (problem IDs 131072–131074,
        −2)

        - **roaming**: Roaming failures (problem ID −5)


        History of Data is sourced from
        `legacy_wireless_client_monitor_problem_stats` over the

        last 24 hours.
      requestBody:
        required: true
        description: >
          Request parameters to retrieve issue details for a specific wireless
          client.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WirelessClientIssueRequest"
            examples:
              association_issues:
                summary: Get association issues for a client
                value:
                  macAddress: B8D5467711C0
                  issueType: association
              authentication_issues:
                summary: Get authentication issues for a client
                value:
                  macAddress: B8D5467711C0
                  issueType: authentication
      responses:
        "200":
          description: |
            Successfully retrieved client issue details.

            **Response Structure:**
            - `macAddress`: The queried client MAC address
            - `issueType`: The queried issue category
            - `totalCount`: Total number of issue events returned
            - `issues`: Array of issue event objects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WirelessClientIssueResponse"
              examples:
                sample_response:
                  summary: Sample issue detail response
                  value:
                    macAddress: B8D5467711C0
                    issueType: association
                    totalCount: 3
                    issues:
                      - dateTime: 2026-04-28T10:12:00Z
                        reason: Client failed to associate with AP due to timeout
                        duration: 45
                        deviceName: AP-Floor2-East
                      - dateTime: 2026-04-28T08:30:00Z
                        reason: Association rejected by AP
                        duration: 12
                        deviceName: AP-Floor1-Main
        "400":
          description: |
            Bad Request - Invalid request parameters.

            **Common Causes:**
            - Missing or invalid macAddress format
            - Invalid issueType value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                invalid_mac:
                  summary: Invalid MAC address
                  value:
                    code: 1701
                    message: macAddress must be a 12-character hexadecimal string
                invalid_issue_type:
                  summary: Invalid issue type
                  value:
                    code: 1701
                    message: "issueType must be one of: association, authentication, network,
                      roaming"
        "404":
          description: |
            No issue data found for the specified client and issue type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                no_issues_found:
                  summary: No issues found
                  value:
                    code: 1307
                    message: No issue events found for the specified client and issue type
        "500":
          description: |
            Internal server error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /analytics/client-trail/roaming:
    post:
      tags:
        - Client trail data
      operationId: RetrieveClientTrailRoamingData
      x-mcp-operation-type: client-analytics
      x-mcp-automation-friendly: true
      x-mcp-use-cases:
        - client-roaming-analysis
        - connectivity-troubleshooting
        - ai-network-diagnostics
      summary: Client Trail Roaming Data for AI and MCP Servers
      description: >
        **Client Roaming Trail Analysis for MCP Servers**


        Retrieves roaming trail data from the Historical Client Session table,
        showing

        the sequence of access point transitions (roams) for a specific client
        within

        a given time range. A roam event is detected when the device serial
        number changes

        between consecutive session records sorted by timestamp in ascending
        order.


        **Roam Detection Logic:**

        - Sessions are sorted by timestamp ascending for the specified client
        MAC

        - A roam is identified when the device serial number changes between
        consecutive records

        - The "from" fields come from the previous record, "to" fields from the
        next record

        - Roam duration is taken from the `roaming_time` field of the
        destination (to) record


        **Roam Status Determination:**

        The status is determined by correlating with the Client Monitor Problem
        table:

        - If any association, authentication, DHCP, DNS, or gateway issue exists
        for the
          client MAC within the time window → status = `FAILED`
        - Otherwise → status = `ROAMING_COMPLETED`


        **Problem ID Mapping (from HiveOsProblem):**

        - Association issues: problem_id 0–3 (category 1) or -3 (slow
        association)

        - Authentication issues: problem_id 65536–65553 (category 2) or -4 (slow
        auth)

        - DHCP issues: problem_id 131072 or -2 (DHCP slow)

        - DNS issues: problem_id 131073

        - Gateway issues: problem_id 131074
      requestBody:
        required: true
        description: |
          Request parameters for client trail roaming data retrieval.
          Requires a client MAC address and a time range.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientTrailRoamingRequest"
            examples:
              basic_roaming_request:
                summary: Basic roaming trail request for a client
                value:
                  clientMac: 9860CAE64680
                  startTime: 2026-04-27T00:00:00Z
                  endTime: 2026-04-28T00:00:00Z
      responses:
        "200":
          description: |
            Successfully retrieved client roaming trail data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientTrailRoamingResponse"
              examples:
                successful_roaming_response:
                  summary: Sample roaming trail with one successful roam
                  value:
                    roamsCompleted: 1
                    roamsFailed: 0
                    items:
                      - timestamp: 1777101288392
                        deviceNameFrom: EDUC-AP07
                        deviceNameTo: EDUC-AP04
                        deviceMacFrom: F02B7C234C40
                        deviceMacTo: BCF310366F40
                        roamDuration: 0
                        statusAction: COMPLETED
                        data:
                          - channelFrom: 116
                            channelTo: 36
                            rssiFrom: -53
                            rssiTo: -44
                            snrFrom: 43
                            snrTo: 51
                            radioTypeFrom: 5G
                            radioTypeTo: 5G
                            status: ROAMING_COMPLETED
                            reason: ""
        "400":
          description: Bad Request - Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "404":
          description: No roaming data found for the specified client and time range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
          description: Internal server error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /analytics/client-trail/connectivity-experience:
    post:
      tags:
        - Client trail data
      operationId: RetrieveClientTrailConnectivityExperience
      x-mcp-operation-type: client-analytics
      x-mcp-automation-friendly: true
      x-mcp-use-cases:
        - connectivity-troubleshooting
        - client-experience-analysis
        - ai-network-diagnostics
      summary: Client Trail Connectivity Experience for AI and MCP Servers
      description: >
        **Client Connectivity Experience Analysis for MCP Servers**


        Retrieves the connectivity experience timeline for a specific client,
        showing

        the session-level details including association, authentication, DHCP,
        DNS, and

        gateway status for each connection event within the specified time
        range.


        **Connectivity Flow:**

        Each session record represents one connection event. The circle statuses
        indicate

        the outcome of each connectivity phase:

        1. **Association** — Did the client successfully associate with the AP?

        2. **Authentication** — Did the client pass authentication?

        3. **DHCP** — Did the client obtain an IP address?

        4. **DNS** — Is DNS resolution functioning?

        5. **Gateway** — Is the default gateway reachable?


        **Circle Status Determination (from Client Monitor Problem table):**

        - `associationCircleStatus`: `FAILED` if problem_id in 0–3 or -3, else
        `SUCCESS`

        - `authCircleStatus`: `FAILED` if problem_id in 65536–65553 or -4, else
        `SUCCESS`

        - `dhcpCircleStatus`: `INVALID` if problem_id in 131072 or -2, else `OK`

        - `dnsCircleStatus`: `DISABLED` if problem_id = 131073, else `OK`

        - `gatewayCircleStatus`: `DISABLED` if problem_id = 131074, else `OK`
      requestBody:
        required: true
        description: |
          Request parameters for client connectivity experience data retrieval.
          Requires a client MAC address and a time range.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientTrailConnectivityExperienceRequest"
            examples:
              basic_connectivity_request:
                summary: Basic connectivity experience request
                value:
                  clientMac: 9860CAE64680
                  startTime: 2026-04-27T00:00:00Z
                  endTime: 2026-04-28T00:00:00Z
      responses:
        "200":
          description: |
            Successfully retrieved client connectivity experience data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientTrailConnectivityExperienceResponse"
              examples:
                successful_connectivity_response:
                  summary: Sample connectivity experience
                  value:
                    items:
                      - startTimestamp: 1777100698283
                        deviceName: EDUC-AP07
                        deviceId: 1606450914716785
                        ssid: EDUC-Student
                        associationDuration: -1
                        authMethod: WPA3-802.1X
                        authenticationResponseTime: -1
                        authenticationStatus: PASS
                        dhcpServerIp: ""
                        dhcpServerResponseTime: -1
                        dhcpIpAddressObtained: 10.11.25.180
                        defaultGatewayIp: ""
                        defaultGatewayRoundTripDelayTime: 0
                        dnsServerIp: ""
                        dnsServerResponseTime: -1
                        associationCircleStatus: SUCCESS
                        authCircleStatus: SUCCESS
                        dhcpCircleStatus: INVALID
                        dnsCircleStatus: DISABLED
                        gatewayCircleStatus: DISABLED
                        avgSnr: 43
                        avgRssi: -53
                        clientIp: 10.11.25.180
        "400":
          description: Bad Request - Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "404":
          description: No connectivity data found for the specified client and time range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
          description: Internal server error occurred while processing the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
