  /analytics/client-health/history:
    post:
      tags:
        - Client health data
      operationId: RetrieveHistoricalClientHealthData
      summary: Historical Client Session Data at Network/Site Level
      description: >
        **Historical Client Session Data at Network/Site Level**


        Retrieves historical client session records across an entire network or
        site

        without requiring a specific DeviceID. This endpoint answers queries
        like

        "Show me all clients that connected to my network/site in the past 7
        days."


        Unlike `/metric-data` (which requires a DeviceID) or `/client-health`
        (which shows

        only currently active/recently disconnected clients), this endpoint
        returns raw

        historical session records`.
      requestBody:
        required: true
        description: >
          Request parameters for historical client session data.

          A time range (startTime/endTime) is required.

          Location filters are optional — without them, returns data for the
          entire network.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalClientHealthRequest"
            examples:
              network_wide_7_days:
                summary: All client sessions across the network in the past 7 days
                value:
                  startTime: 2026-05-26T00:00:00Z
                  endTime: 2026-06-02T00:00:00Z
                  pageNumber: 1
                  pageSize: 100
              site_filtered:
                summary: Client sessions for specific sites
                value:
                  siteIDs: 1,3
                  startTime: 2026-05-26T00:00:00Z
                  endTime: 2026-06-02T00:00:00Z
                  pageNumber: 1
                  pageSize: 50
                  deviceType: wired
      responses:
        "200":
          description: >
            Successfully retrieved historical client session data.


            **Response Structure:**

            - `timeRange`: The queried time window

            - `clients`: Raw session records — one entry per client session (not
            deduplicated)

            - `paginationInfo`: Pagination metadata


            The response is intentionally raw — no pre-computed summaries or
            deduplication.

            Consumers can derive any aggregations (unique clients, session
            counts, etc.) from the data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalClientHealthResponse"
              examples:
                successful_response:
                  summary: Sample historical client session response
                  value:
                    timeRange:
                      startTime: 2026-05-26T00:00:00Z
                      endTime: 2026-06-02T00:00:00Z
                    clients:
                      - mac: AABBCCDDEEFF
                        clientHostname: sdoe-surface
                        clientIP: 10.64.236.100
                        clientIPv6: ""
                        operatingSystem: Windows 11
                        userName: ""
                        userProfileName: ""
                        ssid: ""
                        bssid: ""
                        vlan: 100
                        port: 1:3
                        connectionType: 0
                        connectionChannel: 0
                        radioType: 0
                        authMethod: 0
                        deviceId: 1497460426261685500
                        deviceSerialNumber: 2033X-00456
                        siteName: Site2
                        buildingName: Building3
                        floorName: Floor4
                        startTime: 2026-05-27T08:15:00Z
                        endTime: 2026-05-27T09:15:00Z
                        associationDuration: 3600
                        roamingTime: 0
                        authenticationResponseTime: 50
                        rssi: null
                        snr: null
                    paginationInfo:
                      current_page: 1
                      items_count: 100
                      total_pages: 4
                      total_items_count: 312
        "400":
          description: |
            Bad Request - Invalid request parameters.

            **Common Causes:**
            - Missing required startTime or endTime
            - Time range exceeds maximum allowed (30 days)
            - startTime is after endTime
            - Invalid location IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "404":
          description: No historical client data found for the specified criteria.
          content:
            application/json:
              schema:
