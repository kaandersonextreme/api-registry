    WirelessClientHealthMetadataRequest:
      type: object
      title: Wireless Client Health Metadata Request
      description: >
        Request object for retrieving comprehensive health analytics values for
        network devices.

        Supports hierarchical location filtering and configurable health metric
        selection.
      properties:
        siteIDs:
          type: string
          description: >
            Comma-separated list of site identifiers for location-based
            filtering.

            Sites represent the highest level in the location hierarchy (e.g.,
            campus, datacenter).

            Use this to filter devices by geographical or organizational sites.

            Supports up to approximately 200 site IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1,3
        buildingIDs:
          type: string
          description: >
            Comma-separated list of building identifiers within the specified
            sites.

            Buildings represent physical structures or logical groupings within
            sites.

            More specific than site-level filtering.

            Supports up to approximately 200 building IDs per request for
            optimal performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 11,22
        floorIDs:
          type: string
          description: >
            Comma-separated list of floor identifiers within the specified
            buildings.

            Floors represent the most granular level of location-based
            filtering,

            useful for maintenance and physical access planning.

            Supports up to approximately 200 floor IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 110,220
        deviceIDs:
          type: string
          description: >
            Comma-separated list of specific device identifiers to retrieve
            health data for.

            Use this to target individual devices regardless of their location.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1497460426261685519,1497460426261685520
        managedBy:
          type: string
          description: >
            Filter by management type of device as specified below -

            **Available Types:**

            - **cloud**: Response contains client health information for cloud
            managed devices

            - **TPME**: Response contains client health information for third
            party managed devices


            If not specified, returns client health information for both cloud
            and on-premises managed devices by default.
          pattern: ^[a-zA-Z\s,]+$
          maxLength: 20
          enum:
            - cloud
            - TPME
          example: TPME
        filter:
          type: array
          description: >
            Array of filter conditions to apply on the client health data. Each
            filter specifies values in the enum below.
          items:
            $ref: "#/components/schemas/WirelessClientFilterQuery"
          example:
            - type: connection-status
              value: connected
            - type: authentication
              value: WPA3-802.1X
        keyword:
          type: string
          description: >
            Keyword to filter the client health data. Matches against client,
            location,

            etc.
          pattern: ^[a-zA-Z0-9_\-.:]+$
          maxLength: 100
          example: hospital
        pageNumber:
          type: integer
          description: >
            Current page number for pagination using 1-based indexing.

            Use this in combination with pageSize to navigate through large
            client inventories.
          minimum: 1
          default: 1
          example: 2
        pageSize:
          type: integer
          description: >
            Number of clients to return per page. Recommended maximum is 100 for
            optimal

            performance, though the system supports up to 1000 clients per page.
          minimum: 1
          maximum: 1000
          default: 100
          example: 80
