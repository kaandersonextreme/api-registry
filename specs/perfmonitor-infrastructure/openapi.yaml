openapi: 3.0.3
info:
  title: PerfMonitor Infrastructure API
  description: >
    # Performance Monitor Infrastructure API for MCP Servers


    This comprehensive API provides advanced network performance monitoring
    capabilities specifically optimized for MCP (Model Context Protocol) servers
    and automated monitoring systems.

    The API enables sophisticated monitoring of device health, performance
    metrics, and network analytics across various network components with
    intelligent automation support.


    ## MCP Server Integration Features

    - **Automated Performance Monitoring**: Continuous collection and analysis
    of network performance metrics

    - **Intelligent Alerting**: AI-driven anomaly detection and automated alert
    generation

    - **Time-Series Analytics**: Advanced time-series data processing for trend
    analysis and forecasting

    - **Real-time Health Monitoring**: Live device health status tracking with
    automated response capabilities

    - **Scalable Data Collection**: High-performance metric collection
    supporting thousands of devices

    - **Integration-Ready**: Designed for seamless integration with monitoring
    platforms and automation tools


    ## Key Features

    - **Application Discovery**: List supported monitoring applications and
    their capabilities

    - **Metric Collection**: Retrieve time-series performance data from network
    devices with advanced filtering

    - **Device Health Analytics**: Monitor device health status and performance
    indicators with trend analysis

    - **Flexible Filtering**: Advanced filtering and pagination optimized for
    large-scale monitoring deployments

    - **Real-time Data**: Access to current and historical performance metrics
    with microsecond precision

    - **Bulk Operations**: Efficient batch processing for monitoring large
    network infrastructures


    ## MCP Use Cases

    - **Infrastructure Monitoring**: Automated monitoring of switches, routers,
    and network devices

    - **Performance Optimization**: AI-driven performance analysis and
    optimization recommendations

    - **Capacity Planning**: Predictive analytics for network capacity planning
    and resource allocation

    - **Anomaly Detection**: Machine learning-based anomaly detection for
    proactive issue identification

    - **Compliance Monitoring**: Automated compliance tracking for SLA and
    performance requirements

    - **Integration Workflows**: Seamless integration with ITSM, SIEM, and
    automation platforms


    ## Supported Applications

    Currently supports monitoring for:

    - **Network Infrastructure**: Switches, routers, and network devices with
    full SNMP and telemetry support

    - **Device Stats**: CPU, memory, temperature, and power metrics with
    threshold monitoring

    - **Interface Stats**: Port utilization, errors, and performance data with
    trend analysis

    - **Wireless Stats**: Wireless device and interface monitoring with RF
    analytics

    - **Health Analytics**: Comprehensive device health scoring and predictive
    maintenance

    - **Usage Capacity Analytics**: Comprehensive usage and capacity monitoring
    across network infrastructure


    ## Data Formats

    All timestamps use ISO 8601 UTC format (e.g., "2024-08-26T19:00:00Z").

    Pagination is supported across all list operations for efficient data
    retrieval.

    Time-series data includes microsecond precision for high-frequency
    monitoring.


    ## Authentication

    This API requires proper authentication and authorization. Contact your
    system administrator for access credentials.
