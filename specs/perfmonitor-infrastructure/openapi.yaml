    ClientHealthDataRequest:
      type: object
      title: Client Health Data Request
      description: >
        Request object for retrieving comprehensive health analytics for network
        devices.

        Supports hierarchical location filtering and configurable health metric
        selection.
      properties:
        siteIDs:
          type: string
          description: >
            Comma-separated list of site identifiers for location-based
            filtering.

            Sites represent the highest level in the location hierarchy (e.g.,
            campus, datacenter).

            Use this to filter devices by geographical or organizational sites.

            Supports up to approximately 200 site IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1,3
        buildingIDs:
          type: string
          description: >
            Comma-separated list of building identifiers within the specified
            sites.

            Buildings represent physical structures or logical groupings within
            sites.

            More specific than site-level filtering.

            Supports up to approximately 200 building IDs per request for
            optimal performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 11,22
        floorIDs:
          type: string
          description: >
            Comma-separated list of floor identifiers within the specified
            buildings.

            Floors represent the most granular level of location-based
            filtering,

            useful for maintenance and physical access planning.

            Supports up to approximately 200 floor IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 110,220
        deviceIDs:
          type: string
          description: >
            Comma-separated list of specific device identifiers to retrieve
            health data for.

            Use this to target individual devices regardless of their location.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1497460426261685519,1497460426261685520
        clientMac:
          type: string
          description: >
            A single client MAC address to retrieve health data for.

            Use this to target an individual client regardless of its location.

            The MAC address must be a 12-character uppercase hexadecimal string
            (e.g., B8D5467711C0).
          pattern: ^[0-9A-Fa-f]{12}$
          minLength: 12
          maxLength: 12
          example: B8D5467711C0
        filter:
          type: string
          description: >
            Comma-separated list of client stats filters to include clients with
            these health

            issues in the response.


            **Note:** This filter applies only when `responseType` is `grid`. It
            is ignored

            when `responseType` is `summary` — the summary counts always reflect
            all clients

            regardless of this filter.


            **Available Client Stats:**

            - **port-congestion-healthy**: Represents low utilization or healthy
            state on network ports

            - **port-congestion-unhealthy**: Represents high utilization or
            saturation on network ports

            - **ip-connectivity-valid-ip**: Indicates clients with valid IP
            addresses and good connectivity

            - **ip-connectivity-self-assigned-ip**: Indicates clients with
            self-assigned IP addresses, which may suggest DHCP issues

            - **ip-connectivity-unassigned-ip**: Indicates clients without
            assigned IP addresses, which may suggest connectivity issues

            - **traffic-anomalies-unhealthy**: Detects unusual or unexpected
            traffic patterns

            - **traffic-anomalies-healthy**: Indicates normal traffic patterns
            without anomalies

            - **port-errors-unhealthy**: Captures error events on network ports

            - **port-errors-healthy**: Indicates absence of error events on
            network ports

            - **client-unhealthy**: Represents clients with overall unhealthy
            status based on aggregated metrics
          pattern: ^[a-zA-Z\s,]+$
          maxLength: 200
          example: port-congestion-unhealthy, ip-connectivity-valid-ip
          enum:
            - port-congestion-healthy
            - port-congestion-unhealthy
            - ip-connectivity-valid-ip
            - ip-connectivity-self-assigned-ip
            - ip-connectivity-unassigned-ip
            - traffic-anomalies-healthy
            - traffic-anomalies-unhealthy
            - port-errors-healthy
            - port-errors-unhealthy
            - client-unhealthy
        responseType:
          type: string
          description: >
            Type of response as specified below -

            **Available Types:**

            - **summary**: Response contains processor health summary for
            site/building/floor

            - **grid**: Health information of clients for each metrics


            If not specified, returns health summary by default.
          pattern: ^[a-zA-Z\s,]+$
          enum:
            - summary
            - grid
          maxLength: 100
          example: summary
        deviceType:
          type: string
          description: >
            Type of device as specified below -

            **Available Types:**

            - **wired**: Response contains health information for wired clients
            on site/building/floor/device

            - **wireless**: Response contains health information for wireless
            clients on site/building/floor/device


            If not specified, returns health information for both wired and
            wireless clients by default.
          pattern: ^[a-zA-Z\s,]+$
          maxLength: 100
          enum:
            - wired
            - wireless
          example: wired
        managedBy:
          type: string
          description: >
            Filter by management type of device as specified below -

            **Available Types:**

            - **cloud**: Response contains client health information for cloud
            managed devices

            - **TPME**: Response contains client health information for third
            party managed devices


            If not specified, returns client health information for both cloud
            and on-premises managed devices by default.
          pattern: ^[a-zA-Z\s,]+$
          maxLength: 20
          enum:
            - cloud
            - TPME
          example: TPME
        sortField:
          type: string
          description: >
            An optional field by which to sort client health data. If specified,
            may be: "connection", "client", "location", "ipv4",

            "port-number", "vlan", "operating-system", "mac", "user-name",
            "instant-port-profile", "total-congestion",

            "total-unicast", "total-multicast", "total-broadcast" or "ipv6".
          pattern: ^[a-zA-Z0-9_]+$
          maxLength: 100
          example: client
          enum:
            - connectionStatus
            - client
            - location
            - ipv4
            - port-number
            - vlan
            - operating-system
            - mac
            - user-name
            - instant-port-profile
            - total-congestion
            - total-unicast
            - total-multicast
            - total-broadcast
            - ipv6
        sortOrder:
          type: string
          description: >
            Order to sort the client health data. Can be ascending or descending.
          enum:
            - asc
            - desc
          default: asc
          example: desc
        keyword:
          type: string
          description: >
            Keyword to filter the client health data. Matches against client,
            location,

            port number, switch name, vlan and operating system etc.


            **Note:** This filter applies only when `responseType` is `grid`. It
            is ignored

            when `responseType` is `summary` — the summary counts always reflect
            all clients

            regardless of this filter.
          pattern: ^[a-zA-Z0-9_\-.:]+$
          maxLength: 100
          example: hospital
        pageNumber:
          type: integer
          description: >
            Current page number for pagination using 1-based indexing.

            Use this in combination with pageSize to navigate through large
            client inventories.
          minimum: 1
          default: 1
          example: 2
        pageSize:
          type: integer
          description: >
            Number of clients to return per page. Recommended maximum is 100 for
            optimal

            performance, though the system supports up to 1000 clients per page.
          minimum: 1
          maximum: 1000
          default: 100
          example: 80
    HistoricalClientHealthRequest:
      type: object
      title: Historical Client Health Request
      description: >
        Request object for retrieving historical client session data at the
        network or site level.

        Requires a time range. Location filters are optional — without them,
        data for the entire

        network is returned.
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          format: date-time
          description: |
            Start of the time range (ISO 8601 UTC). Must be before endTime.
            Maximum allowed range is 30 days.
          example: 2026-05-26T00:00:00Z
        endTime:
          type: string
          format: date-time
          description: |
            End of the time range (ISO 8601 UTC). Must be after startTime.
            Maximum allowed range is 30 days.
          example: 2026-06-02T00:00:00Z
        siteIDs:
          type: string
          description: Comma-separated list of site identifiers for location-based
            filtering.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1,3
        buildingIDs:
          type: string
          description: Comma-separated list of building identifiers.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 11,22
        floorIDs:
          type: string
          description: Comma-separated list of floor identifiers.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 110,220
        deviceType:
          type: string
          description: |
            Filter by client connection type.
            If not specified, returns both wired and wireless clients.
          enum:
            - wired
            - wireless
          example: wired
        managedBy:
          type: string
          description: |
            Filter by device management type.
          enum:
            - cloud
            - TPME
          example: cloud
        sortField:
          type: string
          description: Field by which to sort results.
          enum:
            - startTime
            - endTime
            - mac
            - clientHostname
            - operatingSystem
          default: startTime
          example: startTime
        sortOrder:
          type: string
          description: Sort order.
          enum:
            - asc
            - desc
          default: desc
          example: desc
        keyword:
          type: string
          description: |
            Keyword to filter results. Matches against client hostname, MAC, IP,
            site, building, floor, username, and operating system.
          pattern: ^[a-zA-Z0-9_\-.:]+$
          maxLength: 100
          example: jdoe
        pageNumber:
          type: integer
          description: Current page number (1-based).
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          description: Number of session records to return per page.
          minimum: 1
          maximum: 1000
          default: 100
          example: 100
    HistoricalClientHealthResponse:
      type: object
      description: |
        Historical client session data response. Returns raw session records
        from `historical_client_session_stats`. Each entry is one session —
        a client that connected 5 times will have 5 entries.
        No deduplication or aggregation is performed.
      properties:
        timeRange:
          type: object
          description: The queried time window echoed back for reference.
          properties:
            startTime:
              type: string
              format: date-time
              example: 2026-05-26T00:00:00Z
            endTime:
              type: string
              format: date-time
              example: 2026-06-02T00:00:00Z
        clients:
          type: array
          description: Raw session records — one entry per client session.
          items:
            $ref: "#/components/schemas/HistoricalClientEntry"
        paginationInfo:
          $ref: "#/components/schemas/PaginationResponse"
    HistoricalClientEntry:
      type: object
      description: >
        A single client session record from `historical_client_session_stats`.

        Each row represents one session (connection event) for a client.

        Contains both wired and wireless session data.

        Location fields (siteName, buildingName, floorName) are resolved via the
        device asset cache.


        For real-time connected client status, use `/analytics/client-health`.
      properties:
        mac:
          type: string
          description: Client MAC address.
          example: AABBCCDDEEFF
        clientHostname:
          type: string
          description: Hostname of the client device.
          example: sdoe-surface
        clientIP:
          type: string
          description: Client IPv4 address for this session.
          example: 10.64.236.100
        clientIPv6:
          type: string
          description: Client IPv6 address for this session.
          example: ""
        operatingSystem:
          type: string
          description: Detected operating system of the client.
          example: Windows 11
        userName:
          type: string
          description: Authenticated username for this session (802.1X). Empty if not
            authenticated.
          example: jdoe
        userProfileName:
          type: string
          description: User profile name assigned during this session.
          example: EDUC-Student
        ssid:
          type: string
          description: SSID the client was connected to (wireless clients). Empty for wired.
          example: CORP-WiFi
        bssid:
          type: string
          description: AP BSSID the client was associated with (wireless clients). Empty
            for wired.
          example: AA:BB:CC:DD:EE:F0
        vlan:
          type: integer
          description: VLAN ID for this session.
          example: 100
        port:
          type: string
          description: Port the client was connected to (wired clients). Empty for wireless.
          example: 1:3
        connectionType:
          type: integer
          description: |
            Connection type identifier.
            - 0 = Wired
            - Other values = Wireless (protocol-specific)
          example: 0
        connectionChannel:
          type: integer
          description: WiFi channel for this session (wireless clients). 0 for wired.
          example: 36
        radioType:
          type: integer
          description: Radio type/band for this session (wireless clients). 0 for wired.
          example: 1
        authMethod:
          type: integer
          description: Authentication method used for this session.
          example: 8
        deviceId:
          type: integer
          format: int64
          description: ID of the device the client was connected to.
          example: 1497460426261685500
        deviceSerialNumber:
          type: string
          description: Serial number of the device.
          example: 2033X-00456
        siteName:
          type: string
          description: Site name of the device. Resolved from device asset cache.
          example: Site2
        siteId:
          type: integer
          format: int64
          nullable: true
          description: Site ID of the device. Resolved from device asset cache.
          example: 500000
        buildingName:
          type: string
          description: Building name of the device. Resolved from device asset cache.
          example: Building3
        buildingId:
          type: integer
          format: int64
          nullable: true
          description: Building ID of the device. Resolved from device asset cache.
          example: 600000
        floorName:
          type: string
          description: Floor name of the device. Resolved from device asset cache.
          example: Floor4
        floorId:
          type: integer
          format: int64
          nullable: true
          description: Floor ID of the device. Resolved from device asset cache.
          example: 700000
        startTime:
          type: string
          format: date-time
          description: Session start time (ISO 8601 UTC).
          example: 2026-05-27T08:15:00Z
        endTime:
          type: string
          format: date-time
          nullable: true
          description: Session end time (ISO 8601 UTC). Null if the session is still active.
          example: 2026-05-27T09:15:00Z
        associationDuration:
          type: integer
          description: Duration of the session association in seconds. 0 if not available.
          example: 3600
        roamingTime:
          type: integer
          description: Roaming time in milliseconds (wireless clients). 0 for wired or no
            roam.
          example: 150
        authenticationResponseTime:
          type: integer
          description: Authentication response time in milliseconds.
          example: 50
        rssi:
          type: integer
          nullable: true
          description: RSSI for this session (wireless clients). Null for wired.
          example: -53
        snr:
          type: integer
          nullable: true
          description: SNR for this session (wireless clients). Null for wired.
          example: 43
