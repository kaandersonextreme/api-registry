    WirelessClientHealthDataRequest:
      type: object
      title: Wireless Client Health Data Request
      description: >
        Request object for retrieving comprehensive health analytics for network
        devices.

        Supports hierarchical location filtering and configurable health metric
        selection.
      properties:
        siteIDs:
          type: string
          description: >
            Comma-separated list of site identifiers for location-based
            filtering.

            Sites represent the highest level in the location hierarchy (e.g.,
            campus, datacenter).

            Use this to filter devices by geographical or organizational sites.

            Supports up to approximately 200 site IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1,3
        buildingIDs:
          type: string
          description: >
            Comma-separated list of building identifiers within the specified
            sites.

            Buildings represent physical structures or logical groupings within
            sites.

            More specific than site-level filtering.

            Supports up to approximately 200 building IDs per request for
            optimal performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 11,22
        floorIDs:
          type: string
          description: >
            Comma-separated list of floor identifiers within the specified
            buildings.

            Floors represent the most granular level of location-based
            filtering,

            useful for maintenance and physical access planning.

            Supports up to approximately 200 floor IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 110,220
        deviceIDs:
          type: string
          description: >
            Comma-separated list of specific device identifiers to retrieve
            health data for.

            Use this to target individual devices regardless of their location.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1497460426261685519,1497460426261685520
        clientMac:
          type: string
          description: >
            A single client MAC address to retrieve health data for.

            Use this to target an individual client regardless of its location.

            The MAC address must be a 12-character uppercase hexadecimal string
            (e.g., B8D5467711C0).
          pattern: ^[0-9A-Fa-f]{12}$
          minLength: 12
          maxLength: 12
          example: B8D5467711C0
        responseType:
          type: string
          description: >
            Type of response as specified below -

            **Available Types:**

            - **summary**: Response contains processor health summary for
            site/building/floor

            - **grid**: Health information of clients for each metrics


            If not specified, returns health summary by default.
          pattern: ^[a-zA-Z\s,]+$
          enum:
            - summary
            - grid
          maxLength: 100
          example: summary
        managedBy:
          type: string
          description: >
            Filter by management type of device as specified below -

            **Available Types:**

            - **cloud**: Response contains client health information for cloud
            managed devices

            - **TPME**: Response contains client health information for third
            party managed devices


            If not specified, returns client health information for both cloud
            and on-premises managed devices by default.
          pattern: ^[a-zA-Z\s,]+$
          maxLength: 20
          enum:
            - cloud
            - TPME
          example: TPME
        health:
          type: string
          description: >
            Filter clients by health status as specified below -

            **Available Statuses:**

            - **unhealthy**: Response contains client health information for
            unhealthy clients only


            If not specified, returns client health information for clients of
            all health statuses by default.
          enum:
            - unhealthy
          maxLength: 100
          example: unhealthy
        filter:
          type: array
          description: >
            Array of filter conditions to apply on the client health data. Each
            filter specifies values in the enum below.
          items:
            $ref: "#/components/schemas/WirelessClientFilterQuery"
          example:
            - type: connection-status
              value: connected
            - type: authentication
              value: WPA3-802.1X
        numberFilter:
          type: array
          description: >
            Array of numeric filter conditions to apply on metric columns.

            Each filter specifies a column name, a comparison operator, and the
            value(s) to compare against.


            **Supported filter types:**

            - **eq**: Equal to — matches rows where column equals `value`

            - **neq**: Not equal to — matches rows where column does not equal
            `value`

            - **gt**: Greater than — matches rows where column is greater than
            `value`

            - **gte**: Greater than or equal to — matches rows where column >=
            `value`

            - **lt**: Less than — matches rows where column < `value`

            - **lte**: Less than or equal to — matches rows where column <=
            `value`

            - **btw**: Between — matches rows where column is between `min` and
            `max` (inclusive)
          items:
            $ref: "#/components/schemas/NumberFilterItem"
          example:
            - columnName: snr
              filterType: eq
              value: 55
            - columnName: rssi
              filterType: gte
              value: 50
            - columnName: air-time
              filterType: btw
              min: 30
              max: 70
        sortField:
          type: string
          description: |
            An optional field by which to sort client health data.
          pattern: ^[a-zA-Z0-9_]+$
          maxLength: 100
          example: connection
          enum:
            - connection
            - ipv4
            - ipv6
            - snr
            - rssi
            - vlan
            - operating-system
            - client-mac
            - air-time
            - frequency
            - connected-device-mac
            - connected-device-host-name
            - ssid
            - authentication
            - encryption
            - alias
            - client-type
            - user-profile
            - category-assignment
            - rx-client-retries
            - tx-client-retries
        sortOrder:
          type: string
          description: >
            Order to sort the client health data. Can be ascending or descending.
          enum:
            - asc
            - desc
          default: asc
          example: desc
        keyword:
          type: string
          description: >
            Keyword to filter the client health data. Matches against client,
            location,

            etc.
          pattern: ^[a-zA-Z0-9_\-.:]+$
          maxLength: 100
          example: hospital
        pageNumber:
          type: integer
          description: >
            Current page number for pagination using 1-based indexing.

            Use this in combination with pageSize to navigate through large
            client inventories.
          minimum: 1
          default: 1
          example: 2
        pageSize:
          type: integer
          description: >
            Number of clients to return per page. Recommended maximum is 100 for
            optimal

            performance, though the system supports up to 1000 clients per page.
          minimum: 1
          maximum: 1000
          default: 100
          example: 80
    WirelessUsageCapacityDataRequest:
      type: object
      title: Wireless Usage Capacity Data Request
      description: >
        Request parameters for wireless usage capacity data retrieval.

        All location filters are optional — without filters, returns data for
        all accessible wireless devices.
      required:
        - pageNumber
        - pageSize
        - responseType
      properties:
        ownerID:
          type: integer
          description: |
            Identifier of the organization or tenant owning this data.
          minimum: 1
          example: 102
        pageSize:
          type: integer
          description: >
            Number of records to return per page. Use in conjunction with
            pageNumber for pagination.
          minimum: 1
          maximum: 1000
          default: 100
          example: 50
        pageNumber:
          type: integer
          description: |
            Current page number for pagination using 1-based indexing
            (e.g., pageNumber=2 with pageSize=50 returns records 51-100).
          minimum: 1
          default: 1
          example: 2
        keyword:
          type: string
          description: >
            Keyword to filter wireless usage capacity data. Matches against
            device hostName,

            IP address, site name, building name and floor name.
          pattern: ^[a-zA-Z0-9_\-.:]+$
          maxLength: 100
          example: AP-5010
        sortField:
          type: string
          description: |
            An optional field by which to sort wireless usage capacity data.
          pattern: ^[a-zA-Z0-9_]+$
          maxLength: 100
          example: cpu_usage_percentage
          enum:
            - hostname
            - location
            - total-eth0-score
            - total-eth1-score
            - wifi0-packet-loss
            - wifi1-packet-loss
            - wifi2-packet-loss
            - wifi0-channel-utilization
            - wifi1-channel-utilization
            - wifi2-channel-utilization
            - wifi0-retries
            - wifi1-retries
            - wifi2-retries
            - wifi0-noise
            - wifi1-noise
            - wifi2-noise
            - wifi0-interference
            - wifi1-interference
            - wifi2-interference
        sortOrder:
          type: string
          description: >
            Order to sort the wireless usage capacity data. Can be ascending or
            descending.
          enum:
            - asc
            - desc
          default: asc
          example: desc
        responseType:
          type: string
          description: >
            Type of response data to return:

            - `grid`: Returns paginated device-level usage capacity data

            - `summary`: Returns only summary widgets (channel utilization,
            retries, packet loss)

            - `all`: Returns both summary and grid data
          enum:
            - grid
            - summary
            - all
          example: grid
        managedBy:
          type: string
          description: |
            Indicates how the device is managed.
          enum:
            - Cloud
            - TPME
          example: Cloud
        siteIDs:
          type: string
          description: Comma-separated list of site IDs to filter by
          example: 1,3
        buildingIDs:
          type: string
          description: Comma-separated list of building IDs to filter by
          example: 11,22
        floorIDs:
          type: string
          description: Comma-separated list of floor IDs to filter by
          example: 110,220
        deviceIDs:
          type: string
          description: >
            Comma-separated list of specific wireless device identifiers to
            retrieve health data for.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1497460426261685519,1497460426261685520
        has_retries_issues:
          type: boolean
        has_packet_loss_issues:
          type: boolean
        has_usage_capacity_issues:
          type: boolean
        has_2dot4g_utilization_issues:
          type: boolean
          description: Filter devices that have 2.4GHz channel utilization issues
            exceeding the configured threshold
        has_5g_utilization_issues:
          type: boolean
          description: Filter devices that have 5GHz channel utilization issues exceeding
            the configured threshold
        has_6g_utilization_issues:
          type: boolean
          description: Filter devices that have 6GHz channel utilization issues exceeding
            the configured threshold
        numberFilter:
          type: array
          description: >
            Column-level number filters for various metrics. Supports filtering
            at child column level

            for Packet Loss, Channel Utilization, Retries,
            Unicast/Multicast/Broadcast, Noise, and Interference.
          items:
            type: object
            required:
              - columnName
              - filterType
            properties:
              columnName:
                type: string
                description: The specific metric column to filter on at child column level.
                enum:
                  - cpu_usage_percentage
                  - memory_usage_percentage
                  - eth0_unicast_score
                  - eth0_multicast_score
                  - eth0_broadcast_score
                  - eth1_unicast_score
                  - eth1_multicast_score
                  - eth1_broadcast_score
                  - wifi0_packet_loss
                  - wifi1_packet_loss
                  - wifi2_packet_loss
                  - radio_2dot4g_utilization_score
                  - radio_5g_utilization_score
                  - radio_6g_utilization_score
                  - wifi0_retry_score
                  - wifi1_retry_score
                  - wifi2_retry_score
                  - wifi0_noise
                  - wifi1_noise
                  - wifi2_noise
                  - wifi0_interference_score
                  - wifi1_interference_score
                  - wifi2_interference_score
              filterType:
                type: string
                description: The type of comparison to apply.
                enum:
                  - eq
                  - neq
                  - gt
                  - gte
                  - lt
                  - lte
                  - btw
              min:
                type: number
                description: Minimum value for 'between' filter_type.
              max:
                type: number
                description: Maximum value for 'between' filter_type.
              value:
                type: number
                description: Value for single-value filter types (eq, neq, gt, gte, lt, lte).
          example:
            - columnName: cpu_usage_percentage
              filterType: eq
              min: 0
              max: 0
              value: 0
            - columnName: memory_usage_percentage
              filterType: eq
              min: 0
              max: 0
              value: 0
            - columnName: eth0_unicast_score
              filterType: eq
              min: 0
              max: 0
              value: 0
            - columnName: eth0_multicast_score
              filterType: eq
              min: 0
              max: 0
              value: 0
            - columnName: eth0_broadcast_score
              filterType: eq
              min: 0
              max: 0
              value: 0
            - columnName: eth1_unicast_score
              filterType: eq
              min: 0
              max: 0
              value: 0
            - columnName: eth1_multicast_score
              filterType: eq
              min: 0
              max: 0
              value: 0
            - columnName: eth1_broadcast_score
              filterType: eq
              min: 0
              max: 0
              value: 0
            - columnName: wifi0_packet_loss
              filterType: gte
              min: 0
              max: 0
              value: 10
            - columnName: radio_5g_utilization_score
              filterType: btw
              min: 50
              max: 90
              value: 0
            - columnName: wifi1_retry_score
              filterType: gt
              min: 0
              max: 0
              value: 20
            - columnName: wifi0_noise
              filterType: lt
              min: 0
              max: 0
              value: -85
            - columnName: wifi1_interference_score
              filterType: gte
              min: 0
              max: 0
              value: 15
