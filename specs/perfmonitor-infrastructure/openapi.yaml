          type: number
          format: float
          description: Interference level for Wi-Fi 1
        wiFi1Status:
          type: string
          enum:
            - green
            - red
          example: green
        wiFi2:
          type: number
          format: float
          description: Interference level for Wi-Fi 2
        wiFi2Status:
          type: string
          enum:
            - green
            - red
          example: green
    WirelessClientIssueRequest:
      type: object
      title: Wireless Client Issue Request
      description: >
        Request object for retrieving issue details for a specific wireless
        client.
      required:
        - macAddress
        - issueType
      properties:
        macAddress:
          type: string
          description: >
            The client MAC address to retrieve issue details for.

            Must be a 12-character uppercase hexadecimal string (e.g.,
            B8D5467711C0).
          pattern: ^[0-9A-Fa-f]{12}$
          minLength: 12
          maxLength: 12
          example: B8D5467711C0
        issueType:
          type: string
          description: >
            The category of issue to retrieve. Supported values:

            - **association**: Association failures (problem IDs 0–3, −3)

            - **authentication**: Authentication failures (problem IDs
            65536–65553, −4)

            - **network**: Network connectivity issues (problem IDs
            131072–131074, −2)

            - **roaming**: Roaming failures (problem ID −5)
          enum:
            - association
            - authentication
            - network
            - roaming
          example: authentication
    WirelessClientIssueResponse:
      type: object
      title: Wireless Client Issue Response
      description: >
        Response object containing chronological issue events for the requested
        client and issue type.
      properties:
        macAddress:
          type: string
          description: The queried client MAC address.
          example: B8D5467711C0
        issueType:
          type: string
          description: The queried issue category.
          enum:
            - association
            - authentication
            - network
            - roaming
          example: authentication
        totalCount:
          type: integer
          description: Total number of issue events returned.
          example: 5
        issues:
          type: array
          description: Chronological list of issue events (most recent first).
          items:
            $ref: "#/components/schemas/WirelessClientIssueItem"
    WirelessClientIssueItem:
      type: object
      title: Wireless Client Issue Item
      description: |
        A single issue event recorded for a wireless client.
      properties:
        dateTime:
          type: string
          format: date-time
          description: |
            ISO 8601 UTC timestamp when the issue was recorded.
          example: 2026-04-28T10:12:00Z
        reason:
          type: string
          description: |
            Human-readable description of the issue cause.
          example: Client failed 802.1X authentication – EAP timeout
        duration:
          type: integer
          description: >
            Duration of the issue in seconds. Zero if the event is instantaneous.
          minimum: 0
          example: 45
        deviceName:
          type: string
          description: |
            Name of the device (access point) where the issue was observed.
          example: AP-Floor2-East
    DashboardRequest:
      title: Dashboard request
      type: object
      description: Request body for the dashboard endpoint.
      properties:
        responseType:
          type: string
          description: |
            Determines the shape of the response.
            - omitted or empty: returns combined summary + grid (default).
            - `summary` returns a single object with aggregated counts.
            - `grid` returns a paginated list of per-site rows.
          enum:
            - summary
            - grid
        siteIds:
          type: array
          description: Filter results to specific site IDs. When omitted, all sites are
            included.
          items:
            type: string
        keyword:
          type: string
          description: Case-insensitive substring filter on site name. Applied before
            building both summary and grid.
        pageSize:
          type: integer
          description: Maximum number of grid rows to return per page (default 100, max
            1000). Only applies to grid.
          default: 100
          minimum: 1
          maximum: 1000
        pageNumber:
          type: integer
          description: Page number for pagination (1-based). Only applies to grid.
          default: 1
          minimum: 1
        limit:
          type: integer
          description: (DEPRECATED - use pageSize) Maximum number of grid rows to return
            (default 20, max 1000). Only applies to grid.
          deprecated: true
          default: 20
          minimum: 1
          maximum: 1000
        offset:
          type: integer
          description: (DEPRECATED - use pageNumber) Number of grid rows to skip for
            pagination. Only applies to grid.
          deprecated: true
          default: 0
          minimum: 0
        sortBy:
          type: string
          description: Field to sort grid rows by. Currently supports `location` (default).
          default: location
        sortOrder:
          type: string
          description: Sort direction for grid rows.
          enum:
            - asc
            - desc
          default: asc
    DashboardCombinedResponse:
      title: Dashboard combined response
      type: object
      description: Combined summary and grid response (default when responseType is
        omitted).
      required:
        - summary
        - grid
      properties:
        summary:
          $ref: "#/components/schemas/DashboardSummaryResponse"
        grid:
          $ref: "#/components/schemas/DashboardGridResponse"
    DashboardSummaryResponse:
      title: Dashboard summary response
      type: object
      description: Aggregated issue counts across device health, client health, usage
        capacity, device status, and alerts.
      required:
        - usage_capacity
        - client_health
        - device_health
        - device_status
        - alerts
      properties:
        usage_capacity:
          $ref: "#/components/schemas/DashboardSection"
        client_health:
          $ref: "#/components/schemas/DashboardSection"
        device_health:
          $ref: "#/components/schemas/DashboardSection"
        device_status:
          $ref: "#/components/schemas/DashboardSection"
        alerts:
          $ref: "#/components/schemas/AlertSummary"
    DashboardSection:
      title: Dashboard section
      type: object
      description: >
        Totals and issue counts for dashboard sections. This schema is used for
        all summary sections.


        **Consistent field meanings across all sections (device_health,
        client_health, usage_capacity, device_status):**

        - `total`: Total number of items (devices or clients)

        - `total_issues`: Total items with issues (unhealthy devices, unhealthy
        clients, or offline devices)

        - `wired`: Number of **wired items with issues**

        - `wireless`: Number of **wireless items with issues**
      required:
        - total
        - total_issues
        - wired
        - wireless
      properties:
        total:
          type: integer
          format: int32
          description: Total number of items (devices or clients). Meaning depends on
            context.
          example: 13
        total_issues:
          type: integer
          format: int32
          description: Total number of issues (unhealthy items or offline devices).
          example: 2
        wired:
          type: integer
          format: int32
          description: Number of wired items with issues (unhealthy wired devices,
            unhealthy wired clients, or offline wired devices).
          example: 8
        wireless:
          type: integer
          format: int32
          description: Number of wireless items with issues (unhealthy wireless devices,
            unhealthy wireless clients, or offline wireless devices).
          example: 5
    DashboardGridResponse:
      title: Dashboard grid response
      type: object
      description: Paginated list of per-site dashboard rows.
      required:
        - items
        - paginationInfo
      properties:
        items:
          type: array
          description: Grid rows for the current page.
          items:
            $ref: "#/components/schemas/DashboardGridItem"
        paginationInfo:
          $ref: "#/components/schemas/PaginationResponse"
    DashboardGridItem:
      title: Dashboard grid item
      type: object
      description: A single per-site row in the dashboard grid.
      required:
        - location
        - usage_capacity
        - client_health
        - device_health
        - device_status
        - alerts
      properties:
        location:
          type: string
          description: Site name. Devices with no site are grouped under "Unassigned".
          example: Enterprise
        usage_capacity:
          $ref: "#/components/schemas/GridHealthStatus"
        client_health:
          $ref: "#/components/schemas/GridHealthStatus"
        device_health:
          $ref: "#/components/schemas/GridHealthStatus"
        device_status:
          $ref: "#/components/schemas/GridHealthStatus"
        alerts:
          $ref: "#/components/schemas/AlertGridStatus"
    GridHealthStatus:
      title: Grid health status cell
      type: object
      description: >
        Health status for a single site with wired/wireless breakdown.

        For client_health: issues represent disconnected clients.

        For device_health: issues represent unhealthy devices.

        For usage_capacity: issues represent devices with congestion or client
        health problems.
      required:
        - affected
        - total
        - wired_total
        - wired_issues
        - wireless_total
        - wireless_issues
        - status
      properties:
        affected:
          type: integer
          format: int32
          description: Total number of unhealthy items (wired + wireless).
          example: 10
        total:
          type: integer
          format: int32
          description: Total number of items at this site (wired + wireless).
          example: 15
        wired_total:
          type: integer
          format: int32
          description: Total number of wired items.
          example: 12
        wired_issues:
          type: integer
          format: int32
          description: Number of wired items with issues.
          example: 10
        wireless_total:
          type: integer
          format: int32
          description: Total number of wireless items.
          example: 3
        wireless_issues:
          type: integer
          format: int32
          description: Number of wireless items with issues.
          example: 0
        status:
          type: string
          description: Status indicator based on whether any issues exist.
          enum:
            - issue
            - no_issues
            - no_devices
          example: issue
    AlertSummary:
      title: Alert summary
      type: object
      description: Alert counts by severity for the dashboard summary.
      required:
        - critical
        - warning
        - information
        - unacknowledged
      properties:
        critical:
          type: integer
          format: int32
          description: Number of critical alerts.
          example: 3
        warning:
          type: integer
          format: int32
          description: Number of warning alerts.
          example: 5
        information:
          type: integer
          format: int32
          description: Number of information alerts.
          example: 2
        unacknowledged:
          type: integer
          format: int32
          description: Number of unacknowledged alerts.
          example: 4
    AlertGridStatus:
      title: Alert grid status cell
      type: object
      description: Per-site alert counts by severity for the dashboard grid.
      required:
        - critical
        - warning
        - information
      properties:
        critical:
          type: integer
          format: int32
          description: Number of critical alerts at this site.
          example: 2
        warning:
          type: integer
          format: int32
          description: Number of warning alerts at this site.
          example: 3
        information:
          type: integer
          format: int32
          description: Number of information alerts at this site.
          example: 1
    ClientTrailRoamingRequest:
      type: object
      title: Client Trail Roaming Request
      description: |
        Request object for retrieving client roaming trail data.
        Requires client MAC and time range to identify roaming events.
      required:
        - clientMac
        - startTime
        - endTime
      properties:
        clientMac:
          type: string
          description: |
            MAC address of the client to retrieve roaming trail for.
            Format: 12-character hex string without separators.
          pattern: ^[0-9A-Fa-f]{12}$
          minLength: 12
          maxLength: 12
          example: 9860CAE64680
        startTime:
          type: string
          format: date-time
          description: |
            Start of the time range in ISO 8601 UTC format.
          example: 2026-04-27T00:00:00Z
        endTime:
          type: string
          format: date-time
          description: |
            End of the time range in ISO 8601 UTC format.
          example: 2026-04-28T00:00:00Z
    ClientTrailRoamingResponse:
      type: object
      title: Client Trail Roaming Response
      description: |
        Response containing the roaming trail for a client.
        Each item represents one roam event (AP transition).
      required:
        - roamsCompleted
        - roamsFailed
        - items
      properties:
        roamsCompleted:
          type: integer
          description: Total number of completed roams in the requested time range.
          example: 4
        roamsFailed:
          type: integer
          description: Total number of failed roams in the requested time range.
          example: 1
        items:
          type: array
          description: List of roaming events sorted by timestamp ascending.
          items:
            $ref: "#/components/schemas/RoamingEvent"
    RoamingEvent:
      type: object
      title: Roaming Event
      description: >
        A single roaming event representing an AP transition.

        The "from" fields represent the source AP, "to" fields represent the
        destination AP.
      required:
        - timestamp
        - deviceNameFrom
        - deviceNameTo
        - deviceMacFrom
        - deviceMacTo
        - roamDuration
        - statusAction
        - data
      properties:
        timestamp:
          type: integer
          format: int64
          description: Epoch timestamp in milliseconds when the roam occurred.
          example: 1777101288392
        deviceNameFrom:
          type: string
          description: Hostname of the source access point.
          example: EDUC-AP07
        deviceNameTo:
          type: string
          description: Hostname of the destination access point.
          example: EDUC-AP04
        deviceMacFrom:
          type: string
          description: MAC address of the source access point (12-char hex).
          example: F02B7C234C40
        deviceMacTo:
          type: string
          description: MAC address of the destination access point (12-char hex).
          example: BCF310366F40
        roamDuration:
          type: integer
          format: int32
          description: >
            Roam duration in milliseconds. Taken from the `roaming_time` field

            of the destination session record. Value of 0 for the first
            connection.
          example: 0
        statusAction:
          type: string
          description: |
            Overall status of the roam event.
            - `COMPLETED`: Roam completed successfully with no issues detected
            - `FAILED`: One or more connectivity issues detected during the roam
          enum:
            - COMPLETED
            - FAILED
          example: COMPLETED
        data:
          type: array
          description: >
            RF details of the roam event showing channel, signal, and radio
            information

            for the from and to access points.
          items:
            $ref: "#/components/schemas/RoamingEventDetail"
    RoamingEventDetail:
      type: object
      title: Roaming Event Detail
      description: RF and signal details for a roaming event.
      required:
        - channelFrom
        - channelTo
        - rssiFrom
        - rssiTo
        - snrFrom
        - snrTo
        - radioTypeFrom
        - radioTypeTo
        - status
      properties:
        channelFrom:
          type: integer
          format: int32
          description: Channel number on the source AP.
          example: 116
        channelTo:
          type: integer
          format: int32
          description: Channel number on the destination AP.
          example: 36
        rssiFrom:
          type: integer
          format: int32
          description: RSSI value (dBm) on the source AP.
          example: -53
        rssiTo:
          type: integer
          format: int32
          description: RSSI value (dBm) on the destination AP.
          example: -44
        snrFrom:
          type: integer
          format: int32
          description: SNR value (dB) on the source AP.
          example: 43
        snrTo:
          type: integer
          format: int32
          description: SNR value (dB) on the destination AP.
          example: 51
        radioTypeFrom:
          type: string
          description: |
            Radio band of the source AP.
          enum:
            - 2.4G
            - 5G
            - 6G
          example: 5G
        radioTypeTo:
          type: string
          description: |
            Radio band of the destination AP.
          enum:
            - 2.4G
            - 5G
            - 6G
          example: 5G
        status:
          type: string
          description: |
            Roaming status for this specific transition.
            - `ROAMING_COMPLETED`: Roam succeeded
            - `ROAMING_FAILED`: Roam failed due to connectivity issues
          enum:
            - ROAMING_COMPLETED
            - ROAMING_FAILED
          example: ROAMING_COMPLETED
        reason:
          type: string
          description: >
            Failure reason if status is ROAMING_FAILED.

            Empty string if roam completed successfully.

            Populated from the `evidence_type` field of the Client Monitor
            Problem record.
          example: ""
    ClientTrailConnectivityExperienceRequest:
      type: object
      title: Client Trail Connectivity Experience Request
      description: |
        Request object for retrieving client connectivity experience data.
        Requires client MAC and time range.
      required:
        - clientMac
        - startTime
        - endTime
      properties:
        clientMac:
          type: string
          description: |
            MAC address of the client to retrieve connectivity experience for.
            Format: 12-character hex string without separators.
          pattern: ^[0-9A-Fa-f]{12}$
          minLength: 12
          maxLength: 12
          example: 9860CAE64680
        startTime:
          type: string
          format: date-time
          description: |
            Start of the time range in ISO 8601 UTC format.
          example: 2026-04-27T00:00:00Z
        endTime:
          type: string
          format: date-time
          description: |
            End of the time range in ISO 8601 UTC format.
          example: 2026-04-28T00:00:00Z
    ClientTrailConnectivityExperienceResponse:
      type: object
      title: Client Trail Connectivity Experience Response
      description: |
        Response containing the connectivity experience timeline for a client.
      properties:
        items:
          type: array
          description: List of connectivity experience records sorted by timestamp
            ascending.
          items:
            $ref: "#/components/schemas/ConnectivityExperienceRecord"
    ConnectivityExperienceRecord:
      type: object
      title: Connectivity Experience Record
      description: >
        A single connectivity experience record for a client session.

        Shows the outcome of each connectivity phase (association,
        authentication,

        DHCP, DNS, gateway) along with RF metrics.
      properties:
        startTimestamp:
          type: integer
          format: int64
          description: Session start time as epoch milliseconds.
          example: 1777100698283
        deviceName:
          type: string
          description: Hostname of the access point the client connected to.
          example: EDUC-AP07
        deviceId:
          type: integer
          format: int64
          description: Internal device identifier.
          example: 1606450914716785
        ssid:
          type: string
          description: SSID the client connected to.
          example: EDUC-Student
        associationDuration:
          type: integer
          format: int32
          description: >
            Association duration in milliseconds.

            Value of -1 indicates association failed or data unavailable.

            Value of 1 indicates association succeeded (set by problem cascade
            logic).
          example: -1
        authMethod:
          type: string
          description: >
            Authentication method used for the connection.

            Derived from the `auth_method` integer field mapped to a
            human-readable string.
          example: WPA3-802.1X
        authenticationResponseTime:
          type: integer
          format: int32
          description: >
            Authentication response time in milliseconds.

            Value of -1 indicates authentication failed or data unavailable.

            Value of 1 indicates authentication succeeded (set by problem
            cascade logic).
          example: -1
        authenticationStatus:
          type: string
          description: |
            Overall authentication status.
            - `PASS`: Authentication succeeded
            - `FAIL`: Authentication failed (association or auth issue detected)
          enum:
            - PASS
            - FAIL
          example: PASS
        dhcpServerIp:
          type: string
          description: |
            IP address of the DHCP server that responded.
            Empty string if not available (sourced from client metrics stats).
          example: ""
        dhcpServerResponseTime:
          type: integer
          format: int32
          description: |
            DHCP server response time in milliseconds.
            Value of -1 indicates DHCP failed or data unavailable.
          example: -1
        dhcpIpAddressObtained:
          type: string
          description: |
            IP address obtained via DHCP by the client.
          example: 10.11.25.180
        defaultGatewayIp:
          type: string
          description: |
            IP address of the default gateway.
            Empty string if not available (sourced from client metrics stats).
          example: ""
        defaultGatewayRoundTripDelayTime:
          type: integer
          format: int32
          description: |
            Default gateway round trip delay time in milliseconds.
          example: 0
        dnsServerIp:
          type: string
          description: |
            IP address of the DNS server.
            Empty string if not available (sourced from client metrics stats).
          example: ""
        dnsServerResponseTime:
          type: integer
          format: int32
          description: |
            DNS server response time in milliseconds.
            Value of -1 indicates DNS failed or data unavailable.
          example: -1
        associationCircleStatus:
          type: string
          description: |
            Association phase status.
            - `SUCCESS`: No association issues detected
            - `FAILED`: Association issue detected (problem_id 0–3 or -3)
          enum:
            - SUCCESS
            - FAILED
          example: SUCCESS
        authCircleStatus:
          type: string
          description: >
            Authentication phase status.

            - `SUCCESS`: No authentication issues detected

            - `FAILED`: Authentication issue detected (problem_id 65536–65553 or
            -4)
          enum:
            - SUCCESS
            - FAILED
          example: SUCCESS
        dhcpCircleStatus:
          type: string
          description: |
            DHCP phase status.
            - `OK`: No DHCP issues detected
            - `INVALID`: DHCP issue detected (problem_id 131072 or -2)
          enum:
            - OK
            - INVALID
          example: INVALID
        dnsCircleStatus:
          type: string
          description: |
            DNS phase status.
            - `OK`: No DNS issues detected
            - `DISABLED`: DNS issue detected (problem_id 131073)
          enum:
            - OK
            - DISABLED
          example: DISABLED
        gatewayCircleStatus:
          type: string
          description: |
            Default gateway phase status.
            - `OK`: No gateway issues detected
            - `DISABLED`: Gateway issue detected (problem_id 131074)
          enum:
            - OK
            - DISABLED
          example: DISABLED
        avgSnr:
          type: integer
          format: int32
          description: Average SNR (dB) during the session.
          example: 43
        avgRssi:
          type: integer
          format: int32
          description: Average RSSI (dBm) during the session.
          example: -53
        clientIp:
          type: string
          description: Client IP address during this session.
          example: 10.11.25.180
    WirelessAccessPointRequest:
      type: object
      required:
        - deviceID
      properties:
        deviceID:
          type: string
          description: Device numeric identifier. Required.
          example: "8293582110001"
        pageNumber:
          type: integer
          description: Current page number for pagination (1-based indexing).
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          description: Number of items to return per page. Maximum allowed value is 1000.
          minimum: 1
          maximum: 1000
          default: 100
          example: 50
    WirelessAccessPointResponse:
      type: object
      title: Wireless Access Point Response
      description: >
        Paginated response containing neighboring wireless access points
        detected by the specified device.
      properties:
        items:
          type: array
          description: Array of neighboring access point entries.
          items:
            $ref: "#/components/schemas/WirelessAccessPointItem"
        paginationInfo:
          $ref: "#/components/schemas/PaginationResponse"
    WirelessAccessPointItem:
      type: object
      required:
        - mac
        - ssid
        - channelWidth
        - rssi
        - mode
        - rogueAp
        - extremeDevice
        - cuPercent
        - crc
        - clients
      properties:
        mac:
          type: string
          description: MAC address of the neighboring access point.
          example: 00:11:22:33:44:55
        ssid:
          type: string
          description: SSID broadcast by the neighboring access point.
          example: Corporate-WiFi
        channelWidth:
          type: integer
          description: Channel width in MHz used by the neighboring access point.
          example: 80
        rssi:
          type: integer
          description: Received Signal Strength Indicator (dBm) of the neighboring access
            point.
          example: -65
        mode:
          type: string
          description: Operating mode of the neighboring access point (e.g., "802.11ax",
            "802.11ac").
          example: 802.11ax
        rogueAp:
          type: integer
          description: Rogue AP classification score (0 = not rogue).
          example: 0
        extremeDevice:
          type: boolean
          description: Whether this is an Extreme Networks device.
          example: true
        cuPercent:
          type: number
          format: double
          description: Channel utilization percentage.
          example: 35.5
        crc:
          type: integer
          description: CRC error count observed from the neighboring access point.
          example: 0
        clients:
          type: integer
          description: Number of clients connected to the neighboring access point.
          example: 12
    WirelessInterfaceGraphRequest:
      type: object
      required:
        - deviceID
        - startTime
        - endTime
        - channel
      properties:
        deviceID:
          type: string
          description: Device numeric identifier. Required.
          example: "8293582110001"
        startTime:
          type: string
          format: date-time
          description: Start of the query time range in ISO 8601 UTC format. Required.
          example: 2026-05-13T00:00:00Z
        endTime:
          type: string
          format: date-time
          description: End of the query time range in ISO 8601 UTC format. Required. Must
            be after startTime.
          example: 2026-05-14T00:00:00Z
        channel:
          type: string
          description: Wireless channel/radio identifier (e.g., "wifi0", "wifi1", "wifi2").
          example: wifi0
        pageNumber:
          type: integer
          description: Current page number for pagination (1-based indexing).
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          description: Number of data points to return per page. Maximum allowed value is
            1000.
          minimum: 1
          maximum: 1000
          default: 100
          example: 100
    WirelessInterfaceGraphResponse:
      type: object
      title: Wireless Interface Graph Response
      description: >
        Paginated response containing time-series data points for a wireless
        interface,

        ordered by timestamp ascending.
      properties:
        items:
          type: array
          description: Array of time-series graph data points.
          items:
            $ref: "#/components/schemas/WirelessInterfaceGraphDataPoint"
        paginationInfo:
          $ref: "#/components/schemas/PaginationResponse"
    WirelessInterfaceGraphDataPoint:
      type: object
      required:
        - timestamp
        - channelUtilization
        - connectedClients
      properties:
        timestamp:
          type: integer
          format: int64
          description: Timestamp in milliseconds since epoch (UTC).
          example: 1747094400000
        channelUtilization:
          type: integer
          description: Channel utilization percentage at this timestamp.
          example: 42
        connectedClients:
          type: integer
          description: Number of clients connected at this timestamp.
          example: 15
    WirelessInterfacesRequest:
      type: object
      required:
        - deviceID
        - startTime
        - endTime
      properties:
        deviceID:
          type: string
          description: Device numeric identifier. Required.
          example: "8293582110001"
        startTime:
          type: string
          format: date-time
          description: Start of the query time range in ISO 8601 UTC format. Required.
          example: 2026-05-13T00:00:00Z
        endTime:
          type: string
          format: date-time
          description: End of the query time range in ISO 8601 UTC format. Required. Must
            be after startTime.
          example: 2026-05-14T00:00:00Z
    WirelessInterfacesResponse:
      type: object
      title: Wireless Interfaces Response
      description: |
        Map of radio interface names (e.g., wifi0, wifi1, wifi2) to their
        interface details including SSID info, client counts, channel
        configuration, utilization breakdown, and feature flags.
      additionalProperties:
        $ref: "#/components/schemas/WirelessInterfaceDetail"
    WirelessInterfaceDetail:
      type: object
      description: Detailed information for a single wireless radio interface.
      required:
        - ssidCount
        - ssids
        - numberOfClients
        - channelUtilization
        - channel
        - channelWidth
        - loadBalancing
        - bandSteering
        - channelUtilizationDetails
      properties:
        ssidCount:
          type: integer
          description: Number of SSIDs configured on this radio interface.
          example: 2
        ssids:
          type: array
          description: List of SSID names configured on this radio interface.
          items:
            type: string
          example:
            - MFG-PSK
            - MFG-Secure
        numberOfClients:
          type: integer
          description: Number of clients currently connected to this radio interface.
          example: 2
        channelUtilization:
          type: integer
          description: Overall channel utilization percentage for this radio interface.
          example: 48
        channel:
          type: integer
          description: Operating channel number for this radio interface.
          example: 157
        channelWidth:
          type: integer
          description: Channel width in MHz for this radio interface.
          example: 20
        loadBalancing:
          type: boolean
          description: Whether load balancing is enabled on this radio interface.
          example: false
        bandSteering:
          type: boolean
          description: Whether band steering is enabled on this radio interface.
          example: false
        channelUtilizationDetails:
          $ref: "#/components/schemas/ChannelUtilizationDetails"
    ChannelUtilizationDetails:
      type: object
      description: Breakdown of channel utilization into interference, TX retries, and
        RX retries.
      required:
        - interferencePercentage
        - txRetriesPercentage
        - rxRetriesPercentage
      properties:
        interferencePercentage:
          type: integer
          description: Percentage of channel utilization attributed to interference.
          example: 9
        txRetriesPercentage:
          type: integer
          description: Percentage of channel utilization attributed to transmit retries.
          example: 3
        rxRetriesPercentage:
          type: integer
          description: Percentage of channel utilization attributed to receive retries.
          example: 35
    WiredInterfacesRequest:
      type: object
      required:
        - deviceID
        - startTime
        - endTime
      properties:
        deviceID:
          type: string
          description: Device numeric identifier. Required.
          example: "8293582110001"
        startTime:
          type: string
          format: date-time
          description: Start of the query time range in ISO 8601 UTC format. Required.
          example: 2026-05-13T00:00:00Z
        endTime:
          type: string
          format: date-time
          description: End of the query time range in ISO 8601 UTC format. Required. Must
            be after startTime.
          example: 2026-05-14T00:00:00Z
    WiredInterfacesResponse:
      type: object
      title: Wired Interfaces Response
      description: >
        Response containing an array of wired interface entries for a wireless
        device,

        including port state, traffic counters, and error/drop statistics.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WiredInterfaceItem"
        paginationInfo:
          $ref: "#/components/schemas/PaginationResponse"
    WiredInterfaceItem:
      type: object
      description: Detailed information for a single wired interface on a wireless device.
      required:
        - state
        - adminState
        - interface
        - port
        - speed
        - txBytes
        - rxBytes
        - txErrors
        - rxErrors
        - txDrops
        - rxDrops
      properties:
        state:
          type: string
          description: Operational state of the interface (e.g., up, down).
          example: up
        adminState:
          type: string
          description: Administrative state of the interface (e.g., enabled, disabled).
          example: enabled
        interface:
          type: string
          description: Interface name (e.g., eth0, eth1).
          example: eth0
        port:
          type: string
          description: Port description of the interface.
          example: Backhaul
        speed:
          type: string
          description: Interface speed e.g. 1 Gbps, 10 Gbps.
          example: 1 Gbps
        txBytes:
          type: integer
          format: int64
          description: Total bytes transmitted on this interface.
          example: 1234567890
        rxBytes:
          type: integer
          format: int64
          description: Total bytes received on this interface.
          example: 9876543210
        txErrors:
          type: integer
          description: Total transmit errors on this interface.
          example: 0
        rxErrors:
          type: integer
          description: Total receive errors on this interface.
          example: 2
        txDrops:
          type: integer
          description: Total transmit drops on this interface.
          example: 0
        rxDrops:
          type: integer
          description: Total receive drops on this interface.
          example: 1
    WiredClientTrailRequest:
      title: Wired Client Trail Request
      required:
        - clientMac
        - endTime
        - startTime
      type: object
      properties:
        clientId:
          type: string
          description: >
            Optional numeric identifier of the client.

            If provided alongside clientMac, used to scope the query more
            precisely.
          example: "987654321"
        clientMac:
          type: string
          description: MAC address of the wired client.
          example: aa:bb:cc:dd:ee:ff
        startTime:
          type: string
          description: Start of the query time window in ISO 8601 UTC format.
          format: date-time
          example: 2024-08-26T00:00:00.000Z
        endTime:
          type: string
          description: End of the query time window in ISO 8601 UTC format.
          format: date-time
          example: 2024-08-26T23:59:59.000Z
      description: Request payload to retrieve the connection trail for a wired client.
    WiredClientTrailResponse:
      title: Wired Client Trail Response
      type: object
      properties:
        items:
          type: array
          description: Ordered list of trail entries (ascending by startTime).
          items:
            $ref: "#/components/schemas/WiredClientTrailItem"
      description: Response containing the ordered list of wired client trail entries.
      example:
        items:
          - portDuplex: FULL
            usage: 14439361156
            ifName: 1/19
            roamStatus: Complete
            startTime: 1777662532419
            endTime: 0
            deviceId: 1606450913439845
            deviceName: HC-FabEng-08
            speed: SPEED_1000M
          - portDuplex: FULL
            usage: 14439361156
            ifName: 1/19
            roamStatus: Complete
            startTime: 1777662532419
            endTime: 0
            deviceId: 1606450913439845
            deviceName: HC-FabEng-08
            speed: SPEED_1000M
    WiredClientTrailItem:
      title: Wired Client Trail Item
      type: object
      properties:
        startTime:
          type: integer
          description: Session start time as a Unix epoch timestamp in milliseconds.
          format: int64
          example: 1777662532419
        endTime:
          type: integer
          description: |
            Session end time as a Unix epoch timestamp in milliseconds.
            A value of 0 indicates the session is still active.
          format: int64
          example: 0
        deviceId:
          type: integer
          description: Numeric identifier of the device (switch) where the client was
            connected.
          format: int64
          example: 1606450913439845
        deviceName:
          type: string
          description: Human-readable name of the device.
          example: HC-FabEng-08
        usage:
          type: integer
          description: Total bytes transferred during this session.
          format: int64
          example: 14439361156
        ifName:
          type: string
          description: Interface (port) name on the device where the client was connected.
          example: 1/19
        speed:
          type: string
          description: Port link speed during this session.
          example: SPEED_1000M
        portDuplex:
          type: string
          description: Port duplex mode during this session.
          example: FULL
          enum:
            - FULL
            - HALF
            - UNKNOWN
        roamStatus:
          type: string
          description: |
            Roaming status of the client at the end of this session.
            - **Complete**: Client successfully roamed to another port/device.
            - **Active**: Client is still connected on this port.
          example: Complete
      description: A single session entry in the wired client trail.
      example:
        portDuplex: FULL
        usage: 14439361156
        ifName: 1/19
        roamStatus: Complete
        startTime: 1777662532419
        endTime: 0
        deviceId: 1606450913439845
        deviceName: HC-FabEng-08
        speed: SPEED_1000M
    WirelessClientQOSDataRequest:
      type: object
      title: Wireless Client Chart Data Request
      required:
        - clientMac
        - startTime
        - endTime
      properties:
        clientMac:
          type: string
          pattern: ^[0-9A-Fa-f]{12}$
          minLength: 12
          maxLength: 12
          example: B8D5467711C0
        startTime:
          type: string
          format: date-time
          example: 2026-05-07T00:00:00Z
        endTime:
          type: string
          format: date-time
          example: 2026-05-08T00:00:00Z
    WirelessClientQOSDataResponse:
      type: object
      title: Wireless Client Chart Data Response
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WirelessClientQOSDataPoint"
    WirelessClientQOSDataPoint:
      type: object
      title: Wireless Client Chart Data Point
      required:
        - timestamp
        - rssi
        - snr
        - noiseFloor
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1778223600000
        rssi:
          type: integer
          format: int32
          example: -55
        snr:
          type: integer
          format: int32
          example: 40
        noiseFloor:
          type: integer
          format: int32
          example: -95
    IpRoutingDeviceResponse:
      type: object
      title: IP Routing Device Response
      description: Response containing IPv4 routing details for a device with pagination.
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: List of routing data entries for the device.
          items:
            $ref: "#/components/schemas/IpRoutingDeviceData"
        pagination:
          $ref: "#/components/schemas/PaginationResponse"
    IpRoutingDeviceData:
      type: object
      title: IP Routing Device Data
      description: Routing data for a device including refresh timestamps and IPv4
        routing entries.
      required:
        - earliest_refresh_time
        - latest_refresh_time
        - latest_refresh_timestamp
        - ipv4_routing_details
      properties:
        earliest_refresh_time:
          type: string
          description: Earliest refresh time of the routing data (format "yyyy-MM-dd
            HH:mm:ss.SSS").
          example: 2026-02-10 10:30:29.131
        latest_refresh_time:
          type: string
          description: Latest refresh time of the routing data (format "yyyy-MM-dd
            HH:mm:ss.SSS").
          example: 2026-02-10 10:30:29.131
        latest_refresh_timestamp:
          type: integer
          format: int64
          description: Latest refresh time as Unix epoch milliseconds.
          example: 1770719429131
        ipv4_routing_details:
          type: array
          description: List of IPv4 routing table entries.
          items:
            $ref: "#/components/schemas/Ipv4RoutingDetail"
    Ipv4RoutingDetail:
      type: object
      title: IPv4 Routing Detail
      description: A single IPv4 routing table entry with next-hop and ping protection
        information.
      required:
        - destination
        - vlan_id
        - vlan_name
        - route_origin
        - status
        - metric
        - age
        - route_type_priority
        - routing_instance
        - isid_id
        - isid_name
        - nexthop_ipv4_address
        - nexthop_device_id
        - nexthop_host_name
        - ping_protection_enabled
        - ping_protection_state
        - ping_protection_last_uptime
        - ping_protection_last_downtime
      properties:
        destination:
          type: string
          description: Destination network in CIDR notation.
          example: 0.0.0.0/0
        vlan_id:
          type: integer
          description: VLAN identifier associated with the route.
          example: 1
        vlan_name:
          type: string
          description: VLAN name associated with the route.
          example: Default
        route_origin:
          type: string
          description: Origin of the route (e.g., BOOTP, DIRECT, OSPF, STATIC, BGP).
          example: BOOTP
        status:
          type: string
          description: Current operational status of the route.
          enum:
            - UP
            - DOWN
          example: UP
        metric:
          type: integer
          description: Route metric value.
          example: 1
        age:
          type: integer
          description: Age of the route in seconds.
          example: 5929
        route_type_priority:
          type: string
          description: Priority value for the route type.
          example: "5000"
        routing_instance:
          type: string
          description: Virtual router instance name.
          example: VR-Default
        isid_id:
          type: integer
          description: I-SID (ISID) identifier for SPB/VXLAN routing.
          example: 0
        isid_name:
          type: string
          description: I-SID name.
          example: ""
        nexthop_ipv4_address:
          type: string
          description: IPv4 address of the next hop.
          example: 10.234.63.254
        nexthop_device_id:
          type: integer
          format: int64
          description: Device ID of the next-hop device (0 if unknown).
          example: 0
        nexthop_host_name:
          type: string
          description: Hostname of the next-hop device (empty if unknown).
          example: ""
        ping_protection_enabled:
          type: boolean
          description: Whether ping protection is enabled for this route.
          example: false
        ping_protection_state:
          type: string
          description: Current state of ping protection.
          enum:
            - UNKNOWN
            - UP
            - DOWN
          example: UNKNOWN
        ping_protection_last_uptime:
          type: integer
          format: int64
          description: Timestamp of last ping protection up event (0 if never).
          example: 0
        ping_protection_last_downtime:
          type: integer
          format: int64
          description: Timestamp of last ping protection down event (0 if never).
          example: 0
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Enter your API Key as a Bearer Token
security:
  - BearerAuth: []
