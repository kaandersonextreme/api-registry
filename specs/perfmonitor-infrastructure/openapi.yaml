    event-driven-alerting: true
    dashboard-integration: true
    automated-reporting: true
  x-ai-discovery-workflow:
    description: |
      Recommended step-by-step flow for an AI agent or MCP server to discover
      and query metrics without any prior knowledge of field names.
    steps:
      - step: 1
        action: GET /metric-schema
        description: Fetch the full metric registry in a single call. Returns every
          metric group, sub-metric, field name, type, and unit. Use this to
          build a complete picture of what data is available before constructing
          queries.
      - step: 2
        action: POST /metric-data
        description: Request metric data for the desired groups and devices. Each
          response row includes a capabilityRef URL you can use to re-fetch
          field definitions for that specific sub-metric at any time.
      - step: 3
        action: GET {capabilityRef}
        description: Follow the capabilityRef from any /metric-data response row to
          retrieve the exact field names, types, and units for that sub-metric.
servers:
  - url: https://cloudapi.extremecloudiq.com/pm/v1
    description: Extreme Platform ONE REST API - Performance Monitoring
tags:
  - name: application management
    description: >
      Operations for discovering and managing supported monitoring applications.

      Use these endpoints to understand what applications and monitoring
      capabilities are available.
  - name: metric capabilities
    description: >
      Operations for retrieving metric capabilities of specific applications.

      These endpoints help you understand what types of metrics can be collected
      from each application.
  - name: Metric Data
    description: >
      Operations for retrieving historical and real-time metric data from
      monitored devices.

      Supports flexible time ranges, filtering, and pagination for efficient
      data access.
  - name: Device health data
    description: |
      Operations for accessing device health analytics and status information.
      Provides comprehensive health monitoring across network infrastructure.
  - name: Usage capacity data
    description: >
      Operations for accessing usage and capacity analytics and status
      information.

      Provides comprehensive usage and capacity monitoring across network
      infrastructure.
  - name: Client health data
    description: >
      Operations for accessing client health analytics, real-time status, and
      historical

      health stats time-series data. Supports proactive monitoring, trending,
      and

      automated alerting for wired and wireless network clients.
paths:
  /applications:
    get:
      tags:
        - application management
      summary: Discover Supported Monitoring Applications for MCP Integration
      description: >
        **Application Discovery for MCP Servers**


        Retrieves a comprehensive list of monitoring applications supported by
        the performance monitoring service,

        specifically designed for MCP (Model Context Protocol) servers and
        automated monitoring systems.

        This endpoint provides the foundation for understanding available
        monitoring capabilities and building

        intelligent monitoring automation.


        **MCP Server Features:**

        - **Dynamic Application Discovery**: Programmatically discover available
        monitoring applications and their capabilities

        - **Capability Validation**: Validate application support before
        implementing automated monitoring workflows

        - **Configuration Automation**: Enable dynamic configuration of
        monitoring systems based on available applications

        - **Integration Planning**: Understand monitoring scope for automated
        infrastructure management


        **Use Cases for MCP Servers:**

        - **Monitoring System Bootstrap**: Initialize automated monitoring
        systems with available application discovery

        - **Dynamic UI Generation**: Build adaptive monitoring interfaces based
        on supported applications

        - **Workflow Automation**: Configure automated monitoring workflows
        based on application capabilities

        - **Integration Validation**: Verify application support before
        deploying monitoring automation

        - **Capability Assessment**: Assess monitoring coverage for
        infrastructure automation planning


        **Response Details:**

        Returns an array of application objects optimized for programmatic
        consumption:

        - Application name identifiers for API integration

        - Detailed capability descriptions for automation planning

        - Metadata for building intelligent monitoring workflows


        **Performance Considerations:**

        - Response is lightweight and cacheable for frequent access

        - Ideal for caching in MCP server initialization workflows

        - Minimal latency for real-time application discovery
      operationId: GetApplications
      x-mcp-operation-type: discovery
      x-mcp-automation-friendly: true
      x-mcp-caching-recommended: true
      x-mcp-use-cases:
        - application-discovery
        - capability-validation
        - dynamic-configuration
      responses:
        "200":
          description: >
            Successfully retrieved the list of supported applications.

            The response contains an array of application objects with their
            names and descriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResponses"
              examples:
                successful_response:
                  summary: Standard response with supported applications
                  value:
                    - name: network
                      description: Network infrastructure monitoring application supporting switches,
                        routers, and network devices
        "500":
          description: Internal server error occurred while retrieving applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /metric-capabilities:
    get:
      tags:
        - metric capabilities
      operationId: GetMetricCapabilities
      x-mcp-operation-type: capability-discovery
      x-mcp-automation-friendly: true
      x-mcp-metadata-rich: true
      x-mcp-use-cases:
        - metric-planning
        - monitoring-scope-analysis
        - automation-configuration
      summary: Advanced Metric Capability Discovery for MCP Servers
      description: >
        **Metric Capability Analysis for MCP Servers**


        Returns comprehensive information about metric collection capabilities
        for specific applications,

        designed for MCP (Model Context Protocol) servers implementing
        intelligent monitoring automation.

        This endpoint provides rich metadata essential for planning automated
        monitoring strategies and

        building sophisticated performance analytics workflows.


        **MCP Server Features:**

        - **Comprehensive Metric Discovery**: Detailed capability analysis for
        automated monitoring planning

        - **Intelligent Scope Planning**: Rich metadata for building optimized
        monitoring strategies

        - **Automation Configuration**: Detailed metric group information for
        automated collector configuration

        - **Performance Planning**: Capability information for building
        high-performance monitoring systems


        **Use Cases for MCP Servers:**

        - **Monitoring Strategy Planning**: Analyze available metrics for
        comprehensive monitoring automation

        - **Collector Configuration**: Configure automated metric collectors
        based on available capabilities

        - **Performance Analytics Setup**: Plan time-series analytics based on
        available metric groups

        - **Resource Planning**: Understand metric collection scope for
        infrastructure capacity planning

        - **Integration Validation**: Verify metric availability before
        implementing monitoring workflows

        - **Dynamic Monitoring**: Build adaptive monitoring systems based on
        runtime capability discovery


        **Enhanced Metric Groups for Automation:**

        - **device stats**: CPU, memory, temperature, fan, PSU metrics with
        threshold and trend analysis. Also contains converted legacy wireless
        device data (cpu_stats, memory_stats from hm-device-stats).

        - **interface stats**: Port utilization, errors, throughput data with
        performance baselining

        - **interface ext1 stats**: Additional port stats

        - **vlan stats**: VLAN-specific performance metrics with traffic
        analysis capabilities

        - **poe stats**: Power over Ethernet monitoring with power budgeting and
        efficiency tracking

        - **wireless interface stats**: Wireless interface performance with RF
        analytics and optimization. Also contains converted legacy data
        (wireless_network_stats and wireless_rf_stats from hm-interface-usage,
        wireless_client_stats from hm-client-metrics) marked with
        is_legacy=true.

        - **wireless device stats**: Wireless device health with predictive
        maintenance capabilities

        - **queue stats**: Ethernet queue specific performance metrics with
        traffic analysis capabilities

        - **protocol stats**: Protocol-related stats

        - **legacy wireless client app usage stats**: Legacy wireless client
        application usage metrics

        - **legacy wireless client monitor problem stats**: Legacy wireless
        client connectivity problem tracking

        - **legacy wireless device reboot stats**: Legacy wireless device reboot
        event tracking

        - **legacy wireless wifi stats**: Legacy wireless WiFi radio and client
        statistics

        - **legacy wireless device stats**: *Converted* — data is stored in
        `device stats` (cpu stats, memory stats). Query `device stats` instead.

        - **legacy wireless interface usage stats**: *Converted* — data is
        stored in `wireless interface stats` (wireless rf stats, wireless
        network stats). Query `wireless interface stats` instead.

        - **legacy wireless client metrics stats**: *Converted* — data is stored
        in `wireless interface stats` (wireless client stats). Query `wireless
        interface stats` instead.

        - **historical client session stats**: Historical client session stats


        **Automation Benefits:**

        - Rich capability metadata for intelligent monitoring automation

        - Performance characteristics for optimal data collection planning

        - Integration guidance for building efficient monitoring workflows
      parameters:
        - name: application
          in: query
          description: >
            The name of the application for which to retrieve metric
            capabilities.

            Must be one of the supported application names returned by the
            /applications endpoint.

            Currently only 'network' is supported.
          required: true
          schema:
            type: string
            enum:
              - network
            example: network
          examples:
            network_app:
              summary: Network application
              value: network
              description: Retrieve capabilities for network infrastructure monitoring
        - name: detail
          in: query
          description: >
            Controls the level of detail returned in the response.

            - **summary** (default): Returns metric group names and descriptions
            only (backward compatible)

            - **full**: Returns complete field-level metadata including field
            names, types, units, descriptions, supported filters, and example
            request payloads for each metric group
          required: false
          schema:
            type: string
            enum:
              - summary
              - full
            default: summary
            example: full
      responses:
        "200":
          description: >
            Successfully retrieved metric capabilities for the specified
            application.

            Returns an array of metric capability objects containing detailed
            information about

            available metric groups and their descriptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricCapabilityResponses"
              examples:
                network_capabilities:
                  summary: Network application capabilities
                  value:
                    - application: network
                      metricGroupsInfo:
                        - name: device stats
                          description: Device-level performance metrics including CPU, memory, temperature
                        - name: interface stats
                          description: Network interface statistics including utilization and errors
                        - name: interface ext1 stats
                          description: Network interface statistics including utilization and errors
                        - name: vlan stats
                          description: VLAN-specific performance and utilization metrics
                        - name: queue stats
                          description: Ethernet interface queue statistics
                        - name: legacy wireless client app usage stats
                          description: Legacy wireless client app usage stats
                        - name: legacy wireless client metrics stats
                          description: Legacy wireless client metrics stats
                        - name: legacy wireless client monitor problem stats
                          description: Legacy wireless client monitor problem stats
                        - name: legacy wireless device reboot stats
                          description: Legacy wireless device reboot stats
                        - name: legacy wireless device stats
                          description: Legacy wireless device stats
                        - name: legacy wireless interface usage stats
                          description: Legacy wireless interface usage stats
                        - name: legacy wireless wifi stats
                          description: Legacy wireless wifi stats
                        - name: protocol stats
                          description: protocol performance metrics including lldp nbr port, elrp, route
                            summary, isis stats
                        - name: historical client session stats
                          description: Historical wireless client session records including client
                            identity, network associations, health scores, and
                            session lifecycle data
        "400":
          description: >
            Bad request - invalid application name provided.

            The application parameter is required and must be one of the
            supported values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                invalid_application:
                  summary: Invalid application parameter
                  value:
                    code: 1701
                    message: "Invalid application name. Supported applications: network"
        "404":
          description: >
            Application not found - the specified application is not supported
            or does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                application_not_found:
                  summary: Application not supported
                  value:
                    code: 1307
                    message: Application 'invalid_app' is not supported
        "409":
          description: >
            Validation conflict - the application name conflicts with system
            requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                validation_conflict:
                  summary: Application validation conflict
                  value:
                    code: 1002
                    message: "The application name 'test' is not supported. Please provide a valid
                      application name. Valid application is: network"
        "500":
          description: Internal server error occurred while retrieving metric capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /metric-schema:
    get:
      tags:
        - metric capabilities
      operationId: GetMetricSchema
      x-mcp-operation-type: schema-discovery
      x-mcp-automation-friendly: true
      summary: Get the complete metric capability schema for all groups
      description: >
        Returns the full metric registry in a single call — all metric groups,
        sub-metrics,

        field names, types, units, supported filters, and example requests.


        **This is the recommended first call for any AI agent or automation
        system**

        that needs to understand what data is available before constructing
        `/metric-data`

        requests. No parameters are required.


        The response is keyed by metric group name (e.g. `"device stats"`,
        `"interface stats"`)

        and each entry contains the same structure as
        `/metric-capabilities/{metricGroup}`.
      responses:
        "200":
          description: Successfully retrieved the complete metric capability schema.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/MetricCapabilityDetailedResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /metric-capabilities/{metricGroup}:
    get:
      tags:
        - metric capabilities
      operationId: GetMetricCapabilityDetail
      x-mcp-operation-type: capability-detail
      x-mcp-automation-friendly: true
      summary: Get detailed metric capability for a specific metric group
      description: >
        Returns full field-level metadata for a single metric group, including
        all available

        fields with their names, types, units, and descriptions, plus supported
        filters and

        an example request payload.


        **Use Case:** After discovering available metric groups via
        `/metric-capabilities`,

        use this endpoint to get the complete schema for a specific group before
        constructing

        a `/metric-data` request.
      parameters:
        - name: metricGroup
          in: path
          description: |
            The metric group name to retrieve detailed capabilities for.
            Must be URL-encoded if it contains spaces (e.g., "device%20stats").
          required: true
          schema:
            type: string
            example: device stats
        - name: application
          in: query
          description: The application name. Currently only 'network' is supported.
          required: true
          schema:
            type: string
            enum:
              - network
            example: network
      responses:
        "200":
          description: Successfully retrieved detailed metric capability for the specified
            group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricCapabilityDetailedResponse"
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "404":
          description: Metric group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /metric-data:
    post:
      tags:
        - Metric Data
      operationId: RetrieveMetricData
      x-mcp-operation-type: time-series-query
      x-mcp-automation-friendly: true
      x-mcp-high-performance: true
      x-mcp-supports-bulk-queries: true
      x-mcp-real-time-capable: true
      x-mcp-time-series-optimized: true
      x-mcp-use-cases:
        - performance-monitoring
        - anomaly-detection
        - capacity-planning
        - trend-analysis
        - automated-alerting
      summary: Advanced Time-Series Metric Retrieval for MCP Servers
      description: >
        **High-Performance Time-Series Data Retrieval for MCP Servers**


        Retrieves comprehensive time-series metric data from monitored network
        devices with advanced filtering,

        intelligent pagination, and optimized time range processing. This
        primary data endpoint is specifically

        designed for MCP (Model Context Protocol) servers implementing
        sophisticated performance monitoring,

        analytics, and automated alerting systems.


        **MCP Server Features:**

        - **High-Performance Time-Series Processing**: Optimized queries for
        large-scale monitoring deployments

        - **Intelligent Data Sampling**: Configurable sampling rates for
        efficient data processing and storage

        - **Real-Time and Historical Analytics**: Support for both live
        monitoring and historical trend analysis

        - **Bulk Device Queries**: Efficient multi-device data retrieval for
        infrastructure-wide monitoring

        - **Automated Filtering**: Advanced pattern matching for interface and
        metric-specific data extraction

        - **Scalable Pagination**: Optimized pagination for processing massive
        datasets in monitoring workflows


        **Advanced Time-Series Capabilities:**

        - **Microsecond Precision**: High-resolution timestamps for precise
        performance analysis

        - **Multi-Dimensional Filtering**: Complex filtering across time,
        devices, interfaces, and metric types

        - **Adaptive Sampling**: Intelligent data sampling based on monitoring
        requirements and system load

        - **Stream Processing Ready**: Optimized for real-time stream processing
        and event-driven analytics

        - **Memory Efficient**: Optimized data structures for handling large
        time-series datasets


        **MCP Use Cases:**

        - **Automated Performance Monitoring**: Continuous monitoring with
        intelligent threshold detection

        - **Anomaly Detection Systems**: Time-series data for machine
        learning-based anomaly detection

        - **Capacity Planning Analytics**: Historical data analysis for
        predictive capacity planning

        - **Real-Time Alerting**: Live data feeds for immediate alert generation
        and response automation

        - **Trend Analysis Engines**: Long-term trend analysis for performance
        optimization and planning

        - **Integration Workflows**: Data feeds for ITSM, SIEM, and automation
        platform integration


        **Enhanced Time Range Options:**

        1. **Absolute Range**: Precise time windows for specific analysis
        periods with timezone support

        2. **Duration from Start**: Forward-looking analysis for performance
        trending and forecasting

        3. **Duration to End**: Backward-looking analysis for incident
        investigation and root cause analysis

        4. **Recent Data**: Real-time monitoring with configurable recent data
        windows

        5. **Latest Values**: Immediate access to current state for real-time
        dashboards and alerting

        6. **Sliding Windows**: Continuous monitoring with rolling time windows
        for trend detection


        **Intelligent Device Selection:**

        - **UUID-Based Identification**: Preferred method for consistent device
        tracking across system changes

        - **Flexible ID Mapping**: Support for internal IDs and serial numbers
        for legacy system integration

        - **Bulk Device Processing**: Efficient multi-device queries with
        optimized database access patterns

        - **Dynamic Device Lists**: Support for device lists based on tags,
        locations, or other criteria


        **Advanced Filtering Patterns:**

        - **Interface Pattern Matching**: Complex interface selection with regex
        and range support

        - **Metric-Specific Filtering**: Targeted metric collection for specific
        analysis requirements

        - **Performance Optimized**: Filter patterns optimized for
        high-performance data retrieval

        - **Hierarchical Filtering**: Support for device hierarchies and
        organizational structures
      requestBody:
        required: true
        description: >
          Request payload containing metric retrieval parameters.

          At minimum, specify applicationName and metricGroup.

          Time range parameters are optional - without them, returns recent
          data.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricDataRequest"
            examples:
              basic_request:
                summary: Basic metric request for device stats
                value:
                  applicationName: network
                  metricGroup: device stats
                  customerID: 2
                  ownerID: 1011
                  deviceUUID: 5b3da8f6-bfc8-4776-ae72-a388db060000
                  durationInMinutes: 60
                  pageSize: 100
              mcp_anomaly_detection:
                summary: MCP Anomaly Detection Data Collection
                description: High-frequency data collection for ML-based anomaly detection
                value:
                  applicationName: network
                  metricGroup: device stats, interface stats
                  customerID: 2
                  ownerID: 1011
                  deviceUUID: 5b3da8f6-bfc8-4776-ae72-a388db060000,8c4da7f2-3fc1-4128-bf83-2a88ef070001
                  durationInMinutes: 1440
                  frequency: NONE
                  pageSize: 1000
                  latestValue: false
              mcp_capacity_planning:
                summary: MCP Capacity Planning Analytics
                description: Long-term trend data for capacity planning automation
                value:
                  applicationName: network
                  metricGroup: interface stats, device stats
                  customerID: 2
                  ownerID: 1011
                  deviceID: 1,3,5,7,9,11,15,22
                  startTime: 2024-08-01T00:00:00Z
                  endTime: 2024-08-31T23:59:59Z
                  frequency: ONE_FIFTH
                  pageSize: 1000
                  filter:
                    - type: ethernet interface name
                      value: 1:1-48
              mcp_real_time_monitoring:
                summary: MCP Real-Time Monitoring Stream
                description: Latest values for real-time monitoring dashboards
                value:
                  applicationName: network
                  metricGroup: device stats
                  customerID: 2
                  ownerID: 1011
                  deviceUUID: 5b3da8f6-bfc8-4776-ae72-a388db060000
                  latestValue: true
                  pageSize: 50
              mcp_predictive_maintenance:
                summary: MCP Predictive Maintenance Data
                description: Historical data for predictive maintenance algorithms
                value:
                  applicationName: network
                  metricGroup: device stats
                  customerID: 2
                  ownerID: 1011
                  deviceSerialNumber: SW001,SW002,SW003
                  durationInMinutes: 10080
                  frequency: ONE_FIFTH
                  pageSize: 1000
              time_range_request:
                summary: Request with specific time range
                value:
                  applicationName: network
                  metricGroup: interface ext1 stats
                  customerID: 2
                  ownerID: 1011
                  deviceID: 1,3,5
                  startTime: 2024-08-26T19:00:00Z
                  endTime: 2024-08-26T23:00:00Z
                  frequency: ONE_FIFTH
                  filter:
                    - type: ethernet interface ext1 name
                      value: 1:1,1:30-33
              latest_values_request:
                summary: Request for latest metric values
                value:
                  applicationName: network
                  metricGroup: device stats
                  customerID: 2
                  ownerID: 1011
                  deviceSerialNumber: abcd-000008
                  latestValue: true
                  pageSize: 50
      responses:
        "200":
          description: >
            Successfully retrieved metric data. The response contains an array
            of metric data objects,

            each including the metrics information and pagination details.


            **Response Structure:**

            - `items`: Array of metric data objects containing device metrics
            and time-series data

            - Each item includes `metricsInfo` with device details and metric
            values

            - Each item includes `paginationInfo` for navigation through large
            datasets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricDataResponses"
              examples:
                successful_response:
                  summary: Sample metric data response
                  value:
                    items:
                      - metricsInfo:
                          applicationName: network
                          metricGroup: device stats
                          deviceUUID: 5b3da8f6-bfc8-4776-ae72-a388db060000
                          deviceID: "5293818185793495498"
                          metricName: CPU Stats
                          metricData:
                            - timeStamp: 2024-08-26T19:00:00Z
                              metricInfo:
                                - name: UsageMin
                                  value: "40"
                                - name: UsageMax
                                  value: "85"
                        paginationInfo:
                          current_page: 1
                          items_count: 100
                          total_pages: 5
                          total_items_count: 450
        "400":
          description: >
            Bad Request - Invalid request parameters provided.


            **Common Causes:**

            - Missing required fields (applicationName, metricGroup)

            - Invalid time format (must be ISO 8601 UTC)

            - Invalid frequency value

            - Conflicting time parameters (startTime + endTime +
            durationInMinutes)

            - Invalid device identifiers

            - Page size exceeds maximum allowed limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                validation_error:
                  summary: API validation error example
                  value:
                    code: 1701
                    message: Invalid time format. Use ISO 8601 UTC format (e.g.,
                      2024-08-26T19:00:00Z)
        "404":
          description: |
            No metric data found for the specified criteria.

            **Common Causes:**
            - No devices found matching the specified identifiers
            - No data available for the requested time range
            - Specified metric group not available for the application
            - Invalid customer or owner ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                no_data_found:
                  summary: No data found example
                  value:
                    code: 1307
                    message: No metric data found for the specified time range and devices
        "409":
          description: >
            Conflict in request parameters.


            **Common Causes:**

            - Conflicting time range parameters

            - Invalid combination of device identification methods

            - Metric group not supported for specified application

            - The count of returned items would exceed 10,000 when
            `errOnPageExceeded` is `true`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                validation_conflict:
                  summary: Validation conflict example
                  value:
                    code: 1002
                    message: Cannot specify both startTime+endTime and durationInMinutes
                      simultaneously
        "500":
          description: >
            Internal server error occurred while processing the metric data
            request.

            This may indicate database connectivity issues or internal
            processing errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /analytics/device-health:
    post:
      tags:
        - Device health data
      operationId: RetrieveDeviceHealthData
      x-mcp-operation-type: health-analytics
      x-mcp-automation-friendly: true
      x-mcp-predictive-analytics: true
      x-mcp-location-aware: true
      x-mcp-health-scoring: true
      x-mcp-use-cases:
        - proactive-monitoring
        - predictive-maintenance
        - health-dashboards
        - capacity-planning
        - automated-alerting
      summary: Advanced Device Health Analytics for MCP Servers
      description: >
        **Intelligent Device Health Analytics for MCP Servers**


        Provides comprehensive health analytics for wired and wireless network
        devices with advanced health scoring,

        predictive analytics, and intelligent status assessment. This endpoint
        is specifically designed

        for MCP (Model Context Protocol) servers implementing proactive network
        management, predictive

        maintenance, and automated health monitoring systems.


        **MCP Server Features:**

        - **Intelligent Health Scoring**: AI-driven health assessment with
        composite health scores

        - **Predictive Analytics**: Early warning indicators for potential
        device failures and issues

        - **Location-Aware Monitoring**: Hierarchical location filtering for
        geographic monitoring strategies

        - **Automated Health Assessment**: Continuous health evaluation with
        threshold-based alerting

        - **Trend Analysis Ready**: Health data optimized for time-series
        analysis and trending

        - **Integration-Optimized**: Health data formatted for ITSM and
        automation platform integration


        **Advanced Health Analytics:**

        - **Composite Health Scoring**: Multi-dimensional health assessment
        combining all device metrics

        - **Anomaly Detection**: Statistical analysis for identifying abnormal
        health patterns

        - **Baseline Comparison**: Health status compared to historical
        baselines and peer devices

        - **Predictive Indicators**: Early warning metrics for proactive
        maintenance planning

        - **Risk Assessment**: Device risk scoring based on health trends and
        failure probability


        **MCP Use Cases:**

        - **Proactive Monitoring Systems**: Automated health monitoring with
        intelligent alerting

        - **Predictive Maintenance**: ML-driven maintenance scheduling based on
        health analytics

        - **Infrastructure Optimization**: Health-based recommendations for
        infrastructure improvements

        - **Automated Remediation**: Health-triggered automated response and
        remediation workflows

        - **Compliance Monitoring**: Health status tracking for SLA and
        compliance requirements

        - **Capacity Planning**: Health-based capacity planning and resource
        allocation optimization


        **Enhanced Health Metrics:**

        - **CPU Analytics**: Processor utilization trends, peak analysis, and
        performance degradation detection

        - **Memory Intelligence**: RAM usage patterns, memory leak detection,
        and capacity forecasting

        - **Thermal Management**: Temperature monitoring with cooling efficiency
        analysis and thermal trending

        - **Power Analytics**: Power consumption optimization, PoE efficiency
        tracking, and PSU health assessment

        - **Cooling Systems**: Fan performance analysis, cooling efficiency
        metrics, and failure prediction

        - **Environmental Monitoring**: Environmental condition correlation with
        device health metrics


        **Intelligent Location Hierarchy:**

        Advanced location-based filtering with geographic intelligence:

        1. **Site-Level Analytics**: Comprehensive site health overview with
        comparative analysis

        2. **Building-Level Intelligence**: Building-specific health trends and
        environmental correlation

        3. **Floor-Level Precision**: Granular floor-level monitoring with
        spatial health mapping

        4. **Zone-Based Analysis**: Custom zone definitions for targeted health
        monitoring strategies
      parameters:
        - name: download
          in: query
          required: false
          description: |
            When set to `csv`, the response is returned as a CSV file download
            instead of JSON. The CSV contains flattened device health data with
            one row per device. When this parameter is set, `responseType` is
            automatically forced to `grid` and pagination is bypassed so all
            matching devices are included in the export.
          schema:
            type: string
            enum:
              - csv
      requestBody:
        required: true
        description: >
          Request parameters for device health data retrieval.

          All location filters are optional - without filters, returns data for
          all accessible devices.

          Device stats parameter allows customization of returned metrics.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceHealthDataRequest"
            examples:
              basic_health_request:
                summary: Basic device health request
                value:
                  pageNumber: 1
                  pageSize: 50
                  deviceStats: cpu,memory,temperature
              location_filtered_request:
                summary: Request filtered by location
                value:
                  siteIDs: 1,3
                  buildingIDs: 11,22
                  floorIDs: 110,220
                  pageNumber: 1
                  pageSize: 100
                  deviceStats: cpu,memory,temperature,fan,poe,psu
