        client over a given

        time range. Each data point includes:

        - **rssi**: Received Signal Strength Indicator from the client's
        perspective (dBm)

        - **snr**: Signal-to-Noise Ratio (dB)

        - **noise_floor**: Ambient noise level on the channel (dBm)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WirelessClientQOSDataRequest"
      responses:
        "200":
          description: Successfully retrieved wireless client QOS chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WirelessClientQOSDataResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error occurred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /analytics/ip-routing/devices/{device_id}:
    get:
      tags:
        - IP Routing Analytics
      operationId: GetDeviceIpRoutingAnalytics
      summary: Retrieve IPv4 routing details for a specific device
      description: >
        Returns IPv4 routing table details for a given device, including route
        origin,

        next-hop information, VLAN association, ping protection state, and
        timing metadata.


        Supports pagination via `pageNumber` and `pageSize` query parameters.
      parameters:
        - name: device_id
          in: path
          required: true
          description: The unique identifier of the network device.
          schema:
            type: integer
            format: int64
            example: 167941815665597
        - name: pageNumber
          in: query
          required: false
          description: Page number for pagination (1-based indexing).
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
            example: 50
      responses:
        "200":
          description: Successfully retrieved IP routing details for the device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpRoutingDeviceResponse"
              example:
                data:
                  - earliest_refresh_time: 2026-02-10 10:30:29.131
                    latest_refresh_time: 2026-02-10 10:30:29.131
                    latest_refresh_timestamp: 1770719429131
                    ipv4_routing_details:
                      - destination: 0.0.0.0/0
                        vlan_id: 1
                        vlan_name: Default
                        route_origin: BOOTP
                        status: UP
                        metric: 1
                        age: 5929
                        route_type_priority: "5000"
                        routing_instance: VR-Default
                        isid_id: 0
                        isid_name: ""
                        nexthop_ipv4_address: 10.234.63.254
                        nexthop_device_id: 0
                        nexthop_host_name: ""
                        ping_protection_enabled: false
                        ping_protection_state: UNKNOWN
                        ping_protection_last_uptime: 0
                        ping_protection_last_downtime: 0
                      - destination: 10.234.63.0/24
                        vlan_id: 1
                        vlan_name: Default
                        route_origin: DIRECT
                        status: UP
                        metric: 1
                        age: 5930
                        route_type_priority: "10"
                        routing_instance: VR-Default
                        isid_id: 0
                        isid_name: ""
                        nexthop_ipv4_address: 10.234.63.203
                        nexthop_device_id: 167941815665597
                        nexthop_host_name: 4220-12P-4X-SwitchEngine
                        ping_protection_enabled: false
                        ping_protection_state: UNKNOWN
                        ping_protection_last_uptime: 0
                        ping_protection_last_downtime: 0
                pagination:
                  current_page: 1
                  items_count: 2
                  total_pages: 1
                  total_items_count: 2
        "400":
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              examples:
                invalid_device_id:
                  summary: Invalid device ID
                  value:
                    code: 400
                    message: device_id must be a valid integer
        "404":
          description: Device not found or no routing data available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
              example:
                code: 404
                message: No IP routing data found for the specified device
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        default:
          description: Unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
components:
  schemas:
    ApplicationResponses:
      title: Application responses
      type: array
      description: List of supported monitoring applications.
      items:
        $ref: "#/components/schemas/ApplicationResponse"
      example:
        - name: network
          description: Network infrastructure monitoring for switches, routers, and access
            points.
        - name: server
          description: Server monitoring for host CPU, memory, disk, and process health
            metrics.
        - name: storage
          description: Storage monitoring for capacity, latency, throughput, and health
            indicators.
    ApplicationResponse:
      title: Application Response
      type: object
      description: >
        Information about a supported monitoring application including its
        capabilities and description.
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: >
            Unique identifier for the monitoring application.

            Use this value as the `applicationName` parameter in metric data
            requests.


            **Supported Applications:**

            - **network**: Network infrastructure monitoring for switches,
            routers, and access points (SNMP/telemetry)

            - **wireless**: Wireless device and RF analytics monitoring for
            access points and controllers

            - **server**: Server monitoring for host CPU, memory, disk I/O, and
            process health metrics

            - **storage**: Storage monitoring for capacity, latency, throughput,
            and health indicators

            - **cloud**: Cloud infrastructure monitoring for virtual machines
            and cloud-native resources
          enum:
            - network
            - wireless
            - server
            - storage
            - cloud
          example: network
        description:
          type: string
          description: >
            Human-readable description of the application's monitoring
            capabilities

            and the types of devices or systems it supports.
          minLength: 1
          maxLength: 1000
          example: Network infrastructure monitoring application supporting switches,
            routers, and network devices
    MetricCapabilityDetailedResponse:
      title: Detailed metric capability for a single metric group
      type: object
      required:
        - application
        - metricGroup
        - description
        - metrics
        - supportedFilters
        - exampleRequest
      properties:
        application:
          type: string
          description: Application name
          example: network
        metricGroup:
          type: string
          description: The metric group name
          example: device stats
        description:
          type: string
          description: Human-readable description of the metric group
          example: Device-level performance metrics including CPU, memory, temperature,
            fan, PSU
        metrics:
          type: array
          description: List of sub-metrics within this group with their field definitions
          items:
            $ref: "#/components/schemas/MetricDetail"
        supportedFilters:
          type: array
          description: Available filter types for this metric group when querying
            /metric-data
          items:
            $ref: "#/components/schemas/MetricFilterInfo"
        exampleRequest:
          $ref: "#/components/schemas/MetricDataRequest"
    MetricDetail:
      title: Metric detail with fields
      type: object
      properties:
        name:
          type: string
          description: Sub-metric name within the group
          example: cpu stats
        description:
          type: string
          description: Human-readable description of this sub-metric
          example: CPU utilization metrics per core
        fields:
          type: array
          description: List of data fields returned for this metric
          items:
            $ref: "#/components/schemas/MetricFieldInfo"
    MetricFieldInfo:
      title: Metric field metadata
      type: object
      properties:
        name:
          type: string
          description: Field name as it appears in the metricData response
          example: UsageMax
        type:
          type: string
          description: Data type of the field value
          enum:
            - integer
            - float
            - string
            - boolean
          example: integer
        unit:
          type: string
          description: |
            Unit of measurement for this field. Common units:
            - % (percentage), W (watts), V (volts), A (amps)
            - °C (celsius), RPM, dBm, dB, ms, s
            - bytes, packets, count, frames
            - "" (dimensionless or identifier)
          example: "%"
        description:
          type: string
          description: Human-readable description of the field
          example: Maximum CPU usage percentage during the sampling interval
    MetricFilterInfo:
      title: Supported filter information
      type: object
      properties:
        type:
          type: string
          description: The filter type value to use in the /metric-data request filter array
          example: device stats
        description:
          type: string
          description: Human-readable description of what this filter does
          example: Filter by specific device metric names (comma-separated)
        validValues:
          type: string
          description: Comma-separated list of valid filter values
          example: cpu stats, fan stats, memory stats, psu stats, temperature stats,
            devicepoe stats, macaddress stats
        exampleValue:
          type: string
          description: Example filter value for use in requests
          example: cpu stats,memory stats
    MetricCapabilityResponses:
      title: Metrics capabilities
      properties:
        application:
          description: name of the application
          type: string
          enum:
            - network
          example: network
        metricGroupsInfo:
          description: groups info of the metrics of the application
          type: array
          items:
            $ref: "#/components/schemas/MetricCapabilityResponse"
    MetricCapabilityResponse:
      title: Metric capability info
      type: object
      properties:
        name:
          type: string
          enum:
            - device stats
            - interface stats
            - interface ext1 stats
            - vlan stats
            - poe stats
            - wireless interface stats
            - wireless device stats
            - queue stats
            - protocol stats
            - legacy wireless client app usage stats
            - legacy wireless client metrics stats
            - legacy wireless client monitor problem stats
            - legacy wireless device reboot stats
            - legacy wireless device stats
            - legacy wireless interface usage stats
            - legacy wireless wifi stats
            - historical client session stats
          example: device stats
        description:
          type: string
          description: >
            Human-readable description of the metric group including the
            specific metrics

            available, their units, and data characteristics. Unit conventions
            used:


            - **Percentage (%)**: CPU utilization, memory usage, channel
            utilization, PoE efficiency, utilization rates

            - **Bytes (B)**: Memory total/free, RX/TX byte counters, session
            bytes transferred

            - **Bits per second (bps)**: Interface throughput, wireless
            throughput, average throughput

            - **Packets per second (pps)**: Packet rates, broadcast/multicast
            rates, management frame rates

            - **Celsius (°C)**: Device temperature readings

            - **RPM**: Fan rotational speed

            - **Watts (W)**: PSU output power, PoE port power draw, total power
            budget/consumed

            - **Volts (V)**: PSU input voltage

            - **dBm**: RSSI signal strength, interference levels, noise floor

            - **dB**: Signal-to-noise ratio (SNR)

            - **Seconds (s)**: Uptime, session duration, reboot duration

            - **Milliseconds (ms)**: Latency, jitter

            - **Count**: Error counts, event counts, neighbor counts, client
            counts

            - **Enumerated string**: Operational status values (e.g., `"ok"`,
            `"failed"`, `"absent"`, `"up"`, `"down"`)


            Use this description to plan monitoring strategies, configure
            alerting thresholds,

            and understand what data will be returned for each metric group.
          example: Contains CPU utilization (%), memory usage (%), temperature (°C), fan
            operational status, and PSU output power (W) per device for health
            monitoring.
      example:
        - name: device stats
          description: Contains CPU utilization (%), memory usage (%), temperature (°C),
            fan operational status and speed (RPM), and PSU output power (W) and
            input voltage (V) per device. Supports threshold alerting and trend
            analysis. Also contains converted legacy wireless device data
            (cpu_stats, memory_stats from hm-device-stats). Legacy-converted
            rows are identifiable by NULL device_core and NULL usage_min.
        - name: interface stats
          description: Contains interface throughput (bps), packet rates (pps), error
            counts (CRC, collisions, link flaps), utilization (%), and
            operational status per port. Supports performance baselining and
            anomaly detection.
        - name: interface ext1 stats
          description: Extended interface statistics including broadcast/multicast packet
            rates (pps), dropped packet counts, and queue depth metrics per
            port.
        - name: vlan stats
          description: Contains VLAN-specific traffic metrics including inbound/outbound
            byte counts (B), packet rates (pps), broadcast utilization (%), and
            VLAN membership counts per device.
        - name: poe stats
          description: Contains Power over Ethernet metrics including total power budget
            (W), consumed power (W), per-port power draw (W), PoE efficiency
            (%), and port power status per device.
        - name: wireless interface stats
          description: Contains wireless interface performance metrics including RSSI
            (dBm), SNR (dB), channel utilization (%), client association counts,
            retry rates (%), and throughput (bps) per radio interface. Also
            contains converted legacy data (wireless_network_stats and
            wireless_rf_stats from hm-interface-usage, wireless_client_stats
            from hm-client-metrics) marked with is_legacy=true in the database.
        - name: wireless device stats
          description: Contains wireless device health metrics including AP uptime (s),
            client counts, radio utilization (%), channel interference levels
            (dBm), and RF environment quality scores per access point.
        - name: queue stats
          description: Contains Ethernet queue metrics including per-queue TX/RX packet
            counts (pps), congestion packet counts, queue depth, and congestion
            percentage (%) per interface queue.
        - name: protocol stats
          description: Contains protocol-level statistics including STP state, LACP PDU
            counts, LLDP neighbor counts, and protocol-specific error counters
            per device interface.
        - name: legacy wireless client app usage stats
          description: Contains legacy wireless per-client application usage metrics
            including application category byte counts (B), session durations
            (s), throughput per app (bps), and top application rankings per
            wireless client.
        - name: legacy wireless client metrics stats
          description: Contains legacy wireless client performance metrics including RSSI
            (dBm), SNR (dB), data rates (Mbps), retry rates (%), packet loss
            (%), and association/roaming event counts per wireless client.
        - name: legacy wireless client monitor problem stats
          description: Contains legacy wireless client problem detection metrics including
            connectivity failure counts, authentication failure counts, DHCP
            failure counts, roaming failure counts, and problem severity scores
            per wireless client.
        - name: legacy wireless device reboot stats
          description: Contains legacy wireless device reboot event metrics including
            reboot counts, reboot reason codes, reboot duration (s), uptime
            since last reboot (s), and reboot frequency trends per access point.
        - name: legacy wireless device stats
          description: Contains legacy wireless device health metrics including CPU
            utilization (%), memory usage (%), temperature (°C), client counts,
            radio utilization (%), and overall device health scores per access
            point.
        - name: legacy wireless interface usage stats
          description: Contains legacy wireless radio interface usage metrics including
            channel utilization (%), air time fairness scores, interference
            utilization (%), noise floor (dBm), and bandwidth consumption trends
            per wireless radio interface.
        - name: legacy wireless wifi stats
          description: Contains legacy wireless Wi-Fi aggregate statistics including total
            client counts, active client counts, throughput (bps), channel
            utilization (%), error rates (%), and overall wireless network
            health scores per access point.
        - name: historical client session stats
          description: Contains historical wireless client session records including
            client MAC/IP addresses, SSID/BSSID associations, authentication and
            encryption methods, RSSI (dBm), SNR (dB), connection state, health
            scores (overall, SLA, IP connectivity, application), session
            start/end times, roaming time (ms), association duration (s),
            authentication response time (ms), disconnect reason codes, and NAC
            profile details per client session.
    MetricDataRequest:
      type: object
      title: Metric Data Request
      description: >
        Comprehensive request object for retrieving metric data from monitored
        devices.

        Supports flexible time range selection, device filtering, and pagination
        options.


        **Device Identification:** Exactly ONE of `deviceID`, `deviceUUID`, or

        `deviceSerialNumber` must be provided. Providing zero or more than one

        results in a validation error.


        **Authentication:** `customerID` and `ownerID` are automatically
        obtained from

        the authentication token and cannot be overridden via the request body.
      required:
        - applicationName
        - metricGroup
      x-one-of-required:
        - deviceID
        - deviceUUID
        - deviceSerialNumber
      x-device-identifier-preference:
        - field: deviceID
          rank: 1
          reason: Indexed in all metric tables. Fastest query path.
        - field: deviceSerialNumber
          rank: 2
          reason: Resolved to deviceID via Redis cache, then indexed lookup.
        - field: deviceUUID
          rank: 3
          reason: Not indexed. Causes filtered scan on large tables.
      properties:
        applicationName:
          type: string
          description: >
            Name of the monitoring application. Must be one of the supported
            applications

            returned by the /applications endpoint.
          enum:
            - network
          example: network
        metricGroup:
          type: string
          description: >
            Comma-separated list of metric groups to collect. Multiple groups
            can be specified

            for comprehensive data retrieval.


            **Valid values:** call GET /metric-schema or GET
            /metric-capabilities?application=network

            for the authoritative list. Common values include:

            `device stats`, `interface stats`, `interface ext1 stats`, `poe
            stats`,

            `vlan stats`, `wireless interface stats`, `wireless device stats`,

            `queue stats`, `protocol stats`.
          x-valid-values-from: /perfmonitor/v1/metric-capabilities?application=network
          x-discovery-endpoint: /perfmonitor/v1/metric-schema
          pattern: ^[a-zA-Z0-9\s,]+$
          minLength: 1
          maxLength: 500
          example: device stats, interface stats, protocol stats
        customerID:
          type: integer
          deprecated: true
          description: |
            **Ignored.** Automatically obtained from the authentication token.
            Any value in the request body is silently discarded.
          minimum: 1
          example: 2
        ownerID:
          type: integer
          deprecated: true
          description: |
            **Ignored.** Automatically obtained from the authentication token.
            Any value in the request body is silently discarded.
          minimum: 1
          example: 1011
        deviceUUID:
          type: string
          format: uuid
          x-preferred: false
          description: >
            Comma-separated list of device UUIDs. **Not indexed** — queries are
            significantly

            slower than deviceID. Use deviceID for best performance.

            Exactly one of deviceID, deviceUUID, or deviceSerialNumber must be
            provided.
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(,[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})*$
          example: 5b3da8f6-bfc8-4776-ae72-a388db060000
        deviceID:
          type: string
          x-preferred: true
          description: >
            **Preferred device identifier.** Indexed in all metric tables —
            fastest query path.

            Exactly one of deviceID, deviceUUID, or deviceSerialNumber must be
            provided.
          pattern: ^[0-9]+(,[0-9]+)*$
          example: 1,3
        deviceSerialNumber:
          type: string
          description: >
            Comma-separated list of device serial numbers. Resolved to deviceID
            via Redis

            cache, then indexed lookup. Exactly one of deviceID, deviceUUID, or

            deviceSerialNumber must be provided.
          pattern: ^[a-zA-Z0-9\-]+(,[a-zA-Z0-9\-]+)*$
          maxLength: 1000
          example: abcd-000008,abcd-000009
        startTime:
          type: string
          format: date-time
          description: >
            Start time for data retrieval in ISO 8601 UTC format. Results
            include data points

            from this time (inclusive). Cannot be used with durationInMinutes
            alone.
          example: 2024-08-26T19:00:00Z
        endTime:
          type: string
          format: date-time
          description: >
            End time for data retrieval in ISO 8601 UTC format. Results include
            data points

            up to this time (exclusive). Cannot be used with durationInMinutes
            alone.
          example: 2024-08-28T20:36:00Z
        durationInMinutes:
          type: integer
          description: >
            **Unit: Minutes**


            Duration in minutes for data retrieval. Behavior depends on other
            time parameters:

            - Alone: Returns data from 'duration' minutes ago to now

            - With startTime: Returns data from startTime for specified duration

            - With endTime: Returns data for specified duration before endTime

            Cannot be used with both startTime and endTime.
          minimum: 1
          maximum: 43200
          x-unit: minutes
          example: 200
        frequency:
          type: string
          enum:
            - ONE_FIFTH
            - ONE_TENTH
            - NONE
          default: NONE
          description: |
            Data sampling frequency for large datasets:
            - NONE: Return all available data points (default)
            - ONE_FIFTH: Sample every 5th data point (20% of data)
            - ONE_TENTH: Sample every 10th data point (10% of data)
          example: ONE_FIFTH
        pageNumber:
          type: integer
          description: Current page number for pagination (1-based indexing)
          minimum: 1
          default: 1
          example: 2
        pageSize:
          type: integer
          description: Number of items per page. The maximum allowed value is currently
            10,000.
          minimum: 1
          maximum: 10000
          default: 10000
          example: 800
        errOnPageExceeded:
          type: boolean
          description: >
            When `true`, a request that would return an item count exceeding the
            pagination maximum

            (currently 10,000) will generate an HTTP status 409 error instead of
            200 and pagination information.
          default: false
          example: true
        filter:
          type: array
          description: >
            Array of filter criteria for refining data selection. Supports
            complex

            interface patterns and metric-specific filtering.
          items:
            $ref: "#/components/schemas/FilterQuery"
          maxItems: 10
          example:
            - type: ethernet interface name
              value: 1:1,1:30-33,1:12:1-4
        latestValue:
          type: boolean
          default: false
          description: >
            When true, retrieves only the most recent data point for each
            metric.

            Useful for real-time monitoring and current status queries.

            Overrides time range parameters when enabled.
          example: true
    MetricDataResponses:
      type: object
      description: metric data responses
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataResponse"
    MetricDataResponse:
      description: metric data response
      type: object
      required:
        - metricsInfo
        - paginationInfo
      properties:
        metricsInfo:
          $ref: "#/components/schemas/MetricDataDetailResponses"
        paginationInfo:
          $ref: "#/components/schemas/PaginationResponse"
    MetricDataDetailResponses:
      title: metric detail responses
      type: object
      required:
        - applicationName
        - metricGroup
        - customerID
        - ownerID
        - deviceUUID
        - deviceID
        - deviceSerialNumber
        - frequency
        - metricName
        - metricData
      properties:
        applicationName:
          type: string
          description: the application name
          enum:
            - network
          example: network
        metricGroup:
          type: string
          description: the metric group name
          example: device stats
        customerID:
          type: integer
          description: customer ID
          minimum: 1
          example: 2
        ownerID:
          type: integer
          description: |
            Identifier of the organization or tenant owning this data.
          minimum: 1
          example: 1011
        deviceUUID:
          type: string
          description: Universally unique identifier for the device in UUID v4 format.
          format: uuid
          example: 5b3da8f6-bfc8-4776-ae72-a388db060000
        deviceID:
          type: string
          description: Internal system-generated numeric device identifier.
          pattern: ^[0-9]+$
          example: "5293818185793495498"
        deviceSerialNumber:
          type: string
          description: Manufacturer-assigned serial number of the device.
          example: abcd-000008
        frequency:
          type: string
          enum:
            - ONE_FIFTH
            - ONE_TENTH
            - NONE
          default: NONE
          description: the frequency the metric data is sampled. With default NONE, no
            sample of data.
          example: ONE_FIFTH
        metricName:
          type: string
          description: >
            The name of the metric being reported. This is the sub-metric
            identifier

            (e.g. `cpu stats`, `fan stats`, `ethernet interface stats`). Use the

            `capabilityRef` field in this response to retrieve the exact field
            names,

            types, and units for this sub-metric.
          example: cpu stats
        capabilityRef:
          type: string
          description: >
            URL path to retrieve the detailed field definitions (names, types,
            units)

            for this sub-metric. Perform a GET request to this path to
            understand how

            to interpret the values in `metricData` without prior knowledge of
            field names.
          example: /perfmonitor/v1/metric-capabilities/device%20stats
        metricData:
          description: metric data
          type: array
          items:
            $ref: "#/components/schemas/MetricDataDetailResponse"
    MetricDataDetailResponse:
      title: stats detail response
      type: object
      properties:
        timeStamp:
          type: string
          description: Timestamp of the metric data point in ISO 8601 UTC format.
          example: 2024-08-26T19:00:00Z
        metricInfo:
          type: array
          description: metric of name-value pairs
          items:
            $ref: "#/components/schemas/NameValue"
    NameValue:
      type: object
      description: >
        A name-value pair representing a single metric measurement.

        Used in metricInfo arrays to report individual metric readings for
        network devices.
      properties:
        name:
          type: string
          description: >
            The metric field name identifier. Field names are PascalCase and
            vary by

            sub-metric. For example, `cpu stats` fields include `DeviceCore`,
            `UsageMax`,

            `UsageAvg`, `UsageMin`; `fan stats` fields include `Fan`, `Tray`,
            `RpmMax`,

            `RpmAvg`, `RpmMin`, `PwmMax`, `PwmAvg`, `PwmMin`.


            To retrieve the complete list of field names, types, and units for
            any

            sub-metric, call GET on the `capabilityRef` URL returned in the
            parent

            `metricsInfo` object, or call GET /metric-schema for all groups at
            once.
          example: UsageMax
        value:
          type: string
          description: >
            The metric measurement value as a string. The unit depends on the
            field;

            call GET on `capabilityRef` (or GET /metric-schema) to look up units
            per

            field name. Common examples:


            - Percentage usage fields such as for cpu or memory (e.g.,
            `UsageMax`, `UsageAvg`, `UsageMin`): `"72.5"` means 72.5%

            - RPM fields (e.g., `RpmMax`, `RpmAvg`, `RpmMin`): `"3200"` means
            3200 RPM

            - Celsisu fields such as for temperature (e.g., `TemperatureMax`,
            `TemperatureAvg`): `"42.0"` means 42 °C

            - Watts fields (e.g., `Capacity`, `InputPowerMax`): `"150.0"` means
            150 W

            - Ampere fields (e.g., `InputCurrentMax`): `"2.5"` means 2.5 A

            - Byte fields (e.g., `RxBytes`, `TxBytes`): `"1048576"` means 1 MiB

            - Index fields (e.g., `DeviceCore`, `Fan`, `Tray`, `Unit`): integer
            index


            All numeric values are encoded as strings for consistent JSON
            serialization.
          example: "72.5"
    FilterQuery:
      type: object
      title: Filter Query
      description: >
        Defines filtering criteria for metric data retrieval. Supports various
        filter types

        for precise data selection and interface-specific queries.
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: |
            Type of filter to apply. Each type supports specific value formats:

            - **ethernet interface name**: Filter by Ethernet interface patterns
            - **device stats**: Filter by specific device statistics
            - **wireless interface stats**: Filter by wireless interface metrics
          enum:
            - ethernet interface name
            - ethernet interface ext1 name
            - device stats
            - wireless interface stats
            - legacy wireless interface usage stats
            - protocol stats
          example: ethernet interface name
        value:
          type: string
          description: |
            Filter value using type-specific format patterns:

            **For ethernet interface name:**
            - Single interface: "0/1" or "1:1"
            - Interface ranges: "0/30-33" or "1:30-33"
            - Multiple selections: "0/1,0/30-33,0/12:1-4"
            - Stack notation: "1:12:1-4" (stack:slot:port range)

            **For ethernet interface ext1 name:**
            - Single interface: "0/1" or "1:1"
            - Interface ranges: "0/30-33" or "1:30-33"
            - Multiple selections: "0/1,0/30-33,0/12:1-4"
            - Stack notation: "1:12:1-4" (stack:slot:port range)

            **For device stats:**
            - Specific stat names: "cpu,memory,temperature"

            **For wireless interface stats:**
            - Wireless interface identifiers: "wifi0,wifi1"

            **For legacy wireless interface usage stats:**
            - Interface identifiers: "2:12"

            **For protocol stats:**
            - Specific stat names: "lldp nbr port, elrp, route summary, isis"
          minLength: 1
          maxLength: 1000
          example: 0/1,0/30-33,0/12:1-4
    ErrorModel:
      title: Error Response
      type: object
      description: >
        Standardized error response format providing detailed information about
        API failures.

        Use the error code for programmatic error handling and the message for
        user display.
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: >
            Numeric error code indicating the specific type of failure:


            **Success Code:**

            - 0: No Error (PerfmonSuccess)


            **Validation Errors (1000-1099):**

            - 1002: Validation Error (PerfmonValidationError) - Invalid input
            parameters, maps to HTTP 409


            **Database Errors (1300-1399):**

            - 1301: Database Connection Error (PerfmonConnectionToDatabaseError)
            - Database connectivity issues, maps to HTTP 500

            - 1302: Database Get Error (PerfmonDBGetError) - Data retrieval
            failure, maps to HTTP 500

            - 1303: Database Create Error (PerfmonDBCreateError) - Data creation
            failure, maps to HTTP 500

            - 1304: Database Save Error (PerfmonDBSaveError) - Data save
            failure, maps to HTTP 500

            - 1305: Database Delete Error (PerfmonDBDeleteError) - Data deletion
            failure, maps to HTTP 500

            - 1306: Database Update Error (PerfmonDBUpdateError) - Data update
            failure, maps to HTTP 500

            - 1307: Database Find Error (PerfmonDBFindError) - Data search
            failure, maps to HTTP 404

            - 1308: Database Ping Error (PerfmonDBPingError) - Database
            connectivity test failure, maps to HTTP 500

            - 1309: Database Inconsistent (PerfmonDBInconsistent) - Database
            state inconsistency, maps to HTTP 500


            **API Processing Errors (1700-1799):**

            - 1701: API Validation Error (PerfmonAPIValidationError) - Request
            validation failure, maps to HTTP 400

            - 1702: API Decode Error (PerfmonAPIDecodeError) - Request decoding
            failure, maps to HTTP 400

            - 1703: API Unmarshal Error (PerfmonAPIUnmarshalError) - JSON
            unmarshaling failure, maps to HTTP 400

            - 1704: API Marshal Error (PerfmonAPIMarshalError) - JSON marshaling
            failure, maps to HTTP 500

            - 1705: API Write Error (PerfmonAPIWriteError) - Response write
            failure, maps to HTTP 500

            - 1706: API Read Error (PerfmonAPIReadError) - Request read failure,
            maps to HTTP 400


            **Authentication/Authorization Errors (1800-1899):**

            - 1838: Request Unauthorized Error (PerfmonRequestUnauthorizedError)
            - Authentication failure, maps to HTTP 401


            **Unknown/Generic Errors:**

            - 1: Unknown Error (PerfmonUnknownErr) - Generic unknown error, maps
            to HTTP 500


            Use these codes for automated error handling and monitoring.
          example: 1002
        message:
          type: string
          description: >
            Human-readable description of the error condition. Provides
            context-specific

            details about what went wrong and may include suggestions for
            resolution.
          minLength: 1
          maxLength: 1000
          example: Invalid time format. Use ISO 8601 UTC format (e.g.,
            2024-08-26T19:00:00Z)
        details:
          type: object
          description: >
            Optional additional details about the error condition, such as
            validation

            failures, affected parameters, or debugging information.
          additionalProperties: true
          example:
            field: startTime
            provided_value: 2024-08-26
            expected_format: ISO 8601 UTC (YYYY-MM-DDTHH:mm:ssZ)
    PaginationResponse:
      type: object
      required:
        - current_page
        - items_count
        - total_pages
        - total_items_count
      properties:
        current_page:
          type: integer
          description: The current page number (1-based)
          minimum: 1
          example: 1
        items_count:
          type: integer
          description: The number of items on the current page i.e page size
          minimum: 1
          maximum: 1000
          example: 1000
        total_pages:
          type: integer
          description: The total number of pages available
          minimum: 1
          example: 18
        total_items_count:
          type: integer
          description: The total number of items across all pages
          minimum: 0
          example: 17668
    PortStatsRequest:
      type: object
      title: Port Stats Request
      description: |
        Request object for retrieving port statistics for a device
        over a specified time range, optionally filtered by interface names.
      required:
        - deviceID
        - startTime
        - endTime
      properties:
        deviceID:
          type: string
          description: Device numeric identifier. Required.
          example: "123456"
        ifNames:
          type: string
          description: >
            Comma-separated list of interface names to filter (e.g.,
            "ge.1.1,ge.1.2").

            If omitted, statistics from all interfaces are included.
          example: ge.1.1,ge.1.2
        startTime:
          type: string
          format: date-time
          description: Start of the query time range in ISO 8601 UTC format. Required.
          example: 2024-08-26T00:00:00Z
        endTime:
          type: string
          format: date-time
          description: End of the query time range in ISO 8601 UTC format. Required. Must
            be after startTime.
          example: 2024-08-26T23:59:59Z
        pageNumber:
          type: integer
          description: Current page number for pagination (1-based indexing).
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          description: Number of data points to return per page. Maximum allowed value is
            1000.
          minimum: 1
          maximum: 1000
          default: 100
          example: 100
    PortStatsDataPoint:
      type: object
      title: Port Stats Data Point
      description: |
        A single time-stamped row of aggregated port statistics,
        representing sums across all matched interfaces at one timestamp.
      required:
        - timestamp
        - clientsWithIssues
        - totalTxBytes
        - totalRxBytes
        - totalTxUnicastPkts
        - totalRxUnicastPkts
        - totalTxMulticastPkts
        - totalRxMulticastPkts
        - totalTxBroadcastPkts
        - totalRxBroadcastPkts
        - totalErrors
        - totalQueueCongestion
      properties:
        timestamp:
          type: integer
          format: int64
          description: Timestamp of this data point in epoch milliseconds (UTC).
          example: 1724630700000
        clientsWithIssues:
          type: integer
          format: int64
          description: Number of unique clients that experienced connectivity issues on
            any of the matched interfaces at this timestamp.
          example: 5
        totalTxBytes:
          type: integer
          format: int64
          description: Total transmitted bytes (out_octets) summed across matched
            interfaces at this timestamp.
          example: 9876543210
        totalRxBytes:
          type: integer
          format: int64
          description: Total received bytes (in_octets) summed across matched interfaces
            at this timestamp.
          example: 1234567890
        totalTxUnicastPkts:
          type: integer
          format: int64
          description: Total transmitted unicast packets.
          example: 500000
        totalRxUnicastPkts:
          type: integer
          format: int64
          description: Total received unicast packets.
          example: 450000
        totalTxMulticastPkts:
          type: integer
          format: int64
          description: Total transmitted multicast packets.
          example: 10000
        totalRxMulticastPkts:
          type: integer
          format: int64
          description: Total received multicast packets.
          example: 9000
        totalTxBroadcastPkts:
          type: integer
          format: int64
          description: Total transmitted broadcast packets.
          example: 5000
        totalRxBroadcastPkts:
          type: integer
          format: int64
          description: Total received broadcast packets.
          example: 4500
        totalErrors:
          type: integer
          format: int64
          description: Total error count (errors_in_errors + errors_out_errors) at this
            timestamp.
          example: 42
        totalQueueCongestion:
          type: integer
          format: int64
          description: Total queue congestion packets dropped across all queues (Q0–Q15)
            at this timestamp.
          example: 0
    PortStatsResponse:
      type: object
      title: Port Stats Response
      description: >
        Paginated response containing time-stamped port statistics data points,
        ordered by timestamp ascending.

        Each element in `items` represents statistics summed across all matched
        interfaces at one timestamp.
      properties:
        items:
          type: array
          description: Array of time-stamped port statistics data points.
          items:
            $ref: "#/components/schemas/PortStatsDataPoint"
        paginationInfo:
          $ref: "#/components/schemas/PaginationResponse"
    PortStatsSummaryRequest:
      type: object
      title: Port Stats Summary Request
      description: Request object for retrieving the per-port statistics summary for a
        device.
      required:
        - deviceID
      properties:
        deviceID:
          type: string
          description: Numeric identifier of the device whose port summary is requested.
          example: "123456"
    PortStatsSummaryItem:
      type: object
      title: Port Stats Summary Item
      description: Per-port statistics summary for a single port on the device.
      required:
        - rxUtilization
        - txUtilization
        - rxMaxUtilization
        - txMaxUtilization
        - inOctets
        - outOctets
        - inUcastPkts
        - outUcastPkts
        - inBroadcastPkts
        - outBroadcastPkts
        - inMulticastPkts
        - outMulticastPkts
        - congestionDropPkts
        - totalAggregateErrors
      properties:
        portNumber:
          type: string
          description: Port or interface identifier (e.g., "1:1", "ge.1.1").
          example: 1:1
        rxUtilization:
          type: number
          format: double
          description: Average receive utilization as a percentage over the query period.
          example: 45.2
        txUtilization:
          type: number
          format: double
          description: Average transmit utilization as a percentage over the query period.
          example: 30.1
        rxMaxUtilization:
          type: number
          format: double
          description: Maximum receive utilization observed (percentage) during the query
            period.
          example: 88.5
        txMaxUtilization:
          type: number
          format: double
          description: Maximum transmit utilization observed (percentage) during the query
            period.
          example: 72.3
        inOctets:
          type: integer
          format: int64
          description: Total inbound bytes on this port.
          example: 9876543210
        outOctets:
          type: integer
          format: int64
          description: Total outbound bytes on this port.
          example: 1234567890
        inUcastPkts:
          type: integer
          format: int64
          description: Total inbound unicast packets on this port.
          example: 450000
        outUcastPkts:
          type: integer
          format: int64
          description: Total outbound unicast packets on this port.
          example: 500000
        inBroadcastPkts:
          type: integer
          format: int64
          description: Total inbound broadcast packets on this port.
          example: 4500
        outBroadcastPkts:
          type: integer
          format: int64
          description: Total outbound broadcast packets on this port.
          example: 5000
        inMulticastPkts:
          type: integer
          format: int64
          description: Total inbound multicast packets on this port.
          example: 9000
        outMulticastPkts:
          type: integer
          format: int64
          description: Total outbound multicast packets on this port.
          example: 10000
        congestionDropPkts:
          type: integer
          format: int64
          description: Total packets dropped on this port due to queue congestion.
          example: 0
        totalAggregateErrors:
          type: integer
          format: int64
          description: Total aggregate error count (input errors + output errors) on this
            port.
          example: 42
    PortStatsSummaryResponse:
      type: array
      title: Port Stats Summary Response
      description: >
        Array of per-port statistics summary items. Each element represents one
        port on the device.
      items:
        $ref: "#/components/schemas/PortStatsSummaryItem"
    DeviceHealthDataRequest:
      type: object
      title: Wired Device Health Data Request
      description: >
        Request object for retrieving comprehensive health analytics for wired
        network devices.

        Supports hierarchical location filtering and configurable health metric
        selection.
      properties:
        siteIDs:
          type: string
          description: >
            Comma-separated list of site identifiers for location-based
            filtering.

            Sites represent the highest level in the location hierarchy (e.g.,
            campus, datacenter).

            Use this to filter devices by geographical or organizational sites.

            Supports up to approximately 200 site IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1,3
        buildingIDs:
          type: string
          description: >
            Comma-separated list of building identifiers within the specified
            sites.

            Buildings represent physical structures or logical groupings within
            sites.

            More specific than site-level filtering.

            Supports up to approximately 200 building IDs per request for
            optimal performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 11,22
        floorIDs:
          type: string
          description: >
            Comma-separated list of floor identifiers within the specified
            buildings.

            Floors represent the most granular level of location-based
            filtering,

            useful for maintenance and physical access planning.

            Supports up to approximately 200 floor IDs per request for optimal
            performance.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 110,220
        deviceIDs:
          type: string
          description: >
            Comma-separated list of specific device identifiers to retrieve
            health data for.

            Use this to target individual devices regardless of their location.
          pattern: ^[0-9]+(,[0-9]+)*$
          maxLength: 1000
          example: 1497460426261685519,1497460426261685520
        deviceStats:
          type: string
          enum:
            - cpu
            - memory
            - temperature
            - fan
            - poe
            - psu
          description: >
            Comma-separated list of health metric categories to include in the
            response.

            Controls which health parameters are collected and returned.


            **Available Metrics:**

            - **cpu**: Processor utilization percentage (0-100%)

            - **memory**: RAM usage percentage (0-100%)

            - **temperature**: Thermal readings in degrees Celsius (°C)

            - **fan**: Cooling system speed in RPM and operational status

            - **poe**: Power over Ethernet consumption in watts (W)

            - **psu**: Power supply unit output in watts (W) and operational
            status


            If not specified, returns all available metrics by default.
          pattern: ^(cpu|memory|temperature|fan|poe|psu)(,(cpu|memory|temperature|fan|poe|psu))*$
          maxLength: 100
          example: cpu,memory,temperature
        health:
          type: string
          description: |
            Filter devices by health status.

            **Available Statuses:**
            - **unhealthy**: Devices with one or more health issues

            If not specified, returns devices of all health statuses by default.
          pattern: ^[a-zA-Z\s,]+$
          enum:
            - unhealthy
          maxLength: 100
          example: unhealthy
        responseType:
          type: string
          description: >
            Controls the format of the response data:

            - `summary`: Returns aggregated health summary statistics only

            - `grid`: Returns detailed per-device health information in grid
            format
          enum:
            - summary
            - grid
          example: grid
        deviceType:
          type: string
          deprecated: true
          description: >
            **Deprecated — do not use.** The api will return all wired network
            devices if it is set to wired or empty. For wireless it will return
            an empty result.
          enum:
            - wired
            - wireless
          maxLength: 100
          example: wired
        managedBy:
          type: string
          description: >
            Filter by management type of device as specified below -

            **Available Types:**

            - **cloud**: Response contains health information for cloud managed
            devices

            - **TPME**: Response contains health information for third party
            managed devices


            If not specified, returns health information for both cloud and
            on-premises managed devices by default.
          pattern: ^[a-zA-Z\s,]+$
          maxLength: 20
          enum:
            - cloud
            - TPME
          example: TPME
        sortField:
          type: string
          description: >
            An optional field by which to sort device health data. If specified,
            may be: "hostName", "siteName", "cpu",

            "memory", "temperature", "fan", "psu", or "poe".
          pattern: ^[a-zA-Z0-9_]+$
          maxLength: 100
          example: cpu
          enum:
            - hostName
            - siteName
            - cpu
            - memory
            - temperature
            - fan
            - psu
            - poe
        sortOrder:
          type: string
          description: >
            Order to sort the device health data. Can be ascending or descending.
          enum:
            - asc
            - desc
          default: asc
          example: desc
        keyword:
          type: string
          description: >
            Keyword to filter the device health data. Matches against device
            hostName,

            ip address, site name, building name and floor name.
          pattern: ^[a-zA-Z0-9_\-.:]+$
          maxLength: 100
          example: TestMac-021243
        pageNumber:
          type: integer
          description: >
            Current page number for pagination using 1-based indexing.

            Use this in combination with pageSize to navigate through large
            device inventories.
          minimum: 1
          default: 1
          example: 2
        pageSize:
          type: integer
          description: >
            Number of devices to return per page. Recommended maximum is 100 for
            optimal

            performance, though the system supports up to 1000 devices per page.
          minimum: 1
          maximum: 1000
          default: 100
          example: 80
    DeviceHealthDataResponses:
      type: object
      description: network device health data responses
      properties:
        applicationName:
          description: name of the application
          type: string
          enum:
            - network
          example: network
        metricGroup:
          type: string
          example: device health
        ownerID:
          type: integer
          description: |
