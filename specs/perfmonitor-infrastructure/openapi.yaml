  /analytics/device-health/port-stats:
    post:
      tags:
        - Device health data
      operationId: RetrieveDeviceHealthPortStats
      x-mcp-operation-type: port-stats-analytics
      x-mcp-automation-friendly: true
      summary: Retrieve aggregated port statistics for a device
      description: >
        **Port Statistics Analytics**


        Returns aggregated port-level traffic, packet, error, and queue
        congestion statistics

        for a single device over a user-specified time range. Optionally
        filtered by a list of

        interface names.


        **Request Fields:**

        - `deviceID`: Device numeric identifier (required).

        - `ifNames`: Comma-separated list of interface names to filter
        (optional). If omitted, all interfaces are included.

        - `startTime`: Start of the query time window in ISO 8601 UTC format
        (required).

        - `endTime`: End of the query time window in ISO 8601 UTC format
        (required).


        **Response Fields:**

        - `timestamp`: Timestamp of the aggregated statistics (aligned to the
        endTime of the query).

        - `clientsWithIssues`: Number of unique clients with issues based on
        error thresholds (if client-level data is available).

        - `totalTxBytes`: Total transmitted bytes (out_octets) across matched
        interfaces and time range.

        - `totalRxBytes`: Total received bytes (in_octets).

        - `totalTxUnicastPkts`: Total transmitted unicast packets.

        - `totalRxUnicastPkts`: Total received unicast packets.

        - `totalTxMulticastPkts`: Total transmitted multicast packets.

        - `totalRxMulticastPkts`: Total received multicast packets.

        - `totalTxBroadcastPkts`: Total transmitted broadcast packets.

        - `totalRxBroadcastPkts`: Total received broadcast packets.

        - `totalErrors`: Total error count (input + output errors).

        - `totalQueueCongestion`: Total queue congestion packets dropped across
        all queues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortStatsRequest"
            example:
              deviceID: "123456"
              ifNames: mgmt,1:1,1:2
              startTime: 2024-08-26T00:00:00Z
              endTime: 2024-08-26T23:59:59Z
      responses:
        "200":
          description: Port statistics array successfully retrieved, ordered by timestamp
            ascending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortStatsResponse"
              example:
                items:
                  - timestamp: 1724630400000
                    clientsWithIssues: 0
                    totalTxBytes: 9876543210
                    totalRxBytes: 1234567890
                    totalTxUnicastPkts: 500000
                    totalRxUnicastPkts: 450000
                    totalTxMulticastPkts: 10000
                    totalRxMulticastPkts: 9000
                    totalTxBroadcastPkts: 5000
                    totalRxBroadcastPkts: 4500
                    totalErrors: 42
                    totalQueueCongestion: 0
                  - timestamp: 1724630700000
                    clientsWithIssues: 0
                    totalTxBytes: 9876544000
                    totalRxBytes: 1234569000
                    totalTxUnicastPkts: 500100
                    totalRxUnicastPkts: 450050
                    totalTxMulticastPkts: 10010
                    totalRxMulticastPkts: 9010
                    totalTxBroadcastPkts: 5010
                    totalRxBroadcastPkts: 4510
                    totalErrors: 43
                    totalQueueCongestion: 0
                paginationInfo:
                  current_page: 1
                  items_count: 2
                  total_pages: 1
                  total_items_count: 2
        "400":
          description: Bad request — invalid or missing parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
  /analytics/device-health/port-stats-summary:
    post:
      tags:
        - Device health data
      operationId: RetrieveDeviceHealthPortStatsSummary
      x-mcp-operation-type: port-stats-summary-analytics
      x-mcp-automation-friendly: true
      summary: Retrieve per-port statistics summary for a device
      description: >
        **Port Statistics Summary**


        Returns a per-port summary of traffic utilization, packet counts,
        congestion drops,

        and aggregate error metrics for a single device. Each element in the
        response

        represents one physical or logical port on the device.


        **Request Fields:**

        - `deviceId`: Device numeric identifier (required).


        **Response Fields (per port):**

        - `portNumber`: Port/interface identifier.

        - `rxUtilization`: Average receive utilization (percentage).

        - `txUtilization`: Average transmit utilization (percentage).

        - `rxMaxUtilization`: Maximum receive utilization observed (percentage).

        - `txMaxUtilization`: Maximum transmit utilization observed
        (percentage).

        - `inOctets`: Total inbound bytes on the port.

        - `outOctets`: Total outbound bytes on the port.

        - `inUcastPkts`: Total inbound unicast packets.

        - `outUcastPkts`: Total outbound unicast packets.

        - `inBroadcastPkts`: Total inbound broadcast packets.

        - `outBroadcastPkts`: Total outbound broadcast packets.

        - `inMulticastPkts`: Total inbound multicast packets.

        - `outMulticastPkts`: Total outbound multicast packets.

        - `congestionDropPkts`: Total packets dropped due to queue congestion.

        - `totalAggregateErrors`: Total aggregate error count (input + output
        errors).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortStatsSummaryRequest"
            example:
              deviceID: "123456"
      responses:
        "200":
          description: Per-port statistics summary successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortStatsSummaryResponse"
              example:
                - portNumber: 1:1
                  rxUtilization: 45.2
                  txUtilization: 30.1
                  rxMaxUtilization: 88.5
                  txMaxUtilization: 72.3
                  inOctets: 9876543210
                  outOctets: 1234567890
                  inUcastPkts: 450000
                  outUcastPkts: 500000
